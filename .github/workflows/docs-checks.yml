name: Documentation checks

# Checks only; nothing is published. The website is deployed by
# azure-static-web-apps.yml, the GitHub Pages redirect by pages-redirect.yml.

on:
  pull_request:
    paths:
      - '**/*.md'
      - .agents/**
      - .codex/skills/**
      - docs/**
      - tools/check_agent_guidance.py
      - tools/docs.py
      - tools/docs_diagrams.py
      - tools/docs_hook.py
      - tests/test_docs.py
      - tests/test_website.py
      - tests/test_agent_guidance.py
      - requirements-docs.txt
      - mkdocs.yml
      - magic-cluster/platform/magicstick-operator/compute-target-catalog.yaml
      - .github/workflows/docs-checks.yml
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - .agents/**
      - .codex/skills/**
      - docs/**
      - tools/check_agent_guidance.py
      - tools/docs.py
      - tools/docs_diagrams.py
      - tools/docs_hook.py
      - tests/test_docs.py
      - tests/test_website.py
      - tests/test_agent_guidance.py
      - requirements-docs.txt
      - mkdocs.yml
      - magic-cluster/platform/magicstick-operator/compute-target-catalog.yaml
      - .github/workflows/docs-checks.yml
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, check links and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation-only dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Test documentation tooling
        run: python -m unittest tests.test_agent_guidance tests.test_docs tests.test_website
      - name: Check repository instructions and skills
        run: python tools/check_agent_guidance.py
      - name: Check Markdown and build the complete static site
        run: |
          python tools/docs.py build
          git diff --check

  external-links:
    name: External links (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Record advisory public-link results
        run: python tools/docs.py external
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-external-links
          path: dist/docs-external-links.json
          retention-days: 30
