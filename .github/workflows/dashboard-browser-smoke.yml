name: Dashboard browser smoke
on:
  push:
    branches: [main, develop]
    paths:
      - .dockerignore
      - .github/workflows/build-dashboard-image.yml
      - .github/workflows/public-release-checks.yml
      - tools/promote_dashboard_images.py
      - tools/promote_regression_image.py
      - tests/test_dashboard_image_promotion.py
      - dashboard/**
      - magic-cluster/apps/dashboard/regression_api.py
      - magic-cluster/apps/dashboard/dashboard-api.yaml
      - magic-cluster/platform/identity/**
      - '!dashboard/**/*.md'
      - magic-host/roles/host-management/files/network_contract.py
      - magic-host/roles/host-management/files/updates_contract.py
      - magic-host/roles/host-management/files/model_cache.py
      - magic-host/roles/host-management/files/software_contract.py
      - core/**
      - LICENSE
      - LICENSING.md
      - LICENSE-RELEASE.json
      - THIRD_PARTY_NOTICES.md
      - licenses/**
      - tools/license_*.py
      - tools/collect_*notices*
      - .github/workflows/dashboard-browser-smoke.yml
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/build-dashboard-image.yml
      - .github/workflows/public-release-checks.yml
      - tools/promote_dashboard_images.py
      - tools/promote_regression_image.py
      - tests/test_dashboard_image_promotion.py
      - dashboard/**
      - magic-cluster/apps/dashboard/regression_api.py
      - magic-cluster/apps/dashboard/dashboard-api.yaml
      - magic-cluster/platform/identity/**
      - '!dashboard/**/*.md'
      - magic-host/roles/host-management/files/network_contract.py
      - magic-host/roles/host-management/files/updates_contract.py
      - magic-host/roles/host-management/files/model_cache.py
      - magic-host/roles/host-management/files/software_contract.py
      - core/**
      - LICENSE
      - LICENSING.md
      - LICENSE-RELEASE.json
      - THIRD_PARTY_NOTICES.md
      - licenses/**
      - tools/license_*.py
      - tools/collect_*notices*
      - .github/workflows/dashboard-browser-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity-sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated identity test dependencies
        working-directory: dashboard
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install PyYAML==6.0.3
          pnpm --filter @magicstick/dashboard-web exec playwright install --with-deps chromium
      - name: Verify real Keycloak and Envoy session lifecycle with synthetic credentials
        working-directory: dashboard
        run: |
          REGRESSION_MODE=auth-sessions pnpm --filter @magicstick/dashboard-web exec playwright test \
            --config regression/playwright.config.ts --reporter=line
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked workspace and Chromium
        working-directory: dashboard
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @magicstick/dashboard-web exec playwright install --with-deps chromium
      - name: Exercise built UI with isolated API fixtures
        working-directory: dashboard
        run: pnpm test:browser
      - name: Verify regression types and failure-cleanup contracts without a lab
        working-directory: dashboard
        run: |
          pnpm typecheck:regression
          REGRESSION_MODE=selftest pnpm --filter @magicstick/dashboard-web exec playwright test \
            regression/administration/cleanup.unit.spec.ts --config regression/playwright.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: |
            dashboard/apps/web/playwright-report/
            dashboard/apps/web/test-results/
          retention-days: 7
