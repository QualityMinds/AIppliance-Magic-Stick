name: Build MagicStick FreeToken runtime image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-freetoken-image.yml
      - magic-cluster/platform/ai/freetoken/image/**
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - LICENSING.md
      - LICENSE-RELEASE.json
      - licenses/**
      - tools/license_*.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: freetoken-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/qualityminds/magicstick-freetoken
  FREETOKEN_VERSION: 0.1.3

jobs:
  build:
    # An image published from another ref cannot promote this repository's main
    # runtime descriptor. Run manual dispatches from main as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out MagicStick
        uses: actions/checkout@v4

      - name: Verify the bounded runtime adapter
        run: |
          bash -n magic-cluster/platform/ai/freetoken/image/entrypoint.sh
          bash magic-cluster/platform/ai/freetoken/verify-runtime-descriptor.sh
          test -f magic-cluster/platform/ai/freetoken/image/Dockerfile
          ! grep -Eq 'EXTRA_ARGS|EXTRA_ARG|eval[[:space:]]' magic-cluster/platform/ai/freetoken/image/entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check source licensing and report open reviews
        shell: bash
        run: python3 tools/license_audit.py --review 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=v${{ env.FREETOKEN_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=MagicStick FreeToken runtime
            org.opencontainers.image.description=Bounded Kubernetes runtime adapter for FreeToken
            org.opencontainers.image.source=https://github.com/QualityMinds/AIppliance-Magic-Stick
            org.opencontainers.image.licenses=Apache-2.0 AND BUSL-1.1
            org.opencontainers.image.version=v${{ env.FREETOKEN_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish the CUDA 13 runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: magic-cluster/platform/ai/freetoken/image/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FREETOKEN_VERSION=${{ env.FREETOKEN_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=magicstick-freetoken
          cache-to: type=gha,mode=max,scope=magicstick-freetoken
          provenance: mode=max
          sbom: true

      - name: Attest the published runtime digest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: v${{ env.FREETOKEN_VERSION }}
          push-to-registry: true

      - name: Record the immutable runtime digest
        run: |
          {
            echo "### MagicStick FreeToken runtime image"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- FreeToken version: \`v${FREETOKEN_VERSION}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo "- CUDA toolchain: \`13.0\`"
            echo
            echo "Promote this exact digest with the **Promote MagicStick FreeToken runtime digest** workflow on \`main\`. It verifies the registry image and this repository's build attestation before opening the descriptor-promotion pull request."
          } >> "$GITHUB_STEP_SUMMARY"
