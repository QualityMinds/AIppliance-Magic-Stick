name: Build MagicStick AISIX image

on:
  push:
    paths:
      - .github/workflows/build-aisix-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: aisix-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    name: Verify pinned AISIX source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pinned AISIX source
        uses: actions/checkout@v4
        with:
          repository: api7/aisix
          ref: 315ab1f94802a6704c7355fdc4e85cc4ccadeb74
          path: .build/aisix

      - name: Verify upstream version
        working-directory: .build/aisix
        run: |
          test "$(git rev-parse HEAD)" = "315ab1f94802a6704c7355fdc4e85cc4ccadeb74"
          grep -q '^channel = "1\.93\.1"' rust-toolchain.toml

  build:
    name: Build native AMD64 and ARM64 image
    needs: verify-source
    uses: docker/github-builder/.github/workflows/build.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: https://github.com/api7/aisix.git#315ab1f94802a6704c7355fdc4e85cc4ccadeb74
      file: Dockerfile
      build-args: |
        BUILD_SHA=315ab1f94802a6704c7355fdc4e85cc4ccadeb74
        BUILD_VERSION=0.8.1
      cache: true
      cache-mode: max
      cache-scope: magicstick-aisix-v0.8.1
      sbom: true
      sign: auto
      set-meta-labels: true
      meta-images: ghcr.io/qualityminds/magicstick-aisix
      meta-tags: |
        type=sha,prefix=sha-,format=long
        type=raw,value=v0.8.1-magicstick.1,enable=${{ github.ref == 'refs/heads/main' }}
      meta-labels: |
        org.opencontainers.image.title=MagicStick AISIX
        org.opencontainers.image.description=Multi-architecture AISIX gateway built from pinned upstream source
        org.opencontainers.image.source=https://github.com/QualityMinds/AIppliance-Magic-Stick
        org.opencontainers.image.licenses=Apache-2.0
        org.opencontainers.image.created=2026-08-07T14:18:40Z
        org.opencontainers.image.version=v0.8.1-magicstick.1
        org.opencontainers.image.revision=315ab1f94802a6704c7355fdc4e85cc4ccadeb74
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: Record immutable digest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Write build summary
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          {
            echo "### MagicStick AISIX image"
            echo
            echo "- Image: \`ghcr.io/qualityminds/magicstick-aisix\`"
            echo "- Branch tag: \`sha-${GITHUB_SHA}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Platforms: \`linux/amd64,linux/arm64\`"
            echo "- Upstream: \`315ab1f94802a6704c7355fdc4e85cc4ccadeb74\` (v0.8.1)"
          } >> "$GITHUB_STEP_SUMMARY"
