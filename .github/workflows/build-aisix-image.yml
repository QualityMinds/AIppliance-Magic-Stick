name: Build MagicStick AISIX image

on:
  push:
    paths:
      - .github/workflows/build-aisix-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: aisix-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/qualityminds/magicstick-aisix
  IMAGE_VERSION: v0.8.1-magicstick.1
  AISIX_REF: 315ab1f94802a6704c7355fdc4e85cc4ccadeb74

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out MagicStick
        uses: actions/checkout@v4

      - name: Check out pinned AISIX source
        uses: actions/checkout@v4
        with:
          repository: api7/aisix
          ref: ${{ env.AISIX_REF }}
          path: .build/aisix

      - name: Verify upstream version
        working-directory: .build/aisix
        run: |
          test "$(git rev-parse HEAD)" = "$AISIX_REF"
          grep -q '^channel = "1\.93\.1"' rust-toolchain.toml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ env.IMAGE_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=MagicStick AISIX
            org.opencontainers.image.description=Multi-architecture AISIX gateway built from pinned upstream source
            org.opencontainers.image.source=https://github.com/QualityMinds/AIppliance-Magic-Stick
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            org.opencontainers.image.revision=${{ env.AISIX_REF }}

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .build/aisix
          file: .build/aisix/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ env.AISIX_REF }}
            BUILD_VERSION=0.8.1
          cache-from: type=gha,scope=magicstick-aisix
          cache-to: type=gha,mode=max,scope=magicstick-aisix
          provenance: mode=max
          sbom: true

      - name: Record immutable digest
        run: |
          {
            echo "### MagicStick AISIX image"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Branch tag: \`sha-${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Upstream: \`${AISIX_REF}\` (v0.8.1)"
          } >> "$GITHUB_STEP_SUMMARY"
