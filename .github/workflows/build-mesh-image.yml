name: Build Private Mesh integration
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-mesh-image.yml
      - magic-cluster/apps/ai/private-mesh/**
      - core/magicstick_core/**
      - dashboard/apps/api/licensing.py
      - LICENSE
      - LICENSE-RELEASE.json
      - LICENSING.md
      - THIRD_PARTY_NOTICES.md
      - licenses/**
      - tools/**
  pull_request:
    paths:
      - magic-cluster/apps/ai/private-mesh/**
      - core/magicstick_core/**
      - dashboard/apps/api/licensing.py
      - LICENSE
      - LICENSE-RELEASE.json
      - LICENSING.md
      - THIRD_PARTY_NOTICES.md
      - licenses/**
      - tools/**
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: private-mesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r magic-cluster/apps/ai/private-mesh/requirements.txt
      - run: python -m unittest discover -s magic-cluster/apps/ai/private-mesh -p 'test_*.py'
  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check source licensing and report open reviews
        shell: bash
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 tools/license_audit.py --review 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: magic-cluster/apps/ai/private-mesh/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/qualityminds/magicstick-mesh:v0.76.2-ms1
          cache-from: type=gha,scope=private-mesh
          cache-to: type=gha,mode=max,scope=private-mesh
          provenance: mode=max
          sbom: true
