name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - docs/**
      - tools/docs.py
      - tools/docs_diagrams.py
      - tools/docs_hook.py
      - tests/test_docs.py
      - tests/test_website.py
      - requirements-docs.txt
      - mkdocs.yml
      - magic-cluster/platform/magicstick-operator/compute-target-catalog.yaml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - docs/**
      - tools/docs.py
      - tools/docs_diagrams.py
      - tools/docs_hook.py
      - tests/test_docs.py
      - tests/test_website.py
      - requirements-docs.txt
      - mkdocs.yml
      - magic-cluster/platform/magicstick-operator/compute-target-catalog.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation-only dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Test documentation tooling
        run: python -m unittest tests.test_docs tests.test_website
      - name: Check Markdown and build the complete static site
        run: |
          python tools/docs.py build
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: dist/docs-site/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request'
        with:
          path: dist/docs-site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static documentation and landing page
        id: deployment
        uses: actions/deploy-pages@v4

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Record advisory public-link results
        run: python tools/docs.py external
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-external-links
          path: dist/docs-external-links.json
          retention-days: 30
