name: Build MagicStick AMD DRA recovery image
on:
  pull_request:
    paths:
      - .github/workflows/build-amd-dra-image.yml
      - LICENSE
      - LICENSE-RELEASE.json
      - licenses/**
      - tools/license_*.py
      - magic-cluster/platform/gpu/amd-gpu-operator/image/**
      - magic-cluster/platform/gpu/amd-gpu-operator/patches/**
  push:
    branches: [main, develop]
    paths:
      - .github/workflows/build-amd-dra-image.yml
      - LICENSE
      - LICENSE-RELEASE.json
      - licenses/**
      - tools/license_*.py
      - magic-cluster/platform/gpu/amd-gpu-operator/image/**
      - magic-cluster/platform/gpu/amd-gpu-operator/patches/**
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: amd-dra-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ROCm/k8s-gpu-dra-driver
          ref: 9eb4e2ea386e34581524b0110e24769654fcb8d2
          path: .build/amd-dra
      - name: Apply bounded CDI recovery fix
        run: git -C .build/amd-dra apply "$GITHUB_WORKSPACE/magic-cluster/platform/gpu/amd-gpu-operator/patches/reboot-cdi-recovery.patch"
      - uses: docker/setup-buildx-action@v3
      - name: Check source licensing and report open reviews
        shell: bash
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: python3 tools/license_audit.py --review 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test, build and publish
        uses: docker/build-push-action@v6
        with:
          context: .build/amd-dra
          file: magic-cluster/platform/gpu/amd-gpu-operator/image/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ghcr.io/qualityminds/magicstick-amd-dra:sha-${{ github.sha }}
            ghcr.io/qualityminds/magicstick-amd-dra:${{ github.ref == 'refs/heads/main' && 'v1.0.1-cdi-recovery.2' || 'develop' }}
          cache-from: type=gha,scope=amd-dra-recovery
          cache-to: type=gha,mode=max,scope=amd-dra-recovery
          provenance: mode=max
          sbom: true
