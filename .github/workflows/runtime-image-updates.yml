name: Review runtime image updates

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runtime-image-updates
  cancel-in-progress: false

jobs:
  updates:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out development channel
        uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify updater and resolve public supplier tags
        run: |
          python -m unittest tests.test_runtime_image_updates
          python tools/update_runtime_images.py --write
          python tools/license_audit.py --refresh-references
      - uses: azure/setup-helm@v4
      - name: Render candidate configuration
        run: |
          helm template image-review magic-cluster/apps/instances/odysseus \
            --set instance.name=example-review --set instance.namespace=ai \
            --set instance.application=odysseus --set instance.localName=example-review \
            --set instance.localHost=example-review.odysseus.example.local \
            --set-json 'instance.values={}' >/tmp/image-review.yaml
          git diff --check
      - name: Retain the validated update proposal
        id: proposal
        run: |
          git diff --binary -- \
            magic-cluster/apps/instances/odysseus/files/runtime-images.json \
            licenses/dependency-inventory.json > "$RUNNER_TEMP/runtime-image-updates.patch"
          if [ -s "$RUNNER_TEMP/runtime-image-updates.patch" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Validated runtime updates are available in the runtime-image-update-proposal artifact.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No runtime image update is needed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive the reviewed patch
        if: steps.proposal.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-update-proposal
          path: ${{ runner.temp }}/runtime-image-updates.patch
          if-no-files-found: error
          retention-days: 30
      - name: Explain the policy-compatible manual proposal
        if: steps.proposal.outputs.changed == 'true' && vars.RUNTIME_IMAGE_PR_ENABLED != 'true'
        run: |
          echo '::warning::Automatic PR creation is not enabled. Download the validated proposal artifact and open a human-reviewed PR to develop. No image has been promoted.'
          echo 'Automatic PR creation requires enterprise/organization permission and RUNTIME_IMAGE_PR_ENABLED=true. The resolver, tests, chart render and artifact checks remain mandatory.' >> "$GITHUB_STEP_SUMMARY"
      - name: Propose a reviewed update on develop
        if: steps.proposal.outputs.changed == 'true' && vars.RUNTIME_IMAGE_PR_ENABLED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: automation/runtime-image-updates
          add-paths: |
            magic-cluster/apps/instances/odysseus/files/runtime-images.json
            licenses/dependency-inventory.json
          commit-message: 'chore: update reviewed runtime image candidates'
          title: 'Review Odysseus runtime image updates'
          body: |
            Weekly digest refresh for Chroma, ntfy and Odysseus supplier tags.
            Runtime references remain immutable. This PR neither merges itself nor deploys an appliance.

            The update job tests the resolver and renders the candidate chart. Review upstream
            changes and test existing application data before merging to develop. Approve the
            pending PR workflows created through GITHUB_TOKEN, or run Public release checks
            manually on this automation branch if they are unavailable. An approved bot identity
            can be configured separately for unattended PR checks.
            Promote a tested release to main separately. Legal review stays advisory.
