name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      approved_dev_risk: ${{ steps.pr114.outputs.accepted == 'true' || steps.main_dev.outputs.accepted == 'true' }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Compare the actual merge tree with the reviewed source and its parents.
          fetch-depth: >-
            ${{ ((github.event_name == 'pull_request' && (github.event.number == 114 ||
              github.event.pull_request.head.ref == 'codex/main-dev-picomatch-34a2343' ||
              startsWith(github.event.pull_request.head.ref, 'codex/promote-images-'))) ||
              (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependency graph
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Evaluate the documented PR 114 Main admission
        id: pr114
        if: ${{ github.event_name == 'pull_request' && github.event.number == 114 }}
        run: |
          node --test ../tests/pr114-main-advisory.test.mjs
          node ../tools/pr114-main-advisory.mjs
      - name: Evaluate the documented Main-dev advisory acceptance
        id: main_dev
        if: >-
          (github.event_name == 'pull_request' &&
            (github.event.pull_request.head.ref == 'codex/main-dev-picomatch-34a2343' ||
             startsWith(github.event.pull_request.head.ref, 'codex/promote-images-'))) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test ../tests/main-dev-advisory-admission.test.mjs
          node ../tools/main-dev-advisory-admission.mjs
      - name: Query current registry advisories
        if: steps.pr114.outputs.accepted != 'true' && steps.main_dev.outputs.accepted != 'true'
        # Network/registry failure must not turn into a green security result.
        # No --fix, ignored advisories, registry-error bypass or || true here.
        run: pnpm audit --audit-level high

  pr114-unfiltered:
    name: Unfiltered registry audit (approved dev risk)
    # The release verifier requires every job to complete successfully on a
    # clean Main run, including this job. Reuse the completed strict scan there.
    needs: advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Use the completed strict audit when no admission applied
        if: needs.advisories.outputs.approved_dev_risk != 'true'
        working-directory: .
        run: echo 'The required advisories job already completed the unfiltered registry audit.'
      - uses: actions/checkout@v4
        if: needs.advisories.outputs.approved_dev_risk == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.advisories.outputs.approved_dev_risk == 'true'
        with:
          node-version: '24'
      - name: Install locked dependency graph
        if: needs.advisories.outputs.approved_dev_risk == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      # Keep the unaccepted result available, including to fresh installed-CI evidence checks.
      - name: Query current registry advisories without acceptance
        if: needs.advisories.outputs.approved_dev_risk == 'true'
        run: pnpm audit --audit-level high

  python-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - dashboard/apps/api/requirements.txt
          - magic-cluster/apps/ai/private-mesh/requirements.txt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Python advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Query current Python advisories
        # A resolver, registry or advisory-service error must fail this job.
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: python -m pip_audit --strict --progress-spinner off -r "$REQUIREMENTS"
