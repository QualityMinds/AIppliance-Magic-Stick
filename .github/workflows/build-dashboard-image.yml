name: Build MagicStick React dashboard image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-dashboard-image.yml
      - dashboard/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: dashboard-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/qualityminds/magicstick-dashboard

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out MagicStick
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Verify React workspace
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=react-preview
          labels: |
            org.opencontainers.image.title=MagicStick React dashboard
            org.opencontainers.image.description=Parallel React dashboard preview for MagicStick
            org.opencontainers.image.source=https://github.com/QualityMinds/AIppliance-Magic-Stick
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=magicstick-dashboard
          cache-to: type=gha,mode=max,scope=magicstick-dashboard
          provenance: mode=max
          sbom: true
