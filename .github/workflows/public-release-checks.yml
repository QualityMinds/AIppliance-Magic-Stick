name: Public release checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r magic-host/requirements.yml

      - name: Check source license and publication metadata contracts
        run: |
          python3 tools/license_audit.py --check
          python3 -m unittest tests/test_license_release.py tests/test_license_audit.py tests/test_license_kdns.py

      - name: Secret scan current tree
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/reports" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --no-git --redact \
            --report-format json --report-path /reports/gitleaks-current.json

      - name: Report secret-scan locations without matched values
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gitleaks-current.json" ]; then
            jq -r '.[] | [.File, .StartLine, .RuleID] | @tsv' "$RUNNER_TEMP/gitleaks-current.json"
          fi

      - name: Secret scan git history
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact

      - name: Check Ansible playbook syntax
        env:
          ANSIBLE_ROLES_PATH: magic-host/roles
        run: ansible-playbook --syntax-check magic-host/playbooks/local.yml

      - name: Check appliance consoles and host management
        run: |
          python3 -m unittest discover -s magic-host/roles/first-run-setup/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-host/roles/dashboard-console/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-host/roles/gpu-compatibility/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-host/roles/host-management/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-host/roles/k3s/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-host/roles/kubernetes-oidc/tests -p 'test_*.py'

      - name: Check one-command installer entrypoints
        run: |
          bash -n install-from-linux.sh
          bash -n deploy-on-k8s.sh
          python3 -m unittest tests/test_install_entrypoints.py
          python3 -m unittest tests.test_install_channels tests.test_runtime_image_updates tests.test_release tests.test_repository_hygiene
          python3 -m unittest tests/test_installer_network.py
          python3 -m unittest tests/test_installer_boot.py
          python3 -m unittest tests/test_git_http_fallback.py

      - name: Run identity, dashboard, operator, model catalog and AI route unit tests
        run: |
          python3 -m pip install -r dashboard/apps/api/requirements.txt pyyaml
          python3 dashboard/apps/api/check_license_trust.py --manifest magic-cluster/apps/dashboard/license-official-trust.yaml
          python3 -m unittest discover -s dashboard/apps/api -p 'test_*.py'
          python3 -m unittest discover -s magic-cluster/platform/identity/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-cluster/apps/dashboard -p 'test_*.py'
          python3 -m unittest discover -s magic-cluster/platform/magicstick-operator/controller -p 'test_*.py'
          python3 -m unittest discover -s magic-cluster/apps/ai/model-catalog -p 'test_*.py'
          python3 -m unittest discover -s magic-cluster/apps/ai/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-cluster/apps/ai/litellm/tests -p 'test_*.py'
          python3 -m unittest discover -s magic-cluster/apps/ai/private-mesh -p 'test_*.py'

      - name: Check dashboard clients
        working-directory: dashboard
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node ../tools/collect_npm_notices.mjs
          git diff --exit-code -- ../licenses/third-party/npm.txt
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Render public Kustomize targets
        run: |
          targets=(
            magic-cluster/flux/entrypoints/base
            magic-cluster/flux/entrypoints/single-node
            magic-cluster/apps/dashboard
            magic-cluster/platform/magicstick-operator
            magic-cluster/platform/basis
            magic-cluster/platform/first-run-setup
            magic-cluster/platform/gateway/envoy-gateway
            magic-cluster/platform/identity
            magic-cluster/platform/gpu
            magic-cluster/platform/ai/kubeai
            magic-cluster/platform/ai/hermes-operator
            magic-cluster/platform/ai/openclaw-operator
            magic-cluster/platform/ai/paperclip-operator
            magic-cluster/platform/ai/agent-sandbox
            magic-cluster/apps/ai/litellm/base
            magic-cluster/apps/ai/private-mesh
            magic-cluster/apps/ai/model-catalog
            magic-cluster/apps/ai/anything-llm/base
            magic-cluster/apps/ai/kubeopencode
            examples/demo/infra-cluster/flux-bootstrap
          )

          for target in "${targets[@]}"; do
            echo "Rendering ${target}"
            kubectl kustomize "${target}" > /tmp/kustomize-render.yaml
          done
