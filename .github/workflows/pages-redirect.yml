name: GitHub Pages redirect to website

# The website is hosted on Azure Static Web Apps (azure-static-web-apps.yml).
# GitHub Pages only forwards old qualityminds.github.io addresses to https://magic-stick.ai.
# Run this manually to publish redirects; it is not triggered by commits.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-redirect
  cancel-in-progress: false

jobs:
  build:
    name: Build redirect pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      WEBSITE_URL: https://magic-stick.ai
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation-only dependencies
        run: python -m pip install -r requirements-docs.txt
      # The full build lists every published address that needs a redirect.
      - name: Build the static site
        run: python tools/docs.py build
      - name: Generate a redirect page for every website address
        run: python tools/docs.py redirect
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages-redirect

  deploy:
    name: Publish redirects to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      # Fixed environment name that GitHub Pages deployments require.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish redirects to the website
        id: deployment
        uses: actions/deploy-pages@v4
