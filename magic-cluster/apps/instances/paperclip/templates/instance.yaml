{{- $instance := required "instance is required" .Values.instance -}}
{{- $values := default dict $instance.values -}}
{{- $ingress := default dict $values.ingress -}}
{{- $agentExecution := default dict $values.agentExecution -}}
{{- $model := trimPrefix "litellm/" (trimPrefix "openai/" (default "CHANGEME_MODEL" (default $values.model $agentExecution.defaultModel))) -}}
{{- $imageRepository := dig "image" "repository" "ghcr.io/paperclipai/paperclip" $values -}}
{{- $imageTag := dig "image" "tag" "sha-df0e5bd" $values -}}
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: {{ $instance.name }}
  namespace: {{ $instance.namespace }}
  labels:
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/instance: {{ $instance.name }}
    appliance.magicstick.dev/appinstance: {{ $instance.name }}
spec:
  podAnnotations:
    ai-appliance.io/model-catalog-consumer: "true"
  image:
    repository: {{ $imageRepository | quote }}
    tag: {{ $imageTag | quote }}
  deployment:
    # Envoy Gateway is the authentication boundary. Paperclip stays private
    # and does not present a second, application-local login screen.
    mode: local_trusted
    exposure: private
    allowedHostnames:
      - {{ $ingress.host | quote }}
      - {{ $instance.localHost | quote }}
      - localhost
      - 127.0.0.1
  # local_trusted intentionally binds Paperclip to loopback. This sidecar
  # listens only on the Pod IP and forwards raw TCP to that loopback socket,
  # making the existing ClusterIP Service reachable without opening Paperclip
  # directly or adding a second application login.
  sidecars:
    - name: gateway-loopback-proxy
      image: {{ printf "%s:%s" $imageRepository $imageTag | quote }}
      imagePullPolicy: IfNotPresent
      command: [node, -e]
      args:
        - |
          const fs = require("fs");
          const https = require("https");
          const net = require("net");
          const http = require("http");
          const listenHost = process.env.POD_IP;
          const listenPort = 3100;
          const instanceName = process.env.PAPERCLIP_INSTANCE_NAME;
          const sandboxCleanupGraceMs = Math.max(
            0,
            Number(process.env.PAPERCLIP_SANDBOX_CLEANUP_GRACE_SECONDS || "60") * 1000,
          );
          const terminalRunStatuses = new Set([
            "succeeded",
            "completed",
            "failed",
            "cancelled",
            "interrupted",
            "timed_out",
            "timeout",
          ]);
          const pluginKey = "paperclip.kubernetes-sandbox-provider";
          const pluginPackage = "@paperclipai/plugin-kubernetes";
          const pluginPackageVersion = "2026.707.0";
          const paperclipBaseSkill = "paperclipai/paperclip/paperclip";
          const defaultOpenCodeModel = process.env.PAPERCLIP_DEFAULT_OPENCODE_MODEL;
          let installAttempted = false;
          let enableAttempted = false;
          let lastBootstrapError = "";
          let agentReconciliationRunning = false;
          let sandboxReconciliationRunning = false;
          const server = net.createServer((downstream) => {
            const upstream = net.connect({host: "127.0.0.1", port: 3100});
            downstream.pipe(upstream);
            upstream.pipe(downstream);
            downstream.on("error", () => upstream.destroy());
            upstream.on("error", () => downstream.destroy());
          });
          server.once("error", (error) => {
            console.error(`Paperclip gateway proxy failed: ${error.message}`);
            process.exit(1);
          });
          const apiRequest = (method, path, body) => new Promise((resolve, reject) => {
            const payload = body === undefined ? null : JSON.stringify(body);
            const timeout = method === "POST" && path === "/api/plugins/install" ? 120000 : 5000;
            const request = http.request({
              host: "127.0.0.1",
              port: 3100,
              path,
              method,
              timeout,
              headers: payload === null ? {} : {
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload),
              },
            }, (response) => {
              let responseBody = "";
              response.setEncoding("utf8");
              response.on("data", (chunk) => {
                if (responseBody.length < 1024 * 1024) responseBody += chunk;
              });
              response.on("end", () => {
                if (response.statusCode < 200 || response.statusCode >= 300) {
                  reject(new Error(`${method} ${path} returned ${response.statusCode}: ${responseBody.slice(0, 500)}`));
                  return;
                }
                if (responseBody.length === 0) {
                  resolve(null);
                  return;
                }
                try {
                  resolve(JSON.parse(responseBody));
                } catch (error) {
                  reject(new Error(`${method} ${path} returned invalid JSON: ${error.message}`));
                }
              });
            });
            request.once("error", reject);
            request.once("timeout", () => request.destroy(new Error(`${method} ${path} timed out`)));
            if (payload !== null) request.write(payload);
            request.end();
          });
          const kubeApiRequest = (method, path) => new Promise((resolve, reject) => {
            const request = https.request({
              host: process.env.KUBERNETES_SERVICE_HOST,
              port: Number(process.env.KUBERNETES_SERVICE_PORT_HTTPS || "443"),
              path,
              method,
              ca: fs.readFileSync("/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"),
              headers: {
                Accept: "application/json",
                Authorization: `Bearer ${fs.readFileSync("/var/run/secrets/kubernetes.io/serviceaccount/token", "utf8").trim()}`,
              },
            }, (response) => {
              let responseBody = "";
              response.setEncoding("utf8");
              response.on("data", (chunk) => {
                if (responseBody.length < 4 * 1024 * 1024) responseBody += chunk;
              });
              response.on("end", () => {
                if (response.statusCode === 404) {
                  resolve(null);
                  return;
                }
                if (response.statusCode < 200 || response.statusCode >= 300) {
                  reject(new Error(`${method} Kubernetes ${path} returned ${response.statusCode}: ${responseBody.slice(0, 500)}`));
                  return;
                }
                if (responseBody.length === 0) {
                  resolve(null);
                  return;
                }
                try {
                  resolve(JSON.parse(responseBody));
                } catch (error) {
                  reject(new Error(`${method} Kubernetes ${path} returned invalid JSON: ${error.message}`));
                }
              });
            });
            request.once("error", reject);
            request.once("timeout", () => request.destroy(new Error(`${method} Kubernetes ${path} timed out`)));
            request.setTimeout(5000);
            request.end();
          });
          const ensureKubernetesPlugin = async () => {
            const plugins = await apiRequest("GET", "/api/plugins");
            if (!Array.isArray(plugins)) throw new Error("GET /api/plugins did not return a plugin list");
            let plugin = plugins.find((candidate) => candidate.pluginKey === pluginKey);
            if (!plugin || plugin.status === "error" || plugin.status === "incompatible") {
              if (installAttempted) {
                throw new Error(`Kubernetes plugin did not become ready after installation (status=${plugin?.status ?? "missing"})`);
              }
              installAttempted = true;
              plugin = await apiRequest("POST", "/api/plugins/install", {
                packageName: pluginPackage,
                version: pluginPackageVersion,
                isLocalPath: false,
              });
            }
            if (plugin?.status === "disabled" && !enableAttempted) {
              enableAttempted = true;
              plugin = await apiRequest("POST", `/api/plugins/${encodeURIComponent(plugin.id)}/enable`, {});
            }
            if (plugin?.status !== "ready") {
              throw new Error(`Kubernetes plugin is not ready yet (status=${plugin?.status ?? "unknown"})`);
            }
          };
          const reconcileOpenCodeAgents = async () => {
            if (agentReconciliationRunning) return;
            if (!defaultOpenCodeModel || defaultOpenCodeModel.includes("CHANGEME")) return;
            agentReconciliationRunning = true;
            try {
              const adapters = await apiRequest("GET", "/api/adapters");
              if (!Array.isArray(adapters)) throw new Error("GET /api/adapters did not return an adapter list");
              const openCode = adapters.find((adapter) => adapter.type === "opencode_local" && adapter.disabled === false);
              if (!openCode) return;
              const adaptersByType = new Map(adapters.map((adapter) => [adapter.type, adapter]));
              const companies = await apiRequest("GET", "/api/companies");
              if (!Array.isArray(companies)) throw new Error("GET /api/companies did not return a company list");
              for (const company of companies) {
                const companyId = encodeURIComponent(company.id);
                const response = await apiRequest("GET", `/api/companies/${companyId}/agents`);
                const agents = Array.isArray(response) ? response : response?.items;
                if (!Array.isArray(agents)) throw new Error(`Company ${company.id} did not return an agent list`);
                for (const agent of agents) {
                  const marker = agent?.metadata?.paperclipBuiltInAgent;
                  const configuredModel = agent?.adapterConfig?.model;
                  const selectedAdapter = adaptersByType.get(agent?.adapterType);
                  const hasConfiguredModel = typeof configuredModel === "string" && configuredModel.trim().length > 0;
                  const desiredSkills = Array.isArray(agent?.adapterConfig?.paperclipSkillSync?.desiredSkills)
                    ? agent.adapterConfig.paperclipSkillSync.desiredSkills.filter((skill) => typeof skill === "string")
                    : [];
                  const updates = {};
                  if (marker?.key && selectedAdapter?.disabled === true && !hasConfiguredModel) {
                    updates.adapterType = "opencode_local";
                    updates.adapterConfig = {model: defaultOpenCodeModel};
                  }
                  const resolvedAdapterType = updates.adapterType || agent?.adapterType;
                  if (resolvedAdapterType === "opencode_local" && !desiredSkills.includes(paperclipBaseSkill)) {
                    updates.adapterConfig = {
                      ...(updates.adapterConfig || {}),
                      paperclipSkillSync: {
                        ...(agent?.adapterConfig?.paperclipSkillSync || {}),
                        desiredSkills: [...desiredSkills, paperclipBaseSkill],
                      },
                    };
                  }
                  if (Object.keys(updates).length === 0) continue;
                  await apiRequest("PATCH", `/api/agents/${encodeURIComponent(agent.id)}`, updates);
                  console.log(`Reconciled OpenCode model and Paperclip skill for agent ${agent.id}`);
                }
              }
            } finally {
              agentReconciliationRunning = false;
            }
          };
          const reconcileStaleSandboxes = async () => {
            if (sandboxReconciliationRunning) return;
            if (!instanceName || !/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(instanceName)) return;
            sandboxReconciliationRunning = true;
            try {
              const companies = await apiRequest("GET", "/api/companies");
              if (!Array.isArray(companies)) throw new Error("GET /api/companies did not return a company list");
              for (const company of companies) {
                const companyId = typeof company?.id === "string" ? company.id : "";
                if (!/^[a-z0-9-]+$/.test(companyId)) continue;
                const runResponse = await apiRequest(
                  "GET",
                  `/api/companies/${encodeURIComponent(companyId)}/heartbeat-runs`,
                );
                const runs = Array.isArray(runResponse)
                  ? runResponse
                  : (Array.isArray(runResponse?.items) ? runResponse.items : runResponse?.runs);
                if (!Array.isArray(runs)) throw new Error(`Company ${companyId} did not return a heartbeat run list`);
                const terminalRuns = new Map();
                for (const run of runs) {
                  const finishedAt = Date.parse(run?.finishedAt || "");
                  if (
                    typeof run?.id === "string"
                    && terminalRunStatuses.has(run?.status)
                    && Number.isFinite(finishedAt)
                  ) {
                    terminalRuns.set(run.id, finishedAt);
                  }
                }
                if (terminalRuns.size === 0) continue;
                const namespace = `${instanceName}-${companyId}`;
                const selector = encodeURIComponent("paperclip.io/managed-by=paperclip-k8s-plugin");
                const response = await kubeApiRequest(
                  "GET",
                  `/apis/agents.x-k8s.io/v1alpha1/namespaces/${namespace}/sandboxes?labelSelector=${selector}`,
                );
                if (response === null) continue;
                if (!Array.isArray(response?.items)) throw new Error(`Namespace ${namespace} did not return a Sandbox list`);
                for (const sandbox of response.items) {
                  const sandboxName = sandbox?.metadata?.name;
                  const runId = sandbox?.metadata?.labels?.["paperclip.io/run-id"];
                  const finishedAt = terminalRuns.get(runId);
                  if (
                    typeof sandboxName !== "string"
                    || !/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(sandboxName)
                    || finishedAt === undefined
                    || Date.now() - finishedAt < sandboxCleanupGraceMs
                  ) continue;
                  await kubeApiRequest(
                    "DELETE",
                    `/apis/agents.x-k8s.io/v1alpha1/namespaces/${namespace}/sandboxes/${sandboxName}`,
                  );
                  console.log(`Deleted stale Sandbox ${namespace}/${sandboxName} for terminal run ${runId}`);
                }
              }
            } finally {
              sandboxReconciliationRunning = false;
            }
          };
          const bootstrap = async () => {
            try {
              await apiRequest("GET", "/api/health");
              await ensureKubernetesPlugin();
              await reconcileOpenCodeAgents();
              try {
                await reconcileStaleSandboxes();
              } catch (error) {
                console.error(`Paperclip stale Sandbox reconciliation failed: ${error.message}`);
              }
              server.listen(listenPort, listenHost, () => {
                console.log(`Paperclip Kubernetes plugin is ready; gateway proxy listening on ${listenHost}:${listenPort}`);
                setInterval(() => {
                  reconcileOpenCodeAgents().catch((error) => {
                    console.error(`Paperclip OpenCode agent reconciliation failed: ${error.message}`);
                  });
                  reconcileStaleSandboxes().catch((error) => {
                    console.error(`Paperclip stale Sandbox reconciliation failed: ${error.message}`);
                  });
                }, 30000);
              });
            } catch (error) {
              if (error.message !== lastBootstrapError) {
                lastBootstrapError = error.message;
                console.error(`Waiting for Paperclip Kubernetes plugin: ${error.message}`);
              }
              setTimeout(bootstrap, 1000);
            }
          };
          bootstrap();
      env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PAPERCLIP_DEFAULT_OPENCODE_MODEL
          value: {{ printf "litellm/%s" $model | quote }}
        - name: PAPERCLIP_INSTANCE_NAME
          value: {{ $instance.name | quote }}
        - name: PAPERCLIP_SANDBOX_CLEANUP_GRACE_SECONDS
          value: "60"
      readinessProbe:
        tcpSocket:
          port: 3100
        periodSeconds: 5
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
  # Kubelet probes address the Pod IP and therefore traverse the loopback
  # proxy. TCP avoids Paperclip rejecting the probe's Pod-IP Host header.
  probes:
    type: tcp
  database:
    mode: managed
    managed:
      storageSize: {{ dig "database" "managed" "storageSize" "10Gi" $values | quote }}
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-masterkey-secret
          key: LITELLM_MASTER_KEY
    - name: OPENAI_BASE_URL
      value: http://litellm.ai.svc.cluster.local:4000/v1
    - name: PAPERCLIP_ADAPTER_MODELS
      valueFrom:
        configMapKeyRef:
          name: ai-model-catalog
          key: paperclip-adapter-models.json
    - name: PAPERCLIP_OPENCODE_PROVIDERS
      valueFrom:
        configMapKeyRef:
          name: ai-model-catalog
          key: paperclip-opencode-providers.json
    - name: PAPERCLIP_OPENCODE_SMALL_MODEL
      value: {{ printf "litellm/%s" $model | quote }}
    - name: PAPERCLIP_OPENCODE_CHEAP_MODEL
      value: {{ printf "litellm/%s" $model | quote }}
    # The Paperclip operator currently exposes no CRD field for this supported
    # server bootstrap setting. Without it, environment probes fall back to the
    # unregistered claude_local adapter even though runs use opencode_local.
    - name: PAPERCLIP_K8S_ADAPTER_TYPE
      value: opencode_local
  adapters:
    execution:
      mode: kubernetes
      kubernetes:
        backend: sandbox-cr
        egressMode: standard
        namespacePrefix: {{ printf "%s-" $instance.name | quote }}
    registry:
      - adapterType: opencode_local
        enabled: true
        runtimeImage: ghcr.io/paperclipai/agent-runtime-opencode:git-b18cbb0dd3d524d3d332f54143c84f00c694636c
        envKeys:
          - OPENAI_API_KEY
          - OPENAI_BASE_URL
          - PAPERCLIP_OPENCODE_PROVIDERS
          - PAPERCLIP_OPENCODE_SMALL_MODEL
          - PAPERCLIP_OPENCODE_CHEAP_MODEL
        defaultEnv:
          OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
  storage:
    persistence:
      enabled: true
      size: {{ dig "storage" "size" "5Gi" $values | quote }}
  security:
    networkPolicy:
      enabled: true
  networking:
    service:
      type: ClusterIP
      port: 3100
    ingress:
      enabled: false
