{{- $instance := required "instance is required" .Values.instance -}}
{{- $values := default dict $instance.values -}}
{{- $key := default (dict "name" (printf "%s-litellm" $instance.name) "key" "LITELLM_API_KEY" "revision" "") $instance.litellmKey -}}
{{- $model := trimPrefix "litellm/" (trimPrefix "openai/" (default "" $values.model)) -}}
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: {{ $instance.name }}
  namespace: {{ $instance.namespace }}
  {{- if $model }}
  annotations:
    ai-appliance.io/preferred-model: {{ $model | quote }}
  {{- end }}
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/instance: {{ $instance.name }}
    appliance.magicstick.dev/appinstance: {{ $instance.name }}
spec:
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: "2026.9.8"
    digest: sha256:d0ded1dd76939b2bf4d67ef2d13247b8b160aa5666331d4a0b0e58811182cbb8
  podAnnotations:
    appliance.magicstick.dev/litellm-key-revision: {{ $key.revision | quote }}
    # The native operator watches the instance ConfigMap and rolls its Pod.
    ai-appliance.io/model-catalog-consumer: "false"
  config:
    mergeMode: merge
    configMapRef:
      name: {{ printf "%s-model-catalog" $instance.name }}
      key: openclaw.json
    forcePaths:
      - models.providers
      - agents.defaults.compaction
      - agents.defaults.model
      - tools.profile
  env:
    - name: LITELLM_API_KEY
      valueFrom:
        secretKeyRef:
          name: {{ $key.name | quote }}
          key: {{ $key.key | quote }}
  storage:
    persistence:
      enabled: true
      size: {{ dig "storage" "size" "10Gi" $values | quote }}
  # Operator v0.40.0 uses fsGroup but does not own the PVC mount root. The
  # OpenClaw 2026.9 runtime must be able to fchmod its state directory. This
  # narrow helper runs after operator initialization, before the gateway, and
  # only corrects the root of this instance's own data volume.
  initContainers:
    - name: ensure-data-owner
      image: ghcr.io/openclaw/openclaw:2026.9.8@sha256:d0ded1dd76939b2bf4d67ef2d13247b8b160aa5666331d4a0b0e58811182cbb8
      imagePullPolicy: IfNotPresent
      command: [node, -e]
      args:
        - |
{{ .Files.Get "files/ensure-data-owner.cjs" | indent 10 }}
          ensureDataOwner(require('node:fs'));
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 1, memory: 128Mi}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [CHOWN]
        seccompProfile: {type: RuntimeDefault}
      volumeMounts:
        - {name: data, mountPath: /data}
  security:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
    networkPolicy:
      enabled: true
      allowedIngressNamespaces: [ai, envoy-gateway-system]
      additionalEgress:
        - to:
            - podSelector:
                matchLabels:
                  app: litellm
          ports:
            - protocol: TCP
              port: 4000
  networking:
    service:
      type: ClusterIP
    ingress:
      enabled: false
