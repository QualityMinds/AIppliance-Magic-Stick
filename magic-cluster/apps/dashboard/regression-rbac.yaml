apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dashboard-regression-intent, namespace: ai-system}
rules:
  - apiGroups: [appliance.magicstick.dev]
    resources: [regressionruns]
    verbs: [get, list, create, patch]
  - apiGroups: [appliance.magicstick.dev]
    resources: [regressionruns/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dashboard-regression-intent, namespace: ai-system}
subjects: [{kind: ServiceAccount, name: ai-appliance-dashboard-api, namespace: identity-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dashboard-regression-intent}
