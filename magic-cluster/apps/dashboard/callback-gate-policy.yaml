apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: dashboard-callback-gate
  namespace: identity-system
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: dashboard-local}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: dashboard-public}
  lua:
    - type: ValueRef
      valueRef: {group: "", kind: ConfigMap, name: magicstick-cookie-migration}
  extProc:
    - backendRefs: [{group: gateway.envoyproxy.io, kind: Backend, name: magicstick-callback-gate}]
      failOpen: false
      messageTimeout: 8s
      processingMode: {request: {}}
