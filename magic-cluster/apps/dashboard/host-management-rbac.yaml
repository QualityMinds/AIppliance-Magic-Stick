apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-appliance-dashboard-host-operations
  namespace: ai-system
rules:
  - apiGroups: [appliance.magicstick.dev]
    resources: [hostoperations]
    verbs: [get, list, create, delete, patch]
# Network request Secrets are immutable, request-scoped and consumed by the host.
# No secret list/update permission. HostOperation spec remains CEL-immutable;
# patch is used only for explicit network confirmation metadata.
# No status, Node patch, exec, privileged Pod or host filesystem permission.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-appliance-dashboard-host-operations
  namespace: ai-system
subjects:
  - kind: ServiceAccount
    name: ai-appliance-dashboard-api
    namespace: identity-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-appliance-dashboard-host-operations
---
apiVersion: v1
kind: Namespace
metadata:
  name: host-management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-appliance-dashboard-network-credentials
  namespace: host-management
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-appliance-dashboard-network-credentials
  namespace: host-management
subjects:
  - kind: ServiceAccount
    name: ai-appliance-dashboard-api
    namespace: identity-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-appliance-dashboard-network-credentials
