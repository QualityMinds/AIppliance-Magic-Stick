apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-appliance-dashboard-host-operations
  namespace: ai-system
rules:
  - apiGroups: [appliance.magicstick.dev]
    resources: [hostoperations]
    verbs: [get, list, create, delete]
# No status, Node patch, exec, privileged Pod or host filesystem permission.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-appliance-dashboard-host-operations
  namespace: ai-system
subjects:
  - kind: ServiceAccount
    name: ai-appliance-dashboard-api
    namespace: identity-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-appliance-dashboard-host-operations
