apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-api-local
  namespace: identity-system
  annotations:
    lab42.io/mdns.enabled: "true"
spec:
  parentRefs:
    - name: identity-pilot
      sectionName: https
  hostnames:
    - "api.${AI_APPLIANCE_MDNS_DOMAIN:=magicstick.local}"
  rules:
    - backendRefs:
        - name: ai-appliance-dashboard-api
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dashboard-api-local-jwt
  namespace: identity-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: dashboard-api-local
  jwt:
    providers:
      - name: keycloak
        issuer: "https://id.${AI_APPLIANCE_MDNS_DOMAIN:=magicstick.local}/realms/magicstick"
        remoteJWKS:
          uri: http://keycloak.identity-system.svc.cluster.local:8080/realms/magicstick/protocol/openid-connect/certs
          backendRefs:
            - name: keycloak
              port: 8080
  authorization:
    defaultAction: Deny
    rules:
      - name: required-magicstick-user
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: realm_access.roles
                valueType: StringArray
                values:
                  - magicstick-user
                  - magicstick-viewer
                  - magicstick-operator
                  - magicstick-admin
