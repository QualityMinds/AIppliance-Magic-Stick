                    "appliance.magicstick.dev/application": instance_type,
                },
            },
            "spec": {
                "application": instance_type,
                "enabled": payload.get("enabled", True) is not False,
                "targetNamespace": target_namespace,
                "access": {
                    "authentication": authentication,
                    "role": role,
                    "exposure": exposure,
                },
                "applianceRef": {
                    "name": APPLIANCE_NAME,
                    "namespace": APPLIANCE_NAMESPACE,
                },
                "values": parameters,
            },
        }


    def positive_int(value):
        if isinstance(value, bool):
            return None
        if isinstance(value, int) and value > 0:
            return value
        if isinstance(value, str) and value.strip().isdigit():
            parsed = int(value.strip())
            return parsed if parsed > 0 else None
        return None


    def parse_mib(value):
        if value is None or value == "":
            return None
        if isinstance(value, int):
            return value if value > 0 else None
        raw = str(value).strip()
        parsed = positive_int(raw)
        if parsed:
            return parsed
        match = re.fullmatch(r"(\d+(?:\.\d+)?)\s*([A-Za-z]+)", raw)
        if not match:
            return None
        factors = {"m": 1, "mb": 1, "mi": 1, "mib": 1, "g": 1024, "gb": 1024, "gi": 1024, "gib": 1024}
        unit = match.group(2).lower()
        if unit not in factors:
            return None
        return int(float(match.group(1)) * factors[unit])


    def ceil_mib(bytes_value):
        return int((int(bytes_value or 0) + MIB_BYTES - 1) // MIB_BYTES)


    def round_up_mib(value, step=MEMORY_RESERVATION_STEP_MI):
        numeric = max(0, int(value or 0))
        unit = max(1, int(step or 1))
        return ((numeric + unit - 1) // unit) * unit


    def hf_repo_id(value):
        raw = str(value or "").strip()
        if not raw:
            raise ValueError("HF URL is required")
        if raw.startswith("hf://"):
            repo = raw[5:].strip("/")
        elif raw.startswith("https://") or raw.startswith("http://"):
            parsed = urllib.parse.urlparse(raw)
            if parsed.scheme != "https" or parsed.netloc not in {"huggingface.co", "www.huggingface.co"}:
                raise ValueError("only public https://huggingface.co URLs are supported")
            parts = [part for part in parsed.path.split("/") if part]
            if len(parts) >= 4 and parts[2] in {"resolve", "blob", "tree"}:
                repo = "/".join(parts[:2])
            elif len(parts) >= 2:
                repo = "/".join(parts[:2])
            else:
                raise ValueError("HF URL must include namespace and model name")
        elif re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", raw):
            repo = raw
        else:
            raise ValueError("HF URL must be hf://namespace/model or https://huggingface.co/namespace/model")
        parts = repo.split("/")
        if len(parts) != 2 or any(not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", part) for part in parts):
            raise ValueError("HF URL must reference a public namespace/model repository")
        return "/".join(parts)


    def hf_resolve_url(repo, filename):
        namespace, name = repo.split("/", 1)
        return "https://huggingface.co/" + urllib.parse.quote(namespace) + "/" + urllib.parse.quote(name) + "/resolve/main/" + filename


    def hf_model_api_url(repo):
        namespace, name = repo.split("/", 1)
        return "https://huggingface.co/api/models/" + urllib.parse.quote(namespace) + "/" + urllib.parse.quote(name)


    def hf_model_detail_api_url(repo):
        return hf_model_api_url(repo) + "?" + urllib.parse.urlencode({"blobs": "true"})


    def hf_model_tree_url(repo):
        namespace, name = repo.split("/", 1)
        return (
            "https://huggingface.co/api/models/"
            + urllib.parse.quote(namespace)
            + "/"
            + urllib.parse.quote(name)
            + "/tree/main?recursive=true"
        )


    def fetch_public_json(url, required=True):
        request = urllib.request.Request(url, headers={
            "Accept": "application/json",
            "User-Agent": "magicstick-dashboard/0.1",
        })
        try:
            with urllib.request.urlopen(request, timeout=12, context=PUBLIC_SSL_CONTEXT) as response:
                return json.loads(response.read().decode("utf-8"))
        except urllib.error.HTTPError as error:
            if error.code == 404 and not required:
                return None
            if error.code in {401, 403}:
                raise ValueError("private or unauthorized HuggingFace models are not supported in this version")
            if not required:
                return None
            raise


    def hf_metadata(repo):
        now = time.time()
        cached = HF_METADATA_CACHE.get(repo)
        if cached and now - cached.get("fetchedAt", 0) < HF_CACHE_TTL_SECONDS:
            return cached
        model_api = fetch_public_json(hf_model_api_url(repo), required=False)
        config = fetch_public_json(hf_resolve_url(repo, "config.json"), required=False)
        if not config:
            config = (model_api or {}).get("config")
        if not config:
            raise ValueError("public HuggingFace config.json is not available for this model")
        safetensors_index = fetch_public_json(hf_resolve_url(repo, "model.safetensors.index.json"), required=False)
        model_tree = fetch_public_json(hf_model_tree_url(repo), required=False)
        cached = {
            "repo": repo,
            "config": config or {},
            "safetensorsIndex": safetensors_index or {},
            "modelTree": model_tree if isinstance(model_tree, list) else [],
            "modelApi": model_api or {},
            "fetchedAt": now,
        }
        HF_METADATA_CACHE[repo] = cached
        return cached


    def hf_discovery_cache_get(key):
        now = time.time()
        with HF_DISCOVERY_CACHE_LOCK:
            cached = HF_DISCOVERY_CACHE.get(key)
            if not cached:
                return None
            if now - float(cached.get("fetchedAt", 0)) >= HF_DISCOVERY_CACHE_TTL_SECONDS:
                HF_DISCOVERY_CACHE.pop(key, None)
                return None
            return cached.get("value")


    def hf_discovery_cache_set(key, value):
        now = time.time()
        with HF_DISCOVERY_CACHE_LOCK:
            expired = [
                item_key
                for item_key, item in HF_DISCOVERY_CACHE.items()
                if now - float(item.get("fetchedAt", 0)) >= HF_DISCOVERY_CACHE_TTL_SECONDS
            ]
            for item_key in expired:
                HF_DISCOVERY_CACHE.pop(item_key, None)
            while len(HF_DISCOVERY_CACHE) >= HF_DISCOVERY_MAX_CACHE_ENTRIES:
                oldest_key = min(
                    HF_DISCOVERY_CACHE,
                    key=lambda item_key: float(HF_DISCOVERY_CACHE[item_key].get("fetchedAt", 0)),
                )
                HF_DISCOVERY_CACHE.pop(oldest_key, None)
            HF_DISCOVERY_CACHE[key] = {"fetchedAt": now, "value": value}
        return value


    def fetch_hf_discovery_json(url, required=True):
        parsed = urllib.parse.urlparse(str(url or ""))
        if (
            parsed.scheme != "https"
            or parsed.hostname != "huggingface.co"
            or parsed.username
            or parsed.password
            or parsed.port not in {None, 443}
            or not parsed.path.startswith("/api/models")
            or parsed.fragment
        ):
            raise ValueError("Hugging Face discovery only permits the public models API")
        request = urllib.request.Request(url, headers={
            "Accept": "application/json",
            "User-Agent": "magicstick-dashboard/0.1",
        })
        try:
            with urllib.request.urlopen(
                request,
                timeout=HF_DISCOVERY_TIMEOUT_SECONDS,
                context=PUBLIC_SSL_CONTEXT,
            ) as response:
                declared_size = positive_int(response.headers.get("Content-Length"))
                if declared_size and declared_size > HF_DISCOVERY_MAX_RESPONSE_BYTES:
                    raise RequestError(502, "Hugging Face discovery response is too large")
                raw = response.read(HF_DISCOVERY_MAX_RESPONSE_BYTES + 1)
                if len(raw) > HF_DISCOVERY_MAX_RESPONSE_BYTES:
                    raise RequestError(502, "Hugging Face discovery response is too large")
                return json.loads(raw.decode("utf-8"))
        except urllib.error.HTTPError as error:
            if error.code == 404 and not required:
                return None
            if error.code in {401, 403, 404}:
                raise RequestError(404, "public Hugging Face model metadata is unavailable") from error
            if error.code == 429:
                raise RequestError(503, "Hugging Face discovery is rate limited; retry later") from error
            raise RequestError(502, "Hugging Face discovery request failed") from error
        except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, UnicodeDecodeError) as error:
            raise RequestError(503, "Hugging Face discovery is temporarily unavailable") from error


    def hf_discovery_search_url(search=None, base_model=None, sort="relevance"):
        params = [
            ("limit", str(HF_DISCOVERY_UPSTREAM_LIMIT)),
            ("full", "true"),
            ("config", "true"),
            ("cardData", "true"),
            ("apps", "vllm"),
        ]
        if search:
            params.append(("search", search))
        if base_model:
            params.append(("filter", "base_model:" + base_model))
        sort_fields = {
            "downloads": "downloads",
            "likes": "likes",
            "updated": "lastModified",
            "trending": "trendingScore",
        }
        if sort in sort_fields:
            params.extend((("sort", sort_fields[sort]), ("direction", "-1")))
        return "https://huggingface.co/api/models?" + urllib.parse.urlencode(params)


    def hf_search_variants(value):
        query = re.sub(r"\s+", " ", str(value or "").strip())
        if not query:
            raise RequestError(400, "q is required")
        if len(query) > HF_DISCOVERY_MAX_QUERY_LENGTH:
            raise RequestError(400, "q is too long")
        if any(ord(character) < 32 or ord(character) == 127 for character in query):
            raise RequestError(400, "q contains unsupported control characters")
        tokens = query.split(" ")
        compact_family = "".join(tokens[:2])
        if len(tokens) > 2:
            compact_family += "-" + "-".join(tokens[2:])
        variants = []
        for candidate in (
            query,
            compact_family,
            re.sub(r"\s+", "-", query),
        ):
            if candidate and candidate.casefold() not in {item.casefold() for item in variants}:
                variants.append(candidate)
        return variants


    def hf_discovery_query_value(query, name, default="", maximum=80):
        value = str((query.get(name) or [default])[0] or "").strip()
        if len(value) > maximum:
            raise RequestError(400, name + " is too long")
        if any(ord(character) < 32 or ord(character) == 127 for character in value):
            raise RequestError(400, name + " contains unsupported control characters")
        return value


    def hf_discovery_page(query):
        def integer(name, default, minimum, maximum):
            raw = str((query.get(name) or [str(default)])[0] or "").strip()
            try:
                value = int(raw)
            except ValueError as error:
                raise RequestError(400, name + " must be an integer") from error
            if value < minimum or value > maximum:
                raise RequestError(
                    400,
                    name + " must be between " + str(minimum) + " and " + str(maximum),
                )
            return value

        return (
            integer("cursor", 0, 0, HF_DISCOVERY_MAX_CURSOR),
            integer("limit", 20, 1, HF_DISCOVERY_MAX_PAGE_SIZE),
        )


    def hf_discovery_context(query):
        provider = hf_discovery_query_value(query, "provider", "huggingface").lower()
        if provider != "huggingface":
            raise RequestError(400, "provider must be huggingface")
        sort = hf_discovery_query_value(query, "sort", "relevance").lower()
        if sort not in {"relevance", "downloads", "likes", "updated", "trending"}:
            raise RequestError(400, "sort must be relevance, downloads, likes, updated, or trending")
        engine = hf_discovery_query_value(query, "engine", "").lower()
        if engine and engine not in {"vllm", "ollama"}:
            raise RequestError(400, "engine must be VLLM or OLlama")
        compute_target = hf_discovery_query_value(query, "computeTarget", "").lower()
        if compute_target and compute_target not in {"cpu", "nvidia-gpu", "amd-gpu", "intel-gpu"}:
            raise RequestError(400, "computeTarget is unsupported")
        model_type = hf_discovery_query_value(query, "modelType", "").lower()
        if model_type and model_type not in {"chat", "embedding"}:
            raise RequestError(400, "modelType must be chat or embedding")
        return {
            "provider": provider,
            "sort": sort,
            "engine": engine,
            "computeTarget": compute_target,
            "modelType": model_type,
            "filters": {
                name: hf_discovery_query_value(query, name, "")
                for name in ("author", "pipeline", "library", "quantization", "format")
            },
        }


    def hf_model_base_relations(model):
        relations = []

        def append(value, relation=""):
            if isinstance(value, dict):
                relation = str(
                    value.get("relation")
                    or value.get("relationType")
                    or value.get("base_model_relation")
                    or relation
                    or ""
                ).strip().lower()
                value = value.get("repo") or value.get("repoId") or value.get("modelId") or value.get("id")
            try:
                repo = hf_repo_id(value)
            except ValueError:
                return
            existing = next(
                (item for item in relations if item["repo"].casefold() == repo.casefold()),
                None,
            )
            if existing:
                if relation and not existing.get("relation"):
                    existing["relation"] = relation
                return
            relations.append({"repo": repo, "relation": relation})

        raw_relations = (model or {}).get("baseModels") or []
        if isinstance(raw_relations, (str, dict)):
            raw_relations = [raw_relations]
        for raw_relation in raw_relations:
            if isinstance(raw_relation, dict) and isinstance(raw_relation.get("models"), list):
                relation = str(
                    raw_relation.get("relation")
                    or raw_relation.get("relationType")
                    or ""
                ).strip().lower()
                for related_model in raw_relation["models"]:
                    append(related_model, relation)
            else:
                append(raw_relation)
        card_data = (model or {}).get("cardData") or (model or {}).get("card_data") or {}
        if isinstance(card_data, dict):
            relation = card_data.get("base_model_relation") or ""
            base_models = card_data.get("base_model") or []
            if isinstance(base_models, (str, dict)):
                base_models = [base_models]
            for base_model in base_models:
                append(base_model, relation)
        for raw_tag in (model or {}).get("tags") or []:
            tag = str(raw_tag or "")
            if not tag.startswith("base_model:"):
                continue
            parts = tag.split(":", 2)
            if len(parts) == 3:
                append(parts[2], parts[1])
            elif len(parts) == 2:
                append(parts[1], "")
        return relations


    def hf_weight_files(model):
        siblings = (model or {}).get("siblings") or []
        files = []
        for sibling in siblings:
            if not isinstance(sibling, dict):
                continue
            name = str(sibling.get("rfilename") or sibling.get("path") or "")
            if not name.lower().endswith((".safetensors", ".gguf", ".bin")):
                continue
            size = positive_int(sibling.get("size"))
            if not size and isinstance(sibling.get("lfs"), dict):
                size = positive_int(sibling["lfs"].get("size"))
            file_metadata = {"name": name, "sizeBytes": size}
            if name.lower().endswith(".gguf"):
                match = re.search(r"(?i)(?:^|[-_.])q([2-8])(?:[_-]([a-z0-9_]+))?(?=\.gguf$|[-_.])", name)
                if match:
                    scheme = "q" + match.group(1) + ("_" + match.group(2).lower() if match.group(2) else "")
                    file_metadata["quantization"] = {
                        "method": "gguf",
                        "bits": int(match.group(1)),
                        "scheme": scheme,
                        "label": "GGUF " + scheme.upper(),
                    }
            files.append(file_metadata)
            if len(files) >= 100:
                break
        return files


    def hf_formats(model, files):
        formats = []
        tags = {str(tag).strip().lower() for tag in ((model or {}).get("tags") or [])}
        library_name = str(
            (model or {}).get("library_name") or (model or {}).get("libraryName") or ""
        ).strip().lower()
        filenames = [str(item.get("name") or "").lower() for item in files]
        if "safetensors" in tags or any(name.endswith(".safetensors") for name in filenames):
            formats.append("safetensors")
        if "gguf" in tags or any(name.endswith(".gguf") for name in filenames):
            formats.append("gguf")
        if any(name.endswith(".bin") for name in filenames):
            formats.append("pytorch")
        if "mlx" in tags or library_name == "mlx":
            formats.append("mlx")
        return formats


    def hf_quantization(model, files=None):
        config = (model or {}).get("config") or {}
        quant_config = config.get("quantization_config") or {}
        raw_method = str(
            quant_config.get("quant_method")
            or quant_config.get("quantization_method")
            or ""
        ).strip().lower()
        searchable = " ".join(
            [str((model or {}).get("id") or (model or {}).get("modelId") or "")]
            + [str(tag) for tag in ((model or {}).get("tags") or [])]
            + [str(item.get("name") or "") for item in (files or [])]
        ).lower()
        methods = (
            ("awq", ("awq",)),
            ("gptq", ("gptq",)),
            ("compressed-tensors", ("compressed-tensors", "compressed_tensors")),
            ("bitsandbytes", ("bitsandbytes", "bnb-4bit", "bnb_4bit", "nf4")),
            ("fp8", ("fp8", "float8")),
            ("gguf", ("gguf",)),
            ("int8", ("int8", "8-bit", "8bit")),
            ("int4", ("int4", "4-bit", "4bit")),
        )
        method = raw_method
        if not method:
            for candidate, needles in methods:
                if any(re.search(r"(^|[^a-z0-9])" + re.escape(needle) + r"([^a-z0-9]|$)", searchable) for needle in needles):
                    method = candidate
                    break
        gguf_quantizations = [
            item["quantization"]
            for item in (files or [])
            if isinstance(item.get("quantization"), dict)
        ]
        if method == "gguf" and gguf_quantizations:
            unique_schemes = {item.get("scheme") for item in gguf_quantizations}
            if len(unique_schemes) == 1:
                return dict(gguf_quantizations[0])
            return {"method": "gguf", "bits": None, "label": "GGUF (multiple)"}
        bits = quantization_bits(config)
        if not bits:
            match = re.search(r"(?:^|[^a-z0-9])(?:q|int|w|bnb[-_]?)([234568])(?:[^0-9]|$)", searchable)
            if match:
                bits = int(match.group(1))
            elif method in {"awq", "gptq", "bitsandbytes", "int4"}:
                bits = 4
            elif method in {"fp8", "int8"}:
                bits = 8
        if not method:
            return None
        names = {
            "awq": "AWQ",
            "gptq": "GPTQ",
            "compressed-tensors": "Compressed tensors",
            "bitsandbytes": "BitsAndBytes",
            "fp8": "FP8",
            "gguf": "GGUF",
            "int8": "INT8",
            "int4": "INT4",
        }
        label = names.get(method, method.upper())
        if bits and str(bits) not in label:
            label += " " + str(bits) + "-bit"
        return {"method": method, "bits": bits, "label": label}


    def hf_trust_status(model):
        author_data = (model or {}).get("authorData") or (model or {}).get("author_data") or {}
        organization = (model or {}).get("organization") or {}
        if (
            (model or {}).get("verified") is True
            or (isinstance(author_data, dict) and author_data.get("verified") is True)
            or (isinstance(organization, dict) and organization.get("verified") is True)
        ):
            return "official"
        if (model or {}).get("cardData") or (model or {}).get("card_data") or (model or {}).get("author"):
            return "community"
        return "unverified"


    def hf_compatibility(
        formats,
        quantization,
        engine="",
        compute_target="",
        pipeline_tag="",
        model_type="",
    ):
        available_formats = set(formats or [])
        quantization_method = str((quantization or {}).get("method") or "")
        if "mlx" in available_formats:
            return "incompatible", "MLX artifacts are not supported by the current Kubernetes inference runtimes."
        normalized_pipeline = str(pipeline_tag or "").strip().lower()
        chat_pipelines = {"text-generation", "text2text-generation", "image-text-to-text", "conversational"}
        embedding_pipelines = {"feature-extraction", "sentence-similarity"}
        if model_type == "chat" and normalized_pipeline and normalized_pipeline not in chat_pipelines:
            return "incompatible", "The selected Hub model does not expose a supported chat-generation pipeline."
        if model_type == "embedding" and normalized_pipeline and normalized_pipeline not in embedding_pipelines:
            return "incompatible", "The selected Hub model does not expose a supported embedding pipeline."
        if engine == "ollama":
            return "incompatible", "The current Ollama runtime accepts ollama:// registry models, not Hugging Face artifacts."
        if engine == "vllm":
            if "gguf" in available_formats or quantization_method == "gguf":
                return "incompatible", "The current vLLM path cannot select the required GGUF file or runtime plugin."
            if available_formats and "safetensors" not in available_formats and "pytorch" not in available_formats:
                return "incompatible", "No vLLM checkpoint format was discovered."
            if compute_target in {"amd-gpu", "intel-gpu", "cpu"} and quantization_method in {"awq", "gptq", "fp8"}:
                return "experimental", "This quantization and compute-target combination requires runtime validation."
        return "experimental", "Dynamic Hub artifacts require a runtime compatibility check."


    def hf_model_summary(model, engine="", compute_target="", model_type=""):
        if not isinstance(model, dict):
            return None
        identifier = str(model.get("id") or model.get("modelId") or "").strip()
        try:
            repo = hf_repo_id(identifier)
        except ValueError:
            return None
        gated_raw = model.get("gated")
        gated = gated_raw not in (None, False, "", "false", "False")
        private = model.get("private") is True
        files = hf_weight_files(model)
        formats = hf_formats(model, files)
        quantization = hf_quantization(model, files)
        pipeline_tag = str(model.get("pipeline_tag") or model.get("pipelineTag") or "")
        compatibility, compatibility_reason = hf_compatibility(
            formats,
            quantization,
            engine,
            compute_target,
            pipeline_tag,
            model_type,
        )
        author, name = repo.split("/", 1)
        safetensors = model.get("safetensors") or {}
        dimensions = model_dimension_config(model.get("config") or {})
        weight_files = [item for item in files if item.get("sizeBytes")]
        if len([item for item in files if item["name"].lower().endswith(".gguf")]) > 1:
            # One GGUF repository often contains several complete quantizations;
            # summing them would overstate the size of a selectable artifact.
            non_gguf = [item for item in weight_files if not item["name"].lower().endswith(".gguf")]
            weight_bytes = sum(item["sizeBytes"] for item in non_gguf) or None
        else:
            weight_bytes = sum(item["sizeBytes"] for item in weight_files) or None
        parameter_count = positive_int(safetensors.get("total"))
        return {
            "id": repo,
            "repo": repo,
            "label": name,
            "url": "hf://" + repo,
            "author": str(model.get("author") or author),
            "name": name,
            "revision": str(model.get("sha") or ""),
            "pipelineTag": pipeline_tag,
            "libraryName": str(model.get("library_name") or model.get("libraryName") or ""),
            "tags": sorted({str(tag) for tag in (model.get("tags") or [])})[:100],
            "downloads": positive_int(model.get("downloads")) or 0,
            "likes": positive_int(model.get("likes")) or 0,
            "trendingScore": positive_int(model.get("trendingScore") or model.get("trending_score")) or 0,
            "lastModified": str(model.get("lastModified") or model.get("last_modified") or ""),
            "private": private,
            "gated": gated,
            "disabled": model.get("disabled") is True,
            "formats": formats,
            "parameterCount": parameter_count,
            "weightBytes": weight_bytes,
            "downloadBytes": positive_int(model.get("usedStorage") or model.get("used_storage")) or weight_bytes,
            "modelMaxContext": config_int(dimensions, "max_position_embeddings", "model_max_length") or 0,
            "files": files,
            "quantization": quantization,
            "baseModels": hf_model_base_relations(model),
            "trustStatus": hf_trust_status(model),
            "compatibility": compatibility,
            "compatibilityReason": compatibility_reason,
        }


    def hf_public_model(model):
        summary = hf_model_summary(model)
        return bool(
            summary
            and not summary["private"]
            and not summary["gated"]
            and not summary["disabled"]
        )


    def hf_search_models(search=None, base_model=None, sort="relevance"):
        key = ("hf-search", str(search or ""), str(base_model or ""), sort)
        cached = hf_discovery_cache_get(key)
        if cached is not None:
            return cached
        payload = fetch_hf_discovery_json(
            hf_discovery_search_url(search=search, base_model=base_model, sort=sort)
        )
        if not isinstance(payload, list):
            raise RequestError(503, "Hugging Face discovery returned an invalid model list")
        result = [item for item in payload[:HF_DISCOVERY_UPSTREAM_LIMIT] if isinstance(item, dict)]
        return hf_discovery_cache_set(key, result)


    def hf_summary_matches(summary, filters):
        if filters.get("author") and filters["author"].casefold() not in summary["author"].casefold():
            return False
        if filters.get("pipeline") and filters["pipeline"].casefold() != summary["pipelineTag"].casefold():
            return False
        if filters.get("library") and filters["library"].casefold() != summary["libraryName"].casefold():
            return False
        if filters.get("format") and filters["format"].casefold() not in {
            value.casefold() for value in summary["formats"]
        }:
            return False
        if filters.get("quantization"):
            quantization = summary.get("quantization") or {}
            needle = filters["quantization"].casefold()
            haystack = " ".join((
                str(quantization.get("method") or ""),
                str(quantization.get("label") or ""),
                str(quantization.get("bits") or ""),
            )).casefold()
            if needle not in haystack:
                return False
        return True


    def hf_relevance(summary, variants):
        identifier = summary["repo"].casefold()
        name = summary["name"].casefold()
        normalized_name = re.sub(r"[^a-z0-9]", "", name)
        score = 0
        for index, variant in enumerate(variants):
            needle = variant.casefold()
            normalized = re.sub(r"[^a-z0-9]", "", needle)
            if name == needle:
                score = max(score, 1000 - index)
            elif name.startswith(needle):
                score = max(score, 900 - index)
            elif normalized and normalized_name.startswith(normalized):
                score = max(score, 850 - index)
            elif needle in identifier:
                score = max(score, 700 - index)
            elif normalized and normalized in re.sub(r"[^a-z0-9]", "", identifier):
                score = max(score, 650 - index)
        return score


    def hf_sort_summaries(summaries, sort, variants=()):
        if sort == "downloads":
            return sorted(summaries, key=lambda item: (-item["downloads"], -item["likes"], item["repo"].casefold()))
        if sort == "likes":
            return sorted(summaries, key=lambda item: (-item["likes"], -item["downloads"], item["repo"].casefold()))
        if sort == "updated":
            return sorted(summaries, key=lambda item: (item["lastModified"], item["repo"].casefold()), reverse=True)
        if sort == "trending":
            return sorted(
                summaries,
                key=lambda item: (-item["trendingScore"], -item["downloads"], item["repo"].casefold()),
            )
        return sorted(
            summaries,
            key=lambda item: (-hf_relevance(item, variants), -item["downloads"], item["repo"].casefold()),
        )


    def hf_paginated(items, cursor, limit):
        page = items[cursor:cursor + limit]
        next_cursor = cursor + len(page)
        return page, str(next_cursor) if next_cursor < len(items) else None


    def model_discovery_search(query):
        provider = hf_discovery_query_value(query, "provider", "huggingface").lower()
        if provider == "ollama":
            return ollama_discovery_search(query)
        context = hf_discovery_context(query)
        cursor, limit = hf_discovery_page(query)
        search = hf_discovery_query_value(query, "q", "", HF_DISCOVERY_MAX_QUERY_LENGTH)
        variants = hf_search_variants(search)
        merged = {}
        upstream_truncated = False
        required_results = min(HF_DISCOVERY_MAX_RESULTS, cursor + limit)
        for variant in variants:
            models = hf_search_models(search=variant, sort=context["sort"])
            upstream_truncated = upstream_truncated or len(models) >= HF_DISCOVERY_UPSTREAM_LIMIT
            for model in models:
                summary = hf_model_summary(
                    model,
                    context["engine"],
                    context["computeTarget"],
                    context["modelType"],
                )
                if (
                    not summary
                    or summary["private"]
                    or summary["gated"]
                    or summary["disabled"]
                ):
                    continue
                existing = merged.get(summary["repo"].casefold())
                if not existing or len(summary["files"]) > len(existing["files"]):
                    merged[summary["repo"].casefold()] = summary
                if len(merged) >= HF_DISCOVERY_MAX_RESULTS:
                    break
            eligible_count = sum(
                1
                for summary in merged.values()
                if hf_summary_matches(summary, context["filters"])
            )
            if eligible_count >= required_results or len(merged) >= HF_DISCOVERY_MAX_RESULTS:
                break
        results = [
            summary for summary in merged.values()
            if hf_summary_matches(summary, context["filters"])
        ][:HF_DISCOVERY_MAX_RESULTS]
        results = hf_sort_summaries(results, context["sort"], variants)
        page, next_cursor = hf_paginated(results, cursor, limit)
        return {
            "provider": "huggingface",
            "query": search,
            "normalizedQueries": variants,
            "filters": context["filters"],
            "sort": context["sort"],
            "results": page,
            "total": len(results),
            "cursor": str(cursor),
            "nextCursor": next_cursor,
            "truncated": upstream_truncated,
        }


    def model_discovery_popular(query):
        provider = hf_discovery_query_value(query, "provider", "huggingface").lower()
        if provider == "ollama":
            return ollama_discovery_popular(query)
        context = hf_discovery_context(query)
        cursor, limit = hf_discovery_page(query)
        models = hf_search_models(sort="trending")
        results = []
        for model in models:
            summary = hf_model_summary(
                model,
                context["engine"],
                context["computeTarget"],
                context["modelType"],
            )
            if (
                not summary
                or summary["private"]
                or summary["gated"]
                or summary["disabled"]
                or summary["compatibility"] == "incompatible"
                or not hf_summary_matches(summary, context["filters"])
            ):
                continue
            results.append(summary)
        results = hf_sort_summaries(results, "trending")[:HF_DISCOVERY_MAX_RESULTS]
        page, next_cursor = hf_paginated(results, cursor, limit)
        return {
            "provider": "huggingface",
            "source": "trendingScore",
            "results": page,
            "total": len(results),
            "cursor": str(cursor),
            "nextCursor": next_cursor,
        }


    def hf_relation_to(summary, repo):
        return any(
            relation["repo"].casefold() == repo.casefold()
            and relation.get("relation") in {"quantized", "quantization"}
            for relation in summary.get("baseModels") or []
        )


    def model_discovery_artifacts(query):
        provider = hf_discovery_query_value(query, "provider", "huggingface").lower()
        if provider == "ollama":
            return ollama_discovery_artifacts(query)
        context = hf_discovery_context(query)
        cursor, limit = hf_discovery_page(query)
        repo_value = hf_discovery_query_value(query, "repo", "", HF_DISCOVERY_MAX_QUERY_LENGTH)
        try:
            selected_repo = hf_repo_id(repo_value)
        except ValueError as error:
            raise RequestError(400, str(error)) from error

        cache_key = (
            "hf-artifacts",
            selected_repo.casefold(),
            context["sort"],
            context["engine"],
            context["computeTarget"],
            context["modelType"],
        )
        cached = hf_discovery_cache_get(cache_key)
        if cached is None:
            selected_raw = fetch_hf_discovery_json(hf_model_detail_api_url(selected_repo), required=False)
            selected = hf_model_summary(
                selected_raw,
                context["engine"],
                context["computeTarget"],
                context["modelType"],
            )
            if (
                not selected
                or selected["private"]
                or selected["gated"]
                or selected["disabled"]
            ):
                raise RequestError(404, "public Hugging Face model metadata is unavailable")
            selected_relations = selected.get("baseModels") or []
            quantized_bases = [
                item["repo"]
                for item in selected_relations
                if item.get("relation") in {"quantized", "quantization"}
            ]
            base_repo = quantized_bases[0] if quantized_bases else selected_repo
            if base_repo.casefold() == selected_repo.casefold():
                base_model = dict(selected)
            else:
                base_raw = fetch_hf_discovery_json(hf_model_detail_api_url(base_repo), required=False)
                base_model = hf_model_summary(
                    base_raw,
                    context["engine"],
                    context["computeTarget"],
                    context["modelType"],
                )
                if (
                    not base_model
                    or base_model["private"]
                    or base_model["gated"]
                    or base_model["disabled"]
                ):
                    base_model = {
                        "id": base_repo,
                        "repo": base_repo,
                        "label": base_repo.split("/", 1)[1],
                        "url": "hf://" + base_repo,
                    }

            artifacts = []
            selected_artifact = dict(selected)
            selected_artifact.update({
                "relation": "selected",
                "discoverySource": "selected",
                "original": True,
            })
            artifacts.append(selected_artifact)
            seen = {selected_repo.casefold()}

            related_raw = hf_search_models(base_model=base_repo, sort=context["sort"])
            for model in related_raw:
                summary = hf_model_summary(
                    model,
                    context["engine"],
                    context["computeTarget"],
                    context["modelType"],
                )
                if (
                    not summary
                    or summary["private"]
                    or summary["gated"]
                    or summary["disabled"]
                    or summary["repo"].casefold() in seen
                    or not hf_relation_to(summary, base_repo)
                ):
                    continue
                artifact = dict(summary)
                artifact.update({
                    "relation": "quantized",
                    "discoverySource": "base-model",
                    "original": False,
                })
                artifacts.append(artifact)
                seen.add(summary["repo"].casefold())

            selected_item = artifacts[0]
            related_items = hf_sort_summaries(artifacts[1:], context["sort"], [base_model["label"]])
            cached = hf_discovery_cache_set(cache_key, {
                "baseModel": base_model,
                "artifacts": [selected_item] + related_items,
            })

        artifacts = [cached["artifacts"][0]] + [
            item for item in cached["artifacts"][1:]
            if hf_summary_matches(item, context["filters"])
        ]
        page, next_cursor = hf_paginated(artifacts, cursor, limit)
        return {
            "provider": "huggingface",
            "baseModel": cached["baseModel"],
            "artifacts": page,
            "filters": context["filters"],
            "sort": context["sort"],
            "total": len(artifacts),
            "cursor": str(cursor),
            "nextCursor": next_cursor,
        }


    def ollama_discovery_context(query):
        provider = hf_discovery_query_value(query, "provider", "ollama").lower()
        if provider != "ollama":
            raise RequestError(400, "provider must be ollama")
        engine = hf_discovery_query_value(query, "engine", "OLlama").lower()
        if engine != "ollama":
            raise RequestError(400, "Ollama Library discovery requires engine OLlama")
        compute_target = hf_discovery_query_value(query, "computeTarget", "").lower()
        if compute_target and compute_target not in {"cpu", "nvidia-gpu", "amd-gpu"}:
            raise RequestError(400, "computeTarget is unsupported for OLlama")
        model_type = hf_discovery_query_value(query, "modelType", "chat").lower()
        if model_type not in {"chat", "embedding"}:
            raise RequestError(400, "modelType must be chat or embedding")
        return {
            "provider": provider,
            "engine": engine,
            "computeTarget": compute_target,
            "modelType": model_type,
        }


    def ollama_library_model(value):
        raw = urllib.parse.unquote(str(value or "")).strip().strip("/")
        if raw.startswith("ollama://"):
            raw = raw[len("ollama://"):]
        if ":" in raw:
            raw = raw.rsplit(":", 1)[0]
        parts = raw.split("/") if raw else []
        component = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]*$")
        if len(parts) not in {1, 2} or any(not component.fullmatch(part) for part in parts):
            raise RequestError(400, "repo must be an Ollama library model name")
        return "/".join(parts)


    def ollama_discovery_url(path, query=None):
        encoded_path = "/".join(urllib.parse.quote(part) for part in path.strip("/").split("/"))
        url = "https://ollama.com/" + encoded_path
        if query:
            url += "?" + urllib.parse.urlencode(query)
        return url


    def validate_ollama_discovery_url(url):
        parsed = urllib.parse.urlparse(str(url or ""))
        if (
            parsed.scheme != "https"
            or parsed.hostname != "ollama.com"
            or parsed.username
            or parsed.password
            or parsed.port not in {None, 443}
            or parsed.fragment
            or not re.fullmatch(
                r"/(?:search|library(?:/[A-Za-z0-9][A-Za-z0-9_.%-]*){0,2}(?:/tags)?)",
                parsed.path,
            )
        ):
            raise ValueError("Ollama discovery only permits public Ollama Library pages")
        query = urllib.parse.parse_qs(parsed.query, keep_blank_values=True)
        if set(query) - {"q", "sort", "page"}:
            raise ValueError("Ollama discovery URL contains unsupported query parameters")
        return parsed


    def fetch_ollama_discovery_html(url):
        validate_ollama_discovery_url(url)
        request = urllib.request.Request(url, headers={
            "Accept": "text/html",
            "User-Agent": "magicstick-dashboard/0.1",
        })
        try:
            with urllib.request.urlopen(
                request,
                timeout=OLLAMA_DISCOVERY_TIMEOUT_SECONDS,
                context=PUBLIC_SSL_CONTEXT,
            ) as response:
                validate_ollama_discovery_url(response.geturl())
                declared_size = positive_int(response.headers.get("Content-Length"))
                if declared_size and declared_size > OLLAMA_DISCOVERY_MAX_RESPONSE_BYTES:
                    raise RequestError(502, "Ollama Library response is too large")
                raw = response.read(OLLAMA_DISCOVERY_MAX_RESPONSE_BYTES + 1)
                if len(raw) > OLLAMA_DISCOVERY_MAX_RESPONSE_BYTES:
                    raise RequestError(502, "Ollama Library response is too large")
                return raw.decode("utf-8")
        except urllib.error.HTTPError as error:
            if error.code == 404:
                raise RequestError(404, "Ollama Library model metadata is unavailable") from error
            if error.code == 429:
                raise RequestError(503, "Ollama Library is rate limited; retry later") from error
            raise RequestError(502, "Ollama Library request failed") from error
        except (urllib.error.URLError, TimeoutError, UnicodeDecodeError) as error:
            raise RequestError(503, "Ollama Library is temporarily unavailable") from error


    def ollama_html_text(value):
        without_tags = re.sub(r"<[^>]+>", " ", str(value or ""))
        return re.sub(r"\s+", " ", html.unescape(without_tags)).strip()


    def ollama_human_count(value):
        match = re.fullmatch(r"\s*(\d+(?:[.,]\d+)?)\s*([KMB])?\s*", str(value or ""), re.IGNORECASE)
        if not match:
            return 0
        multiplier = {"": 1, "K": 1_000, "M": 1_000_000, "B": 1_000_000_000}
        try:
            return int(Decimal(match.group(1).replace(",", ".")) * multiplier[(match.group(2) or "").upper()])
        except InvalidOperation:
            return 0


    def ollama_size_bytes(value):
        match = re.fullmatch(r"\s*(\d+(?:[.,]\d+)?)\s*(KB|MB|GB|TB)\s*", str(value or ""), re.IGNORECASE)
        if not match:
            return 0
        multiplier = {"KB": 1_000, "MB": 1_000_000, "GB": 1_000_000_000, "TB": 1_000_000_000_000}
        try:
            return int(Decimal(match.group(1).replace(",", ".")) * multiplier[match.group(2).upper()])
        except InvalidOperation:
            return 0


    def ollama_context_tokens(value):
        match = re.fullmatch(r"\s*(\d+(?:[.,]\d+)?)\s*([KMB])?\s*", str(value or ""), re.IGNORECASE)
        if not match:
            return 0
        multiplier = {"": 1, "K": 1024, "M": 1024 * 1024, "B": 1024 * 1024 * 1024}
        try:
            return int(Decimal(match.group(1).replace(",", ".")) * multiplier[(match.group(2) or "").upper()])
        except InvalidOperation:
            return 0


    def ollama_quantization_from_tag(tag):
        match = re.search(r"(?:^|-)(q[2-8](?:_[A-Za-z0-9]+)*|bf16|fp(?:8|16|32))(?:-|$)", str(tag or ""), re.IGNORECASE)
        if not match:
            return None
        scheme = match.group(1).upper()
        bit_match = re.search(r"(\d+)", scheme)
        bits = int(bit_match.group(1)) if bit_match else None
        if scheme.startswith("Q"):
            return {"method": "gguf", "bits": bits, "scheme": scheme.lower(), "label": "GGUF " + scheme}
        return {"method": scheme.lower(), "bits": bits, "scheme": scheme.lower(), "label": scheme}


    def ollama_parameter_count_from_tag(tag):
        match = re.search(r"(?:^|-)(\d+(?:\.\d+)?)([BM])(?:-|$)", str(tag or ""), re.IGNORECASE)
        if not match:
            return None
        multiplier = 1_000_000_000 if match.group(2).upper() == "B" else 1_000_000
        try:
            return int(Decimal(match.group(1)) * multiplier)
        except InvalidOperation:
            return None


    def ollama_model_compatibility(model, model_type):
        embedding = "embed" in model.casefold()
        if model_type == "embedding" and not embedding:
            return "incompatible", "This Ollama Library entry is not identified as an embedding model."
        if model_type == "chat" and embedding:
            return "incompatible", "This Ollama Library entry is identified as an embedding model."
        return "compatible", "Published in the Ollama Library for the selected OLlama runtime."


    def ollama_parse_model_cards(document, model_type="chat"):
        results = []
        seen = set()
        pattern = re.compile(
            r"<a\b[^>]*href=[\"']/library/([^\"'?#:]+)[\"'][^>]*>(.*?)</a>",
            re.IGNORECASE | re.DOTALL,
        )
        for match in pattern.finditer(document or ""):
            try:
                model = ollama_library_model(match.group(1))
            except RequestError:
                continue
            key = model.casefold()
            if key in seen or model.endswith("/tags"):
                continue
            seen.add(key)
            body = match.group(2)
            text = ollama_html_text(body)
            description_match = re.search(r"<p\b[^>]*>(.*?)</p>", body, re.IGNORECASE | re.DOTALL)
            pulls_match = re.search(r"([\d.,]+\s*[KMB]?)\s*Pulls\b", text, re.IGNORECASE)
            tags_match = re.search(r"([\d.,]+\s*[KMB]?)\s*Tags\b", text, re.IGNORECASE)
            badges = []
            for span in re.findall(r"<span\b[^>]*>(.*?)</span>", body, re.IGNORECASE | re.DOTALL):
                value = ollama_html_text(span)
                if re.fullmatch(r"(?:vision|tools|thinking|cloud|\d+(?:\.\d+)?[BM])", value, re.IGNORECASE):
                    badges.append(value.lower())
            compatibility, compatibility_reason = ollama_model_compatibility(model, model_type)
            official = len(model.split("/")) == 1
            results.append({
                "id": model,
                "repo": model,
                "label": model.split("/")[-1],
                "name": model.split("/")[-1],
                "url": "ollama://" + model + ":latest",
                "author": "Ollama Library" if official else model.split("/", 1)[0],
                "description": ollama_html_text(description_match.group(1)) if description_match else "",
                "tags": sorted(set(badges)),
                "pulls": ollama_human_count(pulls_match.group(1)) if pulls_match else 0,
                "tagCount": ollama_human_count(tags_match.group(1)) if tags_match else 0,
                "pipelineTag": "feature-extraction" if "embed" in model.casefold() else "text-generation",
                "formats": ["gguf"],
                "trustStatus": "official" if official else "community",
                "compatibility": compatibility,
                "compatibilityReason": compatibility_reason,
            })
            if len(results) >= HF_DISCOVERY_MAX_RESULTS:
                break
        return results


    def ollama_next_search_page(document, current_page):
        pages = [
            int(value)
            for value in re.findall(r"(?:\?|&amp;|&)page=(\d+)", document or "", re.IGNORECASE)
            if int(value) > current_page
        ]
        return min(pages) if pages else None


    def ollama_search_page(search, page=1):
        cache_key = ("ollama-search-page", search.casefold(), int(page))
        cached = hf_discovery_cache_get(cache_key)
        if cached is not None:
            return cached
        query = {"q": search, "sort": "popular"}
        if page > 1:
            query["page"] = str(page)
        document = fetch_ollama_discovery_html(ollama_discovery_url("search", query))
        return hf_discovery_cache_set(cache_key, {
            "models": ollama_parse_model_cards(document),
            "nextPage": ollama_next_search_page(document, page),
        })


    def ollama_search_models(search, required_results, model_type="chat"):
        results = []
        seen = set()
        page = 1
        has_more = False
        for _ in range(OLLAMA_DISCOVERY_MAX_PAGES):
            payload = ollama_search_page(search, page)
            for raw_model in payload["models"]:
                model = dict(raw_model)
                compatibility, reason = ollama_model_compatibility(model["repo"], model_type)
                model["compatibility"] = compatibility
                model["compatibilityReason"] = reason
                key = model["repo"].casefold()
                if key in seen:
                    continue
                seen.add(key)
                results.append(model)
            next_page = payload.get("nextPage")
            has_more = next_page is not None
            prefix_count = sum(1 for model in results if ollama_prefix_score(model, search) > 0)
            eligible_count = sum(
                1
                for model in results
                if ollama_prefix_score(model, search) > 0 and model["compatibility"] != "incompatible"
            )
            # Ollama orders its HTML search by relevance. Once a page already
            # contains non-prefix results, later pages cannot improve this
            # deliberately prefix-only dashboard view. Avoid walking broad
            # result sets and keep interactive searches bounded to one request.
            if prefix_count < len(results):
                has_more = False
                break
            if eligible_count >= required_results or not next_page:
                break
            page = next_page
        return results[:HF_DISCOVERY_MAX_RESULTS], has_more


    def ollama_prefix_score(model, query):
        normalized_query = re.sub(r"[^a-z0-9]", "", query.casefold())
        normalized_name = re.sub(r"[^a-z0-9]", "", model["name"].casefold())
        if normalized_name == normalized_query:
            return 2
        if normalized_name.startswith(normalized_query):
            return 1
        return 0


    def ollama_discovery_search(query):
        context = ollama_discovery_context(query)
        cursor, limit = hf_discovery_page(query)
        search = hf_discovery_query_value(query, "q", "", HF_DISCOVERY_MAX_QUERY_LENGTH)
        if len(search) < 2:
            raise RequestError(400, "q must contain at least two characters")
        if any(ord(character) < 32 or ord(character) == 127 for character in search):
            raise RequestError(400, "q contains unsupported control characters")
        required = min(HF_DISCOVERY_MAX_RESULTS, cursor + limit)
        models, has_more = ollama_search_models(search, required, context["modelType"])
        prefixed = [model for model in models if ollama_prefix_score(model, search) > 0]
        prefixed.sort(key=lambda item: (-ollama_prefix_score(item, search), -item["pulls"], item["repo"].casefold()))
        compatible = [item for item in prefixed if item["compatibility"] != "incompatible"]
        page = compatible[cursor:cursor + limit]
        local_more = cursor + len(page) < len(compatible)
        next_cursor = str(cursor + len(page)) if page and (local_more or has_more) else None
        total = len(compatible) + (1 if has_more and not local_more else 0)
        return {
            "provider": "ollama",
            "source": "ollama-library-search",
            "query": search,
            "normalizedQueries": [search, re.sub(r"\s+", "", search)],
            "results": page,
            "total": total,
            "cursor": str(cursor),
            "nextCursor": next_cursor,
            "truncated": has_more,
        }


    def ollama_discovery_popular(query):
        context = ollama_discovery_context(query)
        cursor, limit = hf_discovery_page(query)
        cache_key = ("ollama-popular", context["modelType"])
        models = hf_discovery_cache_get(cache_key)
        if models is None:
            document = fetch_ollama_discovery_html(
                ollama_discovery_url("library", {"sort": "popular"})
            )
            models = [
                item for item in ollama_parse_model_cards(document, context["modelType"])
                if item["compatibility"] != "incompatible"
            ]
            models = hf_discovery_cache_set(cache_key, models)
        page, next_cursor = hf_paginated(models[:HF_DISCOVERY_MAX_RESULTS], cursor, limit)
        return {
            "provider": "ollama",
            "source": "ollama-library-popular",
            "results": page,
            "total": len(models),
            "cursor": str(cursor),
            "nextCursor": next_cursor,
        }


    def ollama_parse_tags(document, selected_model, model_type="chat"):
        artifacts = []
        seen = set()
        pattern = re.compile(
            r"<a\b[^>]*href=[\"']/library/([^\"'?#]+:[^\"'?#]+)[\"'][^>]*>(.*?)</a>",
            re.IGNORECASE | re.DOTALL,
        )
        for match in pattern.finditer(document or ""):
            raw_reference = urllib.parse.unquote(match.group(1)).strip("/")
            try:
                reference = ollama_model_reference("ollama://" + raw_reference)
            except ValueError:
                continue
            model = reference["model"] if reference["namespace"] == "library" else reference["namespace"] + "/" + reference["model"]
            if model.casefold() != selected_model.casefold():
                continue
            tag = reference["tag"]
            if "cloud" in tag.casefold() or reference["reference"].casefold() in seen:
                continue
            text = ollama_html_text(match.group(2))
            size_match = re.search(r"\b(\d+(?:[.,]\d+)?\s*(?:KB|MB|GB|TB))\b", text, re.IGNORECASE)
            if not size_match:
                continue
            context_match = re.search(r"\b(\d+(?:[.,]\d+)?\s*[KMB]?)\s+context window\b", text, re.IGNORECASE)
            digest_match = re.search(r"\b([a-f0-9]{12,64})\b", text, re.IGNORECASE)
            size_label = re.sub(r"\s+", "", size_match.group(1)).upper()
            size_bytes = ollama_size_bytes(size_label)
            model_context = ollama_context_tokens(context_match.group(1)) if context_match else 0
            quantization = ollama_quantization_from_tag(tag)
            compatibility, compatibility_reason = ollama_model_compatibility(selected_model, model_type)
            artifact_repo = selected_model + ":" + tag
            seen.add(reference["reference"].casefold())
            artifacts.append({
                "id": artifact_repo,
                "repo": artifact_repo,
                "label": tag,
                "name": artifact_repo,
                "url": "ollama://" + artifact_repo,
                "author": "Ollama Library" if len(selected_model.split("/")) == 1 else selected_model.split("/", 1)[0],
                "revision": digest_match.group(1) if digest_match else "",
                "pipelineTag": "feature-extraction" if "embed" in selected_model.casefold() else "text-generation",
                "formats": ["gguf"],
                "parameterCount": ollama_parameter_count_from_tag(tag),
                "weightBytes": size_bytes,
                "downloadBytes": size_bytes,
                "sizeLabel": size_label,
                "modelMaxContext": model_context,
                "contextWindow": model_context,
                "quantization": quantization,
                "trustStatus": "official" if len(selected_model.split("/")) == 1 else "community",
                "compatibility": compatibility,
                "compatibilityReason": compatibility_reason,
                "relation": "tag",
                "discoverySource": "ollama-library-tags",
                "original": tag.casefold() == "latest",
            })
            if len(artifacts) >= HF_DISCOVERY_MAX_RESULTS:
                break
        return artifacts


    def ollama_discovery_artifacts(query):
        context = ollama_discovery_context(query)
        cursor, limit = hf_discovery_page(query)
        model = ollama_library_model(
            hf_discovery_query_value(query, "repo", "", HF_DISCOVERY_MAX_QUERY_LENGTH)
        )
        cache_key = ("ollama-tags", model.casefold(), context["modelType"])
        artifacts = hf_discovery_cache_get(cache_key)
        if artifacts is None:
            document = fetch_ollama_discovery_html(
                ollama_discovery_url("library/" + model + "/tags")
            )
            artifacts = ollama_parse_tags(document, model, context["modelType"])
            if not artifacts:
                raise RequestError(404, "No locally runnable Ollama tags were found for this model")
            artifacts = hf_discovery_cache_set(cache_key, artifacts)
        page, next_cursor = hf_paginated(artifacts, cursor, limit)
        compatibility, compatibility_reason = ollama_model_compatibility(model, context["modelType"])
        return {
            "provider": "ollama",
            "baseModel": {
                "id": model,
                "repo": model,
                "name": model.split("/")[-1],
                "url": "ollama://" + model + ":latest",
                "formats": ["gguf"],
                "trustStatus": "official" if len(model.split("/")) == 1 else "community",
                "compatibility": compatibility,
                "compatibilityReason": compatibility_reason,
            },
            "artifacts": page,
            "total": len(artifacts),
            "cursor": str(cursor),
            "nextCursor": next_cursor,
        }


    def ollama_model_reference(value):
        raw = str(value or "").strip()
        if not raw:
            raise ValueError("Ollama Model URL is required")
        if not raw.startswith("ollama://"):
            raise ValueError("Ollama Model URL must use ollama://model:tag")
        reference = raw[len("ollama://"):].strip("/")
        if not reference or "?" in reference or "#" in reference:
            raise ValueError("Ollama Model URL must use ollama://model:tag")
        parts = reference.split("/")
        if len(parts) == 1:
            namespace = "library"
            model_and_tag = parts[0]
        elif len(parts) == 2:
            namespace, model_and_tag = parts
        else:
            raise ValueError("Ollama Model URL must contain at most namespace/model:tag")
        if ":" in model_and_tag:
            model, tag = model_and_tag.rsplit(":", 1)
        else:
            model, tag = model_and_tag, "latest"
        component = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]*$")
        if not component.fullmatch(namespace) or not component.fullmatch(model) or not component.fullmatch(tag):
            raise ValueError("Ollama Model URL contains unsupported registry characters")
        return {
            "namespace": namespace,
            "model": model,
            "tag": tag,
            "reference": namespace + "/" + model + ":" + tag,
        }


    def ollama_manifest_url(reference):
        return (
            "https://registry.ollama.ai/v2/"
            + urllib.parse.quote(reference["namespace"])
            + "/"
            + urllib.parse.quote(reference["model"])
            + "/manifests/"
            + urllib.parse.quote(reference["tag"])
        )


    def ollama_metadata(reference):
        cache_key = reference["reference"]
        now = time.time()
        cached = OLLAMA_METADATA_CACHE.get(cache_key)
        if cached and now - cached.get("fetchedAt", 0) < HF_CACHE_TTL_SECONDS:
            return cached
        try:
            manifest = fetch_public_json(ollama_manifest_url(reference))
        except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError, json.JSONDecodeError) as error:
            raise ValueError("public Ollama registry metadata is not available for this model") from error
        layers = (manifest or {}).get("layers") or []
        model_media_types = {
            "application/vnd.ollama.image.model",
            "application/vnd.ollama.image.adapter",
            "application/vnd.ollama.image.projector",
            "application/vnd.ollama.image.draft",
            "application/vnd.ollama.image.tensor",
        }
        model_bytes = sum(
            positive_int((layer or {}).get("size")) or 0
            for layer in layers
            if str((layer or {}).get("mediaType") or "") in model_media_types
        )
        if model_bytes <= 0:
            raise ValueError("Ollama registry manifest does not contain model layers")
        quantization = None
        for layer in layers:
            quantization = ollama_quantization_from_tag((layer or {}).get("from"))
            if quantization:
                break
        cached = {
            "reference": reference,
            "manifest": manifest,
            "modelBytes": model_bytes,
            "quantization": quantization,
            "fetchedAt": now,
        }
        OLLAMA_METADATA_CACHE[cache_key] = cached
        return cached


    def has_model_dimensions(config):
        config = config or {}
        has_layers = any(positive_int(config.get(key)) for key in ("num_hidden_layers", "n_layer", "num_layers"))
        has_hidden = any(positive_int(config.get(key)) for key in ("hidden_size", "n_embd", "d_model"))
        has_heads = any(positive_int(config.get(key)) for key in ("num_attention_heads", "n_head"))
        return has_layers and has_hidden and has_heads


    def model_dimension_config(config):
        config = config or {}
        if has_model_dimensions(config):
            return config
        for key in ("text_config", "language_config", "llm_config", "model_config"):
            nested = config.get(key)
            if isinstance(nested, dict) and has_model_dimensions(nested):
                merged = dict(config)
                merged.update(nested)
                return merged
        return config


    def config_int(config, *keys):
        for key in keys:
            value = positive_int((config or {}).get(key))
            if value:
                return value
        return None


    def quantization_bits(config):
        quant = (config or {}).get("quantization_config") or {}
        for key in ("bits", "weight_bits", "load_in_bits"):
            value = positive_int(quant.get(key))
            if value:
                return value
        if quant.get("load_in_4bit") is True:
            return 4
        if quant.get("load_in_8bit") is True:
            return 8
        for group in (quant.get("config_groups") or {}).values():
            weights = (group or {}).get("weights") or {}
            value = positive_int(weights.get("num_bits") or weights.get("bits"))
            if value:
                return value
        method = str(quant.get("quant_method") or quant.get("quantization_method") or "").lower()
        if method in {"awq", "gptq", "aqlm", "compressed-tensors"}:
            return 4
        return None


    def dtype_bytes(config):
        bits = quantization_bits(config)
        if bits:
            return max(0.5, bits / 8.0)
        raw = str((config or {}).get("torch_dtype") or (config or {}).get("dtype") or "").lower()
        if "float32" in raw or "fp32" in raw:
            return 4
        if "float8" in raw or "fp8" in raw or "int8" in raw:
            return 1
        if "int4" in raw:
            return 0.5
        return 2


    def activation_dtype_bytes(config):
        raw = str((config or {}).get("torch_dtype") or (config or {}).get("dtype") or "").lower()
        if "float32" in raw or "fp32" in raw:
            return 4
        if "float8" in raw or "fp8" in raw or "int8" in raw:
            return 1
        return 2


    def safetensors_weight_mi(index):
        metadata = (index or {}).get("metadata") or {}
        total_size = positive_int(metadata.get("total_size"))
        return ceil_mib(total_size) if total_size else None


    def tree_safetensors_weight_mi(model_tree):
        total_size = sum(
            positive_int((entry or {}).get("size")) or 0
            for entry in (model_tree or [])
            if str((entry or {}).get("type") or "") == "file"
            and str((entry or {}).get("path") or "").endswith(".safetensors")
        )
        return ceil_mib(total_size) if total_size else None


    def api_safetensors_weight_mi(model_api):
        safetensors = (model_api or {}).get("safetensors") or {}
        dtype_sizes = {
            "BOOL": 1,
            "U8": 1,
            "I8": 1,
            "F8_E4M3": 1,
            "F8_E5M2": 1,
            "I16": 2,
            "F16": 2,
            "BF16": 2,
            "I32": 4,
            "F32": 4,
            "I64": 8,
            "F64": 8,
        }
        total_size = sum(
            (positive_int(count) or 0) * dtype_sizes.get(str(dtype).upper(), 0)
            for dtype, count in (safetensors.get("parameters") or {}).items()
        )
        return ceil_mib(total_size) if total_size else None


    def api_safetensors_parameter_count(model_api):
        return positive_int((((model_api or {}).get("safetensors") or {}).get("total")))


    def estimated_parameter_count(config):
        explicit = config_int(config, "num_parameters", "n_params", "parameter_count")
        if explicit:
            return explicit
        layers = config_int(config, "num_hidden_layers", "n_layer", "num_layers")
        hidden = config_int(config, "hidden_size", "n_embd", "d_model")
        heads = config_int(config, "num_attention_heads", "n_head")
        kv_heads = config_int(config, "num_key_value_heads", "num_kv_heads", "n_head_kv") or heads
        vocab = config_int(config, "vocab_size", "padded_vocab_size") or 0
        intermediate = config_int(config, "intermediate_size", "ffn_dim")
        if not layers or not hidden or not heads:
            return None
        head_dim = config_int(config, "head_dim", "qk_rope_head_dim") or max(1, hidden // heads)
        attention = hidden * (heads * head_dim + 2 * kv_heads * head_dim) + hidden * hidden
        if intermediate:
            mlp = 3 * hidden * intermediate
        else:
            mlp = 8 * hidden * hidden
        embeddings = vocab * hidden
        return int(embeddings + layers * (attention + mlp))


    def fallback_weight_mi(config):
        params = estimated_parameter_count(config)
        if not params:
            return None
        overhead = 1.12 if quantization_bits(config) else 1.0
        return ceil_mib(params * dtype_bytes(config) * overhead)


    def runtime_parameter_mi(config, model_api):
        params = api_safetensors_parameter_count(model_api) or estimated_parameter_count(config)
        if not params:
            return None
        return ceil_mib(params * activation_dtype_bytes(config))


    def is_multimodal_config(config):
        return any(isinstance((config or {}).get(key), dict) for key in (
            "vision_config", "audio_config", "multimodal_config",
        ))


    def kv_cache_layer_count(config):
        layers = config_int(config, "num_hidden_layers", "n_layer", "num_layers")
        layer_types = (config or {}).get("layer_types")
        if isinstance(layer_types, list) and layer_types:
            full_attention_layers = sum(1 for layer_type in layer_types if str(layer_type).lower() == "full_attention")
            if full_attention_layers:
                return full_attention_layers, len(layer_types)
        return layers, layers


    def kv_cache_mi(config, context_window, max_num_seqs):
        layers, _total_layers = kv_cache_layer_count(config)
        hidden = config_int(config, "hidden_size", "n_embd", "d_model")
        heads = config_int(config, "num_attention_heads", "n_head")
        kv_heads = config_int(config, "num_key_value_heads", "num_kv_heads", "n_head_kv") or heads
        if not layers or not hidden or not heads or not kv_heads:
            return None
        head_dim = config_int(config, "head_dim", "qk_rope_head_dim") or max(1, hidden // heads)
        kv_dtype_bytes = 1 if "fp8" in str(config.get("kv_cache_dtype") or "").lower() else 2
        bytes_value = 2 * layers * kv_heads * head_dim * kv_dtype_bytes * int(context_window) * int(max_num_seqs)
        return ceil_mib(bytes_value)


    def vllm_kv_cache_mi(config, context_window, max_num_seqs, compute_target):
        theoretical_mi = kv_cache_mi(config, context_window, max_num_seqs)
        if theoretical_mi is None:
            return None, 1, None
        layers, total_layers = kv_cache_layer_count(config)
        compatibility_factor = 1
        if (
            compute_target == "cpu"
            and layers
            and total_layers
            and layers < total_layers
        ):
            # vLLM currently groups and pads hybrid attention/state-cache
            # layouts. Budgeting one theoretical full-attention cache is too
            # optimistic for Qwen 3.5-style models, so use the total/full layer
            # ratio as a conservative compatibility envelope.
            compatibility_factor = max(1, (total_layers + layers - 1) // layers)
        return int(theoretical_mi * compatibility_factor), compatibility_factor, int(theoretical_mi)


    def vllm_runtime_reserve_mi(config, model_api, weights_mi, compute_target):
        if compute_target != "cpu":
            reserve_mi = max(2048, int(weights_mi * 0.08))
            return reserve_mi, {"engineRuntimeReserveMi": int(reserve_mi)}
        runtime_weights_mi = runtime_parameter_mi(config, model_api) or weights_mi
        compile_mi = max(2048, int(max(weights_mi, runtime_weights_mi) * 0.35))
        multimodal_mi = 4096 if is_multimodal_config(config) else 0
        unpack_mi = max(weights_mi, runtime_weights_mi) if quantization_bits(config) else 0
        return int(unpack_mi + compile_mi + multimodal_mi), {
            "runtimeWeightsMi": int(runtime_weights_mi),
            "compileReserveMi": int(compile_mi),
            "multimodalReserveMi": int(multimodal_mi),
            "unpackReserveMi": int(unpack_mi),
        }


    def estimate_vllm_memory(payload, compute_target):
        repo = hf_repo_id(payload.get("url"))
        metadata = hf_metadata(repo)
        config = metadata.get("config") or {}
        dimensions = model_dimension_config(config)
        warnings = []
        model_type = str(payload.get("modelType") or dimensions.get("model_type") or config.get("model_type") or "chat").lower()
        requested_context = positive_int(payload.get("contextWindow"))
        model_max_context = config_int(dimensions, "max_position_embeddings", "model_max_length")
        context_window = requested_context or model_max_context or 4096
        if requested_context and model_max_context and requested_context > model_max_context:
            raise RequestError(
                400,
                "Context Size " + str(requested_context)
                + " exceeds the model maximum of " + str(model_max_context) + " tokens.",
            )
        if not positive_int(payload.get("contextWindow")):
            warnings.append("Context Size was missing; using model config or 4096 token fallback.")
        max_num_seqs = positive_int(payload.get("maxNumSeqs"))
        if not max_num_seqs:
            max_num_seqs = 8 if model_type == "embedding" else 32
            warnings.append("Max Num Seqs was missing; using " + str(max_num_seqs) + " for the estimate.")
        weights_mi = safetensors_weight_mi(metadata.get("safetensorsIndex"))
        weight_size_source = "safetensors-index" if weights_mi else ""
        confidence = "high"
        if not weights_mi:
            weights_mi = tree_safetensors_weight_mi(metadata.get("modelTree"))
            if weights_mi:
                weight_size_source = "repository-files"
                warnings.append("Safetensors index size unavailable; summed public checkpoint file sizes.")
            else:
                weights_mi = api_safetensors_weight_mi(metadata.get("modelApi"))
                if weights_mi:
                    weight_size_source = "parameter-metadata"
                    confidence = "estimated"
                    warnings.append("Checkpoint file sizes unavailable; estimated tensor bytes from HuggingFace dtype metadata.")
                else:
                    weights_mi = fallback_weight_mi(dimensions)
                    weight_size_source = "model-config" if weights_mi else ""
                    confidence = "estimated"
                    warnings.append("Safetensors metadata unavailable; estimated model weights from config.")
        if not weights_mi:
            weights_mi = 0
            confidence = "fallback"
            warnings.append("Could not estimate model weight size from HuggingFace metadata.")

        kv_mi, kv_compatibility_factor, theoretical_kv_mi = vllm_kv_cache_mi(
            dimensions, context_window, max_num_seqs, compute_target
        )
        if kv_mi is None:
            kv_mi = 0
            theoretical_kv_mi = 0
            confidence = "fallback"
            warnings.append("Could not estimate KV cache from model config.")
        else:
            kv_layers, total_layers = kv_cache_layer_count(dimensions)
            if kv_layers and total_layers and kv_layers < total_layers:
                warnings.append("Detected hybrid attention; KV cache uses " + str(kv_layers) + " full-attention layers out of " + str(total_layers) + ".")
                if kv_compatibility_factor > 1:
                    confidence = "estimated"
                    warnings.append(
                        "CPU vLLM hybrid-cache allocation is budgeted with a conservative "
                        + str(kv_compatibility_factor) + "x compatibility factor."
                    )
        runtime_mi, runtime_details = vllm_runtime_reserve_mi(
            dimensions, metadata.get("modelApi") or {}, weights_mi, compute_target
        )
        model_api = metadata.get("modelApi") or {}
        repository_bytes = positive_int(model_api.get("usedStorage") or model_api.get("used_storage")) or 0
        download_bytes = repository_bytes
        download_size_source = "huggingface-used-storage" if repository_bytes else ""
        if not download_bytes and weight_size_source in {"safetensors-index", "repository-files"}:
            download_bytes = int(weights_mi * MIB_BYTES)
            download_size_source = weight_size_source
        if compute_target == "cpu":
            warnings.append(
                "CPU vLLM reserve includes model working tensors and compile/warm-up headroom"
                + (" plus the multimodal processor cache." if runtime_details.get("multimodalReserveMi") else ".")
            )
        return {
            "repo": repo,
            "sourceUrl": "https://huggingface.co/" + repo,
            "weightsMi": int(weights_mi),
            "downloadBytes": int(download_bytes),
            "downloadSizeSource": download_size_source,
            "kvCacheMi": int(kv_mi),
            "theoreticalKvCacheMi": int(theoretical_kv_mi or 0),
            "hybridAllocatorSafetyMi": max(0, int(kv_mi) - int(theoretical_kv_mi or 0)),
            "runtimeReserveMi": int(runtime_mi),
            "runtimeDetails": runtime_details,
            "kvCompatibilityFactor": int(kv_compatibility_factor),
            "modelMaxContext": int(model_max_context or 0),
            "contextWindow": int(context_window),
            "maxNumSeqs": int(max_num_seqs),
            "confidence": confidence,
            "warnings": warnings,
            "calculationSource": "huggingface-model-metadata",
        }


    def estimate_ollama_memory(payload, compute_target):
        reference = ollama_model_reference(payload.get("url"))
        metadata = ollama_metadata(reference)
        model_type = str(payload.get("modelType") or "chat").lower()
        context_window = positive_int(payload.get("contextWindow")) or 4096
        max_num_seqs = positive_int(payload.get("maxNumSeqs")) or (8 if model_type == "embedding" else 32)
        warnings = []
        if not positive_int(payload.get("contextWindow")):
            warnings.append("Context Size was missing; using a 4096 token fallback.")
        if not positive_int(payload.get("maxNumSeqs")):
            warnings.append("Max Num Seqs was missing; using " + str(max_num_seqs) + " for the estimate.")
        weights_mi = ceil_mib(metadata.get("modelBytes"))
        # Public Ollama manifests expose exact model-layer bytes, but not the
        # complete GGUF attention dimensions. Keep the context component
        # deliberately conservative and label the result as an estimate.
        context_factor = max(1.0, float(context_window) / 4096.0)
        kv_mi = max(256, int(weights_mi * 0.08 * context_factor * max_num_seqs))
        runtime_mi = max(512, int((weights_mi + kv_mi) * 0.10))
        source_path = reference["namespace"] + "/" + reference["model"] + ":" + reference["tag"]
        return {
            "repo": reference["reference"],
            "sourceUrl": "https://ollama.com/" + source_path,
            "weightsMi": int(weights_mi),
            "downloadBytes": int(metadata.get("modelBytes") or 0),
            "downloadSizeSource": "ollama-manifest",
            "quantization": metadata.get("quantization"),
            "kvCacheMi": int(kv_mi),
            "runtimeReserveMi": int(runtime_mi),
            "runtimeDetails": {"engineRuntimeReserveMi": int(runtime_mi)},
            "contextWindow": int(context_window),
            "maxNumSeqs": int(max_num_seqs),
            "confidence": "estimated",
            "warnings": warnings + [
                "Ollama model-layer size comes from the public registry manifest; KV cache is estimated from model size, context, and parallel sequences."
            ],
            "calculationSource": "ollama-registry-manifest",
        }


    def estimate_model_memory(payload):
        payload = payload or {}
        engine = normalize_local_engine(payload.get("engine"))
        compute_target = str(payload.get("computeTarget") or "nvidia-gpu").strip().lower()
        supported_targets = {
            "VLLM": {"cpu", "nvidia-gpu", "amd-gpu", "intel-gpu"},
            "OLlama": {"cpu", "nvidia-gpu", "amd-gpu"},
        }
        if compute_target not in supported_targets.get(engine, set()):
            raise RequestError(400, engine + " memory estimation is not supported for " + compute_target)
        if engine == "VLLM":
            estimate = estimate_vllm_memory(payload, compute_target)
        else:
            estimate = estimate_ollama_memory(payload, compute_target)
        warnings = list(estimate.get("warnings") or [])
        context_window = int(estimate.get("contextWindow") or 4096)
        max_num_seqs = int(estimate.get("maxNumSeqs") or 1)
        weights_mi = int(estimate.get("weightsMi") or 0)
        kv_mi = int(estimate.get("kvCacheMi") or 0)
        runtime_mi = int(estimate.get("runtimeReserveMi") or 0)
        minimum_mi = weights_mi + kv_mi + runtime_mi
        recommended_floor = 2048 if engine == "VLLM" else 512
        reserve_mi = max(recommended_floor, int(minimum_mi * 0.15))
        recommended_mi = minimum_mi + reserve_mi

        vram = vram_summary(model_activations()) if compute_target == "nvidia-gpu" else {"available": False}
        maximum_mi = vram.get("plannedRemainingMi") if vram.get("available") else None
        if maximum_mi is None:
            if compute_target == "nvidia-gpu":
                warnings.append("Live GPU availability unavailable; max available cannot be verified.")
        elif maximum_mi < minimum_mi:
            warnings.append("Estimated minimum exceeds unreserved VRAM.")

        return {
            "repo": estimate.get("repo"),
            "engine": engine,
            "computeTarget": compute_target,
            "memoryKind": "ram" if compute_target == "cpu" else "vram",
            "sourceUrl": estimate.get("sourceUrl"),
            "minimumMi": int(minimum_mi),
            "recommendedMi": int(recommended_mi),
            "maximumMi": None if maximum_mi is None else int(maximum_mi),
            "weightsMi": int(weights_mi),
            "downloadBytes": int(estimate.get("downloadBytes") or 0),
            "downloadSizeSource": str(estimate.get("downloadSizeSource") or ""),
            "quantization": estimate.get("quantization"),
            "kvCacheMi": int(kv_mi),
            "theoreticalKvCacheMi": (
                int(estimate.get("theoreticalKvCacheMi"))
                if estimate.get("theoreticalKvCacheMi") is not None
                else None
            ),
            "hybridAllocatorSafetyMi": int(estimate.get("hybridAllocatorSafetyMi") or 0),
            "configuredKvCacheMi": (
                round_up_mib(kv_mi)
                if engine == "VLLM" and compute_target == "cpu" and kv_mi > 0
                else None
            ),
            "reserveMi": int(runtime_mi),
            "recommendedReserveMi": int(reserve_mi),
            "runtimeDetails": estimate.get("runtimeDetails") or {},
            "kvCompatibilityFactor": int(estimate.get("kvCompatibilityFactor") or 1),
            "modelMaxContext": int(estimate.get("modelMaxContext") or 0),
            "contextWindow": int(context_window),
            "maxNumSeqs": int(max_num_seqs),
            "confidence": estimate.get("confidence") or "estimated",
            "calculationSource": estimate.get("calculationSource"),
            "gpuAvailable": bool(vram.get("available")),
            "warnings": warnings,
        }


    def estimate_model_vram(payload):
        """Backward-compatible alias for clients using the former endpoint."""
        return estimate_model_memory(payload)


    def provider_secret_name(model_name):
        return MODEL_SECRET_PREFIX + model_name


    def create_provider_secret(model_name, api_key):
        if not api_key:
            return None
        secret_name = provider_secret_name(model_name)
        secret = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
                "name": secret_name,
                "namespace": MODEL_TARGET_NAMESPACE,
                "labels": {
                    "app.kubernetes.io/managed-by": "ai-appliance-dashboard",
                    "appliance.magicstick.dev/modelactivation": model_name,
                },
            },
            "type": "Opaque",
            "data": {
                "api-key": base64.b64encode(str(api_key).encode("utf-8")).decode("ascii"),
            },
        }
        collection = f"/api/v1/namespaces/{MODEL_TARGET_NAMESPACE}/secrets"
        item = collection + "/" + secret_name
        create_or_patch(collection, item, secret, {"metadata": secret["metadata"], "type": "Opaque", "data": secret["data"]})
        return {"name": secret_name, "key": "api-key"}


    def model_activation_payload(model_type, payload):
        name = require_name(payload)
        target_namespace = str(payload.get("namespace") or payload.get("targetNamespace") or MODEL_TARGET_NAMESPACE)
        spec = {
            "type": model_type,
            "enabled": payload.get("enabled", True) is not False,
            "targetNamespace": target_namespace,
            "applianceRef": {
                "name": APPLIANCE_NAME,
                "namespace": APPLIANCE_NAMESPACE,
            },
        }
        labels = {
            "app.kubernetes.io/managed-by": "ai-appliance-dashboard",
            "appliance.magicstick.dev/model-type": model_type,
        }
        if model_type == "local":
            supplied_local = payload.get("local") or {}
            if not isinstance(supplied_local, dict):
                raise ValueError("local must be an object")
            local = {}
            allowed = {
                "preset", "artifact", "url", "modelType", "engine", "computeTarget", "vram", "vramMi",
                "memoryRequiredMi",
                "contextWindow", "maxOutputTokens", "maxNumSeqs", "minReplicas", "maxReplicas",
            }
            for key in allowed:
                if key in supplied_local:
                    local[key] = supplied_local[key]
            for key in allowed:
                if key in payload and key not in local:
                    local[key] = payload[key]
            compute_target = str(local.get("computeTarget") or "nvidia-gpu").strip().lower()
            engine = normalize_local_engine(local.get("engine"))
            local["computeTarget"] = compute_target
            local["engine"] = engine
            selected_artifact = resolve_local_preset_artifact(local)
            resolved_model_url = str((selected_artifact or {}).get("url") or local.get("url") or "").strip()
            target_definition = ((compute_target_catalog().get("targets") or {}).get(compute_target) or {})
            if target_definition.get("kind") == "cpu" or compute_target == "cpu":
                local.pop("vram", None)
                local.pop("vramMi", None)
                memory_required_mi = None
                if "memoryRequiredMi" in local:
                    memory_required_mi = positive_int(local.get("memoryRequiredMi"))
                    if not memory_required_mi or memory_required_mi < 16:
                        raise ValueError("local.memoryRequiredMi must be an integer of at least 16 MiB")
                    local["memoryRequiredMi"] = memory_required_mi
                if engine == "VLLM" and resolved_model_url:
                    estimate = estimate_model_memory({**local, "url": resolved_model_url})
                    minimum_mi = round_up_mib(estimate.get("minimumMi"))
                    kv_cache_mi = max(
                        MEMORY_RESERVATION_STEP_MI,
                        round_up_mib(estimate.get("kvCacheMi")),
                    )
                    local["kvCacheMemoryBytes"] = kv_cache_mi * MIB_BYTES
                    if memory_required_mi and memory_required_mi < minimum_mi:
                        raise ValueError(
                            "local.memoryRequiredMi must be at least " + str(minimum_mi)
                            + " MiB for this model, context, and CPU vLLM cache."
                        )
            else:
                local.pop("memoryRequiredMi", None)
            labels["appliance.magicstick.dev/compute-target"] = compute_target
            labels["appliance.magicstick.dev/engine"] = engine.lower()
            spec["local"] = local
        else:
            external = dict(payload.get("external") or {})
            for key in ("model", "apiBase", "modelType", "apiVersion", "customLlmProvider", "tpm", "rpm", "contextWindow", "maxOutputTokens"):
                if key in payload and key not in external:
                    external[key] = payload[key]
            if payload.get("apiKey"):
                external["apiKeySecretRef"] = create_provider_secret(name, payload.get("apiKey"))
            elif payload.get("apiKeySecretRef"):
                external["apiKeySecretRef"] = payload.get("apiKeySecretRef")
            spec["external"] = external
        return {
            "apiVersion": f"{APPLIANCE_GROUP}/{APPLIANCE_VERSION}",
            "kind": "ModelActivation",
            "metadata": {
                "name": name,
                "namespace": APPLIANCE_NAMESPACE,
                "labels": labels,
            },
            "spec": spec,
        }


    def summarized_modules():
        catalog = catalog_json()
        catalog_modules = catalog.get("modules") or {}
        modules = {}
        for module, catalog_spec in catalog_modules.items():
            modules[module] = {
                "enabled": False,
                "source": "catalog",
                "displayName": catalog_spec["displayName"],
                "activationMode": catalog_spec["activationMode"],
                "catalog": catalog_spec,
                "parameters": {},
                "status": {},
            }
        current = appliance()
        appliance_status_modules = ((current.get("status") or {}).get("modules") or {})
        for module, spec in ((current.get("spec") or {}).get("modules") or {}).items():
            try:
                canonical = canonical_module(module, catalog)
                catalog_spec = catalog_modules.get(canonical) or catalog_module_metadata(canonical, {})
            except ValueError:
                canonical = str(module or "").strip()
                catalog_spec = catalog_module_metadata(canonical, {"activationMode": "static"})
            if not canonical:
                continue
            modules.setdefault(canonical, {
                "enabled": False,
                "source": "catalog",
                "displayName": catalog_spec["displayName"],
                "activationMode": catalog_spec["activationMode"],
                "catalog": catalog_spec,
                "parameters": {},
                "status": {},
            })
            enabled = spec.get("enabled") is True
            status = appliance_status_modules.get(canonical) or {}
            if not status and catalog_spec["activationMode"] == "static":
                status = {
                    "phase": "Ready" if enabled else "Disabled",
                    "message": "Static module is managed by the cluster bootstrap.",
                }
            modules[canonical].update({"enabled": enabled, "source": "appliance", "status": status})
        for activation in module_activations():
            metadata = activation.get("metadata") or {}
            spec = activation.get("spec") or {}
            status = activation.get("status") or {}
            try:
                module = canonical_module(spec.get("module") or metadata.get("name"), catalog)
                catalog_spec = catalog_modules.get(module) or catalog_module_metadata(module, {})
            except ValueError:
                module = str(spec.get("module") or metadata.get("name") or "").strip()
                catalog_spec = catalog_module_metadata(module, {"activationMode": "static"})
            if not module:
                continue
            modules.setdefault(module, {
                "enabled": False,
                "source": "catalog",
                "displayName": catalog_spec["displayName"],
                "activationMode": catalog_spec["activationMode"],
                "catalog": catalog_spec,
                "parameters": {},
                "status": {},
            })
            modules[module] = {
                "enabled": spec.get("enabled", True) is not False,
                "source": "moduleactivation",
                "activation": metadata.get("name"),
                "autoEnabled": str((metadata.get("annotations") or {}).get("appliance.magicstick.dev/auto-enabled") or "").lower() == "true",
                "generation": int(metadata.get("generation") or 0),
                "observedGeneration": int(status.get("observedGeneration") or 0),
                "displayName": catalog_spec["displayName"],
                "activationMode": catalog_spec["activationMode"],
                "catalog": catalog_spec,
                "parameters": spec.get("parameters") or {},
                "status": status,
            }
        return {
            "catalog": json.dumps(catalog, indent=2, sort_keys=True),
            "catalogJson": {**catalog, **app_catalog_json()},
            "modules": modules,
            "activations": module_activations(),
        }


    def summarized_instances():
        grouped = {}
        for instance in app_instances():
            spec = instance.get("spec") or {}
            instance_type = spec.get("application") or "unknown"
            grouped.setdefault(instance_type, []).append({
                "metadata": instance.get("metadata") or {},
                "spec": spec,
                "status": instance.get("status") or {},
            })
        return {"instances": grouped, "items": app_instances()}


    def dcgm_labels(raw):
        labels = {}
        for part in raw.split(","):
            if "=" not in part:
                continue
            key, value = part.split("=", 1)
            labels[key.strip()] = value.strip().strip('"')
        return labels


    def parse_dcgm_metrics(text):
        gpus = {}
        for line in text.splitlines():
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            match = re.match(r"^(DCGM_FI_DEV_FB_FREE|DCGM_FI_DEV_FB_USED)\{([^}]*)\}\s+([0-9.]+)", line)
            if not match:
                continue
            metric, raw_labels, raw_value = match.groups()
            labels = dcgm_labels(raw_labels)
            key = labels.get("UUID") or labels.get("gpu") or labels.get("device") or "gpu"
            gpu = gpus.setdefault(key, {
                "id": labels.get("gpu") or key,
                "uuid": labels.get("UUID") or "",
                "device": labels.get("device") or "",
                "modelName": labels.get("modelName") or "",
                "hostname": labels.get("Hostname") or "",
                "freeMi": 0,
                "usedMi": 0,
                "totalMi": 0,
            })
            value = int(float(raw_value))
            if metric == "DCGM_FI_DEV_FB_FREE":
                gpu["freeMi"] = value
            if metric == "DCGM_FI_DEV_FB_USED":
                gpu["usedMi"] = value
        for gpu in gpus.values():
            gpu["totalMi"] = int(gpu.get("freeMi", 0)) + int(gpu.get("usedMi", 0))
        return sorted(gpus.values(), key=lambda item: str(item.get("id", "")))


    def vram_summary(activations):
        planned = 0
        for activation in activations:
            spec = activation.get("spec") or {}
            if spec.get("type") != "local" or spec.get("enabled", True) is False:
                continue
            status_vram = positive_int((activation.get("status") or {}).get("vramRequiredMi"))
            local = spec.get("local") or {}
            if str(local.get("computeTarget") or "nvidia-gpu").strip().lower() != "nvidia-gpu":
                continue
            planned += status_vram or parse_mib(local.get("vram")) or positive_int(local.get("vramMi")) or 0
        try:
            metrics = request_text("GET", f"/api/v1/namespaces/{DCGM_NAMESPACE}/services/{DCGM_SERVICE}:{DCGM_PORT}/proxy/metrics")
            gpus = parse_dcgm_metrics(metrics)
            free = sum(int(gpu.get("freeMi") or 0) for gpu in gpus)
            used = sum(int(gpu.get("usedMi") or 0) for gpu in gpus)
            total = sum(int(gpu.get("totalMi") or 0) for gpu in gpus)
            return {
                "available": True,
                "gpus": gpus,
                "freeMi": free,
                "usedMi": used,
                "totalMi": total,
                "plannedMi": planned,
                "plannedRemainingMi": max(0, total - planned),
            }
        except Exception as error:
            return {
                "available": False,
                "error": str(error),
                "gpus": [],
                "freeMi": 0,
                "usedMi": 0,
                "totalMi": 0,
                "plannedMi": planned,
                "plannedRemainingMi": 0,
            }


    def quantity_mi(value):
        """Convert a Kubernetes memory quantity to whole MiB without rounding up."""
        bytes_value = resource_quantity(value)
        if not bytes_value or bytes_value < 0:
            return 0
        return int(bytes_value) // (1024 * 1024)


    def active_model_memory_reservations(activations):
        reservations = {}
        for activation in activations:
            metadata = activation.get("metadata") or {}
            spec = activation.get("spec") or {}
            if spec.get("type") != "local" or spec.get("enabled", True) is False:
                continue
            status = activation.get("status") or {}
            local = spec.get("local") or {}
            compute_target = str(
                local.get("computeTarget")
                or status.get("computeTarget")
                or "nvidia-gpu"
            ).strip().lower()
            if compute_target == "cpu":
                reserved_mi = (
                    positive_int(status.get("memoryRequiredMi"))
                    or positive_int(local.get("memoryRequiredMi"))
                    or 0
                )
            else:
                reserved_mi = (
                    positive_int(status.get("vramRequiredMi"))
                    or parse_mib(local.get("vram"))
                    or positive_int(local.get("vramMi"))
                    or 0
                )
            if not reserved_mi:
                continue
            reservations.setdefault(compute_target, []).append({
                "model": str(metadata.get("name") or "local-model"),
                "reservedMi": int(reserved_mi),
            })
        for items in reservations.values():
            items.sort(key=lambda item: item["model"])
        return reservations


    def node_memory_samples(nodes):
        samples = {}
        missing = []
        for node in nodes:
            name = str((node.get("metadata") or {}).get("name") or "")
            if not name:
                continue
            try:
                summary = request_json(
                    "GET",
                    "/api/v1/nodes/"
                    + urllib.parse.quote(name, safe="")
                    + "/proxy/stats/summary",
                    timeout=3,
                )
                available_bytes = (((summary.get("node") or {}).get("memory") or {}).get("availableBytes"))
                if isinstance(available_bytes, (int, float)) and not isinstance(available_bytes, bool) and available_bytes >= 0:
                    samples[name] = {
                        "availableMi": int(available_bytes) // (1024 * 1024),
                        "source": "kubelet",
                    }
                    continue
            except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError, TypeError):
                pass
            missing.append(name)

        if missing:
            try:
                metrics = {
                    str((item.get("metadata") or {}).get("name") or ""): item
                    for item in list_resource("/apis/metrics.k8s.io/v1beta1/nodes")
                }
            except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError, TypeError):
                metrics = {}
            nodes_by_name = {
                str((node.get("metadata") or {}).get("name") or ""): node
                for node in nodes
            }
            for name in missing:
                total_mi = quantity_mi(
                    (((nodes_by_name.get(name) or {}).get("status") or {}).get("capacity") or {}).get("memory")
                )
                used_mi = quantity_mi(((metrics.get(name) or {}).get("usage") or {}).get("memory"))
                if total_mi and metrics.get(name):
                    samples[name] = {
                        "availableMi": max(0, total_mi - used_mi),
                        "source": "metrics-api-estimate",
                    }
        return samples


    def cpu_memory_device(nodes, reservations):
        if not nodes:
            return None
        total_mi = sum(
            quantity_mi((((node.get("status") or {}).get("capacity") or {}).get("memory")))
            for node in nodes
        )
        reserved_models = reservations.get("cpu") or []
        reserved_mi = sum(int(item.get("reservedMi") or 0) for item in reserved_models)
        samples = node_memory_samples(nodes)
        node_names = [
            str((node.get("metadata") or {}).get("name") or "")
            for node in nodes
            if (node.get("metadata") or {}).get("name")
        ]
        metrics_available = bool(node_names) and all(name in samples for name in node_names)
        available_mi = (
            sum(int(samples[name]["availableMi"]) for name in node_names)
            if metrics_available
            else None
        )
        sources = sorted({samples[name]["source"] for name in node_names if name in samples})
        return {
            "id": "cpu",
            "kind": "cpu",
            "vendor": "generic",
            "computeTarget": "cpu",
            "name": "CPU",
            "nodes": node_names,
            "totalMi": total_mi,
            "reservedMi": reserved_mi,
            "unreservedMi": max(0, total_mi - reserved_mi) if total_mi else None,
            "freeMi": available_mi,
            "metricsAvailable": metrics_available,
            "metricsSource": sources[0] if len(sources) == 1 else ("mixed" if sources else ""),
            "reservations": reserved_models,
        }


    def gpu_resource_placeholders(nodes, compute_catalog, measured_devices):
        measured_targets = {
            str(device.get("computeTarget") or "")
            for device in measured_devices
            if device.get("metricsAvailable")
        }
        devices = []
        definitions = (compute_catalog.get("targets") or {}) if isinstance(compute_catalog, dict) else {}
        for target_id, definition in definitions.items():
            if not isinstance(definition, dict) or str(definition.get("kind") or "") != "gpu":
                continue
            if target_id in measured_targets:
                continue
            resource_names = [str(item) for item in (definition.get("resourceNames") or [])]
            vendor = str(definition.get("vendor") or "gpu")
            display_name = str(definition.get("displayName") or "GPU")
            slot = 0
            for node in nodes:
                status = node.get("status") or {}
                capacity = status.get("capacity") or status.get("allocatable") or {}
                count = int(sum(resource_quantity(capacity.get(name)) for name in resource_names))
                node_name = str((node.get("metadata") or {}).get("name") or "")
                for _index in range(max(0, min(count, 32))):
                    slot += 1
                    devices.append({
                        "id": target_id + "-" + str(slot),
                        "kind": "gpu",
                        "vendor": vendor,
                        "computeTarget": target_id,
                        "name": display_name + (" " + str(slot) if count > 1 else ""),
                        "nodes": [node_name] if node_name else [],
                        "totalMi": 0,
                        "reservedMi": 0,
                        "unreservedMi": None,
                        "freeMi": None,
                        "metricsAvailable": False,
                        "metricsSource": "",
                        "reservations": [],
                    })
        return devices


    def assign_gpu_reservations(devices, reservations):
        by_target = {}
        for device in devices:
            device["reservedMi"] = int(device.get("reservedMi") or 0)
            device["reservations"] = list(device.get("reservations") or [])
            by_target.setdefault(str(device.get("computeTarget") or ""), []).append(device)

        for target, items in reservations.items():
            if target == "cpu":
                continue
            candidates = by_target.get(target) or []
            for reservation in items:
                if not candidates:
                    continue
                amount = int(reservation.get("reservedMi") or 0)
                known = [device for device in candidates if int(device.get("totalMi") or 0) > 0]
                fitting = [
                    device for device in known
                    if int(device.get("totalMi") or 0) - int(device.get("reservedMi") or 0) >= amount
                ]
                if fitting:
                    selected = min(
                        fitting,
                        key=lambda device: int(device.get("totalMi") or 0) - int(device.get("reservedMi") or 0),
                    )
                elif known:
                    selected = max(
                        known,
                        key=lambda device: int(device.get("totalMi") or 0) - int(device.get("reservedMi") or 0),
                    )
                else:
                    selected = min(candidates, key=lambda device: len(device.get("reservations") or []))
                selected["reservedMi"] += amount
                selected["reservations"].append(reservation)

        for device in devices:
            total_mi = int(device.get("totalMi") or 0)
            device["unreservedMi"] = max(0, total_mi - device["reservedMi"]) if total_mi else None
        return devices


    def compute_memory_summary(activations, nvidia_vram=None):
        nodes = ready_schedulable_nodes()
        reservations = active_model_memory_reservations(activations)
        devices = []
        cpu = cpu_memory_device(nodes, reservations)
        if cpu:
            devices.append(cpu)

        nvidia_vram = nvidia_vram if isinstance(nvidia_vram, dict) else vram_summary(activations)
        nvidia_gpus = (nvidia_vram.get("gpus") or []) if nvidia_vram.get("available") else []
        for index, gpu in enumerate(nvidia_gpus, start=1):
            model_name = str(gpu.get("modelName") or "").strip()
            device_name = str(gpu.get("device") or gpu.get("id") or index).strip()
            devices.append({
                "id": "nvidia-" + str(gpu.get("uuid") or gpu.get("id") or index),
                "kind": "gpu",
                "vendor": "nvidia",
                "computeTarget": "nvidia-gpu",
                "name": model_name or ("NVIDIA GPU " + device_name),
                "nodes": [str(gpu.get("hostname"))] if gpu.get("hostname") else [],
                "totalMi": int(gpu.get("totalMi") or 0),
                "reservedMi": 0,
                "unreservedMi": None,
                "freeMi": int(gpu.get("freeMi") or 0),
                "metricsAvailable": bool(int(gpu.get("totalMi") or 0)),
                "metricsSource": "dcgm",
                "reservations": [],
            })

        devices.extend(gpu_resource_placeholders(nodes, compute_target_catalog(), devices))
        gpu_devices = assign_gpu_reservations(
            [device for device in devices if device.get("kind") == "gpu"],
            reservations,
        )
        devices = ([cpu] if cpu else []) + gpu_devices
        return {
            "devices": devices,
            "deviceCount": len(devices),
            "metricsComplete": bool(devices) and all(device.get("metricsAvailable") for device in devices),
        }


    def module_state(modules_payload, name):
        return ((modules_payload or {}).get("modules") or {}).get(name) or {}


    def first_ingress_url(namespace, name):
        ingress = get_resource(f"/apis/networking.k8s.io/v1/namespaces/{namespace}/ingresses/{name}")
        if not ingress:
            return ""
        for rule in (ingress.get("spec") or {}).get("rules") or []:
            host = rule.get("host")
            if host:
                return "http://" + host + "/"
        return ""


    def summarized_models():
        activations = model_activations()
        modules_payload = summarized_modules()
        stack_names = ["gpu", "kubeai", "litellm", "model-catalog", "anything-llm"]
        stack = {
            name: module_state(modules_payload, name)
            for name in stack_names
        }
        anything = dict(stack.get("anything-llm") or {})
        anything["url"] = first_ingress_url(MODEL_TARGET_NAMESPACE, "anything-llm")
        vram = vram_summary(activations)
        return {
            "catalog": generated_model_catalog(),
            "models": (generated_model_catalog().get("models") or []),
            "activations": activations,
            "presets": model_presets(),
            "modules": stack,
            "anythingLlm": anything,
            "vram": vram,
            "computeMemory": compute_memory_summary(activations, vram),
            "computeTargets": compute_target_availability(modules_payload),
        }


    def status_payload():
        current = appliance()
        appliance_status = current.get("status") or {}
        flux = list_resource("/apis/kustomize.toolkit.fluxcd.io/v1/namespaces/flux-system/kustomizations")
        pods = list_resource("/api/v1/pods")
        services = list_resource("/api/v1/services")
        ingresses = list_resource("/apis/networking.k8s.io/v1/ingresses")
        http_routes = list_resource("/apis/gateway.networking.k8s.io/v1/httproutes")
        return {
            "appliance": {
                "metadata": current.get("metadata", {}),
                "spec": current.get("spec", {}),
                "status": current.get("status", {}),
            },
            "moduleActivations": module_activations(),
            "appInstances": app_instances(),
            "fluxKustomizations": summarize_objects(flux),
            "pods": summarize_objects(pods),
            "services": summarize_objects(services),
            "ingresses": summarize_ingresses(ingresses),
            "httpRoutes": summarize_http_routes(http_routes),
            "hardwareOperators": appliance_status.get("hardwareOperators") or {},
        }


    def summarize_objects(items):
        return [
            {
                "namespace": (item.get("metadata") or {}).get("namespace", ""),
                "name": (item.get("metadata") or {}).get("name", ""),
                "phase": (item.get("status") or {}).get("phase", ""),
                "conditions": (item.get("status") or {}).get("conditions", []),
            }
            for item in items
        ]


    def summarize_ingresses(items):
        summarized = []
        for item in items:
            metadata = item.get("metadata") or {}
            annotations = metadata.get("annotations") or {}
            dashboard_annotations = {
                key: value
                for key, value in annotations.items()
                if key.startswith("dashboard.ai-appliance.io/")
            }
            hosts = []
            for rule in (item.get("spec") or {}).get("rules", []):
                host = rule.get("host")
                if host:
                    hosts.append(host)
            summarized.append({
                "namespace": metadata.get("namespace", ""),
                "name": metadata.get("name", ""),
                "labels": metadata.get("labels") or {},
                "annotations": dashboard_annotations,
                "hosts": hosts,
            })
        return summarized


    def summarize_http_routes(items):
        summarized = []
        for item in items:
            metadata = item.get("metadata") or {}
            spec = item.get("spec") or {}
            accepted = False
            for parent in (item.get("status") or {}).get("parents", []):
                for route_condition in parent.get("conditions", []):
                    if route_condition.get("type") == "Accepted" and route_condition.get("status") == "True":
                        accepted = True
            summarized.append({
                "namespace": metadata.get("namespace", ""),
                "name": metadata.get("name", ""),
                "labels": metadata.get("labels") or {},
                "hostnames": spec.get("hostnames") or [],
                "accepted": accepted,
            })
        return summarized


    def required_get_access(parts):
        if len(parts) >= 2 and parts[:2] in (["api", "api-access"], ["api", "kubernetes-access"]):
            return "admin"
        credential_route = (
            len(parts) == 4
            and parts[0] == "api"
            and parts[1] in {"instances", "modules"}
            and parts[3] == "credentials"
        )
        return "operator" if credential_route else "viewer"


    class Handler(BaseHTTPRequestHandler):
        server_version = "MagicStickDashboardAPI/0.6"

        def log_message(self, format, *args):
            print("%s - %s" % (self.address_string(), format % args), flush=True)

        def send_json(self, payload, status=200):
            data = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def send_error_json(self, status, message):
            self.send_json({"error": message}, status)

        def send_auth_error(self, error):
            if error.status == 401:
                data = json.dumps({"error": str(error)}, indent=2, sort_keys=True).encode("utf-8")
                self.send_response(401)
                self.send_header("Content-Type", "application/json")
                self.send_header("Cache-Control", "no-store")
                self.send_header("WWW-Authenticate", 'Bearer realm="magicstick"')
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
                return
            self.send_error_json(error.status, str(error))

        def require_access(self, required_access):
            return authorize(self.headers.get("Authorization", ""), required_access)

        def request_id(self):
            candidate = str(self.headers.get("X-Request-ID", "") or "").strip()
            if candidate and re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", candidate):
                return candidate
            return secrets.token_hex(12)

        def route(self):
            parsed = urllib.parse.urlparse(self.path)
            return parsed.path.rstrip("/") or "/"

        def do_GET(self):
            try:
                path = self.route()
                parts = path.strip("/").split("/")
                if path == "/healthz":
                    self.send_json({"ok": True})
                    return
                if path == "/api/kubernetes-access":
                    principal = self.require_access("admin")
                    query = urllib.parse.parse_qs(
                        urllib.parse.urlparse(self.path).query,
                        keep_blank_values=True,
                    )
                    self.send_json(list_kubernetes_access(principal, query))
                    return
                if len(parts) == 4 and parts[:2] == ["api", "kubernetes-access"] and parts[3] == "kubeconfig":
                    principal = self.require_access("admin")
                    self.send_json(kubernetes_access_kubeconfig(principal, parts[2], self.request_id()))
                    return
                if path == "/api/users" or (len(parts) == 3 and parts[:2] == ["api", "users"]):
                    principal = self.require_access("admin")
                    if path == "/api/users":
                        query = urllib.parse.parse_qs(
                            urllib.parse.urlparse(self.path).query,
                            keep_blank_values=True,
                        )
                        self.send_json(list_users(principal, query))
                    else:
                        self.send_json(get_user(principal, parts[2]))
                    return
                if path == "/api/api-access":
                    self.require_access("admin")
                    self.send_json(list_api_access())
                    return
                required_access = required_get_access(parts)
                principal = self.require_access(required_access)
                if path == "/api/session":
                    session = dict(principal)
                    session["identityManagementAvailable"] = IDENTITY_MANAGEMENT_MODE == "keycloak"
                    session["identityManagementMode"] = IDENTITY_MANAGEMENT_MODE
                    self.send_json(session)
                elif path == "/api/appliance":
                    self.send_json(appliance())
                elif path == "/api/modules":
                    self.send_json(summarized_modules())
                elif path == "/api/instances":
                    self.send_json(summarized_instances())
                elif len(parts) == 4 and parts[:2] == ["api", "instances"] and parts[3] == "credentials":
                    self.send_json(instance_credentials(parts[2]))
                elif len(parts) == 4 and parts[:2] == ["api", "modules"] and parts[3] == "credentials":
                    self.send_json(module_credentials(parts[2]))
                elif path == "/api/models":
                    self.send_json(summarized_models())
                elif path == "/api/models/compute-targets":
                    self.send_json(compute_target_availability())
                elif path == "/api/model-discovery/search":
                    query = urllib.parse.parse_qs(
                        urllib.parse.urlparse(self.path).query,
                        keep_blank_values=True,
                    )
                    self.send_json(model_discovery_search(query))
                elif path == "/api/model-discovery/popular":
                    query = urllib.parse.parse_qs(
                        urllib.parse.urlparse(self.path).query,
                        keep_blank_values=True,
                    )
                    self.send_json(model_discovery_popular(query))
                elif path == "/api/model-discovery/artifacts":
                    query = urllib.parse.parse_qs(
                        urllib.parse.urlparse(self.path).query,
                        keep_blank_values=True,
                    )
                    self.send_json(model_discovery_artifacts(query))
                elif path == "/api/status":
                    self.send_json(status_payload())
                elif path == "/api/settings":
                    self.send_json(settings_response())
                elif path == "/api/events":
                    core_events = list_resource("/api/v1/events")
                    new_events = list_resource("/apis/events.k8s.io/v1/events")
                    self.send_json({"events": summarize_objects(core_events + new_events)})
                else:
                    self.send_error_json(404, "not found")
            except AuthError as error:
                self.send_auth_error(error)
            except RequestError as error:
                self.send_error_json(error.status, str(error))
            except LookupError as error:
                self.send_error_json(404, str(error))
            except ValueError as error:
                self.send_error_json(400, str(error))
            except urllib.error.HTTPError as error:
                if self.route().startswith("/api/kubernetes-access"):
                    self.send_error_json(503, "Kubernetes access management is unavailable")
                elif self.route().startswith("/api/api-access"):
                    self.send_error_json(503, "API access management is unavailable")
                elif self.route().startswith("/api/users"):
                    self.send_error_json(503, "identity administration is unavailable")
                else:
                    self.send_error_json(error.code, error.read().decode("utf-8", errors="replace"))
            except Exception as error:
                if self.route().startswith("/api/kubernetes-access"):
                    self.send_error_json(500, "Kubernetes access management failed")
                elif self.route().startswith("/api/api-access"):
                    self.send_error_json(500, "API access management failed")
                elif self.route().startswith("/api/users"):
                    self.send_error_json(500, "user administration failed")
                else:
                    self.send_error_json(500, str(error))

        def do_PATCH(self):
            path = self.route()
            parts = path.strip("/").split("/")
            if len(parts) == 3 and parts[:2] == ["api", "users"]:
                try:
                    principal = self.require_access("admin")
                    validate_user_mutation_request(self)
                    self.send_json(update_user_profile(principal, parts[2], read_body(self), self.request_id()))
                except AuthError as error:
                    self.send_auth_error(error)
                except RequestError as error:
                    self.send_error_json(error.status, str(error))
                except Exception:
                    self.send_error_json(500, "user administration failed")
                return
            if self.route() == "/api/settings":
                try:
                    self.require_access("admin")
                    self.send_json(settings_patch(read_body(self)))
                except AuthError as error:
                    self.send_auth_error(error)
                except LookupError as error:
                    self.send_error_json(404, str(error))
                except RequestError as error:
                    self.send_error_json(error.status, str(error))
                except urllib.error.HTTPError as error:
                    self.send_error_json(error.code, error.read().decode("utf-8", errors="replace"))
                except Exception as error:
                    self.send_error_json(400, str(error))
                return
            if self.route() == "/api/appliance":
                try:
                    self.require_access("admin")
                except AuthError as error:
                    self.send_auth_error(error)
                    return
                self.send_error_json(405, "Appliance spec is Git-owned; create ModuleActivation or AppInstance resources instead.")
                return
            self.send_error_json(404, "not found")

        def do_POST(self):
            try:
                path = self.route()
                parts = path.strip("/").split("/")
                if path == "/api/api-access":
                    self.require_access("admin")
                    validate_dashboard_mutation_request(self)
                    self.send_json(create_api_access(read_body(self)), 201)
                    return
                if path == "/api/users":
                    principal = self.require_access("admin")
                    validate_user_mutation_request(self)
                    self.send_json(create_user(principal, read_body(self), self.request_id()), 201)
                    return

                if len(parts) == 4 and parts[:2] == ["api", "users"] and parts[3] in {"enable", "disable"}:
                    principal = self.require_access("admin")
                    validate_user_mutation_request(self)
                    payload = read_body(self)
                    _reject_unknown_fields(payload, set())
                    self.send_json(
                        set_user_enabled(
                            principal,
                            parts[2],
                            parts[3] == "enable",
                            self.request_id(),
                        )
                    )
                    return

                if len(parts) == 4 and parts[0] == "api" and parts[1] == "modules":
                    self.require_access("operator")
                    catalog = catalog_json()
                    module = canonical_module(parts[2], catalog)
                    catalog_spec = ((catalog.get("modules") or {}).get(module) or {})
                    if not module_manual_control_enabled(catalog_spec):
                        self.send_error_json(400, "module is statically managed: " + module)
                        return
                    if parts[3] not in {"enable", "disable"}:
                        self.send_error_json(404, "not found")
                        return
                    enabled = parts[3] == "enable"
                    payload = read_body(self)
                    resource = module_activation_payload(module, enabled, payload)
                    name = resource["metadata"]["name"]
                    collection = f"/apis/{APPLIANCE_GROUP}/{APPLIANCE_VERSION}/namespaces/{APPLIANCE_NAMESPACE}/moduleactivations"
                    item = collection + "/" + name
                    self.send_json(create_or_patch(collection, item, resource, manual_module_activation_patch(resource)))
                    return

                applications = app_catalog_json().get("applications") or {}
                if len(parts) == 3 and parts[:2] == ["api", "instances"] and parts[2] in applications:
                    self.require_access("operator")
                    instance_type = parts[2]
                    resource = app_instance_payload(instance_type, read_body(self))
                    name = resource["metadata"]["name"]
                    collection = f"/apis/{APPLIANCE_GROUP}/{APPLIANCE_VERSION}/namespaces/{APPLIANCE_NAMESPACE}/appinstances"
                    item = collection + "/" + name
                    self.send_json(create_or_patch(collection, item, resource, {"spec": resource["spec"], "metadata": {"labels": resource["metadata"]["labels"]}}))
                    return

                if len(parts) == 3 and parts[:2] == ["api", "models"] and parts[2] in {"estimate-memory", "estimate-vram"}:
                    self.require_access("viewer")
                    self.send_json(estimate_model_memory(read_body(self)))
                    return

                if len(parts) == 4 and parts[:3] == ["api", "models", "local-runtime"] and parts[3] == "remove":
                    self.require_access("operator")
                    self.send_json(remove_local_model_runtime())
                    return

                if len(parts) == 3 and parts[:2] == ["api", "models"] and parts[2] in {"local", "external"}:
                    self.require_access("operator")
                    model_type = parts[2]
                    if model_type == "local":
                        payload = read_body(self)
                        local = payload.get("local") or {}
                        compute_target = str(
                            local.get("computeTarget") or payload.get("computeTarget") or "nvidia-gpu"
                        ).strip().lower()
                        engine = normalize_local_engine(
                            local.get("engine") or payload.get("engine") or "VLLM"
                        )
                        require_compute_target_available(compute_target, engine)
                    else:
                        payload = read_body(self)
                    resource = model_activation_payload(model_type, payload)
                    name = resource["metadata"]["name"]
                    collection = f"/apis/{APPLIANCE_GROUP}/{APPLIANCE_VERSION}/namespaces/{APPLIANCE_NAMESPACE}/modelactivations"
                    item = collection + "/" + name
                    self.send_json(create_or_patch(collection, item, resource, {"spec": resource["spec"], "metadata": {"labels": resource["metadata"]["labels"]}}))
                    return

                self.send_error_json(404, "not found")
            except AuthError as error:
                self.send_auth_error(error)
            except RequestError as error:
                self.send_error_json(error.status, str(error))
            except urllib.error.HTTPError as error:
                if self.route().startswith("/api/api-access"):
                    self.send_error_json(503, "API access management is unavailable")
                elif self.route().startswith("/api/users"):
                    self.send_error_json(503, "identity administration is unavailable")
                else:
                    self.send_error_json(error.code, error.read().decode("utf-8", errors="replace"))
            except Exception as error:
                if self.route().startswith("/api/api-access"):
                    self.send_error_json(500, "API access management failed")
                elif self.route().startswith("/api/users"):
                    self.send_error_json(500, "user administration failed")
                else:
                    self.send_error_json(400, str(error))

        def do_PUT(self):
            try:
                path = self.route()
                parts = path.strip("/").split("/")
                if len(parts) == 3 and parts[:2] == ["api", "kubernetes-access"]:
                    principal = self.require_access("admin")
                    validate_dashboard_mutation_request(self)
                    self.send_json(
                        update_kubernetes_access(
                            principal,
                            parts[2],
                            read_body(self),
                            self.request_id(),
                        )
                    )
                    return
                if len(parts) != 4 or parts[:2] != ["api", "users"]:
                    self.send_error_json(404, "not found")
                    return
                principal = self.require_access("admin")
                validate_user_mutation_request(self)
                payload = read_body(self)
                if parts[3] == "roles":
                    self.send_json(update_user_roles(principal, parts[2], payload, self.request_id()))
                    return
                if parts[3] == "password":
                    self.send_json(reset_user_password(principal, parts[2], payload, self.request_id()))
                    return
                self.send_error_json(404, "not found")
            except AuthError as error:
                self.send_auth_error(error)
            except RequestError as error:
                self.send_error_json(error.status, str(error))
            except Exception:
                if self.route().startswith("/api/kubernetes-access"):
                    self.send_error_json(500, "Kubernetes access management failed")
                else:
                    self.send_error_json(500, "user administration failed")

        def do_DELETE(self):
            try:
                path = self.route()
                parts = path.strip("/").split("/")
                if len(parts) == 3 and parts[:2] == ["api", "api-access"]:
                    self.require_access("admin")
                    validate_dashboard_mutation_request(self)
                    payload = read_body(self)
                    _reject_unknown_fields(payload, set())
                    self.send_json(delete_api_access(parts[2]))
                    return
                if len(parts) == 3 and parts[:2] == ["api", "users"]:
                    principal = self.require_access("admin")
                    validate_user_mutation_request(self)
                    payload = read_body(self)
                    self.send_json(delete_user(principal, parts[2], payload, self.request_id()))
                    return
                self.require_access("operator")
                if len(parts) == 3 and parts[:2] == ["api", "instances"]:
                    name = parts[2]
                    if not DNS_LABEL.match(name):
                        self.send_error_json(400, "name must be a DNS-1123 label")
                        return
                    delete_json(f"/apis/{APPLIANCE_GROUP}/{APPLIANCE_VERSION}/namespaces/{APPLIANCE_NAMESPACE}/appinstances/{name}")
                    self.send_json({"deleted": name})
                    return
                if len(parts) == 3 and parts[:2] == ["api", "models"]:
                    name = parts[2]
                    if not DNS_LABEL.match(name):
                        self.send_error_json(400, "name must be a DNS-1123 label")
                        return
                    activation = model_activation(name)
                    if activation:
                        spec = activation.get("spec") or {}
                        external = spec.get("external") or {}
                        ref = external.get("apiKeySecretRef") or {}
                        secret_name = ref.get("name") or ""
                        if secret_name.startswith(MODEL_SECRET_PREFIX):
                            secret = get_resource(f"/api/v1/namespaces/{MODEL_TARGET_NAMESPACE}/secrets/{secret_name}")
                            labels = ((secret or {}).get("metadata") or {}).get("labels") or {}
                            if labels.get("app.kubernetes.io/managed-by") == "ai-appliance-dashboard" and labels.get("appliance.magicstick.dev/modelactivation") == name:
                                delete_json(f"/api/v1/namespaces/{MODEL_TARGET_NAMESPACE}/secrets/{secret_name}")
                    delete_json(f"/apis/{APPLIANCE_GROUP}/{APPLIANCE_VERSION}/namespaces/{APPLIANCE_NAMESPACE}/modelactivations/{name}")
                    self.send_json({"deleted": name})
                    return
                self.send_error_json(404, "not found")
            except AuthError as error:
                self.send_auth_error(error)
            except RequestError as error:
                self.send_error_json(error.status, str(error))
            except urllib.error.HTTPError as error:
                if self.route().startswith("/api/api-access"):
                    self.send_error_json(503, "API access management is unavailable")
                elif self.route().startswith("/api/users"):
                    self.send_error_json(503, "identity administration is unavailable")
                else:
                    self.send_error_json(error.code, error.read().decode("utf-8", errors="replace"))
            except Exception as error:
                if self.route().startswith("/api/api-access"):
                    self.send_error_json(500, "API access management failed")
                elif self.route().startswith("/api/users"):
                    self.send_error_json(500, "user administration failed")
                else:
                    self.send_error_json(400, str(error))


    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8080"))
        ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()
