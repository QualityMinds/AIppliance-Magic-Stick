    def litellm_credentials():
        master_key = litellm_master_key()

        settings = settings_response()
        mdns_domain = settings.get("mdnsDomain") or DEFAULT_MDNS_DOMAIN
        public_domain = settings.get("publicDomain") or DEFAULT_PUBLIC_DOMAIN
        local_url = "https://litellm." + mdns_domain
        public_url = "https://litellm." + public_domain
        fields = [
            {"key": "ui_username", "value": LITELLM_UI_USERNAME},
            {"key": "ui_password", "value": master_key},
            {"key": "master_key", "value": master_key},
            {"key": "authorization", "value": "Bearer " + master_key},
            {"key": "local_ui_url", "value": local_url + "/ui/"},
            {"key": "local_api_base", "value": local_url + "/v1"},
            {"key": "service_api_base", "value": LITELLM_SERVICE_URL + "/v1"},
        ]
        if public_url != local_url:
            fields.extend([
                {"key": "public_ui_url", "value": public_url + "/ui/"},
