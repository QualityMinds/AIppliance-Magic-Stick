  name: ai-appliance-dashboard-api
  namespace: identity-system
  labels:
    app: ai-appliance-dashboard
    app.kubernetes.io/component: api
data:
  server.py: |
    #!/usr/bin/env python3
    import base64
    import hashlib
    import html
    import ipaddress
    import json
    import os
    import re
    import secrets
    import ssl
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from decimal import Decimal, InvalidOperation
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    APPLIANCE_GROUP = "appliance.magicstick.dev"
    APPLIANCE_VERSION = "v1alpha1"
    APPLIANCE_NAMESPACE = os.environ.get("APPLIANCE_NAMESPACE", "ai-system")
    APPLIANCE_NAME = os.environ.get("APPLIANCE_NAME", "local")
    MODULE_CATALOG_NAMESPACE = os.environ.get("MODULE_CATALOG_NAMESPACE", "ai-system")
    MODULE_CATALOG_NAME = os.environ.get("MODULE_CATALOG_NAME", "magicstick-module-catalog")
    APP_CATALOG_NAMESPACE = os.environ.get("APP_CATALOG_NAMESPACE", "ai-system")
    APP_CATALOG_NAME = os.environ.get("APP_CATALOG_NAME", "magicstick-app-catalog")
    MODEL_PRESETS_NAMESPACE = os.environ.get("MODEL_PRESETS_NAMESPACE", "ai-system")
    MODEL_PRESETS_NAME = os.environ.get("MODEL_PRESETS_NAME", "magicstick-model-presets")
    COMPUTE_TARGET_CATALOG_NAMESPACE = os.environ.get("COMPUTE_TARGET_CATALOG_NAMESPACE", "ai-system")
    COMPUTE_TARGET_CATALOG_NAME = os.environ.get("COMPUTE_TARGET_CATALOG_NAME", "magicstick-compute-target-catalog")
    MODEL_TARGET_NAMESPACE = os.environ.get("MODEL_TARGET_NAMESPACE", "ai")
    MODEL_CATALOG_NAME = os.environ.get("MODEL_CATALOG_NAME", "ai-model-catalog")
    DCGM_NAMESPACE = os.environ.get("DCGM_NAMESPACE", "gpu-operator")
    DCGM_SERVICE = os.environ.get("DCGM_SERVICE", "nvidia-dcgm-exporter")
    DCGM_PORT = os.environ.get("DCGM_PORT", "9400")
    SETTINGS_NAMESPACE = os.environ.get("SETTINGS_NAMESPACE", "flux-system")
    SETTINGS_CONFIGMAP_NAME = os.environ.get("SETTINGS_CONFIGMAP_NAME", "ai-appliance-settings")
    KUBE_API = os.environ.get("KUBERNETES_SERVICE_URL", "https://kubernetes.default.svc").rstrip("/")
    SA_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    SA_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    DNS_LABEL = re.compile(r"^[a-z0-9]([-a-z0-9]*[a-z0-9])?$")
    DEFAULT_PUBLIC_DOMAIN = "magicstick.example.com"
    DEFAULT_MDNS_DOMAIN = "magicstick.local"
    SETTINGS_WATCH_LABELS = {"reconcile.fluxcd.io/watch": "Enabled"}

    MODEL_SECRET_PREFIX = "ai-model-provider-"
    LITELLM_MASTER_KEY_SECRET_NAME = "litellm-masterkey-secret"
    LITELLM_MASTER_KEY_SECRET_KEY = "LITELLM_MASTER_KEY"
    LITELLM_UI_USERNAME = "admin"
    LITELLM_SERVICE_URL = "http://litellm.ai.svc.cluster.local:4000"
    SSL_CONTEXT = ssl.create_default_context(cafile=SA_CA_PATH)
    PUBLIC_SSL_CONTEXT = ssl.create_default_context()
    HF_CACHE_TTL_SECONDS = 900
    HF_DISCOVERY_CACHE_TTL_SECONDS = 300
    HF_DISCOVERY_TIMEOUT_SECONDS = 8
    HF_DISCOVERY_MAX_RESPONSE_BYTES = 4 * 1024 * 1024
    HF_DISCOVERY_MAX_QUERY_LENGTH = 120
    HF_DISCOVERY_MAX_PAGE_SIZE = 50
    HF_DISCOVERY_MAX_CURSOR = 500
    HF_DISCOVERY_MAX_RESULTS = 200
    HF_DISCOVERY_UPSTREAM_LIMIT = 50
    HF_DISCOVERY_MAX_CACHE_ENTRIES = 128
    OLLAMA_DISCOVERY_TIMEOUT_SECONDS = 8
    OLLAMA_DISCOVERY_MAX_RESPONSE_BYTES = 4 * 1024 * 1024
    OLLAMA_DISCOVERY_MAX_PAGES = 10
    MEMORY_RESERVATION_STEP_MI = 100
    MIB_BYTES = 1024 * 1024
    HF_METADATA_CACHE = {}
    HF_DISCOVERY_CACHE = {}
    HF_DISCOVERY_CACHE_LOCK = threading.RLock()
    OLLAMA_METADATA_CACHE = {}
    OIDC_USERINFO_URL = os.environ.get(
        "OIDC_USERINFO_URL",
        "http://keycloak.identity-system.svc.cluster.local:8080/realms/magicstick/protocol/openid-connect/userinfo",
    )
    OIDC_EXPECTED_ISSUER = os.environ.get(
        "OIDC_EXPECTED_ISSUER",
        "https://id.magicstick.local/realms/magicstick",
    ).rstrip("/")
    OIDC_EXPECTED_CLIENT_ID = os.environ.get(
        "OIDC_EXPECTED_CLIENT_ID",
        "magicstick-human-gateway-local",
    )
    AUTH_CACHE_TTL_SECONDS = 30
    AUTH_CACHE = {}
    ROLE_ACCESS = {
        "viewer": {"magicstick-viewer", "magicstick-operator", "magicstick-admin"},
        "operator": {"magicstick-operator", "magicstick-admin"},
        "admin": {"magicstick-admin"},
    }
    KEYCLOAK_ADMIN_URL = os.environ.get(
        "KEYCLOAK_ADMIN_URL",
        "http://keycloak.identity-system.svc.cluster.local:8080",
    ).rstrip("/")
    KEYCLOAK_REALM = os.environ.get("KEYCLOAK_REALM", "magicstick")
    KEYCLOAK_USER_ADMIN_SECRET_NAMESPACE = os.environ.get(
        "KEYCLOAK_USER_ADMIN_SECRET_NAMESPACE",
        "identity-system",
    )
    KEYCLOAK_USER_ADMIN_SECRET_NAME = os.environ.get(
        "KEYCLOAK_USER_ADMIN_SECRET_NAME",
        "magicstick-user-admin-client",
    )
    KUBERNETES_ACCESS_INFO_NAMESPACE = os.environ.get(
        "KUBERNETES_ACCESS_INFO_NAMESPACE",
        "identity-system",
    )
    KUBERNETES_ACCESS_INFO_NAME = os.environ.get(
        "KUBERNETES_ACCESS_INFO_NAME",
        "magicstick-kubernetes-access-info",
    )
    KUBERNETES_OIDC_CLIENT_ID = os.environ.get(
        "KUBERNETES_OIDC_CLIENT_ID",
        "magicstick-kubernetes",
    )
    IDENTITY_MANAGEMENT_MODE = os.environ.get("IDENTITY_MANAGEMENT_MODE", "keycloak").strip().lower()
    DASHBOARD_ALLOWED_ORIGINS = {
        origin.strip().rstrip("/")
        for origin in os.environ.get("DASHBOARD_ALLOWED_ORIGINS", "").split(",")
        if origin.strip()
    }
    MANAGED_REALM_ROLES = {
        "magicstick-user",
        "magicstick-viewer",
        "magicstick-operator",
        "magicstick-admin",
    }
    RECOVERY_GROUP_NAME = "magicstick-recovery"
    RECOVERY_GROUP_PATH = "/magicstick-recovery"
    KUBERNETES_ACCESS_GROUPS = {
        "viewer": "magicstick-kubernetes-viewer",
        "operator": "magicstick-kubernetes-operator",
        "admin": "magicstick-kubernetes-admin",
    }
    KUBERNETES_ACCESS_LEVELS = {"none", *KUBERNETES_ACCESS_GROUPS}
    ACCESS_LEVEL_ROLES = {
        "user": {"magicstick-user"},
        "viewer": {"magicstick-user", "magicstick-viewer"},
        "operator": {"magicstick-user", "magicstick-operator"},
        "admin": {"magicstick-user", "magicstick-admin"},
    }
    USER_ID = re.compile(r"^[A-Za-z0-9._:-]{1,160}$")
    USERNAME = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._@+-]{0,127}$")
    EMAIL = re.compile(r"^[^\s@]+@[^\s@]+\.[^\s@]+$")
    MAX_REQUEST_BODY_BYTES = 64 * 1024
    MAX_USERS_PAGE_SIZE = 100
    MAX_USER_SEARCH_LENGTH = 128
    MAX_API_ACCESS_NAME_LENGTH = 64
    API_ACCESS_PAGE_SIZE = 100
    API_ACCESS_MAX_PAGES = 100
    API_ACCESS_METADATA_SOURCE = "magicstick-dashboard"
    API_ACCESS_ID = re.compile(r"^[A-Za-z0-9._:-]{16,256}$")
    USER_MUTATION_LOCK = threading.RLock()
    KUBERNETES_ACCESS_LOCK = threading.RLock()
    API_ACCESS_LOCK = threading.RLock()
    KEYCLOAK_TOKEN_LOCK = threading.Lock()
    KEYCLOAK_TOKEN_CACHE = {"access_token": "", "expires_at": 0.0}


    class AuthError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status = status


    class RequestError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status = status


    def jwt_payload(access_token):
        try:
            encoded = access_token.split(".")[1]
            encoded += "=" * (-len(encoded) % 4)
            return json.loads(base64.urlsafe_b64decode(encoded).decode("utf-8"))
        except (IndexError, ValueError, json.JSONDecodeError) as error:
            raise AuthError(401, "invalid access token") from error


    def authenticated_principal(authorization):
        scheme, separator, access_token = (authorization or "").partition(" ")
        if not separator or scheme.lower() != "bearer" or not access_token.strip():
            raise AuthError(401, "authentication required")
        access_token = access_token.strip()
        now = time.time()
        cache_key = hashlib.sha256(access_token.encode("utf-8")).hexdigest()
        cached = AUTH_CACHE.get(cache_key)
        if cached and cached[0] > now:
            return cached[1]

        request = urllib.request.Request(
            OIDC_USERINFO_URL,
            headers={
                "Accept": "application/json",
                "Authorization": "Bearer " + access_token,
            },
        )
        try:
            with urllib.request.urlopen(request, timeout=5) as response:
                userinfo = json.loads(response.read().decode("utf-8"))
        except urllib.error.HTTPError as error:
            if error.code in {400, 401, 403}:
                raise AuthError(401, "invalid or expired access token") from error
            raise AuthError(503, "identity provider unavailable") from error
        except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
            raise AuthError(503, "identity provider unavailable") from error

        claims = jwt_payload(access_token)
        if str(claims.get("iss") or "").rstrip("/") != OIDC_EXPECTED_ISSUER:
            raise AuthError(401, "access token issuer is not trusted")
        if str(claims.get("azp") or "") != OIDC_EXPECTED_CLIENT_ID:
            raise AuthError(401, "access token client is not trusted")
        try:
            if float(claims.get("exp", 0)) <= now:
                raise AuthError(401, "access token has expired")
        except (TypeError, ValueError) as error:
            raise AuthError(401, "access token expiry is invalid") from error

        realm_access = claims.get("realm_access") or {}
        raw_roles = realm_access.get("roles", []) if isinstance(realm_access, dict) else []
        roles = {str(role) for role in raw_roles} if isinstance(raw_roles, list) else set()
        principal = {
            "subject": str(userinfo.get("sub") or claims.get("sub") or ""),
            "username": str(
                userinfo.get("preferred_username")
                or userinfo.get("email")
                or claims.get("preferred_username")
                or claims.get("sub")
                or "unknown"
            ),
            "roles": sorted(roles),
        }
        AUTH_CACHE[cache_key] = (min(now + AUTH_CACHE_TTL_SECONDS, float(claims["exp"])), principal)
        return principal


    def authorize(authorization, required_access):
        principal = authenticated_principal(authorization)
        allowed_roles = ROLE_ACCESS[required_access]
        if not allowed_roles.intersection(principal["roles"]):
            raise AuthError(403, f"{required_access} role required")
        return principal


    def token():
        with open(SA_TOKEN_PATH, "r", encoding="utf-8") as token_file:
            return token_file.read().strip()


    def request_json(method, path, body=None, content_type="application/json", timeout=20):
        data = None
        headers = {
            "Accept": "application/json",
            "Authorization": "Bearer " + token(),
        }
        if body is not None:
            data = json.dumps(body).encode("utf-8")
            headers["Content-Type"] = content_type
        request = urllib.request.Request(KUBE_API + path, data=data, headers=headers, method=method)
        with urllib.request.urlopen(request, timeout=timeout, context=SSL_CONTEXT) as response:
            payload = response.read().decode("utf-8")
            return json.loads(payload) if payload else {}


    def request_text(method, path):
        request = urllib.request.Request(
            KUBE_API + path,
            headers={
                "Accept": "text/plain",
                "Authorization": "Bearer " + token(),
            },
            method=method,
        )
        with urllib.request.urlopen(request, timeout=20, context=SSL_CONTEXT) as response:
            return response.read().decode("utf-8", errors="replace")


    def delete_json(path):
        try:
            return request_json("DELETE", path)
        except urllib.error.HTTPError as error:
            if error.code == 404:
                return {}
            raise


    def require_identity_management():
        if IDENTITY_MANAGEMENT_MODE != "keycloak":
            raise RequestError(503, "local identity management is not available")


    def decode_secret_field(secret, key):
        encoded = ((secret or {}).get("data") or {}).get(key)
        if not encoded:
            raise RequestError(503, "identity administration is not configured")
        try:
            value = base64.b64decode(encoded, validate=True).decode("utf-8").strip()
        except (ValueError, UnicodeDecodeError) as error:
            raise RequestError(503, "identity administration is not configured") from error
        if not value:
            raise RequestError(503, "identity administration is not configured")
        return value


    def keycloak_client_credentials():
        path = (
            f"/api/v1/namespaces/{urllib.parse.quote(KEYCLOAK_USER_ADMIN_SECRET_NAMESPACE, safe='')}"
            f"/secrets/{urllib.parse.quote(KEYCLOAK_USER_ADMIN_SECRET_NAME, safe='')}"
        )
        try:
            secret = request_json("GET", path)
        except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as error:
            raise RequestError(503, "identity administration is not configured") from error
        return decode_secret_field(secret, "client-id"), decode_secret_field(secret, "client-secret")


    def _keycloak_http_request(method, path, access_token=None, body=None, form=None):
        headers = {"Accept": "application/json"}
        data = None
        if access_token:
            headers["Authorization"] = "Bearer " + access_token
        if form is not None:
            data = urllib.parse.urlencode(form).encode("utf-8")
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        elif body is not None:
            data = json.dumps(body, separators=(",", ":")).encode("utf-8")
            headers["Content-Type"] = "application/json"
        request = urllib.request.Request(
            KEYCLOAK_ADMIN_URL + path,
            data=data,
            headers=headers,
            method=method,
        )
        with urllib.request.urlopen(request, timeout=15, context=PUBLIC_SSL_CONTEXT) as response:
            raw = response.read().decode("utf-8")
            try:
                payload = json.loads(raw) if raw else {}
            except json.JSONDecodeError as error:
                raise RequestError(503, "identity provider returned an invalid response") from error
            return payload, response.headers


    def clear_keycloak_token_cache():
        with KEYCLOAK_TOKEN_LOCK:
            KEYCLOAK_TOKEN_CACHE["access_token"] = ""
            KEYCLOAK_TOKEN_CACHE["expires_at"] = 0.0


    def keycloak_admin_token(force_refresh=False):
        require_identity_management()
        now = time.time()
        with KEYCLOAK_TOKEN_LOCK:
            if (
                not force_refresh
                and KEYCLOAK_TOKEN_CACHE["access_token"]
                and KEYCLOAK_TOKEN_CACHE["expires_at"] > now + 15
            ):
                return KEYCLOAK_TOKEN_CACHE["access_token"]
            client_id, client_secret = keycloak_client_credentials()
            realm = urllib.parse.quote(KEYCLOAK_REALM, safe="")
            try:
                payload, _ = _keycloak_http_request(
                    "POST",
                    f"/realms/{realm}/protocol/openid-connect/token",
                    form={
                        "grant_type": "client_credentials",
                        "client_id": client_id,
                        "client_secret": client_secret,
                    },
                )
            except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as error:
                raise RequestError(503, "identity administration is unavailable") from error
            access_token = str(payload.get("access_token") or "")
            try:
                expires_in = max(1, int(payload.get("expires_in", 60)))
            except (TypeError, ValueError):
                expires_in = 60
            if not access_token:
                raise RequestError(503, "identity administration is unavailable")
            KEYCLOAK_TOKEN_CACHE["access_token"] = access_token
            KEYCLOAK_TOKEN_CACHE["expires_at"] = now + expires_in
            return access_token


    def _mapped_keycloak_error(error):
        if error.code == 400:
            return RequestError(400, "identity provider rejected the request")
        if error.code == 404:
            return RequestError(404, "user not found")
        if error.code == 409:
            return RequestError(409, "username or email already exists")
        if error.code == 413:
            return RequestError(413, "identity provider rejected the request size")
        if error.code == 429:
            return RequestError(503, "identity administration is temporarily rate limited")
        return RequestError(503, "identity administration is unavailable")


    def keycloak_admin_request(method, path, body=None):
        for attempt in range(2):
            access_token = keycloak_admin_token(force_refresh=attempt > 0)
            try:
                return _keycloak_http_request(method, path, access_token=access_token, body=body)
            except urllib.error.HTTPError as error:
                if error.code == 401 and attempt == 0:
                    clear_keycloak_token_cache()
                    continue
                raise _mapped_keycloak_error(error) from error
            except (urllib.error.URLError, TimeoutError) as error:
                raise RequestError(503, "identity administration is unavailable") from error
        raise RequestError(503, "identity administration is unavailable")


    def _user_path(user_id, suffix=""):
        if not USER_ID.fullmatch(str(user_id or "")):
            raise RequestError(400, "invalid user id")
        realm = urllib.parse.quote(KEYCLOAK_REALM, safe="")
        encoded_id = urllib.parse.quote(str(user_id), safe="")
        return f"/admin/realms/{realm}/users/{encoded_id}{suffix}"


    def _realm_path(suffix):
        realm = urllib.parse.quote(KEYCLOAK_REALM, safe="")
        return f"/admin/realms/{realm}{suffix}"


    def keycloak_user(user_id):
        payload, _ = keycloak_admin_request("GET", _user_path(user_id))
        if not isinstance(payload, dict) or not payload.get("id"):
            raise RequestError(404, "user not found")
        if is_service_account_user(payload):
            raise RequestError(404, "user not found")
        return payload


    def keycloak_user_roles(user_id, effective=False):
        suffix = "/role-mappings/realm/composite" if effective else "/role-mappings/realm"
        roles, _ = keycloak_admin_request("GET", _user_path(user_id, suffix))
        if not isinstance(roles, list):
            raise RequestError(503, "identity provider returned an invalid response")
        return roles


    def keycloak_user_groups(user_id):
        groups = []
        offset = 0
        batch_size = 100
        while offset < 10000:
            query = urllib.parse.urlencode({
                "briefRepresentation": "true",
                "first": offset,
                "max": batch_size,
            })
            page, _ = keycloak_admin_request(
                "GET",
                _user_path(user_id, "/groups?") + query,
            )
            if not isinstance(page, list):
                raise RequestError(503, "identity provider returned an invalid response")
            if any(not isinstance(group, dict) for group in page):
                raise RequestError(503, "identity provider returned an invalid response")
            groups.extend(page)
            if len(page) < batch_size:
                return groups
            offset += len(page)
        raise RequestError(503, "identity group membership could not be verified")


    def keycloak_federated_identities(user_id, user=None):
        included = (user or {}).get("federatedIdentities")
        if isinstance(included, list) and included:
            return included
        try:
            identities, _ = keycloak_admin_request("GET", _user_path(user_id, "/federated-identity"))
        except RequestError as error:
            if error.status == 404:
                return []
            raise
        return identities if isinstance(identities, list) else []


    def is_service_account_user(user):
        username = str((user or {}).get("username") or "").lower()
        return bool((user or {}).get("serviceAccountClientId")) or username.startswith("service-account-")


    def identity_source(user, fetch_links=True):
        if is_service_account_user(user):
            return "service-account", str(user.get("serviceAccountClientId"))
        identities = user.get("federatedIdentities")
        if fetch_links and not identities:
            identities = keycloak_federated_identities(user.get("id"), user)
        if isinstance(identities, list) and identities:
            provider = str((identities[0] or {}).get("identityProvider") or "external")
            return "brokered", provider
        if user.get("federationLink"):
            return "federated", str(user.get("federationLink"))
        return "local", "local"


    def attribute_value(user, name):
        value = ((user.get("attributes") or {}).get(name))
        if isinstance(value, list):
            return str(value[0]) if value else ""
        return str(value or "")


    def protected_user(user, direct_groups=None):
        account_type = attribute_value(user, "magicstick.accountType").strip().lower()
        explicitly_protected = attribute_value(user, "magicstick.protected").strip().lower()
        if account_type == "recovery" or explicitly_protected == "true":
            return True
        if direct_groups is None:
            user_id = str(user.get("id") or "")
            if not user_id:
                raise RequestError(503, "identity group membership could not be verified")
            direct_groups = keycloak_user_groups(user_id)
        return any(
            str(group.get("name") or "") == RECOVERY_GROUP_NAME
            and str(group.get("path") or "") == RECOVERY_GROUP_PATH
            for group in direct_groups
            if isinstance(group, dict)
        )


    def role_names(roles):
        return {str(role.get("name")) for role in roles if isinstance(role, dict) and role.get("name")}


    def access_level(roles):
        names = set(roles)
        if "magicstick-admin" in names:
            return "admin"
        if "magicstick-operator" in names:
            return "operator"
        if "magicstick-viewer" in names:
            return "viewer"
        return "user"


    def user_summary(user, actor_id):
        user_id = str(user.get("id") or "")
        if not user_id or is_service_account_user(user):
            raise RequestError(404, "user not found")
        all_direct = role_names(keycloak_user_roles(user_id, effective=False))
        all_effective = role_names(keycloak_user_roles(user_id, effective=True))
        direct = all_direct & MANAGED_REALM_ROLES
        effective = all_effective & MANAGED_REALM_ROLES
        source, provider = identity_source(user)
        is_self = user_id == actor_id
        is_protected = protected_user(user, keycloak_user_groups(user_id))
        is_local = source == "local"
        first_name = str(user.get("firstName") or "")
        last_name = str(user.get("lastName") or "")
        display_name = " ".join(part for part in (first_name, last_name) if part).strip()
        if not display_name:
            display_name = str(user.get("username") or "")
        return {
            "id": user_id,
            "username": str(user.get("username") or ""),
            "firstName": first_name,
            "lastName": last_name,
            "displayName": display_name,
            "email": str(user.get("email") or ""),
            "emailVerified": bool(user.get("emailVerified", False)),
            "enabled": bool(user.get("enabled", False)),
            "createdAt": user.get("createdTimestamp"),
            "source": source,
            "provider": provider,
            "directRoles": sorted(direct),
            "effectiveRoles": sorted(effective),
            "accessLevel": access_level(direct),
            "effectiveAccessLevel": access_level(effective),
            "capabilities": {
                "canEditProfile": is_local and not is_protected,
                "canManageRoles": not is_self and not is_protected,
                "canEnable": not bool(user.get("enabled", False)) and not is_self and not is_protected,
                "canDisable": bool(user.get("enabled", False)) and not is_self and not is_protected,
                "canResetPassword": is_local and not is_self and not is_protected,
                "canDelete": is_local and not is_self and not is_protected,
                "isSelf": is_self,
                "isProtected": is_protected,
            },
        }


    def live_admin_actor(principal):
        require_identity_management()
        subject = str((principal or {}).get("subject") or "")
        if not subject:
            raise AuthError(403, "administrator identity is unavailable")
        try:
            actor = keycloak_user(subject)
        except RequestError as error:
            if error.status == 404:
                raise AuthError(403, "administrator access has been revoked") from error
            raise
        effective_roles = role_names(keycloak_user_roles(subject, effective=True))
        if not actor.get("enabled") or "magicstick-admin" not in effective_roles:
            raise AuthError(403, "administrator access has been revoked")
        return actor


    def _all_human_users(search=""):
        users = []
        offset = 0
        batch_size = 100
        while offset < 10000:
            query = {"first": offset, "max": batch_size}
            if search:
                query["search"] = search
            page, _ = keycloak_admin_request(
                "GET",
                _realm_path("/users?") + urllib.parse.urlencode(query),
            )
            if not isinstance(page, list):
                raise RequestError(503, "identity provider returned an invalid response")
            users.extend(user for user in page if not is_service_account_user(user))
            if len(page) < batch_size:
                break
            offset += batch_size
        return users


    def parse_user_list_query(query):
        def integer(name, default, minimum, maximum):
            raw = (query.get(name) or [str(default)])[0]
            try:
                value = int(raw)
            except (TypeError, ValueError) as error:
                raise RequestError(400, f"{name} must be an integer") from error
            if value < minimum or value > maximum:
                raise RequestError(400, f"{name} must be between {minimum} and {maximum}")
            return value

        first = integer("first", 0, 0, 1000000)
        maximum = integer("max", 50, 1, MAX_USERS_PAGE_SIZE)
        search = str((query.get("search") or [""])[0]).strip()
        if len(search) > MAX_USER_SEARCH_LENGTH:
            raise RequestError(400, "search is too long")
        return first, maximum, search


    def _keycloak_raw_user_page(first, maximum, search=""):
        query = {"first": first, "max": maximum}
        if search:
            query["search"] = search
        page, _ = keycloak_admin_request(
            "GET",
            _realm_path("/users?") + urllib.parse.urlencode(query),
        )
        if not isinstance(page, list):
            raise RequestError(503, "identity provider returned an invalid response")
        return page


    def _keycloak_user_page(first, maximum, search=""):
        # Keycloak has no server-side predicate for excluding service accounts.
        # Walk only as far as the requested human-user page so service accounts
        # cannot create empty pages or shift the public pagination cursor.
        users = []
        human_offset = 0
        raw_offset = 0
        batch_size = max(MAX_USERS_PAGE_SIZE, maximum)
        while len(users) < maximum and raw_offset < 10000:
            page = _keycloak_raw_user_page(raw_offset, batch_size, search)
            for user in page:
                if is_service_account_user(user):
                    continue
                if human_offset < first:
                    human_offset += 1
                    continue
                users.append(user)
                human_offset += 1
                if len(users) == maximum:
                    break
            if len(page) < batch_size:
                break
            raw_offset += len(page)
        return users


    def _matching_service_account_count(search=""):
        lookup = search or "service-account-"
        count = 0
        raw_offset = 0
        batch_size = MAX_USERS_PAGE_SIZE
        while raw_offset < 10000:
            page = _keycloak_raw_user_page(raw_offset, batch_size, lookup)
            count += sum(1 for user in page if is_service_account_user(user))
            if len(page) < batch_size:
                break
            raw_offset += len(page)
        return count


    def _keycloak_user_count(search=""):
        query = urllib.parse.urlencode({"search": search}) if search else ""
        suffix = "/users/count" + (("?" + query) if query else "")
        count, _ = keycloak_admin_request("GET", _realm_path(suffix))
        try:
            total = max(0, int(count))
        except (TypeError, ValueError) as error:
            raise RequestError(503, "identity provider returned an invalid response") from error
        return max(0, total - _matching_service_account_count(search))


    def list_users(principal, query):
        actor = live_admin_actor(principal)
        first, maximum, search = parse_user_list_query(query)
        users = _keycloak_user_page(first, maximum, search)
        return {
            "users": [user_summary(user, actor["id"]) for user in users],
            "total": _keycloak_user_count(search),
            "first": first,
            "max": maximum,
        }


    def _kubernetes_access_group(name):
        if name not in KUBERNETES_ACCESS_GROUPS.values():
            raise RequestError(400, "unsupported Kubernetes access group")
        query = urllib.parse.urlencode({
            "search": name,
            "exact": "true",
            "briefRepresentation": "true",
        })
        groups, _ = keycloak_admin_request("GET", _realm_path("/groups?") + query)
        matches = [
            group for group in (groups if isinstance(groups, list) else [])
            if isinstance(group, dict)
            and str(group.get("name") or "") == name
            and str(group.get("path") or "") == "/" + name
            and group.get("id")
        ]
        if len(matches) != 1:
            raise RequestError(503, "Kubernetes access groups are not configured")
        return matches[0]


    def _direct_kubernetes_groups(user_id):
        managed = set(KUBERNETES_ACCESS_GROUPS.values())
        return {
            str(group.get("name")): group
            for group in keycloak_user_groups(user_id)
            if isinstance(group, dict)
            and str(group.get("name") or "") in managed
            and str(group.get("path") or "") == "/" + str(group.get("name") or "")
        }


    def kubernetes_access_level(groups):
        names = set(groups)
        for level in ("admin", "operator", "viewer"):
            if KUBERNETES_ACCESS_GROUPS[level] in names:
                return level
        return "none"


    def _kubernetes_user_summary(user):
        user_id = str(user.get("id") or "")
        if not user_id or is_service_account_user(user):
            raise RequestError(404, "user not found")
        groups = _direct_kubernetes_groups(user_id)
        source, provider = identity_source(user)
        first_name = str(user.get("firstName") or "")
        last_name = str(user.get("lastName") or "")
        display_name = " ".join(part for part in (first_name, last_name) if part).strip()
        return {
            "id": user_id,
            "username": str(user.get("username") or ""),
            "displayName": display_name or str(user.get("username") or ""),
            "email": str(user.get("email") or ""),
            "enabled": bool(user.get("enabled", False)),
            "source": source,
            "provider": provider,
            "accessLevel": kubernetes_access_level(groups),
            "protected": protected_user(user),
        }


    def _safe_https_endpoint(value):
        if not value or any(ord(character) <= 32 or ord(character) == 127 for character in value):
            return False
        parsed = urllib.parse.urlsplit(value)
        try:
            parsed.port
        except ValueError:
            return False
        return (
            parsed.scheme == "https"
            and bool(parsed.hostname)
            and parsed.username is None
            and parsed.password is None
            and parsed.path in ("", "/")
            and not parsed.query
            and not parsed.fragment
        )


    def _appliance_api_server_endpoint(api_server, current_mdns_domain):
        """Prefer a current control-plane IP when the marker still uses mDNS."""
        if not _safe_https_endpoint(api_server):
            return api_server
        parsed = urllib.parse.urlsplit(api_server)
        if parsed.hostname != current_mdns_domain:
            return api_server
        try:
            nodes = list_resource("/api/v1/nodes")
        except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, TypeError, ValueError):
            return api_server

        def node_rank(node):
            metadata = node.get("metadata") or {}
            labels = metadata.get("labels") or {}
            control_plane = any(
                key in labels
                for key in ("node-role.kubernetes.io/control-plane", "node-role.kubernetes.io/master")
            )
            ready = any(
                condition.get("type") == "Ready" and condition.get("status") == "True"
                for condition in ((node.get("status") or {}).get("conditions") or [])
            )
            return (0 if control_plane else 1, 0 if ready else 1, str(metadata.get("name") or ""))

        for node in sorted(nodes, key=node_rank):
            ready = any(
                condition.get("type") == "Ready" and condition.get("status") == "True"
                for condition in ((node.get("status") or {}).get("conditions") or [])
            )
            if not ready:
                continue
            for address in ((node.get("status") or {}).get("addresses") or []):
                if address.get("type") != "InternalIP":
                    continue
                try:
                    candidate = ipaddress.ip_address(str(address.get("address") or ""))
                except ValueError:
                    continue
                if (
                    not candidate.is_private
                    or candidate.is_link_local
                    or candidate.is_loopback
                    or candidate.is_multicast
                    or candidate.is_unspecified
                ):
                    continue
                host = "[" + candidate.compressed + "]" if candidate.version == 6 else candidate.compressed
                return "https://" + host + ":" + str(parsed.port or 443)
        return api_server


    def kubernetes_access_info(required=False):
        path = (
            f"/api/v1/namespaces/{urllib.parse.quote(KUBERNETES_ACCESS_INFO_NAMESPACE, safe='')}"
            f"/configmaps/{urllib.parse.quote(KUBERNETES_ACCESS_INFO_NAME, safe='')}"
        )
        try:
            resource = request_json("GET", path)
        except urllib.error.HTTPError as error:
            if error.code == 404 and not required:
                return {"configured": False}
            if error.code == 404:
                raise RequestError(409, "Kubernetes SSO access is not configured on this cluster") from error
            raise
        data = resource.get("data") or {}
        enabled = str(data.get("enabled") or "").lower() == "true"
        issuer_url = str(data.get("issuer-url") or "").strip().rstrip("/")
        client_id = str(data.get("client-id") or "").strip()
        api_server = str(data.get("api-server") or "").strip().rstrip("/")
        oidc_ca = str(data.get("oidc-ca.crt") or "").strip() + "\n"
        try:
            current_mdns_domain = normalize_hostname(
                settings_response().get("mdnsDomain") or DEFAULT_MDNS_DOMAIN,
                "mDNS domain",
            )
        except ValueError:
            current_mdns_domain = ""
        expected_issuer_url = f"https://id.{current_mdns_domain}/realms/magicstick"
        api_server = _appliance_api_server_endpoint(api_server, current_mdns_domain)
        valid = (
            enabled
            and current_mdns_domain.endswith(".local")
            and issuer_url == expected_issuer_url
            and client_id == KUBERNETES_OIDC_CLIENT_ID
            and _safe_https_endpoint(api_server)
            and "-----BEGIN CERTIFICATE-----" in oidc_ca
            and "PRIVATE KEY" not in oidc_ca
        )
        if not valid:
            if required:
                raise RequestError(409, "Kubernetes SSO access is not configured on this cluster")
            return {"configured": False}
        return {
            "configured": True,
            "issuerUrl": issuer_url,
            "clientId": client_id,
            "apiServer": api_server,
            "oidcCa": oidc_ca,
        }


    def list_kubernetes_access(principal, query):
        live_admin_actor(principal)
        first, maximum, search = parse_user_list_query(query)
        users = _keycloak_user_page(first, maximum, search)
        info = kubernetes_access_info(required=False)
        return {
            "users": [_kubernetes_user_summary(user) for user in users],
            "total": _keycloak_user_count(search),
            "first": first,
            "max": maximum,
            "configuration": {
                "configured": bool(info.get("configured")),
                "issuerUrl": str(info.get("issuerUrl") or ""),
                "clientId": str(info.get("clientId") or KUBERNETES_OIDC_CLIENT_ID),
                "apiServer": str(info.get("apiServer") or ""),
                "credentialPlugin": "kubectl oidc-login",
            },
        }


    def _replace_kubernetes_access_groups(user_id, desired_level):
        if desired_level not in KUBERNETES_ACCESS_LEVELS:
            raise RequestError(400, "accessLevel must be none, viewer, operator, or admin")
        original = _direct_kubernetes_groups(user_id)
        desired_name = KUBERNETES_ACCESS_GROUPS.get(desired_level)
        desired_group = _kubernetes_access_group(desired_name) if desired_name else None
        desired = {str(desired_group["name"]): desired_group} if desired_group else {}
        try:
            for name, group in original.items():
                if name not in desired:
                    keycloak_admin_request("DELETE", _user_path(user_id, "/groups/" + urllib.parse.quote(str(group["id"]), safe="")))
            for name, group in desired.items():
                if name not in original:
                    keycloak_admin_request("PUT", _user_path(user_id, "/groups/" + urllib.parse.quote(str(group["id"]), safe="")), {})
            assigned = _direct_kubernetes_groups(user_id)
            if set(assigned) != set(desired):
                raise RequestError(503, "Kubernetes access update could not be verified")
        except Exception:
            try:
                current = _direct_kubernetes_groups(user_id)
                for name, group in current.items():
                    if name not in original:
                        keycloak_admin_request("DELETE", _user_path(user_id, "/groups/" + urllib.parse.quote(str(group["id"]), safe="")))
                for name, group in original.items():
                    if name not in current:
                        keycloak_admin_request("PUT", _user_path(user_id, "/groups/" + urllib.parse.quote(str(group["id"]), safe="")), {})
            except Exception:
                pass
            raise


    def audit_kubernetes_access(principal, action, target, result, request_id, status=None):
        event = {
            "event": "magicstick.kubernetes-access",
            "requestId": str(request_id or "")[:128],
            "actorId": str((principal or {}).get("subject") or "")[:160],
            "actorUsername": str((principal or {}).get("username") or "")[:128],
            "target": str(target or "")[:160],
            "action": str(action or "")[:64],
            "result": result,
        }
        if status is not None:
            event["status"] = int(status)
        print(json.dumps(event, separators=(",", ":"), sort_keys=True), flush=True)


    def update_kubernetes_access(principal, user_id, payload, request_id=""):
        _reject_unknown_fields(payload, {"accessLevel"})
        level = _clean_text(payload, "accessLevel", 16, required=True)
        if level not in KUBERNETES_ACCESS_LEVELS:
            raise RequestError(400, "accessLevel must be none, viewer, operator, or admin")
        with KUBERNETES_ACCESS_LOCK:
            live_admin_actor(principal)
            try:
                target = keycloak_user(user_id)
                if protected_user(target):
                    raise RequestError(409, "protected recovery access cannot be changed")
                if level != "none" and not target.get("enabled"):
                    raise RequestError(409, "enable the user before granting Kubernetes access")
                before = kubernetes_access_level(_direct_kubernetes_groups(user_id))
                _replace_kubernetes_access_groups(user_id, level)
                if before != level:
                    _logout_user(user_id)
                result = _kubernetes_user_summary(keycloak_user(user_id))
            except Exception as error:
                audit_kubernetes_access(
                    principal,
                    "update-access",
                    user_id,
                    "failure",
                    request_id,
                    getattr(error, "status", 500),
                )
                raise
            audit_kubernetes_access(principal, "update-access", user_id, "success", request_id, 200)
            return result


    def _base64_file(path):
        try:
            with open(path, "rb") as source:
                content = source.read()
        except OSError as error:
            raise RequestError(503, "Kubernetes cluster CA is unavailable") from error
        if not content:
            raise RequestError(503, "Kubernetes cluster CA is unavailable")
        return base64.b64encode(content).decode("ascii")


    def _yaml_scalar(value):
        return json.dumps(str(value), ensure_ascii=False)


    def kubernetes_access_kubeconfig(principal, user_id, request_id=""):
        live_admin_actor(principal)
        try:
            target = keycloak_user(user_id)
            summary = _kubernetes_user_summary(target)
            if not summary["enabled"]:
                raise RequestError(409, "disabled users cannot receive a kubeconfig")
            if summary["accessLevel"] == "none":
                raise RequestError(409, "grant Kubernetes access before downloading a kubeconfig")
            info = kubernetes_access_info(required=True)
            username = summary["username"] or "user"
            safe_username = re.sub(r"[^A-Za-z0-9._-]+", "-", username).strip("-._") or "user"
            cluster_name = "magicstick"
            user_name = safe_username + "@magicstick"
            context_name = user_name + "@" + cluster_name
            oidc_ca_data = base64.b64encode(info["oidcCa"].encode("utf-8")).decode("ascii")
            content = "\n".join([
                "apiVersion: v1",
                "kind: Config",
                "preferences: {}",
                "clusters:",
                "  - name: " + _yaml_scalar(cluster_name),
                "    cluster:",
                "      server: " + _yaml_scalar(info["apiServer"]),
                "      certificate-authority-data: " + _yaml_scalar(_base64_file(SA_CA_PATH)),
                "users:",
                "  - name: " + _yaml_scalar(user_name),
                "    user:",
                "      exec:",
                "        apiVersion: client.authentication.k8s.io/v1",
                "        command: kubectl",
                "        interactiveMode: IfAvailable",
                "        provideClusterInfo: false",
                "        installHint: Install kubelogin from https://github.com/int128/kubelogin and ensure kubectl-oidc_login is on PATH.",
                "        args:",
                "          - oidc-login",
                "          - get-token",
                "          - --oidc-issuer-url=" + info["issuerUrl"],
                "          - --oidc-client-id=" + info["clientId"],
                "          - --oidc-pkce-method=S256",
                "          - --certificate-authority-data=" + oidc_ca_data,
                "          - --token-cache-storage=keyring",
                "contexts:",
                "  - name: " + _yaml_scalar(context_name),
                "    context:",
                "      cluster: " + _yaml_scalar(cluster_name),
                "      user: " + _yaml_scalar(user_name),
                "current-context: " + _yaml_scalar(context_name),
                "",
            ])
        except Exception as error:
            audit_kubernetes_access(
                principal,
                "download-kubeconfig",
                user_id,
                "failure",
                request_id,
                getattr(error, "status", 500),
            )
            raise
        audit_kubernetes_access(principal, "download-kubeconfig", user_id, "success", request_id, 200)
        return {
            "filename": "magicstick-" + safe_username + ".kubeconfig",
            "content": content,
            "accessLevel": summary["accessLevel"],
        }


    def get_user(principal, user_id):
        actor = live_admin_actor(principal)
        return user_summary(keycloak_user(user_id), actor["id"])


    def _reject_unknown_fields(payload, allowed):
        unknown = sorted(set(payload) - set(allowed))
        if unknown:
            raise RequestError(400, "unsupported field: " + unknown[0])


    def _clean_text(payload, name, maximum, required=False):
        if name not in payload:
            if required:
                raise RequestError(400, name + " is required")
            return None
        value = payload.get(name)
        if not isinstance(value, str):
            raise RequestError(400, name + " must be a string")
        value = value.strip()
        if required and not value:
            raise RequestError(400, name + " is required")
        if len(value) > maximum or any(ord(character) < 32 for character in value):
            raise RequestError(400, name + " is invalid")
        return value


    def _validated_access_level(payload):
        level = _clean_text(payload, "accessLevel", 16, required=True)
        if level not in ACCESS_LEVEL_ROLES:
            raise RequestError(400, "accessLevel must be user, viewer, operator, or admin")
        return level


    def _validated_password(payload):
        password = payload.get("password")
        if not isinstance(password, str):
            raise RequestError(400, "password must be a string")
        if len(password) < 12:
            raise RequestError(400, "password must contain at least 12 characters")
        if len(password) > 1024 or any(ord(character) < 32 for character in password):
            raise RequestError(400, "password is invalid")
        temporary = payload.get("temporary", True)
        if temporary is not True:
            raise RequestError(400, "temporary must be true")
        return password


    def _validated_email(payload, required=False):
        email = _clean_text(payload, "email", 254, required=required)
        if email and not EMAIL.fullmatch(email):
            raise RequestError(400, "email is invalid")
        return email


    def _exact_user_matches(field, value):
        query = urllib.parse.urlencode({field: value, "exact": "true", "first": 0, "max": 2})
        users, _ = keycloak_admin_request("GET", _realm_path("/users?") + query)
        if not isinstance(users, list):
            raise RequestError(503, "identity provider returned an invalid response")
        return [user for user in users if not is_service_account_user(user)]


    def _realm_role(role_name):
        encoded = urllib.parse.quote(role_name, safe="")
        role, _ = keycloak_admin_request("GET", _realm_path("/roles/") + encoded)
        if not isinstance(role, dict) or not role.get("id"):
            raise RequestError(503, "identity roles are not configured")
        return role


    def _replace_managed_roles(user_id, desired_names):
        desired_names = set(desired_names)
        if not desired_names.issubset(MANAGED_REALM_ROLES):
            raise RequestError(400, "unsupported role")
        original = keycloak_user_roles(user_id, effective=False)
        original_by_name = {role.get("name"): role for role in original if role.get("name") in MANAGED_REALM_ROLES}
        add_names = desired_names - set(original_by_name)
        remove_names = set(original_by_name) - desired_names
        try:
            if add_names:
                additions = [_realm_role(name) for name in sorted(add_names)]
                keycloak_admin_request("POST", _user_path(user_id, "/role-mappings/realm"), additions)
            if remove_names:
                removals = [original_by_name[name] for name in sorted(remove_names)]
                keycloak_admin_request("DELETE", _user_path(user_id, "/role-mappings/realm"), removals)
            assigned = role_names(keycloak_user_roles(user_id, effective=False)) & MANAGED_REALM_ROLES
            if assigned != desired_names:
                raise RequestError(503, "identity role update could not be verified")
        except Exception:
            try:
                current = keycloak_user_roles(user_id, effective=False)
                current_by_name = {role.get("name"): role for role in current if role.get("name") in MANAGED_REALM_ROLES}
                restore_add = set(original_by_name) - set(current_by_name)
                restore_remove = set(current_by_name) - set(original_by_name)
                if restore_add:
                    keycloak_admin_request(
                        "POST",
                        _user_path(user_id, "/role-mappings/realm"),
                        [original_by_name[name] for name in sorted(restore_add)],
                    )
                if restore_remove:
                    keycloak_admin_request(
                        "DELETE",
                        _user_path(user_id, "/role-mappings/realm"),
                        [current_by_name[name] for name in sorted(restore_remove)],
                    )
            except Exception:
                pass
            raise


    def _logout_user(user_id):
        try:
            keycloak_admin_request("POST", _user_path(user_id, "/logout"))
        except RequestError as error:
            if error.status != 404:
                raise


    def _enabled_admin_counts(excluding_user_id):
        administrators = 0
        local_administrators = 0
        for candidate in _all_human_users():
            candidate_id = str(candidate.get("id") or "")
            if not candidate_id or candidate_id == excluding_user_id or not candidate.get("enabled"):
                continue
            effective = role_names(keycloak_user_roles(candidate_id, effective=True))
            if "magicstick-admin" not in effective:
                continue
            administrators += 1
            detailed = keycloak_user(candidate_id)
            source, _ = identity_source(detailed)
            if source == "local":
                local_administrators += 1
        return administrators, local_administrators


    def _ensure_admins_survive(target):
        if not target.get("enabled"):
            return
        effective = role_names(keycloak_user_roles(target["id"], effective=True))
        if "magicstick-admin" not in effective:
            return
        administrators, local_administrators = _enabled_admin_counts(target["id"])
        if administrators < 1:
            raise RequestError(409, "the last enabled administrator cannot be changed")
        source, _ = identity_source(target)
        if source == "local" and local_administrators < 1:
            raise RequestError(409, "the last enabled local administrator cannot be changed")


    def audit_user_action(principal, action, target, result, request_id, status=None):
        event = {
            "event": "magicstick.user-admin",
            "requestId": str(request_id or "")[:128],
            "actorId": str((principal or {}).get("subject") or "")[:160],
            "actorUsername": str((principal or {}).get("username") or "")[:128],
            "target": str(target or "")[:160],
            "action": action,
            "result": result,
        }
        if status is not None:
            event["status"] = int(status)
        print(json.dumps(event, separators=(",", ":"), sort_keys=True), flush=True)


    def _audit_failure(principal, action, target, request_id, error):
        status = getattr(error, "status", 500)
        audit_user_action(principal, action, target, "failure", request_id, status)


    def create_user(principal, payload, request_id=""):
        _reject_unknown_fields(
            payload,
            {"username", "firstName", "lastName", "email", "enabled", "accessLevel", "password", "temporary"},
        )
        username = _clean_text(payload, "username", 128, required=True)
        if not USERNAME.fullmatch(username):
            raise RequestError(400, "username is invalid")
        first_name = _clean_text(payload, "firstName", 128) or ""
        last_name = _clean_text(payload, "lastName", 128) or ""
        email = _validated_email(payload, required=True)
        level = _validated_access_level(payload)
        password = _validated_password(payload)
        enabled = payload.get("enabled", True)
        if not isinstance(enabled, bool):
            raise RequestError(400, "enabled must be a boolean")
        with USER_MUTATION_LOCK:
            live_admin_actor(principal)
            user_id = ""
            try:
                if _exact_user_matches("username", username) or _exact_user_matches("email", email):
                    raise RequestError(409, "username or email already exists")
                _, headers = keycloak_admin_request("POST", _realm_path("/users"), {
                    "username": username,
                    "enabled": False,
                    "firstName": first_name,
                    "lastName": last_name,
                    "email": email,
                    "emailVerified": False,
                })
                user_id = str(headers.get("Location", "")).rstrip("/").split("/")[-1]
                if not user_id:
                    matches = _exact_user_matches("username", username)
                    if len(matches) != 1:
                        raise RequestError(503, "created user could not be resolved")
                    user_id = str(matches[0]["id"])
                keycloak_admin_request("PUT", _user_path(user_id, "/reset-password"), {
                    "type": "password",
                    "value": password,
                    "temporary": True,
                })
                _replace_managed_roles(user_id, ACCESS_LEVEL_ROLES[level])
                if enabled:
                    keycloak_admin_request("PUT", _user_path(user_id), {"enabled": True})
                result = user_summary(keycloak_user(user_id), str(principal.get("subject") or ""))
            except Exception as error:
                if user_id:
                    try:
                        keycloak_admin_request("DELETE", _user_path(user_id))
                    except Exception:
                        try:
                            keycloak_admin_request("PUT", _user_path(user_id), {"enabled": False})
                        except Exception:
                            pass
                _audit_failure(principal, "create", username, request_id, error)
                raise
            audit_user_action(principal, "create", user_id, "success", request_id, 201)
            return result


    def update_user_profile(principal, user_id, payload, request_id=""):
        _reject_unknown_fields(payload, {"firstName", "lastName", "email"})
        if not payload:
            raise RequestError(400, "at least one profile field is required")
        updates = {}
        for field in ("firstName", "lastName"):
            value = _clean_text(payload, field, 128)
            if value is not None:
                updates[field] = value
        if "email" in payload:
            updates["email"] = _validated_email(payload, required=True)
            updates["emailVerified"] = False
        with USER_MUTATION_LOCK:
            live_admin_actor(principal)
            try:
                target = keycloak_user(user_id)
                source, _ = identity_source(target)
                if source != "local":
                    raise RequestError(409, "profile fields are managed by the external identity provider")
                if protected_user(target):
                    raise RequestError(409, "protected recovery users cannot be edited")
                body = {
                    "username": target.get("username"),
                    "enabled": bool(target.get("enabled")),
                    "emailVerified": bool(target.get("emailVerified")),
                    "firstName": str(target.get("firstName") or ""),
                    "lastName": str(target.get("lastName") or ""),
                    "email": str(target.get("email") or ""),
                    "attributes": target.get("attributes") or {},
                }
                body.update(updates)
                keycloak_admin_request("PUT", _user_path(user_id), body)
                result = user_summary(keycloak_user(user_id), str(principal.get("subject") or ""))
            except Exception as error:
                _audit_failure(principal, "update-profile", user_id, request_id, error)
                raise
            audit_user_action(principal, "update-profile", user_id, "success", request_id, 200)
            return result


    def update_user_roles(principal, user_id, payload, request_id=""):
        _reject_unknown_fields(payload, {"accessLevel"})
        level = _validated_access_level(payload)
        desired = ACCESS_LEVEL_ROLES[level]
        with USER_MUTATION_LOCK:
            live_admin_actor(principal)
            try:
                target = keycloak_user(user_id)
                if user_id == str(principal.get("subject") or "") and "magicstick-admin" not in desired:
                    raise RequestError(409, "you cannot remove your own administrator access")
                direct = role_names(keycloak_user_roles(user_id, effective=False))
                effective = role_names(keycloak_user_roles(user_id, effective=True))
                if protected_user(target):
                    raise RequestError(409, "protected recovery access cannot be changed")
                inherited_admin = "magicstick-admin" in effective and "magicstick-admin" not in direct
                if "magicstick-admin" in effective and "magicstick-admin" not in desired and not inherited_admin:
                    _ensure_admins_survive(target)
                before = direct & MANAGED_REALM_ROLES
                _replace_managed_roles(user_id, desired)
                if before != desired:
                    _logout_user(user_id)
                result = user_summary(keycloak_user(user_id), str(principal.get("subject") or ""))
            except Exception as error:
                _audit_failure(principal, "update-roles", user_id, request_id, error)
                raise
            audit_user_action(principal, "update-roles", user_id, "success", request_id, 200)
            return result


    def set_user_enabled(principal, user_id, enabled, request_id=""):
        action = "enable" if enabled else "disable"
        with USER_MUTATION_LOCK:
            live_admin_actor(principal)
            try:
                target = keycloak_user(user_id)
                if protected_user(target):
                    raise RequestError(409, "protected recovery users cannot be enabled or disabled")
                if not enabled:
                    if user_id == str(principal.get("subject") or ""):
                        raise RequestError(409, "you cannot disable your own account")
                    _ensure_admins_survive(target)
                if bool(target.get("enabled")) != enabled:
                    keycloak_admin_request("PUT", _user_path(user_id), {"enabled": enabled})
                    if not enabled:
                        _logout_user(user_id)
                result = user_summary(keycloak_user(user_id), str(principal.get("subject") or ""))
            except Exception as error:
                _audit_failure(principal, action, user_id, request_id, error)
                raise
            audit_user_action(principal, action, user_id, "success", request_id, 200)
            return result


    def reset_user_password(principal, user_id, payload, request_id=""):
        _reject_unknown_fields(payload, {"password", "temporary"})
        password = _validated_password(payload)
        with USER_MUTATION_LOCK:
            live_admin_actor(principal)
            try:
                target = keycloak_user(user_id)
                if user_id == str(principal.get("subject") or ""):
                    raise RequestError(409, "use the account page to change your own password")
                source, _ = identity_source(target)
