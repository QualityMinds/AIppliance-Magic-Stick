    def normalize_local_engine(value):
        normalized = str(value or "VLLM").strip().upper()
        if normalized == "VLLM":
            return "VLLM"
        if normalized == "OLLAMA":
            return "OLlama"
        raise RequestError(400, "unsupported local engine: " + str(value))


    def resolve_local_preset_artifact(local):
        preset_name = str((local or {}).get("preset") or "").strip()
        requested_artifact = str((local or {}).get("artifact") or "").strip()
        if not preset_name:
            if requested_artifact:
                raise ValueError("local.artifact requires local.preset")
            return None
        preset = (model_presets().get(preset_name) or {})
        if not preset:
            raise ValueError("unknown local model preset: " + preset_name)
        variants = preset.get("variants") or []
        if not variants:
            if requested_artifact:
                raise ValueError("unknown local model artifact " + requested_artifact + " for legacy preset " + preset_name)
            return None
        engine = normalize_local_engine(local.get("engine"))
        compute_target = str(local.get("computeTarget") or "nvidia-gpu").strip().lower()
        candidates = [
            variant for variant in variants
            if str(variant.get("computeTarget") or "").strip().lower() == compute_target
            and normalize_local_engine(variant.get("engine")) == engine
        ]
        if len(candidates) != 1:
            raise ValueError(
                "preset " + preset_name + " has no unique " + engine + "/" + compute_target + " variant"
            )
        variant = candidates[0]
        artifacts = variant.get("artifacts") or []
        if not artifacts:
            if requested_artifact:
                raise ValueError("unknown local model artifact " + requested_artifact + " for legacy preset " + preset_name)
            return None
        artifact_definitions = {
            str(artifact.get("id") or "").strip(): artifact
            for artifact in artifacts
            if isinstance(artifact, dict) and str(artifact.get("id") or "").strip()
        }
        selected_id = requested_artifact or str(variant.get("defaultArtifact") or "").strip()
        selected = artifact_definitions.get(selected_id)
        if not selected:
            raise ValueError(
                "unknown local model artifact " + str(selected_id or "<none>")
                + " for preset " + preset_name + " " + engine + "/" + compute_target
            )
        expected_url = str(selected.get("url") or "").strip()
        legacy_variant_url = str(variant.get("url") or "").strip()
        supplied_url = str(local.get("url") or "").strip()
        if supplied_url and supplied_url not in {expected_url, legacy_variant_url}:
            raise ValueError("local.url is controlled by the selected preset artifact")
        local["artifact"] = selected_id
        local.pop("url", None)
        return selected


    def target_engine_profile(definition, engine):
        engine = normalize_local_engine(engine)
        profile = (definition.get("engineProfiles") or {}).get(engine)
        if isinstance(profile, dict):
            return profile
        if engine == "VLLM":
            return {
                "defaultResourceProfile": definition.get("defaultResourceProfile"),
                "resourceProfilesByResource": definition.get("resourceProfilesByResource") or {},
            }
        return {}


    def ready_schedulable_nodes():
        result = []
        for node in list_resource("/api/v1/nodes"):
            spec = node.get("spec") or {}
            if spec.get("unschedulable") is True:
                continue
            ready = any(
                condition.get("type") == "Ready" and condition.get("status") == "True"
                for condition in ((node.get("status") or {}).get("conditions") or [])
            )
            if ready:
                result.append(node)
        return result


    def resource_quantity(value):
        raw = str(value or "0").strip()
        match = re.fullmatch(r"(\d+)([EPTGMK]i?|m)?", raw)
        if not match:
            return 0
        number = int(match.group(1))
        suffix = match.group(2) or ""
        if suffix == "m":
            return number / 1000
        powers = {"K": 10**3, "M": 10**6, "G": 10**9, "T": 10**12, "P": 10**15, "E": 10**18,
                  "Ki": 2**10, "Mi": 2**20, "Gi": 2**30, "Ti": 2**40, "Pi": 2**50, "Ei": 2**60}
        return number * powers.get(suffix, 1)


    def compute_target_availability(modules_payload=None):
        catalog = compute_target_catalog()
        definitions = catalog.get("targets") or {}
        modules_payload = modules_payload if modules_payload is not None else summarized_modules()
        nodes = ready_schedulable_nodes()
        result = []
        for target_id, definition in definitions.items():
            if not isinstance(definition, dict):
                continue
            architectures = {str(item) for item in (definition.get("architectures") or [])}
            node_selector = {
                str(key): str(value)
                for key, value in (definition.get("nodeSelector") or {}).items()
            }
            matching_nodes = [
                node for node in nodes
                if not architectures
                or str(((node.get("status") or {}).get("nodeInfo") or {}).get("architecture") or "") in architectures
            ]
            matching_nodes = [
                node for node in matching_nodes
                if all(
                    str(((node.get("metadata") or {}).get("labels") or {}).get(key) or "") == value
                    for key, value in node_selector.items()
                )
            ]
            required_capabilities = [str(item) for item in (definition.get("requiredCapabilities") or [])]
            resource_names = [str(item) for item in (definition.get("resourceNames") or [])]
            engines = [normalize_local_engine(item) for item in (definition.get("engines") or [])]
            selected_resource_name = ""
            resolved_resource_profile = str(definition.get("defaultResourceProfile") or "")
            available = bool(matching_nodes)
            reason = "ready" if available else "no-compatible-node"
            message = "Ready on " + str(len(matching_nodes)) + " compatible node(s)." if available else "No Ready, schedulable node has a supported architecture."
            pending_provider = None

            for capability in required_capabilities:
                providers = sorted(
                    name
                    for name, module in ((modules_payload or {}).get("modules") or {}).items()
                    if capability in (((module.get("catalog") or {}).get("providesCapabilities")) or [])
                )
                if not providers:
                    available = False
                    reason = "capability-provider-missing"
                    message = "No installed module provides " + capability + "."
                    break
                provider_name = providers[0]
                provider = module_state(modules_payload, provider_name)
                provider_status = provider.get("status") or {}
                provider_phase = str(provider_status.get("phase") or "").strip()
                if provider.get("enabled") is not True:
                    available = False
                    reason = "capability-module-disabled"
                    message = "Install the " + str(provider.get("displayName") or provider_name) + " module before selecting this target."
                    break
                if provider_phase.lower() != "ready":
                    # Flux can temporarily report Reconciling while the vendor
                    # device plugin already publishes a schedulable resource.
                    # Keep the phase as a diagnostic fallback and let the
                    # allocatable resource below be the authoritative runtime
                    # readiness signal for accelerator-backed targets.
                    pending_provider = {
                        "displayName": str(provider.get("displayName") or provider_name),
                        "phase": provider_phase or "Pending",
                    }

            if available and pending_provider and not resource_names:
                available = False
                reason = "capability-module-not-ready"
                message = (
                    "The " + pending_provider["displayName"] + " module is "
                    + pending_provider["phase"] + ". Wait until it is Ready."
                )

            if available and resource_names:
                capacities = {}
                for resource_name in resource_names:
                    capacities[resource_name] = sum(
                        resource_quantity(((node.get("status") or {}).get("allocatable") or {}).get(resource_name))
                        for node in matching_nodes
                    )
                selected_resource_name = next(
                    (resource_name for resource_name in resource_names if capacities.get(resource_name, 0) >= 1),
                    "",
                )
                capacity = capacities.get(selected_resource_name, 0)
                if capacity < 1:
                    available = False
                    if pending_provider:
                        reason = "capability-module-not-ready"
                        message = (
                            "The " + pending_provider["displayName"] + " module is "
                            + pending_provider["phase"] + " and Kubernetes reports no allocatable resource yet."
                        )
                    else:
                        reason = "no-allocatable-resource"
                        label = str(definition.get("displayName") or target_id)
                        message = "Kubernetes reports no allocatable resource for " + label + ". Check the hardware, driver, and device plugin."
                else:
                    available = True
                    reason = "ready"
                    message = str(int(capacity)) + " allocatable " + str(definition.get("displayName") or target_id) + " resource(s) available."

            resolved_resource_profiles = {}
            for engine in engines:
                engine_profile = target_engine_profile(definition, engine)
                per_resource = engine_profile.get("resourceProfilesByResource") or {}
                resolved_resource_profiles[engine] = str(
                    per_resource.get(selected_resource_name)
                    or engine_profile.get("defaultResourceProfile")
                    or ""
                )
            resolved_resource_profile = resolved_resource_profiles.get("VLLM", resolved_resource_profile)

            result.append({
                "id": target_id,
                "displayName": str(definition.get("displayName") or target_id),
                "kind": str(definition.get("kind") or ""),
                "vendor": str(definition.get("vendor") or ""),
                "engines": engines,
                "architectures": sorted(architectures),
                "nodeSelector": node_selector,
                "requiredCapabilities": required_capabilities,
                "resourceNames": resource_names,
                "selectedResourceName": selected_resource_name,
                "defaultResourceProfile": str(definition.get("defaultResourceProfile") or ""),
                "resolvedResourceProfile": resolved_resource_profile,
                "resolvedResourceProfiles": resolved_resource_profiles,
                "available": available,
                "reason": reason,
                "message": message,
                "compatibleNodes": len(matching_nodes),
            })
        result.sort(key=lambda item: (0 if item["id"] == "cpu" else 1, item["displayName"]))
        default_target = next((item["id"] for item in result if item["available"]), "")
        return {
            "schemaVersion": catalog.get("schemaVersion", 1),
            "default": default_target,
            "defaultEngine": "VLLM",
            "engineCatalog": catalog.get("engines") or {
                "VLLM": {"displayName": "vLLM", "urlScheme": "hf://", "supportsVramEstimate": True}
            },
            "targets": result,
        }


    def require_compute_target_available(compute_target, engine="VLLM"):
        engine = normalize_local_engine(engine)
        availability = compute_target_availability()
        target = next((item for item in availability["targets"] if item["id"] == compute_target), None)
        if not target:
            raise RequestError(400, "unsupported compute target: " + str(compute_target))
        if engine not in target.get("engines", []):
            raise RequestError(409, str(target.get("displayName") or compute_target) + " does not support " + engine + ".")
        if not target["available"]:
            raise RequestError(409, target["message"])
        return target


