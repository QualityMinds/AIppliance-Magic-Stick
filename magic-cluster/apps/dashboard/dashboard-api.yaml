            "namespace": MODEL_TARGET_NAMESPACE,
            "secretName": LITELLM_MASTER_KEY_SECRET_NAME,
            "credentials": fields,
        }


    def litellm_admin_request(method, path, body=None):
        data = None
        headers = {
            "Accept": "application/json",
            "Authorization": "Bearer " + litellm_master_key(),
        }
        if body is not None:
            data = json.dumps(body, separators=(",", ":")).encode("utf-8")
            headers["Content-Type"] = "application/json"
        request = urllib.request.Request(
            LITELLM_SERVICE_URL + path,
            data=data,
            headers=headers,
            method=method,
        )
        try:
            with urllib.request.urlopen(request, timeout=15) as response:
                raw = response.read().decode("utf-8")
        except urllib.error.HTTPError as error:
            error.read()
            if error.code in {400, 422}:
                raise RequestError(400, "LiteLLM rejected the API access request") from error
            if error.code == 404:
                raise RequestError(404, "API access not found") from error
            if error.code == 409:
                raise RequestError(409, "API access already exists") from error
            if error.code in {401, 403}:
                raise RequestError(503, "LiteLLM key management is not configured") from error
            raise RequestError(503, "LiteLLM key management is temporarily unavailable") from error
        except (urllib.error.URLError, TimeoutError) as error:
            raise RequestError(503, "LiteLLM key management is temporarily unavailable") from error
        try:
            payload = json.loads(raw) if raw.strip() else {}
        except json.JSONDecodeError as error:
            raise RequestError(503, "LiteLLM key management returned an invalid response") from error
        if not isinstance(payload, (dict, list)):
            raise RequestError(503, "LiteLLM key management returned an invalid response")
        return payload


    def api_access_metadata(value):
        if isinstance(value, dict):
            return value
        if isinstance(value, str) and value.strip():
            try:
                decoded = json.loads(value)
            except json.JSONDecodeError:
                return {}
            return decoded if isinstance(decoded, dict) else {}
        return {}


    def api_access_item(value):
        if not isinstance(value, dict):
            return None
        metadata = api_access_metadata(value.get("metadata"))
        if metadata.get("magicstick_source") != API_ACCESS_METADATA_SOURCE:
            return None
        token_id = str(value.get("token") or value.get("token_id") or "").strip()
        raw_key = str(value.get("key") or "").strip()
        if not token_id and raw_key:
            token_id = hashlib.sha256(raw_key.encode("utf-8")).hexdigest()
        if token_id.startswith("sk-"):
            token_id = hashlib.sha256(token_id.encode("utf-8")).hexdigest()
        if not token_id or not API_ACCESS_ID.fullmatch(token_id):
            return None
        name = str(metadata.get("magicstick_name") or value.get("key_alias") or "API access").strip()
        if not name:
            name = "API access"
        created_at = str(value.get("created_at") or value.get("createdAt") or "").strip()
        expires_at = str(
            value.get("expires")
            or value.get("expires_at")
            or value.get("key_expiry")
            or ""
        ).strip()
        return {
            "id": token_id,
            "name": name[:MAX_API_ACCESS_NAME_LENGTH],
            "keyHint": token_id[:10] + "..." + token_id[-6:],
            "createdAt": created_at,
            "expiresAt": expires_at,
            "status": "revoked" if bool(value.get("blocked")) else "active",
        }


    def list_api_access():
        items = []
        page = 1
        while page <= API_ACCESS_MAX_PAGES:
            query = urllib.parse.urlencode({
                "return_full_object": "true",
                "page": page,
                "size": API_ACCESS_PAGE_SIZE,
            })
            payload = litellm_admin_request("GET", "/key/list?" + query)
            if not isinstance(payload, dict):
                raise RequestError(503, "LiteLLM key management returned an invalid response")
            page_items = payload.get("keys") or []
            if not isinstance(page_items, list):
                raise RequestError(503, "LiteLLM key management returned an invalid response")
            for value in page_items:
                item = api_access_item(value)
                if item:
                    items.append(item)
            try:
                total_pages = max(1, int(payload.get("total_pages") or 1))
            except (TypeError, ValueError):
                total_pages = 1
            if page >= total_pages or len(page_items) < API_ACCESS_PAGE_SIZE:
                break
            page += 1
        items.sort(key=lambda item: (item.get("createdAt") or "", item.get("name") or ""), reverse=True)
        return {
            "items": items,
            "total": len(items),
            "apiBases": litellm_api_bases(),
        }


    def create_api_access(payload):
        _reject_unknown_fields(payload, {"name"})
        name = _clean_text(payload, "name", MAX_API_ACCESS_NAME_LENGTH, required=True)
        alias = "magicstick-" + dns_label_part(name, "access")[:40] + "-" + secrets.token_hex(4)
        request_body = {
            "key_alias": alias,
            "key_type": "llm_api",
            "models": [],
            "metadata": {
                "magicstick_source": API_ACCESS_METADATA_SOURCE,
                "magicstick_name": name,
            },
        }
        with API_ACCESS_LOCK:
            result = litellm_admin_request("POST", "/key/generate", request_body)
        if not isinstance(result, dict):
            raise RequestError(503, "LiteLLM key management returned an invalid response")
        key = str(result.get("key") or "").strip()
        if not key.startswith("sk-"):
            raise RequestError(503, "LiteLLM did not return a usable API key")
        normalized = dict(result)
        normalized.setdefault("key_alias", alias)
        normalized.setdefault("metadata", request_body["metadata"])
        item = api_access_item(normalized)
        if not item:
            token_id = hashlib.sha256(key.encode("utf-8")).hexdigest()
            item = {
                "id": token_id,
                "name": name,
                "keyHint": token_id[:10] + "..." + token_id[-6:],
                "createdAt": str(result.get("created_at") or result.get("createdAt") or ""),
                "expiresAt": "",
                "status": "active",
            }
        return {
            "item": item,
            "key": key,
            "apiBases": litellm_api_bases(),
        }


    def delete_api_access(token_id):
        token_id = urllib.parse.unquote(str(token_id or "")).strip()
        if not API_ACCESS_ID.fullmatch(token_id):
            raise RequestError(400, "API access id is invalid")
        current = list_api_access().get("items") or []
        item = next((candidate for candidate in current if candidate.get("id") == token_id), None)
        if not item:
            raise RequestError(404, "API access not found")
        with API_ACCESS_LOCK:
            litellm_admin_request("POST", "/key/delete", {"keys": [token_id]})
        return {"deleted": token_id, "name": item.get("name") or "API access"}


