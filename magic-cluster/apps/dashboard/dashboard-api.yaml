    def delete_user(principal, user_id, payload, request_id=""):
        _reject_unknown_fields(payload, {"usernameConfirmation"})
        confirmation = _clean_text(payload, "usernameConfirmation", 128, required=True)
        with USER_MUTATION_LOCK:
            live_admin_actor(principal)
            try:
                target = keycloak_user(user_id)
                if confirmation != str(target.get("username") or ""):
                    raise RequestError(409, "username confirmation does not match")
                if user_id == str(principal.get("subject") or ""):
                    raise RequestError(409, "you cannot delete your own account")
                source, _ = identity_source(target)
                if source != "local":
                    raise RequestError(409, "external identities must be disabled at their identity provider")
                if protected_user(target):
                    raise RequestError(409, "protected recovery users cannot be deleted")
                _ensure_admins_survive(target)
                _logout_user(user_id)
                keycloak_admin_request("DELETE", _user_path(user_id))
            except Exception as error:
                _audit_failure(principal, "delete", user_id, request_id, error)
                raise
            audit_user_action(principal, "delete", user_id, "success", request_id, 200)
            return {"deleted": user_id}


    def validate_dashboard_mutation_request(handler):
        csrf_header = str(handler.headers.get("X-MagicStick-CSRF", "") or "").strip()
        if csrf_header != "dashboard":
            raise AuthError(403, "CSRF protection header is missing or invalid")
        fetch_site = str(handler.headers.get("Sec-Fetch-Site", "") or "").strip().lower()
        if fetch_site and fetch_site != "same-origin":
            raise AuthError(403, "cross-site user administration requests are not allowed")
        origin = str(handler.headers.get("Origin", "") or "").strip().rstrip("/")
        if not origin:
            if fetch_site:
                raise AuthError(403, "request origin is required")
            return
        parsed = urllib.parse.urlparse(origin)
        if parsed.scheme not in {"http", "https"} or not parsed.netloc or parsed.path not in {"", "/"}:
            raise AuthError(403, "request origin is not allowed")
        allowed = set(DASHBOARD_ALLOWED_ORIGINS)
        host = str(handler.headers.get("X-Forwarded-Host") or handler.headers.get("Host") or "").split(",", 1)[0].strip()
        proto = str(handler.headers.get("X-Forwarded-Proto") or "https").split(",", 1)[0].strip().lower()
        if not allowed and host and proto in {"http", "https"}:
            allowed.add(f"{proto}://{host}".rstrip("/"))
        if origin not in allowed:
            raise AuthError(403, "request origin is not allowed")


    def validate_user_mutation_request(handler):
        validate_dashboard_mutation_request(handler)


