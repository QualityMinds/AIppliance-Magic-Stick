apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-appliance-dashboard
  namespace: dashboard
  annotations:
    configmap.reloader.stakater.com/reload: ai-appliance-dashboard-nginx,ai-appliance-dashboard-renderer
  labels:
    app: ai-appliance-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-appliance-dashboard
  template:
    metadata:
      labels:
        app: ai-appliance-dashboard
      annotations:
        appliance.magicstick.dev/dashboard-config-revision: compute-targets-v1
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 80
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
        - name: renderer
          image: bitnami/kubectl@sha256:a67b11e95e953f550f020a41970185ccc5f83d78b86b8c575d02c904aa0f9cd7
          command: ["/bin/sh", "/scripts/render.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /html
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: renderer-tmp
              mountPath: /tmp
      volumes:
        - name: html
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: ai-appliance-dashboard-nginx
        - name: scripts
          configMap:
            name: ai-appliance-dashboard-renderer
            defaultMode: 0755
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: renderer-tmp
          emptyDir: {}
