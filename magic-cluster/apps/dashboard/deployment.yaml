apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-appliance-dashboard
  namespace: dashboard
  labels:
    app: ai-appliance-dashboard
    app.kubernetes.io/name: magicstick-dashboard
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-appliance-dashboard
  template:
    metadata:
      labels:
        app: ai-appliance-dashboard
        app.kubernetes.io/name: magicstick-dashboard
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/qualityminds/magicstick-dashboard:sha-0a4701847ec08562cde16570f6b88057c5c8ea64@sha256:cb25d6f4ab42c1d111e584138a145d16f5ca4458688545ed20fd8d19fab05021
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
