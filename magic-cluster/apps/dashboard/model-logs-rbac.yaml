apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-model-log-ownership
  namespace: ai
rules:
  - apiGroups: [kubeai.org]
    resources: [models]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-model-log-ownership
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-model-log-ownership
subjects:
  - kind: ServiceAccount
    name: ai-appliance-dashboard-api
    namespace: identity-system
