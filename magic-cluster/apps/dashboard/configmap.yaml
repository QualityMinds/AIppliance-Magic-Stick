apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-appliance-dashboard-renderer
  namespace: dashboard
data:
  render.sh: |
    #!/bin/sh
    set -eu

    html_escape() {
      printf '%s' "$1" \
        | sed -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              -e 's/"/\&quot;/g' \
              -e "s/'/\&#39;/g"
    }

    while true; do
      tmp="$(mktemp /html/index.XXXXXX)"

      rendered_at="$(date -u '+%Y-%m-%d %H:%M:%SZ')"

      cat <<'HTML' > "$tmp"
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>AI Appliance Dashboard</title>
      <style>
        :root {
          color-scheme: dark;
          --bg: #050910;
          --panel: rgba(17, 24, 39, 0.82);
          --panel-strong: rgba(10, 16, 30, 0.95);
          --text: #e2e8f0;
          --muted: #9fb0c8;
          --line: rgba(148, 163, 184, 0.2);
          --accent: #7dd3fc;
          --accent-strong: #22d3ee;
          --good: #86efac;
          --memory-unreserved: #a78bfa;
          --memory-free: #22d3ee;
          --memory-track: rgba(148, 163, 184, 0.16);
        }

        * { box-sizing: border-box; }

        body {
          margin: 0;
          font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          background: radial-gradient(circle at top, #0f1a31, #050910 60%);
          color: var(--text);
          min-height: 100vh;
        }

        .page {
          width: min(1120px, 100% - 2.5rem);
          margin: 2rem auto 3rem;
          display: grid;
          gap: 1.5rem;
        }

        .hero {
          background: linear-gradient(130deg, rgba(34, 211, 238, 0.18), rgba(15, 23, 42, 0.92));
          border: 1px solid rgba(125, 211, 252, 0.25);
          border-radius: 24px;
          padding: clamp(1.3rem, 2vw, 2rem);
          box-shadow: 0 18px 50px rgba(2, 8, 23, 0.45);
        }

        .eyebrow {
          margin: 0;
          text-transform: uppercase;
          letter-spacing: 0.09em;
          font-size: 0.75rem;
          color: var(--accent);
          font-weight: 700;
        }

        h1 {
          margin: 0.35rem 0 0;
          font-size: clamp(1.8rem, 3.6vw, 2.6rem);
          line-height: 1.2;
        }

        .subtitle {
          margin: 0.8rem 0 0;
          color: var(--muted);
          max-width: 62ch;
        }

        .helper {
          margin: 0.65rem 0 0;
          color: var(--muted);
          font-size: 0.9rem;
        }

        .hero-meta {
          margin-top: 1rem;
          display: flex;
          flex-wrap: wrap;
          gap: 0.65rem;
          color: #dbeafe;
          font-size: 0.88rem;
        }

        .chip {
          border: 1px solid var(--line);
          border-radius: 999px;
          padding: 0.35rem 0.7rem;
          background: rgba(15, 23, 42, 0.45);
        }

        .controls {
          margin-top: 1rem;
          display: grid;
          gap: 0.9rem;
        }

        .control-panel {
          background: rgba(8, 13, 24, 0.9);
          border: 1px solid rgba(125, 211, 252, 0.22);
          border-radius: 18px;
          padding: 1rem;
          display: grid;
          grid-template-columns: minmax(150px, 210px) minmax(0, 1fr);
          align-items: start;
          gap: 1rem;
        }

        .panel-heading {
          grid-column: 1 / -1;
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 1rem;
          flex-wrap: wrap;
        }

        .panel-heading h2 {
          margin: 0;
          font-size: 1.2rem;
        }

        .tabs {
          grid-column: 1;
          grid-row: 2;
          display: grid;
          gap: 0.45rem;
          align-content: start;
        }

        .tab-button,
        .control-button {
          border: 1px solid rgba(125, 211, 252, 0.3);
          border-radius: 10px;
          background: rgba(15, 23, 42, 0.9);
          color: var(--text);
          cursor: pointer;
          font: inherit;
          padding: 0.45rem 0.7rem;
        }

        .tab-button {
          width: 100%;
          text-align: left;
        }

        .tab-button[aria-selected="true"],
        .control-button.primary {
          background: rgba(14, 116, 144, 0.65);
          border-color: rgba(125, 211, 252, 0.85);
        }

        .control-button.danger {
          border-color: rgba(248, 113, 113, 0.45);
          color: #fecaca;
        }

        .tab-button:disabled,
        .control-button:disabled,
        .field select:disabled {
          cursor: not-allowed;
          opacity: 0.55;
        }

        .tab-panel {
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }

        .dashboard-grid {
          display: grid;
          gap: 0.85rem;
          grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        }

        .hardware-operator-panel {
          grid-column: 1 / -1;
        }

        .hardware-operator-grid {
          display: grid;
          gap: 0.7rem;
          grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        }

        .hardware-operator-meta {
          color: var(--muted);
          display: grid;
          font-size: 0.78rem;
          gap: 0.25rem;
        }

        .users-workspace {
          display: grid;
          gap: 0.85rem;
        }

        .api-access-workspace {
          display: grid;
          gap: 0.85rem;
        }

        .api-access-toolbar {
          align-items: center;
          display: flex;
          flex-wrap: wrap;
          gap: 0.75rem;
          justify-content: space-between;
        }

        .api-access-toolbar h3,
        .api-access-toolbar p {
          margin: 0;
        }

        .api-access-toolbar p {
          color: var(--muted);
          font-size: 0.86rem;
          margin-top: 0.3rem;
        }

        .kubernetes-access-levels {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 0.75rem;
          margin: 0.15rem 0;
        }

        .kubernetes-access-level {
          background: rgba(15, 23, 42, 0.58);
          border: 1px solid rgba(125, 211, 252, 0.22);
          border-radius: 10px;
          padding: 0.8rem;
        }

        .kubernetes-access-level strong,
        .kubernetes-access-level span {
          display: block;
        }

        .kubernetes-access-level span {
          color: var(--muted);
          font-size: 0.8rem;
          margin-top: 0.3rem;
        }

        .kubernetes-access-warning {
          border-color: rgba(251, 113, 133, 0.55);
        }

        .api-access-endpoints {
          display: grid;
          gap: 0.55rem;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .api-access-endpoint {
          background: rgba(15, 23, 42, 0.58);
          border: 1px solid rgba(125, 211, 252, 0.22);
          border-radius: 10px;
          display: grid;
          gap: 0.25rem;
          padding: 0.7rem;
        }

        .api-access-endpoint span {
          color: var(--muted);
          font-size: 0.72rem;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .api-access-endpoint code,
        .api-key-hint,
        .api-key-once input {
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .api-access-endpoint code {
          color: var(--accent);
          overflow-wrap: anywhere;
        }

        .api-key-once {
          background: rgba(14, 116, 144, 0.13);
          border: 1px solid rgba(125, 211, 252, 0.35);
          border-radius: 12px;
          display: grid;
          gap: 0.7rem;
          padding: 0.85rem;
        }

        .api-key-once p {
          color: #fde68a;
          font-size: 0.82rem;
          margin: 0;
        }

        .api-key-copy-row {
          align-items: stretch;
          display: grid;
          gap: 0.55rem;
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .users-toolbar,
        .users-toolbar form,
        .users-pagination {
          align-items: end;
          display: flex;
          flex-wrap: wrap;
          gap: 0.55rem;
        }

        .users-toolbar {
          justify-content: space-between;
        }

        .users-toolbar form {
          flex: 1 1 34rem;
        }

        .users-toolbar .field {
          min-width: min(15rem, 100%);
        }

        .users-toolbar .user-search-field {
          flex: 1 1 18rem;
        }

        .users-table-wrap {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 12px;
          overflow-x: auto;
        }

        .users-table {
          border-collapse: collapse;
          min-width: 760px;
          width: 100%;
        }

        .users-table th,
        .users-table td {
          border-bottom: 1px solid rgba(148, 163, 184, 0.18);
          padding: 0.7rem;
          text-align: left;
          vertical-align: top;
        }

        .users-table th {
          color: var(--muted);
          font-size: 0.76rem;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .users-table tbody tr:last-child td {
          border-bottom: 0;
        }

        .user-identity {
          display: grid;
          gap: 0.15rem;
        }

        .user-identity span,
        .user-source-note,
        .user-role-note,
        .dialog-helper {
          color: var(--muted);
          font-size: 0.78rem;
        }

        .user-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 0.35rem;
          min-width: 13rem;
        }

        .user-actions .control-button {
          font-size: 0.78rem;
          padding: 0.35rem 0.55rem;
        }

        .user-empty-state {
          border: 1px dashed rgba(148, 163, 184, 0.35);
          border-radius: 12px;
          color: var(--muted);
          padding: 1.2rem;
          text-align: center;
        }

        .users-pagination {
          justify-content: space-between;
        }

        .users-pagination span {
          color: var(--muted);
          font-size: 0.82rem;
        }

        .dashboard-dialog {
          background: var(--panel-strong);
          border: 1px solid rgba(125, 211, 252, 0.35);
          border-radius: 16px;
          color: var(--text);
          max-height: min(90vh, 760px);
          max-width: min(620px, calc(100% - 2rem));
          overflow: auto;
          padding: 0;
          width: 100%;
        }

        .dashboard-dialog::backdrop {
          background: rgba(2, 6, 23, 0.82);
        }

        .dialog-form {
          display: grid;
          gap: 1rem;
          margin: 0;
          padding: 1.1rem;
        }

        .dialog-heading {
          display: grid;
          gap: 0.35rem;
        }

        .dialog-heading h3,
        .dialog-heading p {
          margin: 0;
        }

        .dialog-heading p {
          color: var(--muted);
          font-size: 0.86rem;
        }

        .dialog-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 0.55rem;
          justify-content: flex-end;
        }

        .dialog-error {
          color: #fecaca;
          min-height: 1.2rem;
        }

        .checkbox-field {
          align-items: center;
          color: var(--muted);
          display: flex;
          font-size: 0.82rem;
          gap: 0.5rem;
        }

        .checkbox-field input {
          accent-color: var(--accent-strong);
        }

        .sr-only {
          clip: rect(0, 0, 0, 0);
          clip-path: inset(50%);
          height: 1px;
          overflow: hidden;
          position: absolute;
          white-space: nowrap;
          width: 1px;
        }

        .dashboard-card {
          border: 1px solid rgba(100, 116, 139, 0.3);
          border-radius: 12px;
          background: rgba(15, 23, 42, 0.78);
          padding: 0.9rem;
          display: grid;
          gap: 0.65rem;
        }

        .dashboard-card h3 {
          margin: 0;
          font-size: 1rem;
        }

        .dashboard-card p {
          margin: 0;
          color: var(--muted);
          font-size: 0.88rem;
        }

        .overview-workspace {
          display: grid;
          gap: 1rem;
        }

        .overview-metrics {
          display: grid;
          gap: 0.75rem;
          grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
        }

        .overview-metric p {
          color: var(--text);
          font-size: 1rem;
          font-weight: 700;
        }

        .overview-panel {
          display: grid;
          gap: 0.75rem;
        }

        .overview-app-list {
          display: grid;
          gap: 0.55rem;
        }

        .overview-app-row {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 10px;
          padding: 0.7rem;
          display: grid;
          grid-template-columns: minmax(12rem, 0.65fr) minmax(0, 1.35fr);
          align-items: start;
          gap: 0.75rem;
          background: rgba(2, 6, 23, 0.32);
        }

        .overview-app-title {
          display: grid;
          gap: 0.18rem;
          min-width: 0;
        }

        .overview-app-title strong {
          overflow-wrap: anywhere;
        }

        .overview-app-title span {
          color: var(--muted);
          font-size: 0.8rem;
          overflow-wrap: anywhere;
        }

        .overview-app-actions {
          display: grid;
          gap: 0.4rem;
          min-width: 0;
        }

        .overview-url-entry {
          align-items: center;
          display: grid;
          gap: 0.45rem;
          grid-template-columns: auto minmax(0, 1fr);
          min-width: 0;
        }

        .overview-url-scope {
          border: 1px solid rgba(148, 163, 184, 0.24);
          border-radius: 999px;
          color: var(--muted);
          font-size: 0.7rem;
          min-width: 3.4rem;
          padding: 0.18rem 0.42rem;
          text-align: center;
          text-transform: uppercase;
        }

        .overview-url-link {
          border-radius: 8px;
          display: block;
          min-width: 0;
        }

        .model-workspace {
          display: grid;
          gap: 1rem;
        }

        .compute-memory-overview {
          display: grid;
          gap: 0.5rem;
          padding: 0.1rem 0 0.35rem;
        }

        .compute-memory-overview h3 {
          color: var(--muted);
          font-size: 0.76rem;
          letter-spacing: 0.09em;
          margin: 0;
          text-transform: uppercase;
        }

        .compute-memory-gauges {
          display: grid;
          gap: clamp(0.85rem, 2.2vw, 1.4rem);
          grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
          justify-items: center;
        }

        .memory-gauge {
          display: grid;
          justify-items: center;
          margin: 0;
          min-width: 0;
          width: 100%;
        }

        .memory-gauge-visual {
          max-width: 220px;
          position: relative;
          width: 100%;
        }

        .memory-gauge-svg {
          display: block;
          overflow: visible;
          width: 100%;
        }

        .memory-gauge-track,
        .memory-gauge-arc {
          fill: none;
          stroke-linecap: round;
        }

        .memory-gauge-track {
          stroke: var(--memory-track);
        }

        .memory-gauge-track--outer,
        .memory-gauge-arc--unreserved {
          stroke-width: 14;
        }

        .memory-gauge-track--inner,
        .memory-gauge-arc--free {
          stroke-width: 11;
        }

        .memory-gauge-arc {
          filter: drop-shadow(0 0 7px rgba(34, 211, 238, 0.12));
          transition: stroke-dasharray 220ms ease;
        }

        .memory-gauge-arc--unreserved {
          stroke: var(--memory-unreserved);
        }

        .memory-gauge-arc--free {
          stroke: var(--memory-free);
        }

        .memory-gauge[data-metrics-available="false"] .memory-gauge-track {
          stroke-dasharray: 3 7;
        }

        .memory-gauge-center {
          align-items: center;
          bottom: 0.15rem;
          display: flex;
          flex-direction: column;
          left: 12%;
          line-height: 1.15;
          position: absolute;
          right: 12%;
          text-align: center;
        }

        .memory-gauge-value {
          color: var(--memory-free);
          font-size: clamp(1rem, 2.4vw, 1.35rem);
          font-weight: 750;
        }

        .memory-gauge-value-label {
          color: var(--muted);
          font-size: 0.66rem;
        }

        .memory-gauge-name {
          color: var(--text);
          font-size: 0.78rem;
          font-weight: 700;
          margin-top: 0.28rem;
          max-width: 100%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .memory-gauge-balance {
          align-items: center;
          color: var(--muted);
          display: flex;
          flex-wrap: wrap;
          font-size: 0.67rem;
          gap: 0.22rem;
          justify-content: center;
          margin-top: 0.22rem;
          text-align: center;
        }

        .memory-gauge-unreserved {
          color: #c4b5fd;
        }

        .memory-gauge-unreserved::before {
          background: var(--memory-unreserved);
          border-radius: 50%;
          content: "";
          display: inline-block;
          height: 0.42rem;
          margin-right: 0.28rem;
          width: 0.42rem;
        }

        .model-section {
          display: grid;
          gap: 0.7rem;
        }

        .model-create-flow {
          display: grid;
          gap: 0.85rem;
        }

        .model-list-heading {
          align-items: center;
          display: flex;
          flex-wrap: wrap;
          gap: 0.65rem;
        }

        .model-create-selection {
          margin: 0;
          width: auto;
        }

        .model-create-selection h3 {
          margin: 0;
        }

        .model-create-selection .form-grid {
          align-items: end;
          margin-top: 0.75rem;
        }

        .instance-create-toolbar {
          align-items: center;
          border: 1px solid rgba(125, 211, 252, 0.26);
          border-radius: 12px;
          background: rgba(15, 23, 42, 0.62);
          display: flex;
          flex-wrap: wrap;
          gap: 0.7rem;
          justify-content: space-between;
          padding: 0.8rem;
        }

        .instance-create-toolbar p {
          color: var(--muted);
          flex: 1 1 18rem;
          font-size: 0.8rem;
          margin: 0;
        }

        .instance-create-dialog {
          max-width: min(760px, calc(100% - 2rem));
        }

        .instance-type-picker {
          display: grid;
          gap: 0.75rem;
          grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        }

        .instance-type-choice {
          appearance: none;
          background: rgba(15, 23, 42, 0.78);
          border: 1px solid rgba(125, 211, 252, 0.28);
          border-radius: 12px;
          color: var(--text);
          cursor: pointer;
          display: grid;
          gap: 0.35rem;
          min-height: 6rem;
          padding: 0.9rem;
          text-align: left;
        }

        .instance-type-choice:hover,
        .instance-type-choice:focus-visible {
          background: rgba(14, 116, 144, 0.2);
          border-color: rgba(34, 211, 238, 0.7);
          outline: none;
        }

        .instance-type-choice:disabled {
          cursor: not-allowed;
          opacity: 0.72;
        }

        .instance-type-choice:disabled small {
          color: #fde68a;
        }

        .instance-type-choice strong {
          font-size: 1rem;
        }

        .instance-type-choice small {
          color: var(--muted);
          font-size: 0.78rem;
          line-height: 1.4;
        }

        .instance-config-step,
        .instance-create-grid {
          display: grid;
          gap: 0.85rem;
        }

        .instance-config-heading {
          align-items: center;
          display: flex;
          flex-wrap: wrap;
          gap: 0.65rem;
          justify-content: flex-end;
        }

        .instance-config-heading strong {
          color: var(--text);
        }

        .instance-create-grid .instance-form {
          width: auto;
        }

        .model-form {
          align-content: start;
        }

        .model-form-fields {
          border: 0;
          display: grid;
          gap: 0.85rem;
          margin: 0;
          min-width: 0;
          padding: 0;
        }

        .model-form-fields:disabled {
          opacity: 0.58;
        }

        .model-discovery {
          background: rgba(2, 6, 23, 0.34);
          border: 1px solid rgba(125, 211, 252, 0.18);
          border-radius: 12px;
          display: grid;
          gap: 0.75rem;
          padding: 0.8rem;
        }

        .model-discovery-heading {
          display: grid;
          gap: 0.22rem;
        }

        .model-discovery-heading h4,
        .model-discovery-heading p {
          margin: 0;
        }

        .model-discovery-heading h4 {
          font-size: 0.92rem;
        }

        .model-discovery-heading p,
        .model-discovery-status {
          color: var(--muted);
          font-size: 0.78rem;
        }

        .model-discovery-search {
          align-items: end;
          display: grid;
          gap: 0.55rem;
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .model-discovery-popular {
          align-items: center;
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
        }

        .model-discovery-popular + .model-discovery-popular {
          margin-top: 0.45rem;
        }

        .model-discovery-popular > span {
          color: var(--muted);
          font-size: 0.75rem;
          margin-right: 0.1rem;
        }

        .model-discovery-popular .control-button {
          font-size: 0.75rem;
          max-width: min(16rem, 100%);
          overflow: hidden;
          padding: 0.28rem 0.52rem;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .model-discovery-selection {
          display: grid;
          gap: 0.65rem;
          grid-template-columns: minmax(0, 1fr);
        }

        .model-discovery-field {
          display: grid;
          gap: 0.4rem;
          min-width: 0;
        }

        .model-discovery-load-more {
          background: transparent;
          font-size: 0.75rem;
          justify-self: start;
          padding: 0.28rem 0.5rem;
        }

        .model-discovery-status {
          min-height: 1.05rem;
          overflow-wrap: anywhere;
        }

        .model-discovery-status[data-state="error"] {
          color: #fecaca;
        }

        .model-discovery-metadata {
          align-items: center;
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
          min-height: 1.6rem;
        }

        #huggingface-model-discovery {
          display: grid;
          gap: 0.65rem;
        }

        .model-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 0.45rem;
        }

        .model-meta-item {
          border: 1px solid rgba(148, 163, 184, 0.2);
          border-radius: 999px;
          color: var(--muted);
          font-size: 0.76rem;
          padding: 0.18rem 0.5rem;
          overflow-wrap: anywhere;
        }

        .model-meta-item strong {
          color: var(--text);
          font-weight: 600;
        }

        [hidden] {
          display: none !important;
        }

        .services-workspace {
          display: grid;
          gap: 1rem;
        }

        .services-heading {
          align-items: flex-end;
          display: flex;
          gap: 1rem;
          justify-content: space-between;
        }

        .services-heading h3 {
          font-size: 1.45rem;
          margin: 0;
        }

        .services-kicker {
          color: var(--accent);
          font-size: 0.7rem;
          letter-spacing: 0.09em;
          margin: 0 0 0.2rem;
          text-transform: uppercase;
        }

        #services-summary {
          color: var(--muted);
          font-size: 0.8rem;
          margin: 0.3rem 0 0;
        }

        .services-filters {
          border-bottom: 1px solid var(--line);
          display: flex;
          flex-wrap: wrap;
          gap: 0.25rem;
          padding-bottom: 0.7rem;
        }

        .service-filter {
          background: transparent;
          border: 1px solid transparent;
          border-radius: 9px;
          color: var(--muted);
          cursor: pointer;
          font: inherit;
          padding: 0.38rem 0.65rem;
        }

        .service-filter[aria-pressed="true"] {
          background: rgba(125, 211, 252, 0.1);
          border-color: rgba(125, 211, 252, 0.34);
          color: var(--accent);
        }

        .service-section,
        .service-list {
          display: grid;
          gap: 0.7rem;
        }

        .service-list.compact {
          gap: 0.4rem;
        }

        .service-application-card {
          gap: 0;
          overflow: hidden;
          padding: 0;
        }

        .service-application-main {
          align-items: center;
          display: grid;
          gap: 0.65rem;
          grid-template-columns: minmax(0, 1fr) auto auto;
          padding: 0.8rem;
        }

        .service-module-identity,
        .service-instance-identity {
          display: grid;
          gap: 0.18rem;
          min-width: 0;
        }

        .service-module-identity strong,
        .service-instance-identity strong {
          overflow-wrap: anywhere;
        }

        .service-module-identity span,
        .service-instance-identity span {
          color: var(--muted);
          font-size: 0.76rem;
          overflow-wrap: anywhere;
        }

        .service-application-meta {
          align-items: center;
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
        }

        .service-instances-toggle {
          align-items: center;
          appearance: none;
          background: transparent;
          border: 0;
          border-radius: 7px;
          color: var(--accent);
          cursor: pointer;
          display: inline-flex;
          font: inherit;
          font-size: 0.74rem;
          gap: 0.18rem;
          padding: 0.08rem 0.28rem;
        }

        .service-instances-toggle:hover,
        .service-instances-toggle:focus-visible {
          background: rgba(34, 211, 238, 0.1);
          outline: 1px solid rgba(34, 211, 238, 0.35);
        }

        .service-instances-toggle [data-service-instances-toggle-icon] {
          color: currentColor;
          font-size: 0.86rem;
          line-height: 1;
        }

        .service-application-detail {
          border-top: 1px solid rgba(148, 163, 184, 0.15);
          display: grid;
          gap: 0.6rem;
          padding: 0.7rem 0.8rem;
        }

        .service-application-detail > .module-message {
          min-height: 0;
        }

        .service-instance-list {
          border-top: 1px solid rgba(148, 163, 184, 0.17);
          display: grid;
        }

        .service-instance-card {
          background: transparent;
          border: 0;
          border-radius: 0;
          gap: 0.5rem;
          margin-left: 2.8rem;
          padding: 0.68rem 0.8rem 0.68rem 0;
        }

        .service-instance-card + .service-instance-card {
          border-top: 1px solid rgba(148, 163, 184, 0.12);
        }

        .service-instance-main {
          align-items: center;
          display: grid;
          gap: 0.65rem;
          grid-template-columns: minmax(0, 1fr) auto auto;
        }

        .service-instance-card .resource-links {
          grid-column: 1 / -1;
        }

        .service-instance-card > .module-progress,
        .service-instance-card > .module-message,
        .service-instance-card > .credential-panel {
          grid-column: 1 / -1;
        }

        .service-module-row {
          align-items: center;
          display: grid;
          gap: 0.7rem;
          grid-template-columns: minmax(10rem, 1fr) minmax(9rem, 1fr) auto;
        }

        .service-module-row > .module-progress,
        .service-module-row > .credential-panel,
        .service-module-row > .module-advanced,
        .service-module-row > .resource-links {
          grid-column: 1 / -1;
        }

        .service-module-row .module-message {
          min-height: 0;
        }

        .service-platform-toggle {
          align-items: center;
          background: rgba(15, 23, 42, 0.48);
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 12px;
          color: var(--text);
          cursor: pointer;
          display: flex;
          font: inherit;
          justify-content: space-between;
          padding: 0.72rem 0.8rem;
          text-align: left;
          width: 100%;
        }

        .service-platform-toggle > span:first-child {
          display: grid;
          gap: 0.16rem;
        }

        .service-platform-toggle small,
        .service-empty {
          color: var(--muted);
          font-size: 0.76rem;
        }

        .service-empty {
          border: 1px dashed rgba(148, 163, 184, 0.22);
          border-radius: 10px;
          padding: 0.72rem;
        }

        .module-list {
          display: grid;
          gap: 1rem;
        }

        .module-group {
          display: grid;
          gap: 0.7rem;
        }

        .module-group-heading {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 0.7rem;
        }

        .module-group-heading h3 {
          margin: 0;
          font-size: 0.95rem;
        }

        .module-group-heading span {
          color: var(--muted);
          font-size: 0.78rem;
        }

        .module-grid {
          display: grid;
          gap: 0.75rem;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .module-card {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 12px;
          padding: 0.8rem;
          display: grid;
          gap: 0.65rem;
          background: rgba(2, 6, 23, 0.38);
          min-width: 0;
        }

        .module-card-header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 0.65rem;
        }

        .module-card-title {
          display: grid;
          gap: 0.18rem;
          min-width: 0;
        }

        .module-card-title strong {
          overflow-wrap: anywhere;
        }

        .module-card-title span,
        .module-phase,
        .module-message {
          color: var(--muted);
          font-size: 0.8rem;
        }

        .module-message {
          min-height: 1rem;
          overflow-wrap: anywhere;
        }

        .resource-links {
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
        }

        .resource-link {
          border: 1px solid rgba(125, 211, 252, 0.32);
          border-radius: 999px;
          color: var(--accent);
          font-size: 0.78rem;
          overflow-wrap: anywhere;
          padding: 0.22rem 0.55rem;
          text-decoration: none;
        }

        .resource-link:hover,
        .resource-link:focus-visible {
          background: rgba(14, 116, 144, 0.25);
          border-color: rgba(125, 211, 252, 0.75);
          color: var(--text);
        }

        .credential-panel {
          border: 1px solid rgba(125, 211, 252, 0.24);
          border-radius: 10px;
          display: grid;
          gap: 0.55rem;
          padding: 0.65rem;
          background: rgba(15, 23, 42, 0.48);
        }

        .credential-heading,
        .credential-row {
          display: grid;
          gap: 0.35rem;
        }

        .credential-heading span,
        .credential-row label {
          color: var(--muted);
          font-size: 0.76rem;
        }

        .credential-value {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 0.45rem;
        }

        .credential-value input {
          border: 1px solid var(--line);
          border-radius: 10px;
          background: rgba(2, 6, 23, 0.45);
          color: var(--text);
          font: inherit;
          min-width: 0;
          padding: 0.48rem 0.55rem;
        }

        .module-progress {
          display: grid;
          gap: 0.35rem;
        }

        .module-progress-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 0.65rem;
          color: var(--muted);
          font-size: 0.78rem;
        }

        .module-progress-track {
          height: 0.48rem;
          overflow: hidden;
          border-radius: 999px;
          background: rgba(15, 23, 42, 0.92);
          border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .module-progress-value {
          height: 100%;
          width: var(--module-progress, 0%);
          border-radius: inherit;
          background: linear-gradient(90deg, rgba(34, 211, 238, 0.72), rgba(134, 239, 172, 0.82));
          transition: width 0.25s ease;
        }

        .module-progress.degraded .module-progress-value {
          background: linear-gradient(90deg, rgba(248, 113, 113, 0.72), rgba(251, 191, 36, 0.82));
        }

        .mini-list {
          display: grid;
          gap: 0.55rem;
        }

        .module-item,
        .mini-item {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 10px;
          padding: 0.65rem;
          display: grid;
          gap: 0.5rem;
          background: rgba(2, 6, 23, 0.38);
        }

        .module-row,
        .action-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 0.65rem;
          flex-wrap: wrap;
        }

        .module-advanced summary {
          color: var(--muted);
          cursor: pointer;
          font-size: 0.82rem;
        }

        .module-advanced .form-grid {
          margin-top: 0.55rem;
        }

        .status-pill {
          border-radius: 999px;
          border: 1px solid rgba(148, 163, 184, 0.32);
          padding: 0.2rem 0.55rem;
          color: #cbd5e1;
          font-size: 0.75rem;
          white-space: nowrap;
        }

        .status-pill.ready,
        .status-pill.enabled {
          border-color: rgba(134, 239, 172, 0.45);
          color: #bbf7d0;
        }

        .status-pill.waiting,
        .status-pill.disabled {
          border-color: rgba(251, 191, 36, 0.42);
          color: #fde68a;
        }

        .status-pill.degraded {
          border-color: rgba(248, 113, 113, 0.5);
          color: #fecaca;
        }

        .form-grid {
          display: grid;
          gap: 0.65rem;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .field {
          display: grid;
          gap: 0.28rem;
          color: var(--muted);
          font-size: 0.8rem;
        }

        .field input,
        .field select,
        .field textarea {
          border: 1px solid var(--line);
          border-radius: 10px;
          background: rgba(15, 23, 42, 0.82);
          color: var(--text);
          font: inherit;
          padding: 0.55rem 0.65rem;
        }

        .field textarea {
          min-height: 5.5rem;
          resize: vertical;
        }

        .runtime-options {
          border: 0;
          display: grid;
          gap: 0.55rem;
          margin: 0;
          padding: 0;
        }

        .runtime-options legend {
          color: var(--muted);
          font-size: 0.8rem;
          margin-bottom: 0.2rem;
          padding: 0;
        }

        .runtime-option {
          align-items: center;
          display: flex;
          gap: 0.5rem;
          min-height: 2rem;
        }

        .runtime-option input {
          accent-color: var(--accent-strong);
          height: 1rem;
          margin: 0;
          width: 1rem;
        }

        .vram-estimate {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 10px;
          padding: 0.75rem;
          display: grid;
          gap: 0.7rem;
          background: rgba(2, 6, 23, 0.32);
        }

        .vram-estimate-header,
        .vram-estimate-row {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 0.65rem;
          flex-wrap: wrap;
        }

        .vram-estimate-header span,
        .vram-estimate-row span,
        .vram-estimate-meta {
          color: var(--muted);
          font-size: 0.8rem;
        }

        .vram-summary-grid {
          display: grid;
          gap: 0.55rem;
          grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
        }

        .vram-summary-grid div {
          border: 1px solid rgba(148, 163, 184, 0.2);
          border-radius: 10px;
          display: grid;
          gap: 0.16rem;
          padding: 0.6rem;
          background: rgba(15, 23, 42, 0.5);
        }

        .vram-summary-grid span {
          color: var(--muted);
          font-size: 0.74rem;
        }

        .vram-summary-grid strong {
          font-size: 1rem;
        }

        .vram-breakdown {
          display: grid;
          gap: 0.45rem;
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        }

        .vram-breakdown div {
          border: 1px solid rgba(148, 163, 184, 0.18);
          border-radius: 10px;
          padding: 0.55rem;
          display: grid;
          gap: 0.2rem;
          background: rgba(15, 23, 42, 0.5);
        }

        .vram-breakdown span {
          color: var(--muted);
          font-size: 0.76rem;
        }

        .vram-breakdown strong {
          font-size: 0.95rem;
        }

        .vram-estimate input[type="range"] {
          width: 100%;
          accent-color: #22d3ee;
        }

        .memory-capacity {
          display: grid;
          gap: 0.35rem;
        }

        .memory-capacity-scale {
          min-height: 5.1rem;
          position: relative;
        }

        .memory-capacity-available,
        .memory-capacity-overflow {
          border-radius: 999px;
          height: 0.72rem;
          position: absolute;
          top: 2.5rem;
        }

        .memory-capacity-available {
          background: rgba(34, 211, 238, 0.24);
          border: 1px solid rgba(34, 211, 238, 0.5);
          left: 0;
          width: 100%;
        }

        .memory-capacity-overflow {
          background: repeating-linear-gradient(
            135deg,
            rgba(100, 116, 139, 0.24),
            rgba(100, 116, 139, 0.24) 7px,
            rgba(51, 65, 85, 0.42) 7px,
            rgba(51, 65, 85, 0.42) 14px
          );
          border: 1px solid rgba(148, 163, 184, 0.28);
          right: 0;
        }

        .memory-capacity-available input[type="range"] {
          height: 1.5rem;
          left: 0;
          margin: -0.42rem 0 0;
          position: absolute;
          top: 0;
          width: 100%;
          z-index: 3;
        }

        .memory-capacity-marker {
          color: #e2e8f0;
          font-size: 0.68rem;
          font-weight: 650;
          left: 0;
          line-height: 1.15;
          max-width: 6.5rem;
          position: absolute;
          text-align: center;
          top: 0;
          transform: translateX(-50%);
          z-index: 2;
        }

        .memory-capacity-marker::after {
          background: currentColor;
          content: "";
          height: 1.35rem;
          left: 50%;
          opacity: 0.72;
          position: absolute;
          top: 1.15rem;
          width: 1px;
        }

        .memory-capacity-marker.recommended {
          color: var(--accent);
          top: 0.85rem;
        }

        .memory-capacity-marker.recommended::after {
          height: 0.5rem;
        }

        .memory-capacity-marker.available {
          color: #94a3b8;
          top: 3.55rem;
        }

        .memory-capacity-marker.available::after {
          bottom: 1rem;
          height: 0.62rem;
          top: auto;
        }

        .memory-capacity-marker.overflow {
          color: #94a3b8;
        }

        .memory-capacity-axis {
          color: var(--muted);
          display: flex;
          font-size: 0.72rem;
          gap: 0.75rem;
          justify-content: space-between;
        }

        .memory-capacity-axis span:last-child {
          text-align: right;
        }

        .segmented-control {
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
        }

        .segmented-control .control-button {
          flex: 1 1 8rem;
          text-align: center;
        }

        .vram-breakdown-details summary {
          color: var(--muted);
          cursor: pointer;
          font-size: 0.82rem;
        }

        .vram-breakdown-details[open] summary {
          margin-bottom: 0.55rem;
        }

        .estimate-callouts {
          display: grid;
          gap: 0.4rem;
        }

        .estimate-callout {
          border: 1px solid rgba(125, 211, 252, 0.24);
          border-radius: 10px;
          color: var(--muted);
          font-size: 0.8rem;
          padding: 0.5rem 0.6rem;
          background: rgba(14, 116, 144, 0.12);
        }

        .estimate-callout.warning {
          border-color: rgba(251, 191, 36, 0.35);
          background: rgba(120, 53, 15, 0.18);
          color: #fde68a;
        }

        .vram-estimate .action-row {
          justify-content: flex-start;
        }

        .api-output {
          min-height: 1.3rem;
          color: var(--muted);
          font-size: 0.84rem;
        }

        footer {
          color: var(--muted);
          text-align: center;
          font-size: 0.82rem;
        }

        @media (max-width: 780px) {
          .control-panel {
            grid-template-columns: 1fr;
          }

          .tabs,
          .tab-panel {
            grid-column: 1;
            grid-row: auto;
          }

          .overview-app-row {
            grid-template-columns: 1fr;
          }

          .overview-app-actions {
            justify-content: flex-start;
          }
        }

        @media (max-width: 680px) {
          .page {
            width: min(1120px, 100% - 1.1rem);
            margin-top: 1rem;
          }

          .hero {
            border-radius: 18px;
          }

          .services-heading {
            align-items: stretch;
            flex-direction: column;
          }

          #instance-create-panel .control-button {
            width: 100%;
          }

          .service-application-main,
          .service-instance-main,
          .service-module-row {
            grid-template-columns: minmax(0, 1fr) auto;
          }

          .service-application-main > .action-row,
          .service-instance-main > .action-row,
          .service-module-row > .action-row,
          .service-module-row > .module-message {
            grid-column: 1 / -1;
          }

          .service-instance-card {
            margin-left: 2rem;
          }

          .api-key-copy-row {
            grid-template-columns: 1fr;
          }

          .kubernetes-access-levels {
            grid-template-columns: 1fr;
          }

          .model-discovery-search,
          .model-discovery-selection {
            grid-template-columns: 1fr;
          }

          .users-table {
            display: block;
            min-width: 0;
          }

          .users-table thead {
            display: none;
          }

          .users-table tbody,
          .users-table tr,
          .users-table td {
            display: block;
            width: 100%;
          }

          .users-table tbody {
            display: grid;
            gap: 0.75rem;
            padding: 0.75rem;
          }

          .users-table tr {
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 10px;
            padding: 0.2rem;
          }

          .users-table td {
            border-bottom: 1px solid rgba(148, 163, 184, 0.13);
            display: grid;
            gap: 0.35rem;
            grid-template-columns: minmax(6rem, 35%) minmax(0, 1fr);
          }

          .users-table td::before {
            color: var(--muted);
            content: attr(data-label);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
          }

          .users-table td:last-child {
            border-bottom: 0;
            display: block;
          }

          .users-table td:last-child::before {
            display: block;
            margin-bottom: 0.4rem;
          }
        }
      </style>
    </head>
    <body>
      <main class="page">
        <header class="hero">
          <p class="eyebrow">AI Appliance Platform</p>
          <h1>AI Appliance Dashboard</h1>
          <p class="subtitle">Manage the MagicStick appliance runtime from one place.</p>
          <div class="hero-meta">
            <span class="chip">Last updated: <strong>
    HTML
      printf '%s' "$(html_escape "$rendered_at")" >> "$tmp"
      cat <<'HTML' >> "$tmp"
            </strong></span>
            <span class="chip">Refresh cadence: every 30s</span>
            <span class="chip" id="session-user">Signed in</span>
            <a class="chip" href="/logout">Sign out</a>
          </div>
        </header>

        <section class="control-panel" aria-label="Appliance management">
          <div class="panel-heading">
            <h2>Appliance Control</h2>
            <span id="api-state" class="status-pill waiting">Connecting</span>
          </div>
          <nav class="tabs" aria-label="Dashboard pages">
            <button class="tab-button" type="button" aria-selected="true" data-tab="overview">Overview</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="services">Services</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="models">Models</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="settings">Settings</button>
            <button class="tab-button" id="users-tab-button" type="button" aria-selected="false" data-tab="users" hidden>Users</button>
            <button class="tab-button" id="api-access-tab-button" type="button" aria-selected="false" data-tab="api-access" hidden>API Access</button>
            <button class="tab-button" id="kubernetes-access-tab-button" type="button" aria-selected="false" data-tab="kubernetes-access" hidden>Kubernetes Access</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="system">System Status</button>
          </nav>

          <section id="tab-overview" class="tab-panel">
            <div class="overview-workspace">
              <div class="overview-metrics">
                <article class="dashboard-card overview-metric">
                  <h3>Appliance</h3>
                  <p id="appliance-summary">Loading</p>
                </article>
                <article class="dashboard-card overview-metric">
                  <h3>Modules</h3>
                  <p id="module-summary">Loading</p>
                </article>
                <article class="dashboard-card overview-metric">
                  <h3>Instances</h3>
                  <p id="instance-summary">Loading</p>
                </article>
                <article class="dashboard-card overview-metric">
                  <h3>Models</h3>
                  <p id="model-summary">Loading</p>
                </article>
              </div>
              <section class="dashboard-card overview-panel">
