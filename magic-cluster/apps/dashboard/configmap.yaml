apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-appliance-dashboard-renderer
  namespace: dashboard
data:
  render.sh: |
    #!/bin/sh
    set -eu

    html_escape() {
      printf '%s' "$1" \
        | sed -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              -e 's/"/\&quot;/g' \
              -e "s/'/\&#39;/g"
    }

    while true; do
      tmp="$(mktemp /html/index.XXXXXX)"

      rendered_at="$(date -u '+%Y-%m-%d %H:%M:%SZ')"

      cat <<'HTML' > "$tmp"
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>AI Appliance Dashboard</title>
      <style>
        :root {
          color-scheme: dark;
          --bg: #050910;
          --panel: rgba(17, 24, 39, 0.82);
          --panel-strong: rgba(10, 16, 30, 0.95);
          --text: #e2e8f0;
          --muted: #9fb0c8;
          --line: rgba(148, 163, 184, 0.2);
          --accent: #7dd3fc;
          --accent-strong: #22d3ee;
          --good: #86efac;
        }

        * { box-sizing: border-box; }

        body {
          margin: 0;
          font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          background: radial-gradient(circle at top, #0f1a31, #050910 60%);
          color: var(--text);
          min-height: 100vh;
        }

        .page {
          width: min(1120px, 100% - 2.5rem);
          margin: 2rem auto 3rem;
          display: grid;
          gap: 1.5rem;
        }

        .hero {
          background: linear-gradient(130deg, rgba(34, 211, 238, 0.18), rgba(15, 23, 42, 0.92));
          border: 1px solid rgba(125, 211, 252, 0.25);
          border-radius: 24px;
          padding: clamp(1.3rem, 2vw, 2rem);
          box-shadow: 0 18px 50px rgba(2, 8, 23, 0.45);
        }

        .eyebrow {
          margin: 0;
          text-transform: uppercase;
          letter-spacing: 0.09em;
          font-size: 0.75rem;
          color: var(--accent);
          font-weight: 700;
        }

        h1 {
          margin: 0.35rem 0 0;
          font-size: clamp(1.8rem, 3.6vw, 2.6rem);
          line-height: 1.2;
        }

        .subtitle {
          margin: 0.8rem 0 0;
          color: var(--muted);
          max-width: 62ch;
        }

        .helper {
          margin: 0.65rem 0 0;
          color: var(--muted);
          font-size: 0.9rem;
        }

        .hero-meta {
          margin-top: 1rem;
          display: flex;
          flex-wrap: wrap;
          gap: 0.65rem;
          color: #dbeafe;
          font-size: 0.88rem;
        }

        .chip {
          border: 1px solid var(--line);
          border-radius: 999px;
          padding: 0.35rem 0.7rem;
          background: rgba(15, 23, 42, 0.45);
        }

        .controls {
          margin-top: 1rem;
          display: grid;
          gap: 0.9rem;
        }

        .control-panel {
          background: rgba(8, 13, 24, 0.9);
          border: 1px solid rgba(125, 211, 252, 0.22);
          border-radius: 18px;
          padding: 1rem;
          display: grid;
          grid-template-columns: minmax(150px, 210px) minmax(0, 1fr);
          align-items: start;
          gap: 1rem;
        }

        .panel-heading {
          grid-column: 1 / -1;
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 1rem;
          flex-wrap: wrap;
        }

        .panel-heading h2 {
          margin: 0;
          font-size: 1.2rem;
        }

        .tabs {
          grid-column: 1;
          grid-row: 2;
          display: grid;
          gap: 0.45rem;
          align-content: start;
        }

        .tab-button,
        .control-button {
          border: 1px solid rgba(125, 211, 252, 0.3);
          border-radius: 10px;
          background: rgba(15, 23, 42, 0.9);
          color: var(--text);
          cursor: pointer;
          font: inherit;
          padding: 0.45rem 0.7rem;
        }

        .tab-button {
          width: 100%;
          text-align: left;
        }

        .tab-button[aria-selected="true"],
        .control-button.primary {
          background: rgba(14, 116, 144, 0.65);
          border-color: rgba(125, 211, 252, 0.85);
        }

        .control-button.danger {
          border-color: rgba(248, 113, 113, 0.45);
          color: #fecaca;
        }

        .tab-button:disabled,
        .control-button:disabled,
        .field select:disabled {
          cursor: not-allowed;
          opacity: 0.55;
        }

        .tab-panel {
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }

        .dashboard-grid {
          display: grid;
          gap: 0.85rem;
          grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        }

        .users-workspace {
          display: grid;
          gap: 0.85rem;
        }

        .users-toolbar,
        .users-toolbar form,
        .users-pagination {
          align-items: end;
          display: flex;
          flex-wrap: wrap;
          gap: 0.55rem;
        }

        .users-toolbar {
          justify-content: space-between;
        }

        .users-toolbar form {
          flex: 1 1 34rem;
        }

        .users-toolbar .field {
          min-width: min(15rem, 100%);
        }

        .users-toolbar .user-search-field {
          flex: 1 1 18rem;
        }

        .users-table-wrap {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 12px;
          overflow-x: auto;
        }

        .users-table {
          border-collapse: collapse;
          min-width: 760px;
          width: 100%;
        }

        .users-table th,
        .users-table td {
          border-bottom: 1px solid rgba(148, 163, 184, 0.18);
          padding: 0.7rem;
          text-align: left;
          vertical-align: top;
        }

        .users-table th {
          color: var(--muted);
          font-size: 0.76rem;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .users-table tbody tr:last-child td {
          border-bottom: 0;
        }

        .user-identity {
          display: grid;
          gap: 0.15rem;
        }

        .user-identity span,
        .user-source-note,
        .user-role-note,
        .dialog-helper {
          color: var(--muted);
          font-size: 0.78rem;
        }

        .user-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 0.35rem;
          min-width: 13rem;
        }

        .user-actions .control-button {
          font-size: 0.78rem;
          padding: 0.35rem 0.55rem;
        }

        .user-empty-state {
          border: 1px dashed rgba(148, 163, 184, 0.35);
          border-radius: 12px;
          color: var(--muted);
          padding: 1.2rem;
          text-align: center;
        }

        .users-pagination {
          justify-content: space-between;
        }

        .users-pagination span {
          color: var(--muted);
          font-size: 0.82rem;
        }

        .dashboard-dialog {
          background: var(--panel-strong);
          border: 1px solid rgba(125, 211, 252, 0.35);
          border-radius: 16px;
          color: var(--text);
          max-height: min(90vh, 760px);
          max-width: min(620px, calc(100% - 2rem));
          overflow: auto;
          padding: 0;
          width: 100%;
        }

        .dashboard-dialog::backdrop {
          background: rgba(2, 6, 23, 0.82);
        }

        .dialog-form {
          display: grid;
          gap: 1rem;
          margin: 0;
          padding: 1.1rem;
        }

        .dialog-heading {
          display: grid;
          gap: 0.35rem;
        }

        .dialog-heading h3,
        .dialog-heading p {
          margin: 0;
        }

        .dialog-heading p {
          color: var(--muted);
          font-size: 0.86rem;
        }

        .dialog-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 0.55rem;
          justify-content: flex-end;
        }

        .dialog-error {
          color: #fecaca;
          min-height: 1.2rem;
        }

        .checkbox-field {
          align-items: center;
          color: var(--muted);
          display: flex;
          font-size: 0.82rem;
          gap: 0.5rem;
        }

        .checkbox-field input {
          accent-color: var(--accent-strong);
        }

        .sr-only {
          clip: rect(0, 0, 0, 0);
          clip-path: inset(50%);
          height: 1px;
          overflow: hidden;
          position: absolute;
          white-space: nowrap;
          width: 1px;
        }

        .dashboard-card {
          border: 1px solid rgba(100, 116, 139, 0.3);
          border-radius: 12px;
          background: rgba(15, 23, 42, 0.78);
          padding: 0.9rem;
          display: grid;
          gap: 0.65rem;
        }

        .dashboard-card h3 {
          margin: 0;
          font-size: 1rem;
        }

        .dashboard-card p {
          margin: 0;
          color: var(--muted);
          font-size: 0.88rem;
        }

        .overview-workspace {
          display: grid;
          gap: 1rem;
        }

        .overview-metrics {
          display: grid;
          gap: 0.75rem;
          grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
        }

        .overview-metric p {
          color: var(--text);
          font-size: 1rem;
          font-weight: 700;
        }

        .overview-panel {
          display: grid;
          gap: 0.75rem;
        }

        .overview-app-list {
          display: grid;
          gap: 0.55rem;
        }

        .overview-app-row {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 10px;
          padding: 0.7rem;
          display: grid;
          grid-template-columns: minmax(12rem, 0.65fr) minmax(0, 1.35fr);
          align-items: start;
          gap: 0.75rem;
          background: rgba(2, 6, 23, 0.32);
        }

        .overview-app-title {
          display: grid;
          gap: 0.18rem;
          min-width: 0;
        }

        .overview-app-title strong {
          overflow-wrap: anywhere;
        }

        .overview-app-title span {
          color: var(--muted);
          font-size: 0.8rem;
          overflow-wrap: anywhere;
        }

        .overview-app-actions {
          display: grid;
          gap: 0.4rem;
          min-width: 0;
        }

        .overview-url-entry {
          align-items: center;
          display: grid;
          gap: 0.45rem;
          grid-template-columns: auto minmax(0, 1fr);
          min-width: 0;
        }

        .overview-url-scope {
          border: 1px solid rgba(148, 163, 184, 0.24);
          border-radius: 999px;
          color: var(--muted);
          font-size: 0.7rem;
          min-width: 3.4rem;
          padding: 0.18rem 0.42rem;
          text-align: center;
          text-transform: uppercase;
        }

        .overview-url-link {
          border-radius: 8px;
          display: block;
          min-width: 0;
        }

        .model-workspace {
          display: grid;
          gap: 1rem;
        }

        .model-vram-card {
          align-content: start;
        }

        .model-section {
          display: grid;
          gap: 0.7rem;
        }

        .model-create-panel {
          display: grid;
          gap: 0.75rem;
        }

        .model-create-summary {
          border: 1px solid rgba(125, 211, 252, 0.3);
          border-radius: 10px;
          background: rgba(15, 23, 42, 0.82);
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 0.75rem;
          list-style: none;
          padding: 0.7rem 0.85rem;
        }

        .model-create-summary::-webkit-details-marker {
          display: none;
        }

        .model-create-summary span:first-child {
          display: grid;
          gap: 0.12rem;
        }

        .model-create-summary small {
          color: var(--muted);
          font-size: 0.78rem;
        }

        .model-create-grid {
          display: grid;
          gap: 0.85rem;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          padding-top: 0.75rem;
        }

        .instance-create-toolbar {
          align-items: center;
          border: 1px solid rgba(125, 211, 252, 0.26);
          border-radius: 12px;
          background: rgba(15, 23, 42, 0.62);
          display: flex;
          flex-wrap: wrap;
          gap: 0.7rem;
          justify-content: space-between;
          padding: 0.8rem;
        }

        .instance-create-toolbar p {
          color: var(--muted);
          flex: 1 1 18rem;
          font-size: 0.8rem;
          margin: 0;
        }

        .instance-create-dialog {
          max-width: min(760px, calc(100% - 2rem));
        }

        .instance-type-picker {
          display: grid;
          gap: 0.75rem;
          grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        }

        .instance-type-choice {
          appearance: none;
          background: rgba(15, 23, 42, 0.78);
          border: 1px solid rgba(125, 211, 252, 0.28);
          border-radius: 12px;
          color: var(--text);
          cursor: pointer;
          display: grid;
          gap: 0.35rem;
          min-height: 6rem;
          padding: 0.9rem;
          text-align: left;
        }

        .instance-type-choice:hover,
        .instance-type-choice:focus-visible {
          background: rgba(14, 116, 144, 0.2);
          border-color: rgba(34, 211, 238, 0.7);
          outline: none;
        }

        .instance-type-choice strong {
          font-size: 1rem;
        }

        .instance-type-choice small {
          color: var(--muted);
          font-size: 0.78rem;
          line-height: 1.4;
        }

        .instance-config-step,
        .instance-create-grid {
          display: grid;
          gap: 0.85rem;
        }

        .instance-config-heading {
          align-items: center;
          display: flex;
          flex-wrap: wrap;
          gap: 0.65rem;
          justify-content: space-between;
        }

        .instance-config-heading strong {
          color: var(--text);
        }

        .instance-create-grid .instance-form {
          width: auto;
        }

        .model-form {
          align-content: start;
        }

        .model-form-fields {
          border: 0;
          display: grid;
          gap: 0.85rem;
          margin: 0;
          min-width: 0;
          padding: 0;
        }

        .model-form-fields:disabled {
          opacity: 0.58;
        }

        .model-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 0.45rem;
        }

        .model-meta-item {
          border: 1px solid rgba(148, 163, 184, 0.2);
          border-radius: 999px;
          color: var(--muted);
          font-size: 0.76rem;
          padding: 0.18rem 0.5rem;
          overflow-wrap: anywhere;
        }

        .model-meta-item strong {
          color: var(--text);
          font-weight: 600;
        }

        [hidden] {
          display: none !important;
        }

        .module-list {
          display: grid;
          gap: 1rem;
        }

        .module-group {
          display: grid;
          gap: 0.7rem;
        }

        .module-group-heading {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 0.7rem;
        }

        .module-group-heading h3 {
          margin: 0;
          font-size: 0.95rem;
        }

        .module-group-heading span {
          color: var(--muted);
          font-size: 0.78rem;
        }

        .module-grid {
          display: grid;
          gap: 0.75rem;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .module-card {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 12px;
          padding: 0.8rem;
          display: grid;
          gap: 0.65rem;
          background: rgba(2, 6, 23, 0.38);
          min-width: 0;
        }

        .module-card-header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 0.65rem;
        }

        .module-card-title {
          display: grid;
          gap: 0.18rem;
          min-width: 0;
        }

        .module-card-title strong {
          overflow-wrap: anywhere;
        }

        .module-card-title span,
        .module-phase,
        .module-message {
          color: var(--muted);
          font-size: 0.8rem;
        }

        .module-message {
          min-height: 1rem;
          overflow-wrap: anywhere;
        }

        .resource-links {
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
        }

        .resource-link {
          border: 1px solid rgba(125, 211, 252, 0.32);
          border-radius: 999px;
          color: var(--accent);
          font-size: 0.78rem;
          overflow-wrap: anywhere;
          padding: 0.22rem 0.55rem;
          text-decoration: none;
        }

        .resource-link:hover,
        .resource-link:focus-visible {
          background: rgba(14, 116, 144, 0.25);
          border-color: rgba(125, 211, 252, 0.75);
          color: var(--text);
        }

        .credential-panel {
          border: 1px solid rgba(125, 211, 252, 0.24);
          border-radius: 10px;
          display: grid;
          gap: 0.55rem;
          padding: 0.65rem;
          background: rgba(15, 23, 42, 0.48);
        }

        .credential-heading,
        .credential-row {
          display: grid;
          gap: 0.35rem;
        }

        .credential-heading span,
        .credential-row label {
          color: var(--muted);
          font-size: 0.76rem;
        }

        .credential-value {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 0.45rem;
        }

        .credential-value input {
          border: 1px solid var(--line);
          border-radius: 10px;
          background: rgba(2, 6, 23, 0.45);
          color: var(--text);
          font: inherit;
          min-width: 0;
          padding: 0.48rem 0.55rem;
        }

        .module-progress {
          display: grid;
          gap: 0.35rem;
        }

        .module-progress-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 0.65rem;
          color: var(--muted);
          font-size: 0.78rem;
        }

        .module-progress-track {
          height: 0.48rem;
          overflow: hidden;
          border-radius: 999px;
          background: rgba(15, 23, 42, 0.92);
          border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .module-progress-value {
          height: 100%;
          width: var(--module-progress, 0%);
          border-radius: inherit;
          background: linear-gradient(90deg, rgba(34, 211, 238, 0.72), rgba(134, 239, 172, 0.82));
          transition: width 0.25s ease;
        }

        .module-progress.degraded .module-progress-value {
          background: linear-gradient(90deg, rgba(248, 113, 113, 0.72), rgba(251, 191, 36, 0.82));
        }

        .mini-list {
          display: grid;
          gap: 0.55rem;
        }

        .module-item,
        .mini-item {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 10px;
          padding: 0.65rem;
          display: grid;
          gap: 0.5rem;
          background: rgba(2, 6, 23, 0.38);
        }

        .module-row,
        .action-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 0.65rem;
          flex-wrap: wrap;
        }

        .module-advanced summary {
          color: var(--muted);
          cursor: pointer;
          font-size: 0.82rem;
        }

        .module-advanced .form-grid {
          margin-top: 0.55rem;
        }

        .status-pill {
          border-radius: 999px;
          border: 1px solid rgba(148, 163, 184, 0.32);
          padding: 0.2rem 0.55rem;
          color: #cbd5e1;
          font-size: 0.75rem;
          white-space: nowrap;
        }

        .status-pill.ready,
        .status-pill.enabled {
          border-color: rgba(134, 239, 172, 0.45);
          color: #bbf7d0;
        }

        .status-pill.waiting,
        .status-pill.disabled {
          border-color: rgba(251, 191, 36, 0.42);
          color: #fde68a;
        }

        .status-pill.degraded {
          border-color: rgba(248, 113, 113, 0.5);
          color: #fecaca;
        }

        .form-grid {
          display: grid;
          gap: 0.65rem;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .field {
          display: grid;
          gap: 0.28rem;
          color: var(--muted);
          font-size: 0.8rem;
        }

        .field input,
        .field select,
        .field textarea {
          border: 1px solid var(--line);
          border-radius: 10px;
          background: rgba(15, 23, 42, 0.82);
          color: var(--text);
          font: inherit;
          padding: 0.55rem 0.65rem;
        }

        .field textarea {
          min-height: 5.5rem;
          resize: vertical;
        }

        .runtime-options {
          border: 0;
          display: grid;
          gap: 0.55rem;
          margin: 0;
          padding: 0;
        }

        .runtime-options legend {
          color: var(--muted);
          font-size: 0.8rem;
          margin-bottom: 0.2rem;
          padding: 0;
        }

        .runtime-option {
          align-items: center;
          display: flex;
          gap: 0.5rem;
          min-height: 2rem;
        }

        .runtime-option input {
          accent-color: var(--accent-strong);
          height: 1rem;
          margin: 0;
          width: 1rem;
        }

        .vram-estimate {
          border: 1px solid rgba(148, 163, 184, 0.22);
          border-radius: 10px;
          padding: 0.75rem;
          display: grid;
          gap: 0.7rem;
          background: rgba(2, 6, 23, 0.32);
        }

        .vram-estimate-header,
        .vram-estimate-row {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 0.65rem;
          flex-wrap: wrap;
        }

        .vram-estimate-header span,
        .vram-estimate-row span,
        .vram-estimate-meta {
          color: var(--muted);
          font-size: 0.8rem;
        }

        .vram-summary-grid {
          display: grid;
          gap: 0.55rem;
          grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
        }

        .vram-summary-grid div {
          border: 1px solid rgba(148, 163, 184, 0.2);
          border-radius: 10px;
          display: grid;
          gap: 0.16rem;
          padding: 0.6rem;
          background: rgba(15, 23, 42, 0.5);
        }

        .vram-summary-grid span {
          color: var(--muted);
          font-size: 0.74rem;
        }

        .vram-summary-grid strong {
          font-size: 1rem;
        }

        .vram-breakdown {
          display: grid;
          gap: 0.45rem;
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        }

        .vram-breakdown div {
          border: 1px solid rgba(148, 163, 184, 0.18);
          border-radius: 10px;
          padding: 0.55rem;
          display: grid;
          gap: 0.2rem;
          background: rgba(15, 23, 42, 0.5);
        }

        .vram-breakdown span {
          color: var(--muted);
          font-size: 0.76rem;
        }

        .vram-breakdown strong {
          font-size: 0.95rem;
        }

        .vram-estimate input[type="range"] {
          width: 100%;
          accent-color: #22d3ee;
        }

        .segmented-control {
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
        }

        .segmented-control .control-button {
          flex: 1 1 8rem;
          text-align: center;
        }

        .vram-breakdown-details summary {
          color: var(--muted);
          cursor: pointer;
          font-size: 0.82rem;
        }

        .vram-breakdown-details[open] summary {
          margin-bottom: 0.55rem;
        }

        .estimate-callouts {
          display: grid;
          gap: 0.4rem;
        }

        .estimate-callout {
          border: 1px solid rgba(125, 211, 252, 0.24);
          border-radius: 10px;
          color: var(--muted);
          font-size: 0.8rem;
          padding: 0.5rem 0.6rem;
          background: rgba(14, 116, 144, 0.12);
        }

        .estimate-callout.warning {
          border-color: rgba(251, 191, 36, 0.35);
          background: rgba(120, 53, 15, 0.18);
          color: #fde68a;
        }

        .vram-estimate .action-row {
          justify-content: flex-start;
        }

        .api-output {
          min-height: 1.3rem;
          color: var(--muted);
          font-size: 0.84rem;
        }

        footer {
          color: var(--muted);
          text-align: center;
          font-size: 0.82rem;
        }

        @media (max-width: 780px) {
          .control-panel {
            grid-template-columns: 1fr;
          }

          .tabs,
          .tab-panel {
            grid-column: 1;
            grid-row: auto;
          }

          .overview-app-row {
            grid-template-columns: 1fr;
          }

          .overview-app-actions {
            justify-content: flex-start;
          }
        }

        @media (max-width: 680px) {
          .page {
            width: min(1120px, 100% - 1.1rem);
            margin-top: 1rem;
          }

          .hero {
            border-radius: 18px;
          }

          .users-table {
            display: block;
            min-width: 0;
          }

          .users-table thead {
            display: none;
          }

          .users-table tbody,
          .users-table tr,
          .users-table td {
            display: block;
            width: 100%;
          }

          .users-table tbody {
            display: grid;
            gap: 0.75rem;
            padding: 0.75rem;
          }

          .users-table tr {
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 10px;
            padding: 0.2rem;
          }

          .users-table td {
            border-bottom: 1px solid rgba(148, 163, 184, 0.13);
            display: grid;
            gap: 0.35rem;
            grid-template-columns: minmax(6rem, 35%) minmax(0, 1fr);
          }

          .users-table td::before {
            color: var(--muted);
            content: attr(data-label);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
          }

          .users-table td:last-child {
            border-bottom: 0;
            display: block;
          }

          .users-table td:last-child::before {
            display: block;
            margin-bottom: 0.4rem;
          }
        }
      </style>
    </head>
    <body>
      <main class="page">
        <header class="hero">
          <p class="eyebrow">AI Appliance Platform</p>
          <h1>AI Appliance Dashboard</h1>
          <p class="subtitle">Manage the MagicStick appliance runtime from one place.</p>
          <div class="hero-meta">
            <span class="chip">Last updated: <strong>
    HTML
      printf '%s' "$(html_escape "$rendered_at")" >> "$tmp"
      cat <<'HTML' >> "$tmp"
            </strong></span>
            <span class="chip">Refresh cadence: every 30s</span>
            <span class="chip" id="session-user">Signed in</span>
            <a class="chip" href="/logout">Sign out</a>
          </div>
        </header>

        <section class="control-panel" aria-label="Appliance management">
          <div class="panel-heading">
            <h2>Appliance Control</h2>
            <span id="api-state" class="status-pill waiting">Connecting</span>
          </div>
          <nav class="tabs" aria-label="Dashboard pages">
            <button class="tab-button" type="button" aria-selected="true" data-tab="overview">Overview</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="modules">Modules</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="instances">Instances</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="models">Models</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="settings">Settings</button>
            <button class="tab-button" id="users-tab-button" type="button" aria-selected="false" data-tab="users" hidden>Users</button>
            <button class="tab-button" type="button" aria-selected="false" data-tab="system">System Status</button>
          </nav>

          <section id="tab-overview" class="tab-panel">
            <div class="overview-workspace">
              <div class="overview-metrics">
                <article class="dashboard-card overview-metric">
                  <h3>Appliance</h3>
                  <p id="appliance-summary">Loading</p>
                </article>
                <article class="dashboard-card overview-metric">
                  <h3>Modules</h3>
                  <p id="module-summary">Loading</p>
                </article>
                <article class="dashboard-card overview-metric">
                  <h3>Instances</h3>
                  <p id="instance-summary">Loading</p>
                </article>
                <article class="dashboard-card overview-metric">
                  <h3>Models</h3>
                  <p id="model-summary">Loading</p>
                </article>
              </div>
              <section class="dashboard-card overview-panel">
                <div class="module-group-heading">
                  <h3>Available URLs</h3>
                  <span id="overview-app-count">Loading</span>
                </div>
                <div id="overview-app-list" class="overview-app-list"></div>
              </section>
              <section class="dashboard-card overview-panel">
                <div class="module-group-heading">
                  <h3>Attention</h3>
                  <span id="overview-attention-count">Loading</span>
                </div>
                <div id="overview-attention-list" class="mini-list"></div>
              </section>
            </div>
          </section>

          <section id="tab-modules" class="tab-panel" hidden>
            <div id="module-list" class="module-list"></div>
            <p id="module-output" class="api-output"></p>
          </section>

          <section id="tab-instances" class="tab-panel" hidden>
            <article class="dashboard-card" id="instance-form-empty" hidden>
              <h3>No installed instance modules</h3>
              <p>Enable an instance module and wait until it is Ready before creating an instance.</p>
            </article>
            <div class="instance-create-toolbar" id="instance-create-panel">
              <button class="control-button primary" id="instance-create-open" type="button">Create Instance</button>
              <p>Choose an installed instance type first. The next step shows only its configuration.</p>
            </div>
            <dialog class="dashboard-dialog instance-create-dialog" id="instance-create-dialog" aria-labelledby="instance-create-title" aria-describedby="instance-create-description">
              <div class="dialog-form">
                <div class="dialog-heading">
                  <h3 id="instance-create-title">Create Instance</h3>
                  <p id="instance-create-description">Choose the type of instance you want to create.</p>
                </div>
                <section id="instance-type-step" aria-label="Instance type">
                  <div class="instance-type-picker" id="instance-type-picker"></div>
                </section>
                <section class="instance-config-step" id="instance-config-step" aria-label="Instance configuration" hidden>
                  <div class="instance-config-heading">
                    <button class="control-button" id="instance-create-back" type="button">Back to types</button>
                    <strong id="instance-selected-type"></strong>
                  </div>
                  <div class="instance-create-grid">
              <form class="dashboard-card instance-form" data-instance-type="openclaw">
                <h3>OpenClaw</h3>
                <div class="form-grid">
                  <label class="field">Name<input name="name" value="default" /></label>
                  <label class="field">Model<select name="model" data-model-select="chat" data-model-fallback="CHANGEME_MODEL"><option value="">Loading models</option></select></label>
                  <label class="field">Access<select name="authentication"><option value="sso">SSO protected</option><option value="none">Public without login</option></select></label>
                  <label class="field">Minimum Role<select name="role"><option value="user">Authenticated user</option><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Administrator</option></select></label>
                  <label class="field">Exposure<select name="exposure"><option value="localAndPublic">Local and public hosts</option><option value="local">Local host only</option></select></label>
                </div>
                <details class="module-advanced">
                  <summary>Configure</summary>
                  <div class="form-grid">
                    <label class="field">Storage<input name="storage" value="20Gi" /></label>
                  </div>
                </details>
                <button class="control-button primary" type="submit">Create OpenClaw</button>
              </form>
              <form class="dashboard-card instance-form" data-instance-type="hermes">
                <h3>Hermes</h3>
                <div class="form-grid">
                  <label class="field">Name<input name="name" value="default" /></label>
                  <label class="field">Model<select name="model" data-model-select="chat" data-model-fallback="qwen3635b"><option value="">Loading models</option></select></label>
                  <label class="field">Access<select name="authentication"><option value="sso">SSO protected</option><option value="none">Public without login</option></select></label>
                  <label class="field">Minimum Role<select name="role"><option value="user">Authenticated user</option><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Administrator</option></select></label>
                  <label class="field">Exposure<select name="exposure"><option value="localAndPublic">Local and public hosts</option><option value="local">Local host only</option></select></label>
                </div>
                <details class="module-advanced">
                  <summary>Configure</summary>
                  <div class="form-grid">
                    <label class="field">Storage<input name="storage" value="10Gi" /></label>
                  </div>
                </details>
                <button class="control-button primary" type="submit">Create Hermes</button>
              </form>
              <form class="dashboard-card instance-form" data-instance-type="paperclip">
                <h3>Paperclip</h3>
                <div class="form-grid">
                  <label class="field">Name<input name="name" value="default" /></label>
                  <label class="field">Admin Email<input name="adminEmail" value="admin@example.com" /></label>
                  <label class="field">Default Model<select name="model" data-model-select="chat" data-model-fallback="CHANGEME_MODEL"><option value="">Loading models</option></select></label>
                  <label class="field">Access<select name="authentication"><option value="sso">SSO protected</option><option value="none">Public without login</option></select></label>
                  <label class="field">Minimum Role<select name="role"><option value="user">Authenticated user</option><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Administrator</option></select></label>
                  <label class="field">Exposure<select name="exposure"><option value="localAndPublic">Local and public hosts</option><option value="local">Local host only</option></select></label>
                </div>
                <fieldset class="runtime-options">
                  <legend>Agent runtimes</legend>
                  <label class="runtime-option"><input type="checkbox" name="openCodeEnabled" checked /><span>OpenCode</span></label>
                  <label class="runtime-option"><input type="checkbox" name="openClawEnabled" data-gateway-toggle="openclaw" /><span>OpenClaw Gateway</span></label>
                  <label class="field">OpenClaw Instance<select name="openClawInstanceRef" data-instance-ref-type="openclaw" disabled><option value="">No instance available</option></select></label>
                  <label class="runtime-option"><input type="checkbox" name="hermesEnabled" data-gateway-toggle="hermes" /><span>Hermes Gateway</span></label>
                  <label class="field">Hermes Instance<select name="hermesInstanceRef" data-instance-ref-type="hermes" disabled><option value="">No instance available</option></select></label>
                </fieldset>
                <details class="module-advanced">
                  <summary>Configure</summary>
                  <div class="form-grid">
                    <label class="field">Storage<input name="storage" value="5Gi" /></label>
                    <label class="field">Postgres<input name="postgresStorage" value="10Gi" /></label>
                    <label class="field">Parallel Agents<input name="maxConcurrentAgents" type="number" min="1" max="10" step="1" value="2" /></label>
                  </div>
                </details>
                <button class="control-button primary" type="submit">Create Paperclip</button>
              </form>
              <form class="dashboard-card instance-form" data-instance-type="kubeopencode">
                <h3>KubeOpenCode</h3>
                <div class="form-grid">
                  <label class="field">Name<input name="name" value="default" /></label>
                  <label class="field">Model<select name="model" data-model-select="chat" data-model-fallback="CHANGEME_MODEL"><option value="">Loading models</option></select></label>
                  <label class="field">Template<input name="template" value="default-coder" /></label>
                  <label class="field">Access<select name="authentication"><option value="sso">SSO protected</option><option value="none">Public without login</option></select></label>
                  <label class="field">Minimum Role<select name="role"><option value="user">Authenticated user</option><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Administrator</option></select></label>
                  <label class="field">Exposure<select name="exposure"><option value="localAndPublic">Local and public hosts</option><option value="local">Local host only</option></select></label>
                </div>
                <button class="control-button primary" type="submit">Create KubeOpenCode</button>
              </form>
              <form class="dashboard-card instance-form" data-instance-type="odysseus">
                <h3>Odysseus</h3>
                <div class="form-grid">
                  <label class="field">Name<input name="name" value="default" /></label>
                  <label class="field">Model<select name="model" data-model-select="chat" data-model-fallback="CHANGEME_MODEL"><option value="">Loading models</option></select></label>
                  <label class="field">Access<select name="authentication"><option value="sso">SSO protected</option><option value="none">Public without login</option></select></label>
                  <label class="field">Minimum Role<select name="role"><option value="user">Authenticated user</option><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Administrator</option></select></label>
                  <label class="field">Exposure<select name="exposure"><option value="localAndPublic">Local and public hosts</option><option value="local">Local host only</option></select></label>
                </div>
                <details class="module-advanced">
                  <summary>Configure</summary>
                  <div class="form-grid">
                    <label class="field">Storage<input name="storage" value="20Gi" /></label>
                    <label class="field">Chroma<input name="chromaStorage" value="5Gi" /></label>
                    <label class="field">SearXNG<input name="searxngStorage" value="1Gi" /></label>
                    <label class="field">ntfy<input name="ntfyStorage" value="1Gi" /></label>
                  </div>
                </details>
                <button class="control-button primary" type="submit">Create Odysseus</button>
              </form>
                  </div>
                </section>
                <div class="dialog-actions">
                  <button class="control-button" type="button" data-dialog-cancel>Cancel</button>
                </div>
              </div>
            </dialog>
            <div id="instance-list" class="module-list"></div>
            <p id="instance-output" class="api-output"></p>
          </section>

          <section id="tab-models" class="tab-panel" hidden>
            <div class="model-workspace">
              <details class="model-create-panel">
                <summary class="model-create-summary">
                  <span>
                    <strong>Create Model</strong>
                    <small>Local presets and external providers</small>
                  </span>
                  <span class="status-pill">Create</span>
                </summary>
                <div class="model-create-grid">
                  <form class="dashboard-card model-form" id="local-model-form">
                    <h3>Local Model</h3>
                    <p class="module-message" id="local-model-requirements" role="status">Checking whether GPU and KubeAI are ready.</p>
                    <fieldset class="model-form-fields" id="local-model-fields" disabled>
                      <div class="form-grid">
                      <label class="field">Name<input name="name" value="qwen352bvlembedding" /></label>
                      <label class="field">Preset<select name="preset" id="local-model-preset"><option value="qwen352bvlembedding">qwen352bvlembedding</option><option value="qwen3635b">qwen3635b</option><option value="qwen359b">qwen359b</option><option value="custom">Custom</option></select></label>
                      <label class="field">Type<select name="modelType"><option value="chat">chat</option><option value="embedding">embedding</option></select></label>
                      <label class="field">VRAM Limit<input name="vram" value="5Gi" /></label>
                      <label class="field">HF URL<input name="url" placeholder="hf://example/model" /></label>
                      <label class="field">Context Size<input name="contextWindow" value="4096" /></label>
                      <label class="field">Max Num Seqs<input name="maxNumSeqs" placeholder="32" /></label>
                      </div>
                      <div class="vram-estimate" id="vram-estimate">
                      <div class="vram-estimate-header">
                        <strong>VRAM Estimate</strong>
                        <span id="vram-estimate-status">Waiting for model metadata</span>
                      </div>
                      <div class="vram-summary-grid">
                        <div><span>Minimum</span><strong id="vram-estimate-minimum">-</strong></div>
                        <div><span>Recommended</span><strong id="vram-estimate-recommended">-</strong></div>
                        <div><span>Available</span><strong id="vram-estimate-maximum">-</strong></div>
                      </div>
                      <label class="field">VRAM Limit<input id="vram-estimate-slider" type="range" min="0" max="0" step="256" disabled /></label>
                      <div class="vram-estimate-row">
                        <span id="vram-estimate-selected">Selected: -</span>
                        <span id="vram-estimate-meta">-</span>
                      </div>
                      <div class="segmented-control vram-choice">
                        <button class="control-button" type="button" data-vram-use="minimum" disabled>Minimum</button>
                        <button class="control-button primary" type="button" data-vram-use="recommended" disabled>Recommended</button>
                        <button class="control-button" type="button" data-vram-use="maximum" disabled>Max</button>
                      </div>
                      <details class="vram-breakdown-details">
                        <summary>Breakdown</summary>
                        <div class="vram-breakdown">
                          <div><span>Weights</span><strong id="vram-estimate-weights">-</strong></div>
                          <div><span>KV Cache</span><strong id="vram-estimate-kv">-</strong></div>
                          <div><span>Reserve</span><strong id="vram-estimate-reserve">-</strong></div>
                        </div>
                      </details>
                      <div class="estimate-callouts" id="vram-estimate-warnings"></div>
                      </div>
                      <button class="control-button primary" type="submit">Add Local Model</button>
                    </fieldset>
                  </form>
                  <form class="dashboard-card model-form" id="external-model-form">
                    <h3>External Model</h3>
                    <p class="module-message">Uses a remote provider through LiteLLM. No local GPU driver or KubeAI installation is required.</p>
                    <div class="form-grid">
                      <label class="field">Name<input name="name" value="example-openai-gpt-4o-mini" /></label>
                      <label class="field">Provider Model<input name="model" value="openai/gpt-4o-mini" /></label>
                      <label class="field">API Base<input name="apiBase" value="https://api.openai.com/v1" /></label>
                      <label class="field">Type<select name="modelType"><option value="chat">chat</option><option value="embedding">embedding</option></select></label>
                      <label class="field">Context<input name="contextWindow" value="128000" /></label>
                      <label class="field">API Key<input name="apiKey" type="password" placeholder="CHANGEME" /></label>
                    </div>
                    <button class="control-button primary" type="submit">Add External Model</button>
                  </form>
                </div>
              </details>

              <article class="dashboard-card model-vram-card">
                <h3>VRAM</h3>
                <p id="vram-summary">Waiting for GPU metrics.</p>
                <div id="vram-list" class="mini-list"></div>
                <button class="control-button danger" id="remove-local-runtime" type="button" hidden>Remove Local GPU Runtime</button>
              </article>

              <section class="model-section">
                <div class="module-group-heading">
                  <h3>Installed Models</h3>
                  <span id="model-list-count">Waiting for catalog</span>
                </div>
                <div id="model-list" class="module-list model-list"></div>
              </section>
            </div>
            <p id="model-output" class="api-output"></p>
          </section>

          <section id="tab-settings" class="tab-panel" hidden>
            <div class="dashboard-grid">
              <form class="dashboard-card" id="settings-form">
                <h3>Domains</h3>
                <div class="form-grid">
                  <label class="field">Public Domain<input name="publicDomain" value="magicstick.example.com" /></label>
                  <label class="field">mDNS Domain<input name="mdnsDomain" value="magicstick.local" /></label>
                  <label class="field">Dashboard Public Host<input name="dashboardHost" value="magicstick.example.com" /></label>
                </div>
                <button class="control-button primary" type="submit">Save Domains</button>
              </form>
              <article class="dashboard-card">
                <h3>Addresses</h3>
                <div class="mini-list">
                  <div class="mini-item" id="settings-dashboard-public">Dashboard public: loading</div>
                  <div class="mini-item" id="settings-dashboard-local">Dashboard local: loading</div>
                  <div class="mini-item" id="settings-anythingllm-public">AnythingLLM public: loading</div>
                  <div class="mini-item" id="settings-anythingllm-local">AnythingLLM local: loading</div>
                </div>
              </article>
            </div>
            <p id="settings-output" class="api-output"></p>
          </section>

          <section id="tab-users" class="tab-panel" hidden aria-labelledby="users-tab-button">
            <div class="users-workspace">
              <div class="users-toolbar">
                <form id="user-search-form" role="search">
                  <label class="field user-search-field">Search users
                    <input id="user-search" name="search" type="search" autocomplete="off" placeholder="Username, name, or email" />
                  </label>
                  <label class="field">Status
                    <select id="user-status-filter" name="status">
                      <option value="all">All</option>
                      <option value="enabled">Enabled</option>
                      <option value="disabled">Disabled</option>
                    </select>
                  </label>
                  <label class="field">Source
                    <select id="user-source-filter" name="source">
                      <option value="all">All</option>
                      <option value="local">Local</option>
                      <option value="external">External</option>
                    </select>
                  </label>
                  <button class="control-button" type="submit">Search</button>
                  <button class="control-button" id="user-refresh" type="button">Refresh</button>
                </form>
                <button class="control-button primary" id="user-create" type="button">Create User</button>
              </div>
              <p id="users-output" class="api-output" role="status" aria-live="polite">Open this page to load users.</p>
              <div id="users-loading" class="user-empty-state" role="status" hidden>Loading users…</div>
              <div id="users-error" class="user-empty-state" role="alert" hidden></div>
              <div id="users-empty" class="user-empty-state" hidden>No users match the current search and filters.</div>
              <div id="users-table-wrap" class="users-table-wrap" hidden>
                <table class="users-table">
                  <caption class="sr-only">Keycloak users known to this appliance</caption>
                  <thead>
                    <tr>
                      <th scope="col">User</th>
                      <th scope="col">Email</th>
                      <th scope="col">Source</th>
                      <th scope="col">Status</th>
                      <th scope="col">Access</th>
                      <th scope="col">Created</th>
                      <th scope="col">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="users-list"></tbody>
                </table>
              </div>
              <div class="users-pagination" id="users-pagination" hidden>
                <span id="users-page-summary">0 users</span>
                <div class="action-row">
                  <label class="field">Per page
                    <select id="users-page-size">
                      <option value="10">10</option>
                      <option value="25" selected>25</option>
                      <option value="50">50</option>
                    </select>
                  </label>
                  <button class="control-button" id="users-previous" type="button">Previous</button>
                  <button class="control-button" id="users-next" type="button">Next</button>
                </div>
              </div>
            </div>
          </section>

          <section id="tab-system" class="tab-panel" hidden>
            <div class="dashboard-grid">
              <article class="dashboard-card"><h3>Flux</h3><div id="flux-list" class="mini-list"></div></article>
              <article class="dashboard-card"><h3>Pods</h3><p id="pod-summary">Loading</p></article>
              <article class="dashboard-card"><h3>Gateway Routes</h3><div id="route-list" class="mini-list"></div></article>
            </div>
          </section>
        </section>

        <footer>
          Generated by the dashboard renderer.
        </footer>
      </main>

      <dialog class="dashboard-dialog" id="user-editor-dialog" aria-labelledby="user-editor-title">
        <form class="dialog-form" id="user-editor-form">
          <div class="dialog-heading">
            <h3 id="user-editor-title">Create User</h3>
            <p id="user-editor-description">Create a local Keycloak user for this appliance.</p>
          </div>
          <div class="form-grid">
            <label class="field">Username
              <input name="username" autocomplete="username" required maxlength="128" pattern="[A-Za-z0-9][A-Za-z0-9._@+-]{0,127}" title="Start with a letter or digit; then use letters, digits, dot, underscore, at sign, plus, or hyphen." />
            </label>
            <label class="field">First name
              <input name="firstName" autocomplete="given-name" maxlength="128" />
            </label>
            <label class="field">Last name
              <input name="lastName" autocomplete="family-name" maxlength="128" />
            </label>
            <label class="field">Email
              <input name="email" type="email" autocomplete="email" maxlength="254" required />
            </label>
            <label class="field" id="user-editor-access-field">Access level
              <select name="accessLevel">
                <option value="user">User</option>
                <option value="viewer">Viewer</option>
                <option value="operator">Operator</option>
                <option value="admin">Administrator</option>
              </select>
            </label>
            <label class="field" id="user-editor-password-field">Temporary password
              <input name="password" type="password" autocomplete="new-password" minlength="12" />
            </label>
            <label class="field" id="user-editor-confirm-field">Confirm temporary password
              <input name="passwordConfirmation" type="password" autocomplete="new-password" minlength="12" />
            </label>
          </div>
          <label class="checkbox-field" id="user-editor-enabled-field">
            <input name="enabled" type="checkbox" checked />
            Enable the account after it has been created
          </label>
          <p class="dialog-helper" id="user-editor-source-note" hidden></p>
          <p class="dialog-error" id="user-editor-error" role="alert" aria-live="assertive"></p>
          <div class="dialog-actions">
            <button class="control-button" type="button" data-dialog-cancel>Cancel</button>
            <button class="control-button primary" id="user-editor-submit" type="submit">Create User</button>
          </div>
        </form>
      </dialog>

      <dialog class="dashboard-dialog" id="user-role-dialog" aria-labelledby="user-role-title">
        <form class="dialog-form" id="user-role-form">
          <div class="dialog-heading">
            <h3 id="user-role-title">Change access</h3>
            <p id="user-role-description">Choose the MagicStick access level. Unmanaged and inherited roles are preserved.</p>
          </div>
          <label class="field">Access level
            <select name="accessLevel">
              <option value="user">User</option>
              <option value="viewer">Viewer</option>
              <option value="operator">Operator</option>
              <option value="admin">Administrator</option>
            </select>
          </label>
          <p class="user-role-note" id="user-role-note"></p>
          <p class="dialog-error" id="user-role-error" role="alert" aria-live="assertive"></p>
          <div class="dialog-actions">
            <button class="control-button" type="button" data-dialog-cancel>Cancel</button>
            <button class="control-button primary" type="submit">Save Access</button>
          </div>
        </form>
      </dialog>

      <dialog class="dashboard-dialog" id="user-password-dialog" aria-labelledby="user-password-title">
        <form class="dialog-form" id="user-password-form">
          <div class="dialog-heading">
            <h3 id="user-password-title">Reset password</h3>
            <p id="user-password-description">Set a temporary password. The user must change it at the next sign-in.</p>
          </div>
          <div class="form-grid">
            <label class="field">Temporary password
              <input name="password" type="password" autocomplete="new-password" minlength="12" required />
            </label>
            <label class="field">Confirm temporary password
              <input name="passwordConfirmation" type="password" autocomplete="new-password" minlength="12" required />
            </label>
          </div>
          <p class="dialog-error" id="user-password-error" role="alert" aria-live="assertive"></p>
          <div class="dialog-actions">
            <button class="control-button" type="button" data-dialog-cancel>Cancel</button>
