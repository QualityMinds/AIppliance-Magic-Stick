      <script>
        (() => {
          const $ = (id) => document.getElementById(id);
          const apiState = $('api-state');
          let latestModelPayload = {};
          let latestModulePayload = {};
          let latestSettings = {
            publicDomain: 'magicstick.example.com',
            mdnsDomain: 'magicstick.local',
            mdnsName: 'magicstick'
          };
          let renderedPresetSignature = '';
          let localPresetLastApplied = '';
          let activeModelCreateSource = '';
          let activeLocalEngine = '';
          let activeComputeTarget = '';
          let activeLocalModelSource = '';
          let directLocalModelUrl = '';
          let localPresetSourceValue = '';
          let huggingFaceSearchResults = [];
          let huggingFaceArtifacts = [];
          let selectedHuggingFaceModel = null;
          let selectedHuggingFaceArtifact = null;
          let modelDiscoveryAutoName = '';
          let modelDiscoveryContextDirty = false;
          let modelDiscoveryAutoContext = '4096';
          let huggingFacePopularRequest = 0;
          let huggingFacePopularSignature = '';
          let huggingFaceSearchRequest = 0;
          let huggingFaceArtifactRequest = 0;
          let huggingFaceSearchTimer = null;
          let huggingFaceSearchNextCursor = null;
          let huggingFaceSearchTotal = 0;
          let huggingFaceSearchQuery = '';
          let huggingFaceArtifactNextCursor = null;
          let huggingFaceArtifactTotal = 0;
          let huggingFaceArtifactRepo = '';
          const pendingModuleActions = {};
          const pendingModelDeletes = {};
          let vramEstimateTimer = null;
          let vramEstimateRequest = 0;
          let latestVramEstimate = null;
          let latestVramEstimateSignature = '';
          let latestSession = {};
          let usersLoaded = false;
          let usersLoading = false;
          let usersRequestSequence = 0;
          let usersPageFirst = 0;
          let usersPageSize = 25;
          let usersTotal = 0;
          let usersPageItems = [];
          let apiAccessLoaded = false;
          let apiAccessLoading = false;
          let apiAccessItems = [];
          let kubernetesAccessLoaded = false;
          let kubernetesAccessLoading = false;
          let kubernetesAccessItems = [];
          let kubernetesAccessConfiguration = {};
          let activeKubernetesAccessUser = null;
          let activeUserEditor = null;
          let activeUserRoles = null;
          let activeUserPassword = null;
          let activeUserConfirmation = null;
          let activeApiAccessRevocation = null;
          let activeInstanceCreateType = '';
          let activeServiceFilter = 'all';
          let platformServicesExpanded = false;
          const expandedApplicationInstances = new Set();
          const dialogOpeners = new Map();

          const setApiState = (text, ok = false) => {
            if (!apiState) { return; }
            apiState.textContent = text;
            apiState.className = ok ? 'status-pill ready' : 'status-pill waiting';
          };

          const request = async (path, options = {}) => {
            const response = await fetch(path, {
              headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
              ...options
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(payload.error || response.statusText);
            }
            return payload;
          };

          const dashboardRequest = (path, options = {}) => {
            const method = String(options.method || 'GET').toUpperCase();
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (method !== 'GET' && method !== 'HEAD') {
              headers['X-MagicStick-CSRF'] = 'dashboard';
            }
            return request(path, { ...options, headers });
          };

          const userRequest = (path, options = {}) => dashboardRequest(path, options);

          const titleFromKey = (name) => String(name || '')
            .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
            .replace(/[-_]+/g, ' ')
            .split(/\s+/)
            .filter(Boolean)
            .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
            .join(' ') || 'Module';

          const moduleCatalog = (modulePayload) => (((modulePayload || {}).catalogJson || {}).modules || {});

          const moduleGroups = (modulePayload) => (((modulePayload || {}).catalogJson || {}).groups || {});

          const moduleSpec = (modulePayload, name) => {
            const modules = ((modulePayload || {}).modules || {});
            return modules[name] || {};
          };

          const applicationDefinitions = (modulePayload) => (((modulePayload || {}).catalogJson || {}).applications || {});

          const requiredModulesForInstance = (modulePayload, type) => {
            const definition = applicationDefinitions(modulePayload)[type] || {};
            return Array.isArray(definition.requiredModules) ? definition.requiredModules : [];
          };

          const primaryModuleForApplication = (modulePayload, type) => {
            return requiredModulesForInstance(modulePayload, type)[0] || '';
          };

          const applicationPrimaryModules = (modulePayload) => new Set(
            Object.keys(applicationDefinitions(modulePayload))
              .map((type) => primaryModuleForApplication(modulePayload, type))
              .filter(Boolean)
          );

          const moduleInstalled = (modulePayload, name) => {
            const spec = moduleSpec(modulePayload, name);
            const status = spec.status || {};
            const phase = String(status.phase || '').toLowerCase();
            const activationMode = spec.activationMode || ((spec.catalog || {}).activationMode);
            if (spec.enabled !== true) { return false; }
            if (activationMode === 'static' && !phase) { return true; }
            return phase === 'ready';
          };

          const instanceTypeInstalled = (modulePayload, type) => {
            const requiredModules = requiredModulesForInstance(modulePayload, type);
            return requiredModules.length > 0 && requiredModules.every((name) => moduleInstalled(modulePayload, name));
          };

          const computeTargets = (modelPayload = latestModelPayload) => ((((modelPayload || {}).computeTargets || {}).targets) || []);

          const normalizeLocalEngine = (value) => {
            const normalized = String(value || '').trim().toUpperCase();
            if (!normalized) { return ''; }
            return normalized === 'OLLAMA' ? 'OLlama' : 'VLLM';
          };

          const selectedLocalEngine = () => {
            const field = $('local-model-engine');
            return normalizeLocalEngine(activeLocalEngine || (field || {}).value || '');
          };

          const selectedLocalModelType = () => {
            const form = $('local-model-form');
            const value = String((((form || {}).elements || {}).modelType || {}).value || 'chat').trim().toLowerCase();
            return value || 'chat';
          };

          const targetSupportsEngine = (target, engine = selectedLocalEngine()) => Boolean(
            target
            && normalizeLocalEngine(engine)
            && (target.engines || ['VLLM']).map(normalizeLocalEngine).includes(normalizeLocalEngine(engine))
          );

          const availableComputeTargets = (modelPayload = latestModelPayload, engine = selectedLocalEngine()) => computeTargets(modelPayload)
            .filter((target) => target.available === true && targetSupportsEngine(target, engine));

          const engineDefinitions = [
            { id: 'VLLM', label: 'vLLM', description: 'High-throughput OpenAI-compatible inference for Hugging Face models.' },
            { id: 'OLlama', label: 'Ollama', description: 'Simple local model serving with Ollama model references.' }
          ];

          const renderInferenceEngines = (modelPayload = latestModelPayload) => {
            const field = $('local-model-engine');
            const message = $('inference-engine-message');
            if (!field) { return; }
            const requested = selectedLocalEngine();
            const engines = engineDefinitions.filter((definition) => availableComputeTargets(modelPayload, definition.id).length > 0);
            field.replaceChildren();
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select an inference engine';
            field.appendChild(placeholder);
            engines.forEach((definition) => {
              const targets = availableComputeTargets(modelPayload, definition.id);
              const option = document.createElement('option');
              option.value = definition.id;
              option.textContent = definition.label + ' (' + targets.length + ' available ' + (targets.length === 1 ? 'target' : 'targets') + ')';
              field.appendChild(option);
            });
            const selected = engines.some((definition) => definition.id === requested) ? requested : '';
            activeLocalEngine = selected;
            field.value = selected;
            field.disabled = engines.length === 0;
            if (message) {
              message.textContent = activeModelCreateSource === 'local' && !engines.length
                ? 'No inference engine currently has available hardware.'
                : '';
            }
          };

          const resetLocalModelSelection = () => {
            activeLocalEngine = '';
            activeComputeTarget = '';
            const engineField = $('local-model-engine');
            const targetField = $('local-model-compute-target');
            const artifactField = $('local-model-artifact');
            if (engineField) { engineField.value = ''; }
            if (targetField) { targetField.value = ''; }
            if (artifactField) {
              artifactField.replaceChildren();
              const option = document.createElement('option');
              option.value = '';
              option.textContent = 'Preset default';
              artifactField.appendChild(option);
              artifactField.disabled = true;
            }
            const artifactNote = $('local-model-artifact-note');
            if (artifactNote) {
              artifactNote.textContent = '';
              artifactNote.hidden = true;
            }
            renderedPresetSignature = '';
            localPresetLastApplied = '';
            resetHuggingFaceDiscovery();
          };

          const updateModelCreateVisibility = () => {
            const local = activeModelCreateSource === 'local';
            const external = activeModelCreateSource === 'external';
            const engineField = $('model-engine-field');
            const computeField = $('model-compute-field');
            const localForm = $('local-model-form');
            const externalForm = $('external-model-form');
            const requirements = $('local-model-requirements');
            if (engineField) { engineField.hidden = !local; }
            if (computeField) { computeField.hidden = !local || !selectedLocalEngine(); }
            if (requirements) { requirements.hidden = !local || !selectedLocalEngine(); }
            if (localForm) { localForm.hidden = !local || !selectedComputeTarget(); }
            if (externalForm) { externalForm.hidden = !external; }
          };

          const resetModelCreateForm = () => {
            activeModelCreateSource = '';
            const sourceField = $('model-source-select');
            if (sourceField) { sourceField.value = ''; }
            resetLocalModelSelection();
            renderInferenceEngines(latestModelPayload);
            renderComputeTargets(latestModelPayload);
            renderLocalModelAvailability(latestModelPayload);
            updateModelCreateVisibility();
          };

          const selectModelCreateSource = (source) => {
            activeModelCreateSource = source === 'local' || source === 'external' ? source : '';
            const sourceField = $('model-source-select');
            if (sourceField) { sourceField.value = activeModelCreateSource; }
            renderInferenceEngines(latestModelPayload);
            renderComputeTargets(latestModelPayload);
            renderLocalModelAvailability(latestModelPayload);
            updateModelCreateVisibility();
          };

          const selectLocalEngine = (engine) => {
            const normalized = normalizeLocalEngine(engine);
            if (!normalized || !availableComputeTargets(latestModelPayload, normalized).length) {
              activeLocalEngine = '';
              activeComputeTarget = '';
              const engineField = $('local-model-engine');
              const targetField = $('local-model-compute-target');
              if (engineField) { engineField.value = ''; }
              if (targetField) { targetField.value = ''; }
              renderComputeTargets(latestModelPayload);
              renderLocalModelAvailability(latestModelPayload);
              updateModelCreateVisibility();
              return false;
            }
            activeLocalEngine = normalized;
            const engineField = $('local-model-engine');
            const targetField = $('local-model-compute-target');
            if (engineField) { engineField.value = normalized; }
            const selectedTarget = computeTarget(activeComputeTarget, latestModelPayload);
            if (!selectedTarget || selectedTarget.available !== true || !targetSupportsEngine(selectedTarget, normalized)) {
              activeComputeTarget = '';
              if (targetField) { targetField.value = ''; }
            }
            renderedPresetSignature = '';
            localPresetLastApplied = '';
            renderComputeTargets(latestModelPayload);
            if (activeComputeTarget) {
              selectComputeTarget(activeComputeTarget);
            } else {
              renderLocalModelAvailability(latestModelPayload);
              updateModelCreateVisibility();
            }
            return true;
          };

          const computeTarget = (targetId, modelPayload = latestModelPayload) => computeTargets(modelPayload)
            .find((target) => String(target.id || '') === String(targetId || ''));

          const selectedComputeTarget = () => {
            const field = $('local-model-compute-target');
            return String((field || {}).value || activeComputeTarget || '').trim();
          };

          const computeTargetKind = (targetId = selectedComputeTarget()) => {
            const target = computeTarget(targetId);
            return String((target || {}).kind || (targetId === 'cpu' ? 'cpu' : 'gpu')).toLowerCase();
          };

          const presetVariant = (preset, targetId, engine = selectedLocalEngine()) => {
            if (!preset || typeof preset !== 'object') { return null; }
            const base = Object.fromEntries(Object.entries(preset).filter(([key]) => key !== 'variants'));
            const variants = Array.isArray(preset.variants) ? preset.variants : [];
            if (!variants.length) {
              return targetId === 'nvidia-gpu' && normalizeLocalEngine(engine) === 'VLLM' ? base : null;
            }
            const variant = variants.find((item) => (
              String(item.computeTarget || '').toLowerCase() === String(targetId || '').toLowerCase()
              && normalizeLocalEngine(item.engine || 'VLLM') === normalizeLocalEngine(engine)
            ));
            return variant ? { ...base, ...variant } : null;
          };

          const presetArtifacts = (variant) => Array.isArray((variant || {}).artifacts)
            ? variant.artifacts.filter((artifact) => artifact && String(artifact.id || '').trim())
            : [];

          const resolvedPresetArtifact = (variant, artifactId = '') => {
            if (!variant) { return { preset: null, artifact: null }; }
            const artifacts = presetArtifacts(variant);
            if (!artifacts.length) { return { preset: variant, artifact: null }; }
            const requested = String(artifactId || variant.defaultArtifact || '').trim();
            const artifact = artifacts.find((item) => String(item.id || '') === requested) || artifacts[0];
            return {
              preset: {
                ...variant,
                ...artifact,
                engine: variant.engine,
                computeTarget: variant.computeTarget,
                artifact: String(artifact.id)
              },
              artifact
            };
          };

          const selectedLocalArtifact = () => String((($('local-model-artifact') || {}).value) || '').trim();

          const renderLocalArtifactNote = (artifact) => {
            const note = $('local-model-artifact-note');
            if (!note) { return; }
            const message = String((artifact || {}).compatibilityNote || '').trim();
            note.textContent = message;
            note.hidden = !message;
          };

          const renderLocalArtifactOptions = (variant, requestedArtifact = '') => {
            const select = $('local-model-artifact');
            if (!select) { return ''; }
            const artifacts = presetArtifacts(variant);
            select.replaceChildren();
            if (!artifacts.length) {
              const option = document.createElement('option');
              option.value = '';
              option.textContent = 'Preset default';
              select.appendChild(option);
              select.value = '';
              select.disabled = true;
              renderLocalArtifactNote(null);
              return '';
            }
            artifacts.forEach((artifact) => {
              const option = document.createElement('option');
              option.value = String(artifact.id);
              option.textContent = String(artifact.title || artifact.id);
              if (artifact.compatibilityNote) {
                option.title = String(artifact.compatibilityNote);
              }
              select.appendChild(option);
            });
            const requested = String(requestedArtifact || variant.defaultArtifact || '').trim();
            const selected = artifacts.some((artifact) => String(artifact.id) === requested)
              ? requested
              : String(artifacts[0].id);
            select.disabled = false;
            select.value = selected;
            renderLocalArtifactNote(artifacts.find((artifact) => String(artifact.id) === selected));
            return selected;
          };

          const setHuggingFaceStatus = (message, state = '') => {
            const node = $('huggingface-model-status');
            if (!node) { return; }
            node.textContent = message;
            if (state) {
              node.dataset.state = state;
            } else {
              node.removeAttribute('data-state');
            }
          };

          const renderHuggingFacePopular = (items, state = '') => {
            const container = $('huggingface-popular-models');
            if (!container) { return; }
            container.replaceChildren();
            const label = document.createElement('span');
            label.textContent = 'Trending on Hugging Face';
            container.appendChild(label);
            const models = compatibleDiscoveryItems(items).slice(0, 5);
            if (!models.length) {
              const status = document.createElement('span');
              status.id = 'huggingface-popular-status';
              status.textContent = state || 'Unavailable';
              container.appendChild(status);
              return;
            }
            models.forEach((model) => {
              const repo = discoveryRepo(model);
              const button = document.createElement('button');
              button.className = 'control-button';
              button.type = 'button';
              button.dataset.huggingfaceQuery = repo;
              button.textContent = String((model || {}).name || repo.split('/').pop() || repo);
              button.title = repo;
              button.addEventListener('click', () => {
                const query = $('huggingface-model-query');
                if (query) { query.value = repo; }
                searchHuggingFaceModels(repo);
              });
              container.appendChild(button);
            });
          };

          const loadHuggingFacePopular = async (options = {}) => {
            if (activeLocalModelSource !== 'huggingface' || !selectedLocalEngine() || !selectedComputeTarget()) {
              return false;
            }
            const signature = [selectedLocalEngine(), selectedComputeTarget(), selectedLocalModelType()].join('|');
            if (options.force !== true && signature === huggingFacePopularSignature) { return true; }
            const requestId = ++huggingFacePopularRequest;
            renderHuggingFacePopular([], 'Loading…');
            const query = new URLSearchParams({
              provider: 'huggingface',
              limit: '5',
              cursor: '0',
              engine: selectedLocalEngine(),
              computeTarget: selectedComputeTarget(),
              modelType: selectedLocalModelType()
            });
            try {
              const payload = await request('/api/model-discovery/popular?' + query.toString());
              if (requestId !== huggingFacePopularRequest) { return false; }
              huggingFacePopularSignature = signature;
              renderHuggingFacePopular((payload || {}).results || []);
              return true;
            } catch (_error) {
              if (requestId !== huggingFacePopularRequest) { return false; }
              huggingFacePopularSignature = '';
              renderHuggingFacePopular([], 'Trending unavailable');
              return false;
            }
          };

          const setDiscoverySelectPlaceholder = (select, message) => {
            if (!select) { return; }
            select.replaceChildren();
            const option = document.createElement('option');
            option.value = '';
            option.textContent = message;
            select.appendChild(option);
            select.value = '';
            select.disabled = true;
          };

          const discoveryFormats = (item) => {
            const values = Array.isArray((item || {}).formats)
              ? item.formats
              : ((item || {}).format ? [(item || {}).format] : []);
            return values.map((value) => String(value || '').trim()).filter(Boolean);
          };

          const discoveryQuantization = (item) => {
            const quantization = (item || {}).quantization;
            if (quantization && typeof quantization === 'object') {
              const label = String(quantization.label || quantization.method || '').trim();
              const bits = Number(quantization.bits || 0);
              return label + (bits && !label.includes(String(bits)) ? ' / ' + bits + '-bit' : '');
            }
            return String(quantization || (item || {}).precision || '').trim();
          };

          const discoveryCompatibility = (item) => {
            const value = (item || {}).compatibility;
            const normalized = String(value && typeof value === 'object' ? value.status : value || 'experimental').trim().toLowerCase();
            if (normalized === 'compatible') { return 'Compatible'; }
            if (normalized === 'incompatible') { return 'Incompatible'; }
            return 'Experimental';
          };

          const discoveryTrust = (item) => {
            const value = (item || {}).trustStatus;
            const normalized = String(value && typeof value === 'object' ? value.status : value || 'unverified').trim().toLowerCase();
            if (normalized === 'official') { return 'Official'; }
            if (normalized === 'community') { return 'Community'; }
            return (item || {}).gated ? 'Gated' : 'Unverified';
          };

          const compatibleDiscoveryItems = (items) => (Array.isArray(items) ? items : [])
            .filter((item) => item && discoveryCompatibility(item) !== 'Incompatible');

          const mergeDiscoveryItems = (...collections) => {
            const merged = [];
            const seen = new Set();
            collections.flat().forEach((item) => {
              const repo = discoveryRepo(item).toLowerCase();
              if (!repo || seen.has(repo)) { return; }
              seen.add(repo);
              merged.push(item);
            });
            return merged;
          };

          const updateDiscoveryLoadMore = (id, nextCursor, loading = false) => {
            const button = $(id);
            if (!button) { return; }
            const available = nextCursor !== null && nextCursor !== undefined && String(nextCursor) !== '';
            button.hidden = !available;
            button.disabled = !available || loading;
            if (id === 'huggingface-model-load-more') {
              button.textContent = loading ? 'Loading models' : 'Load more models';
            } else {
              button.textContent = loading ? 'Loading quantizations' : 'Load more quantizations';
            }
          };

          const discoveryProgress = (loaded, total, noun) => {
            const safeLoaded = Math.max(0, Number(loaded || 0));
            const safeTotal = Math.max(safeLoaded, Number(total || 0));
            const candidateLabel = noun + (safeLoaded === 1 ? ' candidate' : ' candidates');
            return safeLoaded + ' ' + candidateLabel + ' loaded from ' + safeTotal + ' discovered.';
          };

          const formatDiscoveryBytes = (value) => {
            const bytes = Number(value || 0);
            if (!Number.isFinite(bytes) || bytes <= 0) { return ''; }
            const gib = bytes / (1024 * 1024 * 1024);
            return gib >= 10 ? gib.toFixed(0) + ' GiB' : gib.toFixed(1) + ' GiB';
          };

          const formatDiscoveryParameters = (value) => {
            const count = Number(value || 0);
            if (!Number.isFinite(count) || count <= 0) { return ''; }
            return count >= 1e9 ? (count / 1e9).toFixed(count >= 10e9 ? 0 : 1) + 'B params' : Math.round(count / 1e6) + 'M params';
          };

          const formatDiscoveryContext = (value) => {
            const tokens = Number(value || 0);
            if (!Number.isFinite(tokens) || tokens <= 0) { return ''; }
            return Math.round(tokens).toLocaleString('en-US') + ' tokens';
          };

          const discoveryRepo = (item) => String((item || {}).repo || (item || {}).id || '').trim();

          const discoveryOptionLabel = (item, options = {}) => {
            const repo = discoveryRepo(item) || String((item || {}).label || 'Unknown model');
            const details = [];
            const quantization = discoveryQuantization(item);
            const formats = discoveryFormats(item);
            const size = formatDiscoveryBytes((item || {}).weightBytes);
            const parameters = formatDiscoveryParameters((item || {}).parameterCount);
            if (options.artifact && (item || {}).original) { details.push('Original'); }
            if (quantization) { details.push(quantization); }
            if (formats.length) { details.push(formats.join('/')); }
            if (parameters) { details.push(parameters); }
            if (size) { details.push(size); }
            details.push(discoveryTrust(item));
            details.push(discoveryCompatibility(item));
            return repo + (details.length ? ' — ' + details.join(' · ') : '');
          };

          const appendDiscoveryMetadata = (container, label, value) => {
            const text = String(value || '').trim();
            if (!container || !text) { return; }
            const item = document.createElement('span');
            item.className = 'model-meta-item';
            const strong = document.createElement('strong');
            strong.textContent = label + ': ';
            item.append(strong, text);
            container.appendChild(item);
          };

          const renderHuggingFaceMetadata = (item) => {
            const container = $('huggingface-model-metadata');
            if (!container) { return; }
            container.replaceChildren();
            if (!item) { return; }
            appendDiscoveryMetadata(container, 'Publisher', (item || {}).author || discoveryRepo(item).split('/')[0]);
            appendDiscoveryMetadata(container, 'Format', discoveryFormats(item).join(', '));
            appendDiscoveryMetadata(container, 'Quantization', discoveryQuantization(item) || 'Original precision');
            appendDiscoveryMetadata(container, 'Download', formatDiscoveryBytes((item || {}).downloadBytes || (item || {}).weightBytes));
            appendDiscoveryMetadata(container, 'Parameters', formatDiscoveryParameters((item || {}).parameterCount));
            appendDiscoveryMetadata(container, 'Model context', formatDiscoveryContext((item || {}).modelMaxContext || (item || {}).contextWindow));
            appendDiscoveryMetadata(container, 'Trust', discoveryTrust(item));
            appendDiscoveryMetadata(container, 'Runtime', discoveryCompatibility(item));
            if ((item || {}).revision) {
              appendDiscoveryMetadata(container, 'Revision', String(item.revision).slice(0, 12));
            }
          };

          const syncHuggingFaceEstimateMetadata = (estimate) => {
            const form = $('local-model-form');
            if (
              activeLocalModelSource !== 'huggingface'
              || !selectedHuggingFaceArtifact
              || !form
              || discoveryRepo(selectedHuggingFaceArtifact) !== String((estimate || {}).repo || '')
            ) {
              return false;
            }
            const downloadBytes = Number((estimate || {}).downloadBytes || 0);
            const modelMaxContext = Number((estimate || {}).modelMaxContext || 0);
            if (downloadBytes > 0) { selectedHuggingFaceArtifact.downloadBytes = downloadBytes; }
            if (modelMaxContext > 0) { selectedHuggingFaceArtifact.modelMaxContext = modelMaxContext; }
            renderHuggingFaceMetadata(selectedHuggingFaceArtifact);
            const contextField = form.elements.contextWindow;
            if (!contextField || modelDiscoveryContextDirty || modelMaxContext <= 0) { return false; }
            const desired = String(Math.round(modelMaxContext));
            if (String(contextField.value || '') === desired) {
              modelDiscoveryAutoContext = desired;
              return false;
            }
            setFormValue(form, 'contextWindow', desired);
            modelDiscoveryAutoContext = desired;
            return true;
          };

          const modelActivationName = (item) => {
            const repo = discoveryRepo(item);
            const candidate = String((item || {}).name || repo.split('/').pop() || 'model')
              .trim()
              .toLowerCase()
              .replace(/[^a-z0-9-]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .replace(/--+/g, '-');
            return (candidate || 'model').slice(0, 63).replace(/-+$/, '') || 'model';
          };

          const applyHuggingFaceArtifact = (artifact) => {
            const form = $('local-model-form');
            if (!form || !artifact) { return false; }
            const repo = discoveryRepo(artifact);
            if (!repo) { return false; }
            selectedHuggingFaceArtifact = artifact;
            const url = String(artifact.url || 'hf://' + repo).trim();
            const presetSelect = $('local-model-preset');
            if (presetSelect) { presetSelect.value = 'custom'; }
            renderLocalArtifactOptions(null);
            const nameField = form.elements.name;
            const generatedName = modelActivationName(artifact);
            if (nameField && (!String(nameField.value || '').trim() || nameField.value === modelDiscoveryAutoName)) {
              nameField.value = generatedName;
              modelDiscoveryAutoName = generatedName;
            }
            const pipelineTag = String(artifact.pipelineTag || '').toLowerCase();
            if (pipelineTag === 'feature-extraction' || pipelineTag === 'sentence-similarity') {
              setFormValue(form, 'modelType', 'embedding');
            }
            if (!modelDiscoveryContextDirty && (artifact.contextWindow || artifact.modelMaxContext)) {
              const context = String(artifact.contextWindow || artifact.modelMaxContext);
              setFormValue(form, 'contextWindow', context);
              modelDiscoveryAutoContext = context;
            }
            if (form.elements.url) {
              form.elements.url.value = url;
              form.elements.url.readOnly = true;
              form.elements.url.title = 'Resolved from the selected Hugging Face artifact.';
            }
            renderHuggingFaceMetadata(artifact);
            renderLocalArtifactNote({
              compatibilityNote: discoveryTrust(artifact) + ' Hugging Face artifact · ' + discoveryCompatibility(artifact) + ' for the selected runtime.'
            });
            scheduleVramEstimate();
            return true;
          };

          const renderHuggingFaceArtifacts = (items, requestedRepo = '') => {
            const select = $('huggingface-model-artifacts');
            if (!select) { return; }
            huggingFaceArtifacts = compatibleDiscoveryItems(items);
            select.replaceChildren();
            if (!huggingFaceArtifacts.length) {
              setDiscoverySelectPlaceholder(select, 'No compatible artifacts found');
              selectedHuggingFaceArtifact = null;
              return;
            }
            huggingFaceArtifacts.forEach((artifact) => {
              const option = document.createElement('option');
              option.value = discoveryRepo(artifact);
              option.textContent = discoveryOptionLabel(artifact, { artifact: true });
              select.appendChild(option);
            });
            const preferred = huggingFaceArtifacts.find((artifact) => discoveryRepo(artifact) === requestedRepo)
              || huggingFaceArtifacts.find((artifact) => artifact.original)
              || huggingFaceArtifacts[0];
            select.disabled = false;
            select.value = discoveryRepo(preferred);
            applyHuggingFaceArtifact(preferred);
          };

          const loadHuggingFaceArtifacts = async (model, options = {}) => {
            const repo = discoveryRepo(model);
            if (!repo) { return; }
            const append = options.append === true;
            if (append && (huggingFaceArtifactNextCursor === null || huggingFaceArtifactNextCursor === undefined)) { return; }
            const requestId = ++huggingFaceArtifactRequest;
            const select = $('huggingface-model-artifacts');
            const requestedRepo = options.requestedRepo || discoveryRepo(selectedHuggingFaceArtifact);
            const cursor = append ? String(huggingFaceArtifactNextCursor) : '0';
            if (!append) {
              huggingFaceArtifactRepo = repo;
              huggingFaceArtifactNextCursor = null;
              huggingFaceArtifactTotal = 0;
              if (select) { select.disabled = true; }
            }
            updateDiscoveryLoadMore('huggingface-artifact-load-more', append ? cursor : null, append);
            setHuggingFaceStatus((append ? 'Loading more quantizations for ' : 'Finding original and quantized artifacts for ') + repo + '...');
            const query = new URLSearchParams({
              provider: 'huggingface',
              repo,
              limit: '20',
              cursor,
              engine: selectedLocalEngine(),
              computeTarget: selectedComputeTarget(),
              modelType: selectedLocalModelType()
            });
            try {
              const payload = await request('/api/model-discovery/artifacts?' + query.toString());
              if (requestId !== huggingFaceArtifactRequest) { return; }
              const page = compatibleDiscoveryItems((payload || {}).artifacts || []);
              const artifacts = append ? mergeDiscoveryItems(huggingFaceArtifacts, page) : page;
              huggingFaceArtifactNextCursor = (payload || {}).nextCursor;
              huggingFaceArtifactTotal = Math.max(artifacts.length, Number((payload || {}).total || 0));
              renderHuggingFaceArtifacts(artifacts, requestedRepo);
              updateDiscoveryLoadMore('huggingface-artifact-load-more', huggingFaceArtifactNextCursor);
              setHuggingFaceStatus(
                artifacts.length
                  ? discoveryProgress(artifacts.length, huggingFaceArtifactTotal, 'artifact')
                  : 'No compatible artifact was returned for the selected runtime.',
                artifacts.length ? '' : 'error'
              );
            } catch (error) {
              if (requestId !== huggingFaceArtifactRequest) { return; }
              if (!append) {
                huggingFaceArtifactNextCursor = null;
                huggingFaceArtifactTotal = 1;
                renderHuggingFaceArtifacts([{ ...model, original: true, relation: 'selected' }], repo);
              }
              updateDiscoveryLoadMore('huggingface-artifact-load-more', huggingFaceArtifactNextCursor);
              setHuggingFaceStatus('Quantization lookup failed. Existing selections remain available: ' + (error.message || 'unknown error'), 'error');
            }
          };

          const selectHuggingFaceModel = (repo) => {
            const selected = huggingFaceSearchResults.find((item) => discoveryRepo(item) === String(repo || ''));
            if (!selected) {
              selectedHuggingFaceModel = null;
              selectedHuggingFaceArtifact = null;
              setDiscoverySelectPlaceholder($('huggingface-model-artifacts'), 'Select a model first');
              renderHuggingFaceMetadata(null);
              return false;
            }
            selectedHuggingFaceModel = selected;
            modelDiscoveryContextDirty = false;
            modelDiscoveryAutoContext = '4096';
            const form = $('local-model-form');
            if (form) {
              setFormValue(form, 'contextWindow', modelDiscoveryAutoContext);
              applyModelContextLimit(null);
            }
            renderHuggingFaceMetadata(selected);
            loadHuggingFaceArtifacts(selected);
            return true;
          };

          const renderHuggingFaceSearchResults = (items, requestedRepo = '', options = {}) => {
            const select = $('huggingface-model-results');
            if (!select) { return; }
            huggingFaceSearchResults = compatibleDiscoveryItems(items);
            select.replaceChildren();
            if (!huggingFaceSearchResults.length) {
              setDiscoverySelectPlaceholder(select, 'No compatible models found');
              setDiscoverySelectPlaceholder($('huggingface-model-artifacts'), 'Select a model first');
              selectedHuggingFaceModel = null;
              selectedHuggingFaceArtifact = null;
              renderHuggingFaceMetadata(null);
              return;
            }
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select a model';
            select.appendChild(placeholder);
            huggingFaceSearchResults.forEach((model) => {
              const option = document.createElement('option');
              option.value = discoveryRepo(model);
              option.textContent = discoveryOptionLabel(model);
              select.appendChild(option);
            });
            select.disabled = false;
            const preserved = huggingFaceSearchResults.find((item) => discoveryRepo(item) === requestedRepo);
            if (preserved) {
              select.value = discoveryRepo(preserved);
              selectedHuggingFaceModel = preserved;
              if (options.reloadArtifacts !== false) {
                loadHuggingFaceArtifacts(preserved, { requestedRepo: discoveryRepo(selectedHuggingFaceArtifact) });
              } else {
                renderHuggingFaceMetadata(selectedHuggingFaceArtifact || preserved);
              }
            } else {
              select.value = '';
              setDiscoverySelectPlaceholder($('huggingface-model-artifacts'), 'Select a model first');
              selectedHuggingFaceModel = null;
              selectedHuggingFaceArtifact = null;
              renderHuggingFaceMetadata(null);
            }
          };

          const searchHuggingFaceModels = async (rawQuery, options = {}) => {
            const queryValue = String(rawQuery || '').trim();
            if (queryValue.length < 2) {
              setHuggingFaceStatus('Enter at least two characters or choose a model family or trending model.', 'error');
              return false;
            }
            const append = options.append === true;
            if (append && (huggingFaceSearchNextCursor === null || huggingFaceSearchNextCursor === undefined)) { return false; }
            const requestId = ++huggingFaceSearchRequest;
            const previousRepo = discoveryRepo(selectedHuggingFaceModel);
            const button = $('huggingface-model-search');
            const cursor = append ? String(huggingFaceSearchNextCursor) : '0';
            if (!append) {
              huggingFaceSearchQuery = queryValue;
              huggingFaceSearchNextCursor = null;
              huggingFaceSearchTotal = 0;
            }
            if (button && !append) {
              button.disabled = true;
              button.textContent = 'Searching';
            }
            updateDiscoveryLoadMore('huggingface-model-load-more', append ? cursor : null, append);
            setHuggingFaceStatus((append ? 'Loading more Hugging Face results for "' : 'Searching Hugging Face for "') + queryValue + '"...');
            const query = new URLSearchParams({
              provider: 'huggingface',
              q: queryValue,
              limit: '20',
              cursor,
              sort: 'downloads',
              engine: selectedLocalEngine(),
              computeTarget: selectedComputeTarget(),
              modelType: selectedLocalModelType()
            });
            try {
              const payload = await request('/api/model-discovery/search?' + query.toString());
              if (requestId !== huggingFaceSearchRequest) { return false; }
              const page = compatibleDiscoveryItems((payload || {}).results || []);
              const results = append ? mergeDiscoveryItems(huggingFaceSearchResults, page) : page;
              huggingFaceSearchNextCursor = (payload || {}).nextCursor;
              huggingFaceSearchTotal = Math.max(results.length, Number((payload || {}).total || 0));
              renderHuggingFaceSearchResults(results, previousRepo, { reloadArtifacts: !append });
              updateDiscoveryLoadMore('huggingface-model-load-more', huggingFaceSearchNextCursor);
              setHuggingFaceStatus(
                results.length
                  ? discoveryProgress(results.length, huggingFaceSearchTotal, 'model') + ' Select one to load quantizations.'
                  : 'No compatible Hugging Face models matched "' + queryValue + '".',
                results.length ? '' : 'error'
              );
              return true;
            } catch (error) {
              if (requestId !== huggingFaceSearchRequest) { return false; }
              updateDiscoveryLoadMore('huggingface-model-load-more', huggingFaceSearchNextCursor);
              setHuggingFaceStatus(error.message || 'Hugging Face search failed.', 'error');
              return false;
            } finally {
              if (requestId === huggingFaceSearchRequest && button && !append) {
                button.disabled = false;
                button.textContent = 'Search';
              }
            }
          };

          const scheduleHuggingFaceSearch = () => {
            if (huggingFaceSearchTimer) { window.clearTimeout(huggingFaceSearchTimer); }
            const field = $('huggingface-model-query');
            const value = String((field || {}).value || '').trim();
            if (value.length < 2 || activeLocalModelSource !== 'huggingface') { return; }
            huggingFaceSearchTimer = window.setTimeout(() => searchHuggingFaceModels(value), 450);
          };

          const refreshHuggingFaceModelType = () => {
            if (activeLocalModelSource !== 'huggingface') { return; }
            loadHuggingFacePopular({ force: true });
            const field = $('huggingface-model-query');
            const value = String(huggingFaceSearchQuery || (field || {}).value || '').trim();
            if (value.length >= 2) { searchHuggingFaceModels(value); }
          };

          const resetHuggingFaceDiscovery = () => {
            huggingFacePopularRequest += 1;
            huggingFaceSearchRequest += 1;
            huggingFaceArtifactRequest += 1;
            if (huggingFaceSearchTimer) { window.clearTimeout(huggingFaceSearchTimer); }
            huggingFaceSearchTimer = null;
            huggingFaceSearchResults = [];
            huggingFaceArtifacts = [];
            selectedHuggingFaceModel = null;
            selectedHuggingFaceArtifact = null;
            huggingFaceSearchNextCursor = null;
            huggingFaceSearchTotal = 0;
            huggingFaceSearchQuery = '';
            huggingFaceArtifactNextCursor = null;
            huggingFaceArtifactTotal = 0;
            huggingFaceArtifactRepo = '';
            modelDiscoveryAutoName = '';
            modelDiscoveryContextDirty = false;
            modelDiscoveryAutoContext = '4096';
            huggingFacePopularSignature = '';
            directLocalModelUrl = '';
            localPresetSourceValue = '';
            activeLocalModelSource = '';
            const query = $('huggingface-model-query');
            if (query) { query.value = ''; }
            setDiscoverySelectPlaceholder($('huggingface-model-results'), 'Search to list models');
            setDiscoverySelectPlaceholder($('huggingface-model-artifacts'), 'Select a model first');
            updateDiscoveryLoadMore('huggingface-model-load-more', null);
            updateDiscoveryLoadMore('huggingface-artifact-load-more', null);
            renderHuggingFacePopular([], 'Loading…');
            renderHuggingFaceMetadata(null);
            setHuggingFaceStatus('Enter at least two characters or choose a model family or trending model.');
            const form = $('local-model-form');
            if (form) {
              setFormValue(form, 'name', '');
              setFormValue(form, 'url', '');
              setFormValue(form, 'maxNumSeqs', 1);
              setFormValue(form, 'contextWindow', modelDiscoveryAutoContext);
              applyModelContextLimit(null);
              if (form.elements.url) {
                form.elements.url.readOnly = false;
                form.elements.url.removeAttribute('title');
              }
            }
          };

          const selectLocalModelSource = (source) => {
            const engine = selectedLocalEngine();
            const allowed = engine === 'VLLM' ? ['huggingface', 'preset', 'direct'] : ['preset', 'direct'];
            const selected = allowed.includes(source) ? source : allowed[0];
            const form = $('local-model-form');
            const field = $('local-model-source');
            const discovery = $('huggingface-model-discovery');
            const presetFields = $('local-model-preset-fields');
            const preset = $('local-model-preset');
            if (activeLocalModelSource === 'direct' && form && form.elements.url && !form.elements.url.readOnly) {
              directLocalModelUrl = String(form.elements.url.value || '').trim();
            }
            if (activeLocalModelSource === 'preset' && preset && preset.value && preset.value !== 'custom') {
              localPresetSourceValue = preset.value;
            }
            activeLocalModelSource = selected;
            if (field) { field.value = selected; }
            if (discovery) { discovery.hidden = selected !== 'huggingface'; }
            if (presetFields) { presetFields.hidden = selected !== 'preset'; }
            if (selected === 'preset') {
              renderLocalPresetOptions(latestModelPayload);
              if (preset) {
                const options = Array.from(preset.options);
                const remembered = options.some((option) => option.value === localPresetSourceValue)
                  ? localPresetSourceValue
                  : '';
                if (remembered) {
                  preset.value = remembered;
                } else if (!preset.value || preset.value === 'custom') {
                  const firstCatalogPreset = options.find((option) => option.value && option.value !== 'custom');
                  preset.value = firstCatalogPreset ? firstCatalogPreset.value : 'custom';
                }
              }
              applyLocalPresetFields(preset ? preset.value : '', { force: true });
              renderEngineSpecificFields();
              return selected;
            }
            if (preset) { preset.value = 'custom'; }
            renderLocalArtifactOptions(null);
            if (form && form.elements.url) {
              if (selected === 'huggingface') {
                form.elements.url.readOnly = true;
                form.elements.url.title = 'Resolved from the selected Hugging Face artifact.';
                form.elements.url.value = selectedHuggingFaceArtifact
                  ? String(selectedHuggingFaceArtifact.url || 'hf://' + discoveryRepo(selectedHuggingFaceArtifact))
                  : '';
                renderHuggingFaceMetadata(selectedHuggingFaceArtifact || selectedHuggingFaceModel);
                loadHuggingFacePopular();
              } else {
                form.elements.url.readOnly = false;
                form.elements.url.removeAttribute('title');
                form.elements.url.value = directLocalModelUrl;
                renderLocalArtifactNote(null);
              }
            }
            renderEngineSpecificFields();
            scheduleVramEstimate();
            return selected;
          };

          const renderLocalModelSourceOptions = () => {
            const field = $('local-model-source');
            if (!field) { return; }
            const engine = selectedLocalEngine();
            const choices = engine === 'VLLM'
              ? [
                  { value: 'huggingface', label: 'Hugging Face search' },
                  { value: 'preset', label: 'Tested preset' },
                  { value: 'direct', label: 'Direct Hugging Face URL' }
                ]
              : [
                  { value: 'preset', label: 'Tested preset' },
                  { value: 'direct', label: 'Direct Ollama model reference' }
                ];
            const requested = activeLocalModelSource;
            field.replaceChildren();
            choices.forEach((choice) => {
              const option = document.createElement('option');
              option.value = choice.value;
              option.textContent = choice.label;
              field.appendChild(option);
            });
            selectLocalModelSource(choices.some((choice) => choice.value === requested) ? requested : choices[0].value);
          };

          const renderEngineSpecificFields = () => {
            const engine = selectedLocalEngine();
            const targetKind = computeTargetKind();
            const isOllama = engine === 'OLlama';
            const url = $('local-model-url');
            const urlLabel = $('local-model-url-label');
            const vramLabel = $('local-model-vram-label');
            const estimator = $('vram-estimate');
            const ollamaSummary = $('ollama-runtime-summary');
            if (url) { url.placeholder = isOllama ? 'ollama://model:tag' : 'hf://organization/model'; }
            if (urlLabel) {
              urlLabel.textContent = isOllama
                ? 'Ollama Model URL'
                : (activeLocalModelSource === 'huggingface' ? 'Selected Hugging Face URL' : 'Hugging Face URL');
            }
            if (vramLabel) { vramLabel.textContent = isOllama ? 'Required VRAM' : 'VRAM Limit'; }
            if (estimator) { estimator.hidden = targetKind !== 'gpu'; }
            if (ollamaSummary) { ollamaSummary.hidden = !isOllama || targetKind !== 'gpu'; }
            if (targetKind !== 'gpu') {
              latestVramEstimateSignature = '';
              renderEmptyVramEstimate('VRAM is not used for CPU inference');
            }
          };

          const renderComputeTargetSections = (targetId) => {
            const targetKind = computeTargetKind(targetId);
            document.querySelectorAll('[data-compute-target-section]').forEach((node) => {
              node.hidden = node.dataset.computeTargetSection !== targetKind;
            });
            if (targetKind !== 'gpu') {
              latestVramEstimateSignature = '';
              renderEmptyVramEstimate('VRAM is not used for CPU inference');
            }
            renderEngineSpecificFields();
          };

          const selectComputeTarget = (targetId, options = {}) => {
            const target = computeTarget(targetId);
            if (!target || target.available !== true || !targetSupportsEngine(target)) {
              activeComputeTarget = '';
              const field = $('local-model-compute-target');
              if (field) { field.value = ''; }
              renderLocalModelAvailability(latestModelPayload);
              updateModelCreateVisibility();
              return false;
            }
            const targetChanged = activeComputeTarget !== targetId;
            activeComputeTarget = targetId;
            const field = $('local-model-compute-target');
            if (field) { field.value = targetId; }
            renderComputeTargetSections(targetId);
            renderedPresetSignature = '';
            localPresetLastApplied = '';
            const presetSelect = $('local-model-preset');
            if (targetChanged && activeLocalModelSource === 'preset' && presetSelect && presetSelect.value && presetSelect.value !== 'custom') {
              localPresetSourceValue = presetSelect.value;
            }
            renderLocalPresetOptions(latestModelPayload);
            applyLocalPresetFields(presetSelect ? presetSelect.value : '', { force: true });
            renderLocalModelSourceOptions();
            const discoveryQuery = String((($('huggingface-model-query') || {}).value) || '').trim();
            if (targetChanged && activeLocalModelSource === 'huggingface' && discoveryQuery.length >= 2) {
              searchHuggingFaceModels(discoveryQuery);
            }
            if (options.renderAvailability !== false) {
              renderLocalModelAvailability(latestModelPayload);
            }
            updateModelCreateVisibility();
            return true;
          };

          const renderComputeTargets = (modelPayload) => {
            const field = $('local-model-compute-target');
            if (!field) { return; }
            const requested = selectedComputeTarget();
            field.replaceChildren();
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select available hardware';
            field.appendChild(placeholder);
            const targets = availableComputeTargets(modelPayload, selectedLocalEngine());
            targets.forEach((target) => {
              const option = document.createElement('option');
              option.value = target.id;
              option.textContent = target.displayName || target.id;
              field.appendChild(option);
            });
            const selected = computeTarget(requested, modelPayload);
            if (selected && selected.available === true && targetSupportsEngine(selected)) {
              activeComputeTarget = requested;
              field.value = requested;
              renderComputeTargetSections(requested);
            } else {
              activeComputeTarget = '';
              field.value = '';
            }
            field.disabled = targets.length === 0;
            updateModelCreateVisibility();
          };

          const renderLocalModelAvailability = (modelPayload) => {
            const fields = $('local-model-fields');
            const message = $('local-model-requirements');
            const summary = $('local-model-selection-summary');
            const targets = computeTargets(modelPayload);
            const selected = computeTarget(selectedComputeTarget(), modelPayload);
            const available = availableComputeTargets(modelPayload, selectedLocalEngine());
            if (fields) {
              fields.disabled = !selected || selected.available !== true || !targetSupportsEngine(selected);
            }
            const setMessages = (value) => {
              if (message) { message.textContent = value; }
              if (summary) { summary.textContent = value; }
            };
            if (!targets.length) {
              setMessages('No compute targets are configured.');
              return;
            }
            if (!available.length) {
              setMessages('No compute target for ' + selectedLocalEngine() + ' is currently available. Check the node and accelerator status.');
              return;
            }
            if (!selected || selected.available !== true || !targetSupportsEngine(selected)) {
              setMessages('Select one of ' + available.length + ' available compute ' + (available.length === 1 ? 'target' : 'targets') + ' for ' + selectedLocalEngine() + '.');
              return;
            }
            setMessages((selected.displayName || selected.id) + ' with ' + selectedLocalEngine() + ' selected. ' + (selected.message || 'Ready.'));
          };

          const instanceForms = () => Array.from(document.querySelectorAll('.instance-form[data-instance-type]'));

          const cataloguedInstanceForms = () => {
            const definitions = applicationDefinitions(latestModulePayload);
            return instanceForms().filter((form) => Boolean(definitions[String(form.dataset.instanceType || '')]));
          };

          const availableInstanceForms = () => cataloguedInstanceForms().filter((form) => form.dataset.instanceAvailable === 'true');

          const missingModulesForInstance = (type) => requiredModulesForInstance(latestModulePayload, type)
            .filter((name) => !moduleInstalled(latestModulePayload, name));

          const instanceModuleDisplayName = (name) => {
            const spec = moduleSpec(latestModulePayload, name);
            const catalogSpec = moduleCatalog(latestModulePayload)[name] || {};
            return String(spec.displayName || catalogSpec.displayName || titleFromKey(name));
          };

          const firstInstanceChoiceTarget = () => {
            const picker = $('instance-type-picker');
            return (picker && picker.querySelector('.instance-type-choice:not(:disabled)')) || $('instance-create-cancel');
          };

          const instanceTypeDisplayName = (form) => {
            const type = form ? String(form.dataset.instanceType || '') : '';
            const definition = applicationDefinitions(latestModulePayload)[type] || {};
            const heading = form && form.querySelector('h3');
            return String(definition.displayName || (heading && heading.textContent) || titleFromKey(type));
          };

          const selectInstanceCreateType = (type = '') => {
            const selectedForm = availableInstanceForms().find((form) => form.dataset.instanceType === type) || null;
            activeInstanceCreateType = selectedForm ? type : '';
            const typeStep = $('instance-type-step');
            const configStep = $('instance-config-step');
            if (typeStep) { typeStep.hidden = Boolean(selectedForm); }
            if (configStep) { configStep.hidden = !selectedForm; }
            instanceForms().forEach((form) => { form.hidden = form !== selectedForm; });

            const selectedType = $('instance-selected-type');
            const description = $('instance-create-description');
            if (selectedForm) {
              const displayName = instanceTypeDisplayName(selectedForm);
              if (selectedType) { selectedType.textContent = displayName + ' configuration'; }
              if (description) { description.textContent = 'Configure only the options for ' + displayName + '.'; }
            } else {
              if (selectedType) { selectedType.textContent = ''; }
              if (description) { description.textContent = 'Choose the type of instance you want to create.'; }
            }

            const dialog = $('instance-create-dialog');
            if (!dialog || !dialog.open) { return; }
            requestAnimationFrame(() => {
              const focusTarget = selectedForm
                ? (selectedForm.querySelector('input:not([type="hidden"]), select, button') || dialog.querySelector('[data-dialog-cancel]'))
                : firstInstanceChoiceTarget();
              if (focusTarget) { focusTarget.focus(); }
            });
          };

          const renderInstanceTypeChoices = () => {
            const picker = $('instance-type-picker');
            if (!picker) { return; }
            picker.replaceChildren();
            cataloguedInstanceForms().forEach((form) => {
              const type = String(form.dataset.instanceType || '');
              const displayName = instanceTypeDisplayName(form);
              const available = form.dataset.instanceAvailable === 'true';
              const missingModules = missingModulesForInstance(type).map(instanceModuleDisplayName);
              const button = document.createElement('button');
              button.className = 'instance-type-choice';
              button.type = 'button';
              button.dataset.instanceChoice = type;
              button.dataset.instanceAvailable = available ? 'true' : 'false';
              button.disabled = !available;
              const heading = document.createElement('strong');
              heading.textContent = displayName;
              const detail = document.createElement('small');
              detail.textContent = available
                ? 'Configure a new ' + displayName + ' instance.'
                : (missingModules.length
                  ? 'Unavailable. Enable and wait for: ' + missingModules.join(', ') + '.'
                  : 'Unavailable because its module requirements are incomplete.');
              button.title = available ? '' : detail.textContent;
              button.append(heading, detail);
              button.addEventListener('click', () => selectInstanceCreateType(type));
              picker.appendChild(button);
            });
          };

          const openInstanceCreateDialog = (initialType = '') => {
            const dialog = $('instance-create-dialog');
            if (!dialog || typeof dialog.showModal !== 'function' || cataloguedInstanceForms().length === 0) { return; }
            renderInstanceTypeChoices();
            selectInstanceCreateType(initialType);
            dialogOpeners.set(dialog, document.activeElement);
            dialog.showModal();
            requestAnimationFrame(() => {
              const focusTarget = activeInstanceCreateType
                ? (document.querySelector('.instance-form:not([hidden]) input, .instance-form:not([hidden]) select') || dialog.querySelector('[data-dialog-cancel]'))
                : firstInstanceChoiceTarget();
              if (focusTarget) { focusTarget.focus(); }
            });
          };

          const renderInstanceForms = (modulePayload) => {
            let cataloguedCount = 0;
            const definitions = applicationDefinitions(modulePayload);
            instanceForms().forEach((form) => {
              const catalogued = Boolean(definitions[String(form.dataset.instanceType || '')]);
              const installed = catalogued && instanceTypeInstalled(modulePayload, form.dataset.instanceType);
              if (catalogued) { cataloguedCount += 1; }
              form.dataset.instanceAvailable = installed ? 'true' : 'false';
              form.hidden = true;
            });
            const createPanel = $('instance-create-panel');
            if (createPanel) {
              createPanel.hidden = cataloguedCount === 0;
            }
            const dialog = $('instance-create-dialog');
            if (dialog && dialog.open) {
              renderInstanceTypeChoices();
              selectInstanceCreateType(activeInstanceCreateType);
            }
          };

          const moduleCatalogSpec = (modulePayload, name, spec = {}) => {
            return spec.catalog || moduleCatalog(modulePayload)[name] || {};
          };

          const moduleDisplayName = (name, catalogSpec = {}, spec = {}) => {
            return spec.displayName || catalogSpec.displayName || titleFromKey(name);
          };

          const moduleOrder = (name, catalogSpec = {}) => {
            const value = Number(catalogSpec.order);
            return Number.isFinite(value) ? value : 10000;
          };

          const moduleGroupKey = (catalogSpec = {}) => {
            const key = String(catalogSpec.group || 'other').trim().toLowerCase();
            return key || 'other';
          };

          const moduleGroupSpec = (modulePayload, key) => {
            const groups = moduleGroups(modulePayload);
            const spec = groups[key] || {};
            return {
              displayName: spec.displayName || titleFromKey(key),
              order: Number.isFinite(Number(spec.order)) ? Number(spec.order) : 10000
            };
          };

          const moduleProgress = (phase, enabled, status = {}) => {
            const normalized = String(phase || '').toLowerCase();
            if (normalized === 'ready') {
              return { value: 100, label: 'Ready', className: 'ready' };
            }
            if (normalized === 'installing') {
              return { value: 85, label: 'Waiting for hardware readiness', className: 'waiting' };
            }
            if (normalized === 'waitingformodules') {
              return { value: 35, label: 'Waiting for dependencies', className: 'waiting' };
            }
            if (normalized === 'waitingforcrds') {
              return { value: 45, label: 'Waiting for CRDs', className: 'waiting' };
            }
            if (normalized === 'waitingforgpu') {
              return { value: 55, label: 'Waiting for NVIDIA GPU', className: 'waiting' };
            }
            if (normalized === 'starting') {
              return { value: 85, label: 'Starting model runtime', className: 'waiting' };
            }
            if (normalized === 'reconciling') {
              return { value: 70, label: 'Reconciling', className: 'waiting' };
            }
            if (normalized === 'removing') {
              return { value: 65, label: 'Removing', className: 'waiting' };
            }
            if (normalized === 'degraded') {
              return { value: 100, label: status.message || 'Needs attention', className: 'degraded' };
            }
            if (normalized === 'disabled' || normalized === 'suspended' || !enabled) {
              return { value: 0, label: normalized === 'suspended' ? 'Suspended' : 'Disabled', className: 'disabled' };
            }
            return { value: 20, label: 'Requested', className: 'waiting' };
          };

          const phaseInProgress = (phase) => {
            return ['requested', 'detected', 'installing', 'waitingformodules', 'waitingforcrds', 'waitingforgpu', 'starting', 'reconciling', 'removing'].includes(String(phase || '').toLowerCase());
          };

          const moduleGenerationPending = (spec = {}) => {
            const generation = Number(spec.generation || 0);
            const observed = Number(spec.observedGeneration || ((spec.status || {}).observedGeneration) || 0);
            return generation > 0 && observed < generation;
          };

          const moduleActionProgress = (action) => {
            if (action === 'disable') {
              return { value: 65, label: 'Disable requested', className: 'waiting' };
            }
            return { value: 20, label: 'Enable requested', className: 'waiting' };
          };

          const progressPillClass = (progress) => {
            return ['ready', 'waiting', 'disabled', 'degraded'].includes(progress.className) ? progress.className : 'waiting';
          };

          const createProgressBox = (progress) => {
            const progressBox = document.createElement('div');
            progressBox.className = 'module-progress ' + progress.className;
            const progressRow = document.createElement('div');
            progressRow.className = 'module-progress-row';
            const progressLabel = document.createElement('span');
            progressLabel.textContent = progress.label;
            const progressValue = document.createElement('span');
            progressValue.textContent = progress.value + '%';
            progressRow.append(progressLabel, progressValue);
            const track = document.createElement('div');
            track.className = 'module-progress-track';
            const value = document.createElement('div');
            value.className = 'module-progress-value';
            value.style.setProperty('--module-progress', progress.value + '%');
            track.appendChild(value);
            progressBox.append(progressRow, track);
            return progressBox;
          };

          const orderedModules = (modulePayload) => {
            const catalog = moduleCatalog(modulePayload);
            const modules = ((modulePayload || {}).modules || {});
            const names = new Set([...Object.keys(catalog), ...Object.keys(modules)]);
            return Array.from(names).map((name) => {
              const spec = modules[name] || {};
              const catalogSpec = moduleCatalogSpec(modulePayload, name, spec);
              return { name, spec, catalogSpec, title: moduleDisplayName(name, catalogSpec, spec) };
            }).sort((left, right) => {
              const orderDelta = moduleOrder(left.name, left.catalogSpec) - moduleOrder(right.name, right.catalogSpec);
              if (orderDelta !== 0) { return orderDelta; }
              return left.title.localeCompare(right.title) || left.name.localeCompare(right.name);
            });
          };

          const groupedModules = (modulePayload) => {
            const groups = new Map();
            orderedModules(modulePayload).forEach((module) => {
              const key = moduleGroupKey(module.catalogSpec);
              if (!groups.has(key)) {
                groups.set(key, { key, spec: moduleGroupSpec(modulePayload, key), modules: [] });
              }
              groups.get(key).modules.push(module);
            });
            return Array.from(groups.values()).sort((left, right) => {
              const orderDelta = left.spec.order - right.spec.order;
              if (orderDelta !== 0) { return orderDelta; }
              return left.spec.displayName.localeCompare(right.spec.displayName) || left.key.localeCompare(right.key);
            });
          };

          const parameterDisplayValue = (value) => {
            if (!value) { return ''; }
            if (typeof value === 'object') {
              return value.size || value.storageSize || '';
            }
            return String(value);
          };

          const renderModuleAdvanced = (item, name, spec, modulePayload) => {
            const fields = moduleCatalogSpec(modulePayload, name, spec).parameters || [];
            if (!fields.length) { return; }
            const parameters = (spec || {}).parameters || {};
            const details = document.createElement('details');
            details.className = 'module-advanced';
            details.open = fields.some((field) => parameterDisplayValue(parameters[field.name]) !== '');
            const summary = document.createElement('summary');
            summary.textContent = 'Configure';
            const grid = document.createElement('div');
            grid.className = 'form-grid';
            fields.forEach((field) => {
              const label = document.createElement('label');
              label.className = 'field';
              label.textContent = field.label;
              const input = document.createElement('input');
              input.name = field.name;
              input.placeholder = field.placeholder;
              input.type = field.type || 'text';
              input.value = parameterDisplayValue(parameters[field.name]);
              input.dataset.moduleParameter = field.name;
              label.appendChild(input);
              grid.appendChild(label);
            });
            details.append(summary, grid);
            item.appendChild(details);
          };

          const moduleParametersFromItem = (item) => {
            const parameters = {};
            if (!item) { return parameters; }
            item.querySelectorAll('[data-module-parameter]').forEach((input) => {
              const value = String(input.value || '').trim();
              if (value) {
                parameters[input.dataset.moduleParameter] = value;
              }
            });
            return parameters;
          };

          const ensureHttpUrl = (value) => {
            const raw = String(value || '').trim();
            if (!raw) { return ''; }
            if (/^https?:\/\//i.test(raw)) { return raw; }
            return 'http://' + raw.replace(/^\/+/, '').replace(/\/?$/, '/');
          };

          const urlHost = (value) => {
            const url = ensureHttpUrl(value);
            if (!url) { return ''; }
            try {
              return new URL(url).host;
            } catch (error) {
              return String(value || '').replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
            }
          };

          const urlHostname = (value) => {
            const url = ensureHttpUrl(value);
            if (!url) { return ''; }
            try {
              return new URL(url).hostname;
            } catch (error) {
              return String(urlHost(value) || '').replace(/:\d+$/, '');
            }
          };

          const normalizedKey = (value) => {
            return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          };

          const linkFromUrl = (value) => {
            const url = ensureHttpUrl(value);
            if (!url) { return null; }
            return { url, label: urlHost(url) || url };
          };

          const linksFromIngress = (ingress) => {
            return ((ingress || {}).hosts || []).map(linkFromUrl).filter(Boolean);
          };

          const linksFromHttpRoute = (route) => {
            if ((route || {}).accepted !== true) { return []; }
            return ((route || {}).hostnames || []).map((hostname) => linkFromUrl('https://' + hostname)).filter(Boolean);
          };

          const uniqueLinks = (links) => {
            const seen = new Set();
            return (links || []).filter((link) => {
              const key = String((link || {}).url || '').replace(/\/$/, '');
              if (!key || seen.has(key)) { return false; }
              seen.add(key);
              return true;
            });
          };

          const createResourceLinks = (links) => {
            const unique = uniqueLinks(links);
            if (!unique.length) { return null; }
            const wrapper = document.createElement('div');
            wrapper.className = 'resource-links';
            unique.forEach((link) => {
              const anchor = document.createElement('a');
              anchor.className = 'resource-link';
              anchor.href = link.url;
              anchor.target = '_blank';
              anchor.rel = 'noreferrer';
              anchor.textContent = link.label;
              wrapper.appendChild(anchor);
            });
            return wrapper;
          };

          const moduleIngressLookupKeys = (name, catalogSpec = {}) => {
            const values = [name].concat(catalogSpec.aliases || []);
            return new Set(values.map(normalizedKey).filter(Boolean));
          };

          const moduleAccessLinks = (name, catalogSpec = {}, status = {}) => {
            const keys = moduleIngressLookupKeys(name, catalogSpec);
            const allowNameContains = (catalogSpec.activationMode || '') === 'static';
            const matches = (resource) => {
              const labels = (resource || {}).labels || {};
              const annotations = (resource || {}).annotations || {};
              const labeledKeys = [
                labels.app,
                labels['app.kubernetes.io/name'],
                labels['appliance.magicstick.dev/module'],
                annotations['dashboard.ai-appliance.io/title']
              ].map(normalizedKey).filter(Boolean);
              if (labeledKeys.some((key) => keys.has(key))) { return true; }
              const resourceName = normalizedKey((resource || {}).name);
              if (keys.has(resourceName)) { return true; }
              if (allowNameContains && Array.from(keys).some((key) => key && resourceName.includes(key))) { return true; }
              const hosts = ((resource || {}).hosts || []).concat((resource || {}).hostnames || []);
              return hosts.some((host) => {
                const hostname = String(urlHost(host) || host || '');
                const hostLabels = hostname.split('.').map(normalizedKey).filter(Boolean);
                return hostLabels.some((label) => keys.has(label));
              });
            };
            const ingressLinks = ((status || {}).ingresses || []).filter(matches).flatMap(linksFromIngress);
            const routeLinks = ((status || {}).httpRoutes || []).filter(matches).flatMap(linksFromHttpRoute);
            return uniqueLinks(ingressLinks.concat(routeLinks));
          };

          const instanceConfiguredHosts = (instance) => {
            const spec = (instance || {}).spec || {};
            const params = spec.values || {};
            const status = (instance || {}).status || {};
            const server = params.server || {};
            const hosts = [
              status.url,
              status.localURL,
              status.publicURL,
              ((params.ingress || {}).host),
              ((server.ingress || {}).host),
              params.host
            ].map(urlHost).filter(Boolean);
            return new Set(hosts);
          };

          const instanceAccessLinks = (instance, status = {}) => {
            const metadata = (instance || {}).metadata || {};
            const instanceName = String(metadata.name || '').toLowerCase();
            const expectedHosts = instanceConfiguredHosts(instance);
            const matches = (resource) => {
              const resourceName = String((resource || {}).name || '').toLowerCase();
              const labels = (resource || {}).labels || {};
              const appInstanceName = String(labels['appliance.magicstick.dev/appinstance'] || '').toLowerCase();
              if (instanceName && (resourceName === instanceName || resourceName.startsWith(instanceName + '-') || appInstanceName === instanceName)) { return true; }
              const hosts = ((resource || {}).hosts || []).concat((resource || {}).hostnames || []);
              return hosts.some((host) => expectedHosts.has(urlHost(host)));
            };
            const ingressLinks = ((status || {}).ingresses || []).filter(matches).flatMap(linksFromIngress);
            const routeLinks = ((status || {}).httpRoutes || []).filter(matches).flatMap(linksFromHttpRoute);
            const instanceStatus = ((instance || {}).status || {});
            const statusLinks = [instanceStatus.localURL, instanceStatus.publicURL, instanceStatus.url].map(linkFromUrl).filter(Boolean);
            return uniqueLinks(ingressLinks.concat(routeLinks, statusLinks));
          };

          const overviewLinkScope = (link) => {
            const hostname = urlHostname((link || {}).url || (link || {}).label);
            if (/^\d{1,3}(\.\d{1,3}){3}$/.test(hostname) || hostname === 'localhost') {
              return { key: 'direct', label: 'Direct', order: 30 };
            }
            if (hostname.endsWith('.local')) {
              return { key: 'local', label: 'Local', order: 10 };
            }
            return { key: 'public', label: 'Public', order: 20 };
          };

          const overviewDisplayLinks = (links) => {
            return uniqueLinks(links).map((link) => ({ link, scope: overviewLinkScope(link) })).sort((left, right) => {
              const orderDelta = left.scope.order - right.scope.order;
              if (orderDelta !== 0) { return orderDelta; }
              return String(left.link.url || '').localeCompare(String(right.link.url || ''));
            });
          };

          const createOverviewAppActions = (links) => {
            const actions = overviewDisplayLinks(links);
            if (!actions.length) { return null; }
            const wrapper = document.createElement('div');
            wrapper.className = 'overview-app-actions';
            actions.forEach(({ link, scope }) => {
              const entry = document.createElement('div');
              entry.className = 'overview-url-entry';
              const badge = document.createElement('span');
              badge.className = 'overview-url-scope';
              badge.textContent = scope.label;
              const anchor = document.createElement('a');
              anchor.className = 'resource-link overview-url-link';
              anchor.href = link.url;
              anchor.target = '_blank';
              anchor.rel = 'noreferrer';
              anchor.title = 'Open ' + scope.label.toLowerCase() + ' URL';
              anchor.textContent = link.url;
              entry.append(badge, anchor);
              wrapper.appendChild(entry);
            });
            return wrapper;
          };

          const copyText = async (value, input) => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              try {
                await navigator.clipboard.writeText(value);
                return true;
              } catch (error) {
                // Fall back to selecting the readonly field below.
              }
            }
            if (input) {
              input.focus();
              input.select();
              return document.execCommand && document.execCommand('copy');
            }
            const temporaryInput = document.createElement('textarea');
            temporaryInput.value = value;
            temporaryInput.setAttribute('readonly', '');
            temporaryInput.style.position = 'fixed';
            temporaryInput.style.opacity = '0';
            temporaryInput.style.pointerEvents = 'none';
            document.body.appendChild(temporaryInput);
            temporaryInput.focus();
            temporaryInput.select();
            try {
              return Boolean(document.execCommand && document.execCommand('copy'));
            } finally {
              temporaryInput.remove();
            }
          };

          const showCredentials = (card, payload) => {
            if (!card) { return; }
            const existing = card.querySelector('.credential-panel');
            if (existing) {
              existing.remove();
            }
            const panel = document.createElement('div');
            panel.className = 'credential-panel';
            const heading = document.createElement('div');
            heading.className = 'credential-heading';
            const title = document.createElement('strong');
            title.textContent = (payload.title || titleFromKey(payload.type || 'instance')) + ' credentials';
            const meta = document.createElement('span');
            meta.textContent = [payload.namespace, payload.secretName].filter(Boolean).join('/');
            heading.append(title, meta);
            panel.appendChild(heading);
            const credentials = Array.isArray(payload.credentials) && payload.credentials.length
              ? payload.credentials
              : [{ key: 'token', value: payload.token || '' }];
            credentials.filter((credential) => credential && credential.value).forEach((credential) => {
              const row = document.createElement('div');
              row.className = 'credential-row';
              const label = document.createElement('label');
              label.textContent = credential.key || 'token';
              const valueRow = document.createElement('div');
              valueRow.className = 'credential-value';
              const input = document.createElement('input');
              input.readOnly = true;
              input.value = credential.value || '';
              const copy = document.createElement('button');
              copy.type = 'button';
              copy.className = 'control-button';
              copy.textContent = 'Copy';
              copy.addEventListener('click', async () => {
                try {
                  await copyText(input.value, input);
                  copy.textContent = 'Copied';
                  window.setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
                } catch (error) {
                  copy.textContent = 'Select';
                  input.focus();
                  input.select();
                }
              });
              valueRow.append(input, copy);
              row.append(label, valueRow);
              panel.appendChild(row);
            });
            card.appendChild(panel);
          };

          const instanceOverviewTitle = (type, instance) => {
            const metadata = (instance || {}).metadata || {};
            const rawName = metadata.name || '';
            const prefix = type + '-';
            const shortName = rawName.startsWith(prefix) ? rawName.slice(prefix.length) : rawName;
            return titleFromKey(type) + (shortName && shortName !== type ? ' ' + shortName : '');
          };

          const createOverviewAppRow = ({ title, subtitle, phase, links }) => {
            const row = document.createElement('article');
            row.className = 'overview-app-row';
            const titleBlock = document.createElement('div');
            titleBlock.className = 'overview-app-title';
            const name = document.createElement('strong');
            name.textContent = title;
            const meta = document.createElement('span');
            meta.textContent = [subtitle, phase].filter(Boolean).join(' - ');
            titleBlock.append(name, meta);
            const actions = createOverviewAppActions(links);
            row.appendChild(titleBlock);
            if (actions) {
              row.appendChild(actions);
            }
            return row;
          };

          const addOverviewRow = (target, rows, seenLinks, row) => {
            const links = uniqueLinks(row.links || []);
            if (!links.length) { return; }
            links.forEach((link) => seenLinks.add(String(link.url || '').replace(/\/$/, '')));
            target.appendChild(createOverviewAppRow({ ...row, links }));
            rows.push({ ...row, links });
          };

          const renderOverviewApps = (modulePayload, instancePayload, status) => {
            const target = $('overview-app-list');
            const count = $('overview-app-count');
            if (!target) { return; }
            target.innerHTML = '';
            const rows = [];
            const seenLinks = new Set();
            const instances = ((instancePayload || {}).instances || {});
            Object.keys(instances).sort().forEach((type) => {
              (instances[type] || []).forEach((instance) => {
                const spec = instance.spec || {};
                const statusSpec = instance.status || {};
                const enabled = spec.enabled !== false;
                const phase = statusSpec.phase || (enabled ? 'Requested' : 'Suspended');
                addOverviewRow(target, rows, seenLinks, {
                  title: instanceOverviewTitle(type, instance),
                  subtitle: 'Instance',
                  phase,
                  links: instanceAccessLinks(instance, status)
                });
              });
            });
            orderedModules(modulePayload).forEach(({ name, spec, catalogSpec, title }) => {
              const enabled = spec.enabled === true;
              const activationMode = spec.activationMode || catalogSpec.activationMode || 'moduleactivation';
              const phase = (spec.status || {}).phase || (activationMode === 'static' && enabled ? 'Ready' : (enabled ? 'Requested' : 'Disabled'));
              addOverviewRow(target, rows, seenLinks, {
                title,
                subtitle: 'Module',
                phase,
                links: moduleAccessLinks(name, catalogSpec, status)
              });
            });
            if (!target.childElementCount) {
              const item = document.createElement('div');
              item.className = 'mini-item';
              item.textContent = 'No module or instance URLs discovered yet.';
              target.appendChild(item);
            }
            if (count) {
              count.textContent = seenLinks.size + (seenLinks.size === 1 ? ' URL' : ' URLs');
            }
          };

          const attentionItem = (target, items, label, detail) => {
            if (!target) { return; }
            const item = document.createElement('div');
            item.className = 'mini-item';
            const strong = document.createElement('strong');
            strong.textContent = label;
            item.appendChild(strong);
            if (detail) {
              const text = document.createElement('span');
              text.textContent = detail;
              item.appendChild(text);
            }
            target.appendChild(item);
            items.push(label);
          };

          const phaseNeedsOverviewAttention = (phase) => {
            const normalized = String(phase || '').toLowerCase();
            return normalized === 'degraded' || phaseInProgress(normalized);
          };

          const renderOverviewAttention = (appliance, modulePayload, instancePayload, modelPayload, statusPayload) => {
            const target = $('overview-attention-list');
            const count = $('overview-attention-count');
            if (!target) { return; }
            target.innerHTML = '';
            const items = [];
            (((appliance || {}).status || {}).conditions || []).forEach((condition) => {
              if (condition.status && condition.status !== 'True') {
                attentionItem(target, items, 'Appliance ' + (condition.type || 'Condition'), (condition.reason || condition.message || condition.status || '').trim());
              }
            });
            orderedModules(modulePayload).forEach(({ name, spec, catalogSpec, title }) => {
              const enabled = spec.enabled === true;
              const activationMode = spec.activationMode || catalogSpec.activationMode || 'moduleactivation';
              const moduleStatus = spec.status || {};
              const phase = moduleStatus.phase || (activationMode === 'static' && enabled ? 'Ready' : (enabled ? 'Requested' : 'Disabled'));
              if (phaseNeedsOverviewAttention(phase)) {
                attentionItem(target, items, 'Module ' + title, moduleStatus.message || phase);
              }
            });
            const instances = ((instancePayload || {}).instances || {});
            Object.keys(instances).sort().forEach((type) => {
              (instances[type] || []).forEach((instance) => {
                const spec = instance.spec || {};
                const status = instance.status || {};
                const enabled = spec.enabled !== false;
                const phase = status.phase || (enabled ? 'Requested' : 'Suspended');
                if (phaseNeedsOverviewAttention(phase)) {
                  attentionItem(target, items, 'Instance ' + (instanceOverviewTitle(type, instance)), status.message || phase);
                }
              });
            });
            ((modelPayload || {}).activations || []).forEach((activation) => {
              const metadata = activation.metadata || {};
              const spec = activation.spec || {};
              const status = activation.status || {};
              const enabled = spec.enabled !== false;
              const phase = status.phase || (enabled ? 'Requested' : 'Disabled');
              if (phaseNeedsOverviewAttention(phase) || metadata.deletionTimestamp || pendingModelDeletes[metadata.name]) {
                attentionItem(target, items, 'Model ' + (metadata.name || 'unnamed'), status.message || (metadata.deletionTimestamp ? 'Removing' : phase));
              }
            });
            ((statusPayload || {}).fluxKustomizations || []).forEach((item) => {
              const ready = (item.conditions || []).find((condition) => condition.type === 'Ready');
              if (ready && ready.status && ready.status !== 'True') {
                attentionItem(target, items, 'Flux ' + (item.name || 'Kustomization'), ready.reason || ready.message || ready.status);
              }
            });
            if (!target.childElementCount) {
              const item = document.createElement('div');
              item.className = 'mini-item';
              item.textContent = 'No issues detected.';
              target.appendChild(item);
            }
            if (count) {
              count.textContent = items.length ? (items.length + (items.length === 1 ? ' item' : ' items')) : 'No issues';
            }
          };

          const renderInstanceReferences = (instancePayload) => {
            const instances = ((instancePayload || {}).instances || {});
            document.querySelectorAll('select[data-instance-ref-type]').forEach((select) => {
              const type = select.dataset.instanceRefType;
              const items = (instances[type] || []).filter((instance) => {
                const phase = String(((instance.status || {}).phase) || '').toLowerCase();
                return phase !== 'removing' && (instance.spec || {}).enabled !== false;
              });
              const previous = String(select.value || '').trim();
              select.innerHTML = '';
              const emptyOption = document.createElement('option');
              emptyOption.value = '';
              emptyOption.textContent = items.length ? 'Select instance' : 'No instance available';
              select.appendChild(emptyOption);
              items.forEach((instance) => {
                const option = document.createElement('option');
                option.value = (instance.metadata || {}).name || '';
                option.textContent = option.value;
                select.appendChild(option);
              });
              if (items.some((instance) => ((instance.metadata || {}).name || '') === previous)) {
                select.value = previous;
              } else if (items.length === 1) {
                select.value = (items[0].metadata || {}).name || '';
              }
              const form = select.closest('form');
              const toggleName = type === 'openclaw' ? 'openClawEnabled' : 'hermesEnabled';
              const toggle = form && form.elements ? form.elements[toggleName] : null;
              if (toggle) {
                toggle.disabled = items.length === 0;
                if (!items.length) { toggle.checked = false; }
                select.disabled = !toggle.checked || items.length === 0;
              }
            });
          };

          const serviceHardwareOperatorState = (name, statusPayload = {}, modelPayload = {}) => {
            const operator = (((statusPayload || {}).hardwareOperators || {})[name]) || null;
            if (!operator) { return null; }
            const status = { ...operator };
            const normalized = String(status.phase || '').toLowerCase();
            const nvidiaTelemetry = (modelPayload || {}).vram || {};
            if (name === 'gpu' && normalized === 'ready' && nvidiaTelemetry.available !== true) {
              status.phase = 'Installing';
              status.message = 'The NVIDIA GPU resource is published; waiting for DCGM telemetry before reporting the service ready.';
            }
            return status;
          };

          const serviceModuleState = (name, spec, catalogSpec, statusPayload = {}, modelPayload = {}) => {
            const enabled = spec.enabled === true;
            const moduleStatus = spec.status || {};
            const hardwareStatus = serviceHardwareOperatorState(name, statusPayload, modelPayload);
            const status = hardwareStatus
              ? { ...moduleStatus, ...hardwareStatus, message: hardwareStatus.message || moduleStatus.message || '' }
              : moduleStatus;
            const activationMode = spec.activationMode || catalogSpec.activationMode || 'moduleactivation';
            const phase = status.phase || (activationMode === 'static' && enabled ? 'Ready' : (enabled ? 'Requested' : 'Disabled'));
            const pendingAction = pendingModuleActions[name];
            const runtimeInProgress = phaseInProgress(phase) || moduleGenerationPending(spec);
            if (pendingAction && !runtimeInProgress) {
              delete pendingModuleActions[name];
            }
            const activePendingAction = pendingModuleActions[name];
            const progress = activePendingAction
              ? moduleActionProgress(activePendingAction)
              : (moduleGenerationPending(spec) ? moduleActionProgress(enabled ? 'enable' : 'disable') : moduleProgress(phase, enabled, status));
            return { enabled, status, activationMode, phase, runtimeInProgress, activePendingAction, progress };
          };

          const createServicePill = (phase, progress) => {
            const pill = document.createElement('span');
            pill.className = 'status-pill ' + progressPillClass(progress);
            pill.textContent = phase;
            return pill;
          };

          const appendModuleControls = (actions, name, catalogSpec, state) => {
            const credentialSpec = (catalogSpec || {}).credentials || {};
            const credentialProvider = typeof credentialSpec === 'object' ? String(credentialSpec.provider || '') : '';
            if (credentialProvider && state.enabled && String(state.phase).toLowerCase() !== 'removing' && sessionCanReadCredentials(latestSession)) {
              const credentials = document.createElement('button');
              credentials.className = 'control-button';
              credentials.type = 'button';
              credentials.dataset.moduleCredentials = name;
              credentials.textContent = 'Credentials';
              actions.appendChild(credentials);
            }
            if (state.activationMode !== 'moduleactivation') { return; }
            const action = document.createElement('button');
            action.type = 'button';
            if (state.enabled) {
              action.className = 'control-button danger';
              action.dataset.moduleDisable = name;
              action.textContent = 'Disable';
            } else {
              action.className = 'control-button primary';
              action.dataset.moduleEnable = name;
              action.textContent = 'Enable';
            }
            action.disabled = state.runtimeInProgress || Boolean(state.activePendingAction);
            if (action.disabled) { action.title = state.progress.label; }
            actions.appendChild(action);
          };

          const createServiceIdentity = (title, detail, className = 'service-module-identity') => {
            const identity = document.createElement('div');
            identity.className = className;
            const label = document.createElement('strong');
            label.textContent = title;
            const meta = document.createElement('span');
            meta.textContent = detail;
            identity.append(label, meta);
            return identity;
          };

          const createModuleServiceRow = (module, modulePayload, statusPayload, modelPayload) => {
            const { name, spec, catalogSpec, title } = module;
            const state = serviceModuleState(name, spec, catalogSpec, statusPayload, modelPayload);
            const item = document.createElement('article');
            item.className = 'module-card service-module-row';
            const identity = createServiceIdentity(title, name);
            const message = document.createElement('div');
            message.className = 'module-message';
            message.textContent = state.status.message || catalogSpec.description || '';
            const actions = document.createElement('div');
            actions.className = 'action-row';
            actions.appendChild(createServicePill(state.phase, state.progress));
            appendModuleControls(actions, name, catalogSpec, state);
            item.append(identity, message, actions);
            if (state.runtimeInProgress || phaseNeedsOverviewAttention(state.phase)) {
              item.appendChild(createProgressBox(state.progress));
            }
            const links = createResourceLinks(moduleAccessLinks(name, catalogSpec, statusPayload));
            if (links) { item.appendChild(links); }
            if (!state.enabled) { renderModuleAdvanced(item, name, spec, modulePayload); }
            return item;
          };

          const createInstanceServiceCard = (type, instance, statusPayload) => {
            const metadata = instance.metadata || {};
            const spec = instance.spec || {};
            const status = instance.status || {};
            const enabled = spec.enabled !== false;
            const phase = status.phase || (enabled ? 'Requested' : 'Suspended');
            const progress = moduleProgress(phase, enabled, status);
            const accessSpec = spec.access || {};
            const access = (accessSpec.authentication || status.authentication || 'sso') === 'none'
              ? 'public without login'
              : 'SSO: ' + (accessSpec.role || status.requiredRole || 'user');
            const item = document.createElement('article');
            item.className = 'module-card service-instance-card';
            const main = document.createElement('div');
            main.className = 'service-instance-main';
            const identity = createServiceIdentity(
              metadata.name || 'unnamed',
              (spec.targetNamespace || 'ai') + ' · ' + access,
              'service-instance-identity'
            );
            const actions = document.createElement('div');
            actions.className = 'action-row';
            if (['openclaw', 'odysseus', 'paperclip'].includes(type) && metadata.name && String(phase).toLowerCase() !== 'removing') {
              const credentials = document.createElement('button');
              credentials.className = 'control-button';
              credentials.type = 'button';
              credentials.dataset.instanceCredentials = metadata.name;
              credentials.textContent = 'Credentials';
              actions.appendChild(credentials);
            }
            if (metadata.name && String(phase).toLowerCase() !== 'removing') {
              const remove = document.createElement('button');
              remove.className = 'control-button danger';
              remove.type = 'button';
              remove.dataset.instanceDelete = metadata.name;
              remove.textContent = 'Remove';
              actions.appendChild(remove);
            }
            main.append(identity, createServicePill(phase, progress), actions);
            item.appendChild(main);
            if (phaseInProgress(phase) || phaseNeedsOverviewAttention(phase) || metadata.deletionTimestamp) {
              item.appendChild(createProgressBox(progress));
            }
            if (status.message && String(phase).toLowerCase() !== 'ready') {
              const message = document.createElement('div');
              message.className = 'module-message';
              message.textContent = status.message;
              item.appendChild(message);
            }
            const links = createResourceLinks(instanceAccessLinks(instance, statusPayload));
            if (links) { item.appendChild(links); }
            return item;
          };

          const createApplicationServiceCard = (type, definition, modulePayload, instances, statusPayload) => {
            const primaryModule = primaryModuleForApplication(modulePayload, type);
            const spec = moduleSpec(modulePayload, primaryModule);
            const catalogSpec = moduleCatalogSpec(modulePayload, primaryModule, spec);
            const state = serviceModuleState(primaryModule, spec, catalogSpec);
            const missingModules = requiredModulesForInstance(modulePayload, type)
              .filter((name) => !moduleInstalled(modulePayload, name));
            const ready = missingModules.length === 0;
            const phase = ready ? 'Ready' : (state.enabled && String(state.phase).toLowerCase() === 'ready' ? 'Waiting' : state.phase);
            const progress = ready ? moduleProgress('Ready', true, {}) : state.progress;
            const item = document.createElement('article');
            item.className = 'module-card service-application-card';
            item.dataset.serviceApplication = type;
            const main = document.createElement('div');
            main.className = 'service-application-main';
            const count = instances.length;
            const expanded = count > 0 && expandedApplicationInstances.has(type);
            const identity = createServiceIdentity(
              definition.displayName || titleFromKey(type),
              'Module · ' + count + (count === 1 ? ' instance' : ' instances')
            );
            if (count > 0) {
              const meta = identity.querySelector('span');
              const metaRow = document.createElement('div');
              metaRow.className = 'service-application-meta';
              if (meta) { metaRow.appendChild(meta); }
              const instanceToggle = document.createElement('button');
              instanceToggle.className = 'service-instances-toggle';
              instanceToggle.type = 'button';
              instanceToggle.dataset.serviceInstancesToggle = type;
              instanceToggle.setAttribute('aria-expanded', String(expanded));
              instanceToggle.setAttribute('aria-label', (expanded ? 'Hide' : 'Show') + ' ' + (definition.displayName || titleFromKey(type)) + ' instances');
              const toggleIcon = document.createElement('span');
              toggleIcon.dataset.serviceInstancesToggleIcon = '';
              toggleIcon.setAttribute('aria-hidden', 'true');
              toggleIcon.textContent = expanded ? '▾' : '▸';
              const toggleLabel = document.createElement('span');
              toggleLabel.dataset.serviceInstancesToggleLabel = '';
              toggleLabel.textContent = expanded ? 'Hide' : 'Show';
              instanceToggle.append(toggleIcon, toggleLabel);
              metaRow.appendChild(instanceToggle);
              identity.appendChild(metaRow);
            }
            const actions = document.createElement('div');
            actions.className = 'action-row';
            if (ready) {
              const create = document.createElement('button');
              create.className = 'control-button primary';
              create.type = 'button';
              create.dataset.instanceCreate = type;
              create.textContent = 'New Instance';
              actions.appendChild(create);
            }
            if (primaryModule) { appendModuleControls(actions, primaryModule, catalogSpec, state); }
            main.append(identity, createServicePill(phase, progress), actions);
            item.appendChild(main);

            const detail = document.createElement('div');
            detail.className = 'service-application-detail';
            if (state.runtimeInProgress || phaseNeedsOverviewAttention(state.phase)) {
              detail.appendChild(createProgressBox(state.progress));
            }
            const links = primaryModule ? createResourceLinks(moduleAccessLinks(primaryModule, catalogSpec, statusPayload)) : null;
            if (links) { detail.appendChild(links); }
            if (primaryModule && !state.enabled) { renderModuleAdvanced(detail, primaryModule, spec, modulePayload); }
            if (detail.childElementCount) { item.appendChild(detail); }

            if (instances.length) {
              const instanceList = document.createElement('div');
              instanceList.className = 'service-instance-list';
              instanceList.dataset.serviceInstancesList = type;
              instanceList.hidden = !expanded;
              instances.forEach((instance) => instanceList.appendChild(createInstanceServiceCard(type, instance, statusPayload)));
              item.appendChild(instanceList);
            }
            return item;
          };

          const appendServiceEmpty = (target, text) => {
            const empty = document.createElement('div');
            empty.className = 'service-empty';
            empty.textContent = text;
            target.appendChild(empty);
          };

          const setPlatformServicesExpanded = (expanded) => {
            platformServicesExpanded = Boolean(expanded);
            const list = $('service-platform-list');
            const toggle = $('service-platform-toggle');
            if (list) { list.hidden = !platformServicesExpanded; }
            if (toggle) {
              toggle.setAttribute('aria-expanded', String(platformServicesExpanded));
              const label = toggle.querySelector('[data-platform-toggle-label]');
              if (label) { label.textContent = platformServicesExpanded ? 'Hide' : 'Show'; }
            }
          };

          const applyServiceFilter = () => {
            document.querySelectorAll('[data-service-filter]').forEach((button) => {
              button.setAttribute('aria-pressed', String(button.dataset.serviceFilter === activeServiceFilter));
            });
            document.querySelectorAll('[data-service-section]').forEach((section) => {
              section.hidden = activeServiceFilter !== 'all' && section.dataset.serviceSection !== activeServiceFilter;
            });
            if (activeServiceFilter === 'platform') { setPlatformServicesExpanded(true); }
          };

          const renderServices = (modulePayload, instancePayload, statusPayload = {}, modelPayload = {}) => {
            const applicationList = $('service-applications-list');
            const runtimeList = $('service-runtime-list');
            const platformList = $('service-platform-list');
            if (!applicationList || !runtimeList || !platformList) { return; }
            applicationList.replaceChildren();
            runtimeList.replaceChildren();
            platformList.replaceChildren();
            renderInstanceReferences(instancePayload);

            const definitions = applicationDefinitions(modulePayload);
            const instances = ((instancePayload || {}).instances || {});
            const primaryModules = applicationPrimaryModules(modulePayload);
            const modules = orderedModules(modulePayload);
            const definitionEntries = Object.entries(definitions).sort((left, right) => {
              const leftTitle = String((left[1] || {}).displayName || titleFromKey(left[0]));
              const rightTitle = String((right[1] || {}).displayName || titleFromKey(right[0]));
              return leftTitle.localeCompare(rightTitle) || left[0].localeCompare(right[0]);
            });
            definitionEntries.forEach(([type, definition]) => {
              applicationList.appendChild(createApplicationServiceCard(type, definition || {}, modulePayload, instances[type] || [], statusPayload));
            });

            const standaloneApplications = modules.filter(({ name, catalogSpec }) => (
              !primaryModules.has(name) && moduleGroupKey(catalogSpec) === 'apps'
            ));
            standaloneApplications.forEach((module) => applicationList.appendChild(createModuleServiceRow(module, modulePayload, statusPayload, modelPayload)));

            const runtimeModules = modules.filter(({ name, catalogSpec }) => (
              !primaryModules.has(name) && moduleGroupKey(catalogSpec) === 'runtime'
            ));
            runtimeModules.forEach((module) => runtimeList.appendChild(createModuleServiceRow(module, modulePayload, statusPayload, modelPayload)));

            const platformModules = modules.filter(({ name, catalogSpec }) => {
              const group = moduleGroupKey(catalogSpec);
              return !primaryModules.has(name) && group !== 'apps' && group !== 'runtime';
            });
            platformModules.forEach((module) => platformList.appendChild(createModuleServiceRow(module, modulePayload, statusPayload, modelPayload)));

            if (!applicationList.childElementCount) { appendServiceEmpty(applicationList, 'No application services are catalogued.'); }
            if (!runtimeList.childElementCount) { appendServiceEmpty(runtimeList, 'No shared AI runtime modules are catalogued.'); }
            if (!platformList.childElementCount) { appendServiceEmpty(platformList, 'No platform modules are catalogued.'); }

            const instanceCount = Object.values(instances).reduce((total, items) => total + (Array.isArray(items) ? items.length : 0), 0);
            const enabledCount = modules.filter(({ spec }) => spec.enabled === true).length;
            setText('services-summary', enabledCount + ' modules enabled · ' + instanceCount + (instanceCount === 1 ? ' instance' : ' instances'));
            setText('service-applications-count', (definitionEntries.length + standaloneApplications.length) + ' services · ' + instanceCount + (instanceCount === 1 ? ' instance' : ' instances'));
            setText('service-runtime-count', runtimeModules.length + (runtimeModules.length === 1 ? ' module' : ' modules'));
            setText('service-platform-count', platformModules.length + (platformModules.length === 1 ? ' technical module' : ' technical modules'));
            setPlatformServicesExpanded(platformServicesExpanded);
            applyServiceFilter();
          };

          const formatMi = (value) => {
            const number = Number(value || 0);
            if (number >= 1024) {
              return (number / 1024).toFixed(number >= 10240 ? 0 : 1) + ' GiB';
            }
            return number + ' MiB';
          };

          const formatPlanningMi = (value) => {
            const number = Math.max(0, Number(value || 0));
            const rounded = number ? Math.ceil(number / 100) * 100 : 0;
            if (rounded >= 1024) {
              return (rounded / 1024).toFixed(1) + ' GiB';
            }
            return rounded + ' MiB';
          };

          const formatVramInput = (value) => {
            const number = Math.max(0, Math.round(Number(value || 0)));
            return number % 1024 === 0 ? (number / 1024) + 'Gi' : number + 'Mi';
          };

          const formNumber = (form, name) => {
            const value = String((form.elements[name] || {}).value || '').trim();
            return /^\d+$/.test(value) ? Number(value) : 0;
          };

          const localPreset = (form) => {
            const presetName = String((form.elements.preset || {}).value || '').trim();
            const preset = ((latestModelPayload || {}).presets || {})[presetName] || {};
            const variant = presetVariant(preset, selectedComputeTarget(), selectedLocalEngine());
            return (resolvedPresetArtifact(variant, selectedLocalArtifact()).preset) || {};
          };

          const vramEstimatePayload = (form) => {
            const preset = localPreset(form);
            const modelTypeValue = String((form.elements.modelType || {}).value || preset.modelType || preset.type || 'chat').trim().toLowerCase();
            return {
              engine: selectedLocalEngine(),
              computeTarget: selectedComputeTarget(),
              artifact: selectedLocalArtifact() || null,
              url: String((form.elements.url || {}).value || preset.url || '').trim(),
              contextWindow: formNumber(form, 'contextWindow') || Number(preset.contextWindow || 0) || null,
              maxNumSeqs: formNumber(form, 'maxNumSeqs') || Number(presetMaxNumSeqs(preset) || 0) || (modelTypeValue === 'embedding' ? 8 : 32),
              modelType: modelTypeValue || 'chat'
            };
          };

          const setEstimateText = (id, value) => {
            const node = $(id);
            if (node) { node.textContent = value; }
          };

          const applyModelContextLimit = (estimate) => {
            const form = $('local-model-form');
            const field = form && form.elements.contextWindow;
            if (!field) { return; }
            const maximum = Number((estimate || {}).modelMaxContext || 0);
            if (maximum > 0) {
              field.max = String(maximum);
              field.title = 'Model maximum: ' + maximum + ' tokens';
            } else {
              field.removeAttribute('max');
              field.removeAttribute('title');
            }
          };

          const modelEstimateMeta = (estimate) => {
            const maximum = Number((estimate || {}).modelMaxContext || 0);
            return 'Context ' + estimate.contextWindow
              + (maximum ? ' / max ' + maximum : '')
              + ', max seqs ' + estimate.maxNumSeqs;
          };

          const setVramEstimateControls = (enabled) => {
            const slider = $('vram-estimate-slider');
            if (slider) { slider.disabled = !enabled; }
            document.querySelectorAll('[data-vram-use]').forEach((button) => { button.disabled = !enabled; });
          };

          const targetUnreservedMemoryMi = (targetId = selectedComputeTarget()) => {
            const devices = ((((latestModelPayload || {}).computeMemory || {}).devices) || [])
              .filter((device) => String(device.computeTarget || '') === String(targetId || ''));
            const unreserved = devices
              .map((device) => Number(device.unreservedMi))
              .filter((value) => Number.isFinite(value) && value >= 0);
            return unreserved.length ? Math.max(...unreserved) : null;
          };

          const MEMORY_RESERVATION_STEP_MI = 100;

          const defaultCpuMemoryReservationMi = () => selectedLocalEngine() === 'OLlama' ? 2048 : 4096;

          const setRamUseMode = (mode) => {
            document.querySelectorAll('[data-ram-use]').forEach((button) => {
              button.classList.toggle('primary', button.dataset.ramUse === mode);
            });
          };

          const setRamEstimateControls = (enabled) => {
            const slider = $('ram-reservation-slider');
            if (slider) { slider.disabled = !enabled; }
            document.querySelectorAll('[data-ram-use]').forEach((button) => { button.disabled = !enabled; });
          };

          const renderRamEstimateWarnings = (warnings) => {
            const node = $('ram-reservation-warnings');
            if (!node) { return; }
            node.replaceChildren();
            (warnings || []).forEach((warning) => {
              const item = document.createElement('div');
              item.className = 'estimate-callout ' + (/exceeds|unavailable|not available|could not/i.test(warning) ? 'warning' : '');
              item.textContent = warning;
              node.appendChild(item);
            });
          };

          const applyCpuMemoryReservationMi = (value) => {
            const form = $('local-model-form');
            if (!form) { return; }
            const normalized = Math.max(
              MEMORY_RESERVATION_STEP_MI,
              Math.ceil(Number(value || 0) / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI
            );
            setFormValue(form, 'memoryRequiredMi', normalized);
            setEstimateText('ram-reservation-selected', 'Reserved: ' + formatPlanningMi(normalized));
          };

          const renderCpuMemoryReservation = (presetMi = 0, options = {}) => {
            latestVramEstimate = null;
            const unreserved = targetUnreservedMemoryMi('cpu');
            const maximum = unreserved === null
              ? 0
              : Math.floor(unreserved / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI;
            const recommended = Math.max(
              MEMORY_RESERVATION_STEP_MI,
              Math.ceil(Number(presetMi || defaultCpuMemoryReservationMi()) / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI
            );
            const form = $('local-model-form');
            const current = form ? formNumber(form, 'memoryRequiredMi') : 0;
            const requested = options.applyPreset === false && current ? current : recommended;
            const selected = maximum > 0 ? Math.min(maximum, requested) : requested;
            setEstimateText('ram-estimate-status', 'Waiting for model metadata');
            setEstimateText('ram-estimate-minimum', '-');
            setEstimateText('ram-estimate-recommended', formatPlanningMi(recommended));
            setEstimateText('ram-reservation-maximum', maximum > 0 ? formatPlanningMi(maximum) : 'Unknown');
            setEstimateText('ram-estimate-weights', '-');
            setEstimateText('ram-estimate-kv', '-');
            setEstimateText('ram-estimate-reserve', '-');
            setEstimateText('ram-estimate-meta', 'Preset fallback · Kubernetes requests.memory');
            applyCpuMemoryReservationMi(selected);
            const slider = $('ram-reservation-slider');
            if (slider) {
              slider.min = String(MEMORY_RESERVATION_STEP_MI);
              slider.max = String(Math.max(MEMORY_RESERVATION_STEP_MI, maximum || selected));
              slider.step = String(MEMORY_RESERVATION_STEP_MI);
              slider.value = String(selected);
              slider.disabled = maximum <= 0;
            }
            renderRamCapacityScale(0, recommended, maximum);
            setRamUseMode('recommended');
            setRamEstimateControls(maximum > 0);
            const minimumButton = document.querySelector('[data-ram-use="minimum"]');
            if (minimumButton) { minimumButton.disabled = true; }
            renderRamEstimateWarnings([
              maximum <= 0
                ? 'Unreserved system RAM is unknown; the preset reservation will be used.'
                : (recommended > maximum
                  ? 'The preset exceeds unreserved system RAM. The reservation was capped at the available planning capacity.'
                  : 'Calculating minimum and recommended RAM from model metadata.')
            ]);
          };

          const renderCpuMemoryEstimate = (estimate, options = {}) => {
            latestVramEstimate = estimate || null;
            if (!estimate) {
              renderCpuMemoryReservation(defaultCpuMemoryReservationMi(), { applyPreset: false });
              return;
            }
            const roundToReservationStep = (value) => Math.max(
              MEMORY_RESERVATION_STEP_MI,
              Math.ceil(Number(value || 0) / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI
            );
            const minimum = roundToReservationStep(estimate.minimumMi);
            const recommended = roundToReservationStep(estimate.recommendedMi || minimum);
            const unreserved = targetUnreservedMemoryMi('cpu');
            const maximum = unreserved === null
              ? 0
              : Math.floor(unreserved / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI;
            const form = $('local-model-form');
            const current = form ? formNumber(form, 'memoryRequiredMi') : 0;
            const requested = options.applyRecommended === false && current ? current : recommended;
            const selected = maximum > 0 ? Math.min(maximum, requested) : requested;
            setEstimateText('ram-estimate-status', estimate.confidence === 'high' ? 'High confidence' : 'Estimated');
            setEstimateText('ram-estimate-minimum', formatPlanningMi(minimum));
            setEstimateText('ram-estimate-recommended', formatPlanningMi(recommended));
            setEstimateText('ram-reservation-maximum', maximum > 0 ? formatPlanningMi(maximum) : 'Unknown');
            setEstimateText('ram-estimate-weights', formatPlanningMi(estimate.weightsMi));
            setEstimateText('ram-estimate-kv', formatPlanningMi(estimate.kvCacheMi));
            setEstimateText('ram-estimate-reserve', formatPlanningMi((estimate.reserveMi || 0) + (estimate.recommendedReserveMi || 0)));
            setEstimateText('ram-estimate-meta', modelEstimateMeta(estimate));
            applyModelContextLimit(estimate);
            applyCpuMemoryReservationMi(selected);
            const slider = $('ram-reservation-slider');
            if (slider) {
              slider.min = String(MEMORY_RESERVATION_STEP_MI);
              slider.max = String(Math.max(MEMORY_RESERVATION_STEP_MI, maximum || selected));
              slider.step = String(MEMORY_RESERVATION_STEP_MI);
              slider.value = String(selected);
            }
            const warnings = [...(estimate.warnings || [])];
            if (maximum > 0 && minimum > maximum) {
              warnings.push('Estimated minimum exceeds the unreserved RAM. The marker is shown in the gray overflow area.');
            } else if (maximum > 0 && recommended > maximum) {
              warnings.push('Recommended RAM exceeds the unreserved RAM. The marker is shown in the gray overflow area.');
            }
            renderRamEstimateWarnings([...new Set(warnings)]);
            renderRamCapacityScale(minimum, recommended, maximum);
            setRamEstimateControls(maximum > 0);
            const minimumButton = document.querySelector('[data-ram-use="minimum"]');
            const recommendedButton = document.querySelector('[data-ram-use="recommended"]');
            if (minimumButton) { minimumButton.disabled = !maximum || minimum > maximum; }
            if (recommendedButton) { recommendedButton.disabled = !maximum || recommended > maximum; }
            setRamUseMode(options.applyRecommended === false ? '' : 'recommended');
          };

          const positionMemoryMarker = (id, labelPrefix, value, scaleMaximum, available) => {
            const marker = $(id);
            if (!marker) { return; }
            const numeric = Number(value || 0);
            if (!numeric || !scaleMaximum) {
              marker.hidden = true;
              return;
            }
            const percent = Math.max(0, Math.min(100, (numeric / scaleMaximum) * 100));
            marker.hidden = false;
            marker.style.left = percent + '%';
            marker.style.transform = percent >= 99.5 ? 'translateX(-100%)' : (percent <= 0.5 ? 'translateX(0)' : 'translateX(-50%)');
            marker.classList.toggle('overflow', Boolean(available) && numeric > available);
            const label = marker.querySelector('span');
            if (label) {
              label.textContent = labelPrefix + ' ' + formatPlanningMi(numeric);
            }
          };

          const renderMemoryCapacityScale = (prefix, memoryLabel, minimum = 0, recommended = 0, available = 0) => {
            const usable = Math.max(0, Number(available || 0));
            const scaleMaximum = Math.max(1, usable, Number(minimum || 0), Number(recommended || 0));
            const availablePercent = Math.max(0, Math.min(100, (usable / scaleMaximum) * 100));
            const availableNode = $(prefix + '-capacity-available');
            const overflowNode = $(prefix + '-capacity-overflow');
            const note = $(prefix + '-capacity-note');
            if (availableNode) { availableNode.style.width = availablePercent + '%'; }
            if (overflowNode) {
              overflowNode.hidden = availablePercent >= 99.999;
              overflowNode.style.left = availablePercent + '%';
              overflowNode.style.width = Math.max(0, 100 - availablePercent) + '%';
            }
            positionMemoryMarker(prefix + '-minimum-marker', 'Minimum', minimum, scaleMaximum, usable);
            positionMemoryMarker(prefix + '-recommended-marker', 'Recommended', recommended, scaleMaximum, usable);
            positionMemoryMarker(prefix + '-available-marker', '100% unreserved', usable, scaleMaximum, usable);
            if (note) {
              note.textContent = !usable
                ? 'Unreserved ' + memoryLabel + ' is unknown; allocation cannot be adjusted.'
                : (availablePercent < 100
                  ? 'The gray area exceeds the unreserved ' + memoryLabel + '.'
                  : 'The slider maximum equals 100% of unreserved ' + memoryLabel + '.');
            }
          };

          const renderVramCapacityScale = (minimum = 0, recommended = 0, available = 0) => {
            renderMemoryCapacityScale('vram', 'VRAM', minimum, recommended, available);
          };

          const renderRamCapacityScale = (minimum = 0, recommended = 0, available = 0) => {
            renderMemoryCapacityScale('ram', 'RAM', minimum, recommended, available);
          };

          const setVramUseMode = (mode) => {
            document.querySelectorAll('[data-vram-use]').forEach((button) => {
              button.classList.toggle('primary', button.dataset.vramUse === mode);
            });
          };

          const renderVramEstimateWarnings = (warnings) => {
            const node = $('vram-estimate-warnings');
            if (!node) { return; }
            node.innerHTML = '';
            (warnings || []).forEach((warning) => {
              const item = document.createElement('div');
              item.className = 'estimate-callout ' + (/exceeds|unavailable|not available|could not/i.test(warning) ? 'warning' : '');
              item.textContent = warning;
              node.appendChild(item);
            });
          };

          const renderEmptyVramEstimate = (message) => {
            latestVramEstimate = null;
            setEstimateText('vram-estimate-status', message || 'Waiting for model metadata');
            ['weights', 'kv', 'reserve', 'minimum', 'recommended', 'maximum'].forEach((key) => {
              setEstimateText('vram-estimate-' + key, '-');
            });
            setEstimateText('vram-estimate-selected', 'Selected: -');
            setEstimateText('vram-estimate-meta', '-');
            renderVramEstimateWarnings([]);
            renderVramCapacityScale();
            setVramUseMode('');
            setVramEstimateControls(false);
          };

          const applyVramLimitMi = (value, mode = '') => {
            const form = $('local-model-form');
            if (!form) { return; }
            const normalized = Math.max(
              MEMORY_RESERVATION_STEP_MI,
              Math.ceil(Number(value || 0) / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI
            );
            setFormValue(form, 'vram', formatVramInput(normalized));
            setEstimateText('vram-estimate-selected', 'Selected: ' + formatPlanningMi(normalized));
            setVramUseMode(mode);
          };

          const renderVramEstimate = (estimate, options = {}) => {
            latestVramEstimate = estimate || null;
            if (!estimate) {
              renderEmptyVramEstimate('Waiting for model metadata');
              return;
            }
            const minimum = Math.max(
              MEMORY_RESERVATION_STEP_MI,
              Math.ceil(Number(estimate.minimumMi || 0) / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI
            );
            const recommended = Math.max(
              minimum,
              Math.ceil(Number(estimate.recommendedMi || minimum) / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI
            );
            const estimatedMaximum = estimate.maximumMi === null || estimate.maximumMi === undefined ? 0 : Number(estimate.maximumMi || 0);
            const unreservedMaximum = targetUnreservedMemoryMi();
            const rawMaximum = unreservedMaximum === null ? estimatedMaximum : unreservedMaximum;
            const maximum = Math.floor(rawMaximum / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI;
            const selected = maximum > 0 ? Math.min(maximum, Math.max(MEMORY_RESERVATION_STEP_MI, recommended)) : 0;
            setEstimateText('vram-estimate-status', estimate.confidence === 'high' ? 'High confidence' : 'Estimated');
            setEstimateText('vram-estimate-weights', formatPlanningMi(estimate.weightsMi));
            setEstimateText('vram-estimate-kv', formatPlanningMi(estimate.kvCacheMi));
            setEstimateText('vram-estimate-reserve', formatPlanningMi((estimate.reserveMi || 0) + (estimate.recommendedReserveMi || 0)));
            setEstimateText('vram-estimate-minimum', formatPlanningMi(minimum));
            setEstimateText('vram-estimate-recommended', formatPlanningMi(recommended));
            setEstimateText('vram-estimate-maximum', maximum > 0 ? formatPlanningMi(maximum) : 'Unknown');
            setEstimateText('vram-estimate-meta', modelEstimateMeta(estimate));
            applyModelContextLimit(estimate);
            const warnings = [...(estimate.warnings || [])];
            if (maximum > 0 && minimum > maximum) {
              warnings.push('Estimated minimum exceeds the unreserved VRAM. The marker is shown in the gray overflow area.');
            } else if (maximum > 0 && recommended > maximum) {
              warnings.push('Recommended VRAM exceeds the unreserved VRAM. The marker is shown in the gray overflow area.');
            }
            renderVramEstimateWarnings([...new Set(warnings)]);
            renderVramCapacityScale(minimum, recommended, maximum);
            const slider = $('vram-estimate-slider');
            if (slider) {
              slider.min = maximum > 0 ? String(Math.min(MEMORY_RESERVATION_STEP_MI, maximum)) : '0';
              slider.max = String(maximum);
              slider.step = String(MEMORY_RESERVATION_STEP_MI);
              slider.value = String(selected);
            }
            setVramEstimateControls(maximum > 0);
            const minimumButton = document.querySelector('[data-vram-use="minimum"]');
            const recommendedButton = document.querySelector('[data-vram-use="recommended"]');
            if (minimumButton) { minimumButton.disabled = !maximum || minimum > maximum; }
            if (recommendedButton) { recommendedButton.disabled = !maximum || recommended > maximum; }
            if (options.applyRecommended !== false && maximum > 0) {
              applyVramLimitMi(selected, 'recommended');
            }
          };

          const runVramEstimate = async () => {
            const form = $('local-model-form');
            if (!form) { return; }
            const targetKind = computeTargetKind();
            const payload = vramEstimatePayload(form);
            if (!payload.url) {
              latestVramEstimateSignature = '';
              applyModelContextLimit(null);
              const message = selectedLocalEngine() === 'OLlama' ? 'Waiting for Ollama URL' : 'Waiting for HF URL';
              if (targetKind === 'cpu') {
                renderCpuMemoryReservation(formNumber(form, 'memoryRequiredMi') || defaultCpuMemoryReservationMi(), { applyPreset: false });
                setEstimateText('ram-estimate-status', message);
              } else {
                renderEmptyVramEstimate(message);
              }
              return;
            }
            const signature = JSON.stringify(payload);
            if (signature === latestVramEstimateSignature && latestVramEstimate) {
              if (targetKind === 'cpu') {
                renderCpuMemoryEstimate(latestVramEstimate, { applyRecommended: false });
              } else {
                renderVramEstimate(latestVramEstimate, { applyRecommended: false });
              }
              return;
            }
            const requestId = ++vramEstimateRequest;
            if (targetKind === 'cpu') {
              setEstimateText('ram-estimate-status', 'Estimating');
              renderRamEstimateWarnings([]);
              setRamEstimateControls(false);
            } else {
              setEstimateText('vram-estimate-status', 'Estimating');
              renderVramEstimateWarnings([]);
              setVramEstimateControls(false);
            }
            try {
              const estimate = await request('/api/models/estimate-memory', { method: 'POST', body: JSON.stringify(payload) });
              if (requestId !== vramEstimateRequest) { return; }
              if (syncHuggingFaceEstimateMetadata(estimate)) {
                latestVramEstimateSignature = '';
                scheduleVramEstimate();
                return;
              }
              latestVramEstimateSignature = signature;
              if (targetKind === 'cpu') {
                renderCpuMemoryEstimate(estimate);
              } else {
                renderVramEstimate(estimate);
              }
            } catch (error) {
              if (requestId !== vramEstimateRequest) { return; }
              latestVramEstimateSignature = '';
              if (targetKind === 'cpu') {
                renderCpuMemoryReservation(formNumber(form, 'memoryRequiredMi') || defaultCpuMemoryReservationMi(), { applyPreset: false });
                setEstimateText('ram-estimate-status', 'Estimate unavailable');
                renderRamEstimateWarnings([error.message || 'Could not estimate RAM.']);
              } else {
                renderEmptyVramEstimate('Estimate unavailable');
                renderVramEstimateWarnings([error.message || 'Could not estimate VRAM.']);
              }
            }
          };

          const scheduleVramEstimate = () => {
            clearTimeout(vramEstimateTimer);
            vramEstimateTimer = setTimeout(runVramEstimate, 450);
          };

          const orderedPresetKeys = (presets, targetId, engine = selectedLocalEngine()) => {
            const preferred = targetId === 'cpu'
              ? ['qwen2505bcpu']
              : ['qwen352bvlembedding', 'qwen3635b', 'qwen359b'];
            const keys = Object.keys(presets || {}).filter((key) => Boolean(presetVariant(presets[key], targetId, engine)));
            return [
              ...preferred.filter((key) => keys.includes(key)),
              ...keys.filter((key) => !preferred.includes(key)).sort()
            ];
          };

          const renderLocalPresetOptions = (modelPayload) => {
            const select = $('local-model-preset');
            if (!select) { return; }
            const presets = (modelPayload || {}).presets || {};
            const targetId = selectedComputeTarget();
            const engine = selectedLocalEngine();
            const keys = orderedPresetKeys(presets, targetId, engine);
            const signature = engine + '|' + targetId + '|' + keys.join('|');
            if (signature === renderedPresetSignature) { return; }
            const selected = select.value || (targetId === 'cpu' ? 'qwen2505bcpu' : 'qwen352bvlembedding');
            select.innerHTML = '';
            keys.forEach((key) => {
              const option = document.createElement('option');
              option.value = key;
              option.textContent = String(((presets[key] || {}).title || key));
              select.appendChild(option);
            });
            const custom = document.createElement('option');
            custom.value = 'custom';
            custom.textContent = 'Custom';
            select.appendChild(custom);
            select.value = keys.includes(selected) || selected === 'custom' ? selected : (keys[0] || 'custom');
            renderedPresetSignature = signature;
          };

          const modelIdentifier = (model) => String(((model || {}).id || (model || {}).name || '')).trim();

          const modelLabel = (model) => {
            const id = modelIdentifier(model);
            const name = String(((model || {}).name || '')).trim();
            return name && name !== id ? name + ' (' + id + ')' : id;
          };

          const modelType = (model) => String(((model || {}).type || (model || {}).modelType || '')).trim().toLowerCase();

          const deployedModels = (modelPayload, type = 'chat') => {
            const seen = new Set();
            return (((modelPayload || {}).models || []) || [])
              .filter((model) => {
                const id = modelIdentifier(model);
                if (!id) { return false; }
                if (type === 'chat') {
                  return modelType(model) === 'chat';
                }
                return modelType(model) === type;
              })
              .filter((model) => {
                const id = modelIdentifier(model);
                if (seen.has(id)) { return false; }
                seen.add(id);
                return true;
              })
              .sort((left, right) => modelLabel(left).localeCompare(modelLabel(right)));
          };

          const catalogDefaultChatModel = (modelPayload) => {
            const catalog = (modelPayload || {}).catalog || {};
            const models = deployedModels(modelPayload, 'chat');
            const available = new Set(models.map(modelIdentifier));
            const wanted = String(catalog.defaultChatModel || '').trim();
            if (wanted && available.has(wanted)) {
              return wanted;
            }
            return models.length ? modelIdentifier(models[0]) : '';
          };

          const renderInstanceModelOptions = (modelPayload) => {
            const defaultChatModel = catalogDefaultChatModel(modelPayload);
            document.querySelectorAll('select[data-model-select]').forEach((select) => {
              const type = select.dataset.modelSelect || 'chat';
              const models = deployedModels(modelPayload, type);
              const previous = String(select.value || '').trim();
              select.innerHTML = '';

              if (!models.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = type === 'chat' ? 'No deployed chat models' : 'No deployed models';
                select.appendChild(option);
                select.disabled = true;
                select.dataset.modelsAvailable = 'false';
                return;
              }

              const available = new Set();
              models.forEach((model) => {
                const id = modelIdentifier(model);
                available.add(id);
                const option = document.createElement('option');
                option.value = id;
                option.textContent = modelLabel(model);
                select.appendChild(option);
              });

              const fallback = String(select.dataset.modelFallback || '').trim();
              select.value = available.has(previous)
                ? previous
                : (available.has(defaultChatModel) ? defaultChatModel : (available.has(fallback) ? fallback : modelIdentifier(models[0])));
              select.disabled = false;
              select.dataset.modelsAvailable = 'true';
            });

            document.querySelectorAll('.instance-form').forEach((form) => {
              const select = form.querySelector('select[data-model-select]');
              const button = form.querySelector('button[type="submit"]');
              if (!select || !button) { return; }
              const disabled = select.dataset.modelsAvailable === 'false';
              button.disabled = disabled;
              button.title = disabled ? 'No deployed chat models available' : '';
            });
          };

          const setFormValue = (form, name, value) => {
            if (!form) { return; }
            const field = form.elements[name];
            if (field) {
              field.value = value === undefined || value === null ? '' : String(value);
            }
          };

          const appHost = (prefix, domain) => {
            const cleanPrefix = String(prefix || '').trim().replace(/\.$/, '');
            const cleanDomain = String(domain || '').trim().replace(/^\./, '').replace(/\.$/, '');
            return cleanPrefix && cleanDomain ? cleanPrefix + '.' + cleanDomain : cleanDomain;
          };

          const dnsLabelPart = (value, fallback) => {
            const clean = String(value || '')
              .trim()
              .toLowerCase()
              .replace(/[^a-z0-9-]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .replace(/--+/g, '-');
            return clean || fallback;
          };

          const instanceHostPrefix = (form) => {
            const type = dnsLabelPart((form || {}).dataset ? form.dataset.instanceType : '', 'instance');
            const field = form && form.elements ? form.elements.name : null;
            let name = dnsLabelPart(field ? field.value : '', 'default');
            if (name.startsWith(type + '-')) {
              name = name.slice(type.length + 1) || 'default';
            }
            return name + '.' + type;
          };

          const instanceHostDefault = (form, settings) => {
            const domain = (settings || latestSettings).publicDomain || 'magicstick.example.com';
            return appHost(instanceHostPrefix(form), domain);
          };

          const setText = (id, value) => {
            const node = $(id);
            if (node) {
              node.textContent = value;
            }
          };

          const renderSettings = (settings, options = {}) => {
            latestSettings = {
              publicDomain: settings.publicDomain || 'magicstick.example.com',
              mdnsDomain: settings.mdnsDomain || 'magicstick.local',
              mdnsName: settings.mdnsName || 'magicstick'
            };
            const form = $('settings-form');
            if (form && (options.force || form.dataset.dirty !== 'true')) {
              setFormValue(form, 'publicDomain', latestSettings.publicDomain);
              setFormValue(form, 'mdnsDomain', latestSettings.mdnsDomain);
              form.dataset.dirty = 'false';
            }
          };

          const presetArgValue = (preset, flag) => {
            const args = (preset || {}).args || [];
            for (let index = 0; index < args.length; index += 1) {
              const arg = String(args[index]);
              if (arg === flag && args[index + 1] !== undefined) {
                return String(args[index + 1]);
              }
              if (arg.startsWith(flag + '=')) {
                return arg.slice(flag.length + 1);
              }
            }
            return '';
          };

          const presetMaxNumSeqs = (preset) => {
            return preset.maxNumSeqs || preset.max_num_seqs || presetArgValue(preset, '--max-num-seqs') || presetArgValue(preset, '--max_num_seqs');
          };

          const applyLocalPresetFields = (presetName, options = {}) => {
            const form = $('local-model-form');
            if (!form || !presetName) { return; }
            if (presetName === 'custom') {
              renderLocalArtifactOptions(null);
              if (form.elements.url) {
                form.elements.url.readOnly = false;
                form.elements.url.removeAttribute('title');
              }
              if (computeTargetKind() === 'cpu') {
                renderCpuMemoryReservation(formNumber(form, 'memoryRequiredMi') || defaultCpuMemoryReservationMi(), { applyPreset: false });
              }
              scheduleVramEstimate();
              return;
            }
            const variant = presetVariant(
              ((latestModelPayload || {}).presets || {})[presetName],
              selectedComputeTarget(),
              selectedLocalEngine()
            );
            if (!variant) {
              renderLocalArtifactOptions(null);
              return;
            }
            const requestedArtifact = options.preserveArtifact ? selectedLocalArtifact() : String(options.artifactId || '');
            const artifactId = renderLocalArtifactOptions(variant, requestedArtifact);
            const preset = resolvedPresetArtifact(variant, artifactId).preset;
            if (form.elements.url) {
              form.elements.url.readOnly = true;
              form.elements.url.title = 'Controlled by the selected preset artifact.';
            }
            const marker = [
              selectedLocalEngine(),
              selectedComputeTarget(),
              presetName,
              artifactId,
              preset.vram || '',
              preset.vramMi || '',
              preset.memoryRequiredMi || '',
              preset.contextWindow || '',
              presetMaxNumSeqs(preset) || '',
              preset.url || '',
              preset.type || preset.modelType || ''
            ].join('|');
            if (!options.force && localPresetLastApplied === marker) { return; }
            if (options.artifactOnly) {
              setFormValue(form, 'vram', preset.vram || (preset.vramMi ? preset.vramMi + 'Mi' : ''));
              setFormValue(form, 'memoryRequiredMi', preset.memoryRequiredMi || defaultCpuMemoryReservationMi());
              setFormValue(form, 'url', preset.url);
              localPresetLastApplied = marker;
              if (computeTargetKind() === 'cpu') {
                renderCpuMemoryReservation(preset.memoryRequiredMi || defaultCpuMemoryReservationMi());
              }
              scheduleVramEstimate();
              return;
            }
            setFormValue(form, 'name', presetName);
            setFormValue(form, 'modelType', preset.type || preset.modelType);
            setFormValue(form, 'vram', preset.vram || (preset.vramMi ? preset.vramMi + 'Mi' : ''));
            setFormValue(form, 'memoryRequiredMi', preset.memoryRequiredMi || defaultCpuMemoryReservationMi());
            setFormValue(form, 'url', preset.url);
            setFormValue(form, 'contextWindow', preset.contextWindow);
            setFormValue(form, 'maxNumSeqs', presetMaxNumSeqs(preset) || ((preset.type || preset.modelType) === 'embedding' ? 8 : 32));
            localPresetLastApplied = marker;
            if (computeTargetKind() === 'cpu') {
              renderCpuMemoryReservation(preset.memoryRequiredMi || defaultCpuMemoryReservationMi());
            }
            scheduleVramEstimate();
          };

          const memoryNumber = (value) => {
            if (value === null || value === undefined || value === '') { return null; }
            const number = Number(value);
            return Number.isFinite(number) && number >= 0 ? number : null;
          };

          const memoryPercent = (value, total) => {
            const normalizedValue = memoryNumber(value);
            const normalizedTotal = memoryNumber(total);
            if (normalizedValue === null || normalizedTotal === null || normalizedTotal <= 0) { return 0; }
            return Math.max(0, Math.min(100, (normalizedValue / normalizedTotal) * 100));
          };

          const memoryArc = (className, path, percent, role) => {
            const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            arc.setAttribute('class', className);
            arc.setAttribute('d', path);
            arc.setAttribute('pathLength', '100');
            if (role) {
              arc.dataset.memoryRole = role;
              arc.dataset.percent = String(Math.round(percent * 10) / 10);
              arc.setAttribute('stroke-dasharray', String(percent) + ' 100');
            }
            return arc;
          };

          const createMemoryGauge = (rawDevice) => {
            const device = rawDevice || {};
            const total = memoryNumber(device.totalMi);
            const unreserved = memoryNumber(device.unreservedMi);
            const free = memoryNumber(device.freeMi);
            const metricsAvailable = device.metricsAvailable === true && total !== null && total > 0 && free !== null;
            const name = String(device.name || (device.kind === 'cpu' ? 'CPU' : 'GPU'));
            const unreservedPercent = memoryPercent(unreserved, total);
            const freePercent = memoryPercent(free, total);

            const figure = document.createElement('figure');
            figure.className = 'memory-gauge';
            figure.dataset.memoryDevice = String(device.id || name);
            figure.dataset.memoryKind = String(device.kind || '');
            figure.dataset.metricsAvailable = String(metricsAvailable);
            const description = metricsAvailable
              ? name + ': ' + formatMi(total) + ' total, ' + formatMi(unreserved) + ' unreserved, ' + formatMi(free) + ' actually free.'
              : name + ': memory metrics unavailable.';
            figure.setAttribute('aria-label', description);

            const visual = document.createElement('div');
            visual.className = 'memory-gauge-visual';
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'memory-gauge-svg');
            svg.setAttribute('viewBox', '0 0 220 126');
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-hidden', 'true');
            const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
            title.textContent = description;
            svg.appendChild(title);
            const outerPath = 'M 18 112 A 92 92 0 0 1 202 112';
            const innerPath = 'M 38 112 A 72 72 0 0 1 182 112';
            svg.appendChild(memoryArc('memory-gauge-track memory-gauge-track--outer', outerPath, 100, ''));
            if (metricsAvailable) {
              svg.appendChild(memoryArc('memory-gauge-arc memory-gauge-arc--unreserved', outerPath, unreservedPercent, 'unreserved'));
            }
            svg.appendChild(memoryArc('memory-gauge-track memory-gauge-track--inner', innerPath, 100, ''));
            if (metricsAvailable) {
              svg.appendChild(memoryArc('memory-gauge-arc memory-gauge-arc--free', innerPath, freePercent, 'free'));
            }

            const center = document.createElement('div');
            center.className = 'memory-gauge-center';
            const value = document.createElement('strong');
            value.className = 'memory-gauge-value';
            value.textContent = metricsAvailable ? formatMi(free) : '—';
            const valueLabel = document.createElement('span');
            valueLabel.className = 'memory-gauge-value-label';
            valueLabel.textContent = metricsAvailable ? 'actually free' : 'metrics unavailable';
            const deviceName = document.createElement('span');
            deviceName.className = 'memory-gauge-name';
            deviceName.textContent = name;
            center.append(value, valueLabel, deviceName);
            visual.append(svg, center);
            figure.appendChild(visual);

            const balance = document.createElement('figcaption');
            balance.className = 'memory-gauge-balance';
            if (metricsAvailable) {
              const unreservedLabel = document.createElement('span');
              unreservedLabel.className = 'memory-gauge-unreserved';
              unreservedLabel.textContent = formatMi(unreserved) + ' unreserved';
              const separator = document.createElement('span');
              separator.textContent = '·';
              const totalLabel = document.createElement('span');
              totalLabel.textContent = formatMi(total) + ' total';
              balance.append(unreservedLabel, separator, totalLabel);
            } else {
              const reserved = memoryNumber(device.reservedMi);
              balance.textContent = reserved ? formatMi(reserved) + ' reserved' : 'Memory metrics unavailable';
            }
            figure.appendChild(balance);
            return figure;
          };

          const renderComputeMemory = (modelPayload) => {
            const gauges = $('compute-memory-gauges');
            if (!gauges) { return; }
            const modules = (modelPayload || {}).modules || {};
            const localModels = ((modelPayload || {}).activations || []).filter((activation) => {
              const metadata = activation.metadata || {};
              const spec = activation.spec || {};
              const status = activation.status || {};
              return spec.type === 'local' && (spec.enabled !== false || metadata.deletionTimestamp || status.phase === 'Removing');
            });
            const localRuntimeEnabled = ['gpu', 'kubeai'].some((name) => ((modules[name] || {}).enabled === true));
            const localRuntimeAutoEnabled = ['gpu', 'kubeai'].some((name) => ((modules[name] || {}).autoEnabled === true));
            const removeRuntime = $('remove-local-runtime');
            if (removeRuntime) {
              removeRuntime.hidden = !(localRuntimeEnabled && localRuntimeAutoEnabled && localModels.length === 0);
              removeRuntime.disabled = false;
            }
            gauges.replaceChildren();
            const devices = (((modelPayload || {}).computeMemory || {}).devices || []);
            const visibleDevices = devices.length ? devices : [{
              id: 'cpu-unavailable', kind: 'cpu', name: 'CPU', metricsAvailable: false
            }];
            visibleDevices.forEach((device) => gauges.appendChild(createMemoryGauge(device)));
          };

          const appendModelMeta = (container, label, value) => {
            const text = value === undefined || value === null ? '' : String(value).trim();
            if (!text) { return; }
            const item = document.createElement('span');
            item.className = 'model-meta-item';
            const strong = document.createElement('strong');
            strong.textContent = label + ': ';
            item.append(strong, text);
            container.appendChild(item);
          };

          const modelArtifactMetadata = (local, status, modelPayload) => {
            const presetName = String((local || {}).preset || '').trim();
            const preset = (((modelPayload || {}).presets || {})[presetName]) || {};
            const targetId = String((status || {}).computeTarget || (local || {}).computeTarget || '').trim();
            const engine = (status || {}).engine || (local || {}).engine || 'VLLM';
            const variant = presetVariant(preset, targetId, engine);
            const artifacts = presetArtifacts(variant);
            const requestedId = String(
              (status || {}).artifact
              || (local || {}).artifact
              || ((variant || {}).defaultArtifact)
              || ''
            ).trim();
            const artifact = artifacts.find((item) => String(item.id || '') === requestedId) || {};
            return {
              id: requestedId,
              format: (status || {}).format || (local || {}).format || artifact.format || '',
              precision: (status || {}).precision || (local || {}).precision || artifact.precision || '',
              quantization: (status || {}).quantization || (local || {}).quantization || artifact.quantization || '',
              bits: (status || {}).bits || (local || {}).bits || artifact.bits || ''
            };
          };

          const quantizationLabel = (artifact) => {
            const quantization = String((artifact || {}).quantization || '').trim();
            const bits = Number((artifact || {}).bits || 0);
            if (!quantization) { return bits ? bits + '-bit' : ''; }
            return quantization + (bits && !quantization.includes(String(bits)) ? ' / ' + bits + '-bit' : '');
          };

          const renderModels = (modelPayload) => {
            const list = $('model-list');
            if (!list) { return; }
            list.innerHTML = '';
            const catalogModels = new Map(((modelPayload || {}).models || []).map((model) => [model.id, model]));
            const activations = (modelPayload || {}).activations || [];
            const activationNames = new Set(activations.map((activation) => (activation.metadata || {}).name).filter(Boolean));
            const registeredModels = ((modelPayload || {}).models || []).filter((model) => !activationNames.has(model.id));
            const countNode = $('model-list-count');
            if (countNode) {
              const total = activations.length + registeredModels.length;
              countNode.textContent = total + (total === 1 ? ' model' : ' models');
            }
            Object.keys(pendingModelDeletes).forEach((name) => {
              if (!activationNames.has(name)) {
                delete pendingModelDeletes[name];
              }
            });
            if (activations.length) {
              const section = document.createElement('section');
              section.className = 'module-group';
              const grid = document.createElement('div');
              grid.className = 'module-grid';
              activations.forEach((activation) => {
                const metadata = activation.metadata || {};
                const spec = activation.spec || {};
                const status = activation.status || {};
                const local = spec.local || {};
                const external = spec.external || {};
                const enabled = spec.enabled !== false;
                const basePhase = status.phase || (enabled ? 'Requested' : 'Disabled');
                const deleting = Boolean(metadata.name && pendingModelDeletes[metadata.name]) || Boolean(metadata.deletionTimestamp) || String(basePhase).toLowerCase() === 'removing';
                const phase = deleting ? 'Removing' : basePhase;
                const progress = moduleProgress(phase, enabled, status);
                const catalog = catalogModels.get(metadata.name) || {};
                const item = document.createElement('article');
                item.className = 'module-card';
                const header = document.createElement('div');
                header.className = 'module-card-header';
                const titleBlock = document.createElement('div');
                titleBlock.className = 'module-card-title';
                const label = document.createElement('strong');
                label.textContent = metadata.name || 'unnamed';
                const key = document.createElement('span');
                key.textContent = (spec.type || 'model') + ' / ' + (catalog.type || (spec.external || {}).modelType || (spec.local || {}).modelType || 'chat');
                titleBlock.append(label, key);
                const pill = document.createElement('span');
                pill.className = 'status-pill ' + progressPillClass(progress);
                pill.textContent = phase;
                header.append(titleBlock, pill);
                const meta = document.createElement('div');
                meta.className = 'model-meta';
                const computeTargetId = status.computeTarget || local.computeTarget || (spec.type === 'local' ? 'nvidia-gpu' : 'external');
                const artifact = modelArtifactMetadata(local, status, modelPayload);
                appendModelMeta(meta, 'Compute', computeTargetId);
                appendModelMeta(meta, 'Engine', status.engine || local.engine || (spec.type === 'local' ? 'VLLM' : ''));
                appendModelMeta(meta, 'Artifact', artifact.id);
                appendModelMeta(meta, 'Format', artifact.format);
                appendModelMeta(meta, 'Precision', artifact.precision);
                appendModelMeta(meta, 'Quantization', quantizationLabel(artifact));
                if (computeTargetId === 'cpu') {
                  appendModelMeta(meta, 'RAM', status.memoryRequiredMi
                    ? formatMi(status.memoryRequiredMi)
                    : (local.memoryRequiredMi ? formatMi(local.memoryRequiredMi) : ''));
                } else {
                  appendModelMeta(meta, 'VRAM', status.vramRequiredMi ? formatMi(status.vramRequiredMi) : (local.vram || (local.vramMi ? formatMi(local.vramMi) : '')));
                }
                appendModelMeta(meta, 'Context', local.contextWindow || external.contextWindow || '');
                appendModelMeta(meta, 'Max seqs', local.maxNumSeqs || '');
                appendModelMeta(meta, 'Target', spec.targetNamespace || '');
                const details = document.createElement('div');
                details.className = 'module-message';
                details.textContent = status.message || status.modelRef || catalog.modelRef || 'pending';
                const actions = document.createElement('div');
                actions.className = 'action-row';
                item.append(header);
                if (meta.childElementCount) {
                  item.appendChild(meta);
                }
                item.append(createProgressBox(progress), details);
                if (metadata.name) {
                  const remove = document.createElement('button');
                  remove.className = 'control-button danger';
                  remove.type = 'button';
                  remove.dataset.modelDelete = metadata.name;
                  remove.textContent = deleting ? 'Removing' : 'Remove';
                  remove.disabled = deleting;
                  if (deleting) {
                    remove.title = 'Remove requested';
                  }
                  actions.appendChild(remove);
                  item.appendChild(actions);
