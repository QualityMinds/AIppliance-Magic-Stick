            document.querySelectorAll('[data-vram-use]').forEach((button) => {
              button.addEventListener('click', () => {
                if (!latestVramEstimate) { return; }
                const mode = button.dataset.vramUse;
                const minimum = Number(latestVramEstimate.minimumMi || 0);
                const recommended = Number(latestVramEstimate.recommendedMi || minimum);
                const estimatedMaximum = latestVramEstimate.maximumMi === null || latestVramEstimate.maximumMi === undefined ? 0 : Number(latestVramEstimate.maximumMi || 0);
                const unreservedMaximum = targetUnreservedMemoryMi();
                const rawMaximum = unreservedMaximum === null ? estimatedMaximum : unreservedMaximum;
                const maximum = Math.floor(rawMaximum / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI;
                if (!maximum) { return; }
                const requested = mode === 'minimum' ? minimum : (mode === 'maximum' ? maximum : recommended);
                const value = Math.min(
                  maximum,
                  Math.max(MEMORY_RESERVATION_STEP_MI, Math.ceil(requested / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI)
                );
                const slider = $('vram-estimate-slider');
                if (slider) {
