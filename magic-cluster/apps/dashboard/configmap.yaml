          const refreshApiAccessAfterMutation = async (message) => {
            apiAccessLoaded = false;
            await loadApiAccess(true);
            const output = $('api-access-output');
            if (output && apiAccessLoaded) { output.textContent = message; }
          };

          const kubernetesAccessLabel = (level) => ({
            none: 'No access',
            viewer: 'Viewer',
            operator: 'Operator',
            admin: 'Cluster Administrator'
          })[String(level || 'none')] || 'No access';

          const kubernetesAccessById = (id) => kubernetesAccessItems.find((item) => String(item.id) === String(id));

          const renderKubernetesAccessConfiguration = () => {
            const node = $('kubernetes-access-configuration');
            if (!node) { return; }
            if (kubernetesAccessConfiguration.configured === true) {
              node.textContent = 'SSO is active for ' + String(kubernetesAccessConfiguration.apiServer || 'this cluster')
                + '. Downloaded kubeconfigs use ' + String(kubernetesAccessConfiguration.credentialPlugin || 'kubectl oidc-login') + '. The kubeconfig contains no token.';
              node.className = 'api-output success';
            } else {
              node.textContent = 'Kubernetes SSO is not confirmed by this cluster. Access can be assigned, but kubeconfig downloads remain disabled until the API server OIDC configuration is published.';
              node.className = 'api-output error';
            }
          };

          const renderKubernetesAccess = () => {
            const list = $('kubernetes-access-list');
            if (!list) { return; }
            list.replaceChildren();
            kubernetesAccessItems.forEach((user) => {
              const row = document.createElement('tr');

              const userCell = document.createElement('td');
              userCell.dataset.label = 'User';
              const identity = document.createElement('div');
              identity.className = 'user-identity';
              const name = document.createElement('strong');
              name.textContent = String(user.displayName || user.username || 'User');
              const username = document.createElement('span');
              username.textContent = String(user.username || '');
              identity.append(name, username);
              if (user.email) {
                const email = document.createElement('span');
                email.textContent = String(user.email);
                identity.appendChild(email);
              }
              userCell.appendChild(identity);

              const sourceCell = document.createElement('td');
              sourceCell.dataset.label = 'Source';
              sourceCell.textContent = userSource(user);

              const statusCell = document.createElement('td');
              statusCell.dataset.label = 'Status';
              const status = document.createElement('span');
              status.className = 'status-pill ' + (user.enabled ? 'ready' : 'disabled');
              status.textContent = user.enabled ? 'Enabled' : 'Disabled';
              statusCell.appendChild(status);

              const accessCell = document.createElement('td');
              accessCell.dataset.label = 'Kubernetes Access';
              const access = document.createElement('span');
              const level = String(user.accessLevel || 'none');
              access.className = 'status-pill ' + (level === 'none' ? 'disabled' : (level === 'admin' ? 'degraded' : 'ready'));
              access.textContent = kubernetesAccessLabel(level);
              accessCell.appendChild(access);

              const actionsCell = document.createElement('td');
              actionsCell.dataset.label = 'Actions';
              const actions = document.createElement('div');
              actions.className = 'user-actions';
              const edit = document.createElement('button');
              edit.className = 'control-button';
              edit.type = 'button';
              edit.dataset.kubernetesAccessAction = 'edit';
              edit.dataset.kubernetesAccessId = String(user.id || '');
              edit.textContent = 'Edit Access';
              edit.disabled = Boolean(user.protected) || (!user.enabled && level === 'none');
              edit.title = user.protected
                ? 'Protected recovery access cannot be changed.'
                : ((!user.enabled && level === 'none') ? 'Enable the user before granting Kubernetes access.' : '');
              const download = document.createElement('button');
              download.className = 'control-button primary';
              download.type = 'button';
              download.dataset.kubernetesAccessAction = 'download';
              download.dataset.kubernetesAccessId = String(user.id || '');
              download.textContent = 'Download Kubeconfig';
              download.disabled = kubernetesAccessConfiguration.configured !== true || !user.enabled || level === 'none';
              download.title = kubernetesAccessConfiguration.configured !== true
                ? 'The Kubernetes API server has not confirmed its OIDC configuration.'
                : (!user.enabled ? 'The user is disabled.' : (level === 'none' ? 'Grant access first.' : ''));
              const copy = document.createElement('button');
              copy.className = 'control-button';
              copy.type = 'button';
              copy.dataset.kubernetesAccessAction = 'copy';
              copy.dataset.kubernetesAccessId = String(user.id || '');
              copy.textContent = 'Copy to Clipboard';
              copy.disabled = download.disabled;
              copy.title = download.title || 'Copy the token-free kubeconfig to the clipboard.';
              actions.append(edit, download, copy);
              actionsCell.appendChild(actions);
              row.append(userCell, sourceCell, statusCell, accessCell, actionsCell);
              list.appendChild(row);
            });
            const table = $('kubernetes-access-table-wrap');
            const empty = $('kubernetes-access-empty');
            if (table) { table.hidden = kubernetesAccessItems.length === 0; }
            if (empty) { empty.hidden = kubernetesAccessItems.length !== 0; }
            const output = $('kubernetes-access-output');
            if (output) {
              output.textContent = kubernetesAccessItems.length + (kubernetesAccessItems.length === 1 ? ' user shown.' : ' users shown.');
            }
            renderKubernetesAccessConfiguration();
          };

          const setKubernetesAccessLoading = (loading) => {
            kubernetesAccessLoading = loading;
            const loadingNode = $('kubernetes-access-loading');
            const errorNode = $('kubernetes-access-error');
            if (loadingNode) { loadingNode.hidden = !loading; }
            if (loading && errorNode) { errorNode.hidden = true; }
            const refreshButton = $('kubernetes-access-refresh');
            if (refreshButton) { refreshButton.disabled = loading; }
            if (loading) {
              const table = $('kubernetes-access-table-wrap');
              const empty = $('kubernetes-access-empty');
              if (table) { table.hidden = true; }
              if (empty) { empty.hidden = true; }
            }
          };

          const loadKubernetesAccess = async (force = false) => {
            if (!sessionCanManageKubernetesAccess(latestSession) || kubernetesAccessLoading || (kubernetesAccessLoaded && !force)) { return; }
            setKubernetesAccessLoading(true);
            const output = $('kubernetes-access-output');
            if (output) { output.textContent = 'Loading SSO-bound Kubernetes access…'; }
            const search = String(($('kubernetes-access-search') || {}).value || '').trim();
            const query = new URLSearchParams({ first: '0', max: '100' });
            if (search) { query.set('search', search); }
            try {
              const payload = await dashboardRequest('/api/kubernetes-access?' + query.toString());
              kubernetesAccessItems = Array.isArray((payload || {}).users) ? payload.users : [];
              kubernetesAccessConfiguration = (payload || {}).configuration || {};
              kubernetesAccessLoaded = true;
              const errorNode = $('kubernetes-access-error');
              if (errorNode) { errorNode.hidden = true; errorNode.textContent = ''; }
              renderKubernetesAccess();
            } catch (error) {
              kubernetesAccessLoaded = false;
              kubernetesAccessItems = [];
              kubernetesAccessConfiguration = {};
              const errorNode = $('kubernetes-access-error');
              if (errorNode) {
                errorNode.textContent = 'Kubernetes access could not be loaded: ' + (error.message || 'identity administration is unavailable.');
                errorNode.hidden = false;
              }
              const table = $('kubernetes-access-table-wrap');
              const empty = $('kubernetes-access-empty');
              if (table) { table.hidden = true; }
              if (empty) { empty.hidden = true; }
              if (output) { output.textContent = 'Use Refresh to retry.'; }
              renderKubernetesAccessConfiguration();
            } finally {
              setKubernetesAccessLoading(false);
            }
          };

          const updateKubernetesAccessNote = () => {
            const form = $('kubernetes-access-form');
            const note = $('kubernetes-access-level-note');
            if (!form || !note) { return; }
            const level = String(form.elements.accessLevel.value || 'none');
            note.textContent = level === 'admin'
              ? 'Warning: Cluster Administrator grants unrestricted control over workloads, RBAC, Secrets, and the appliance itself.'
              : (level === 'operator'
                ? 'Operator can read the cluster and manage Magic Stick modules, models, and instances. It cannot create arbitrary workloads or read Secrets.'
                : (level === 'viewer'
                  ? 'Viewer can inspect cluster resources but cannot read Kubernetes Secrets or make changes.'
                  : 'Existing Kubernetes group membership is removed.'));
            note.className = 'dialog-helper' + (level === 'admin' ? ' kubernetes-access-warning' : '');
          };

          const openKubernetesAccessEditor = (user) => {
            const dialog = $('kubernetes-access-dialog');
            const form = $('kubernetes-access-form');
