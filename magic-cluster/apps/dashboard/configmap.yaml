            document.querySelectorAll('[data-ram-use]').forEach((button) => {
              button.addEventListener('click', () => {
                if (!latestVramEstimate || computeTargetKind() !== 'cpu') { return; }
                const mode = button.dataset.ramUse;
                const minimum = Number(latestVramEstimate.minimumMi || 0);
                const recommended = Number(latestVramEstimate.recommendedMi || minimum);
                const unreserved = targetUnreservedMemoryMi('cpu');
                const maximum = unreserved === null
                  ? 0
                  : Math.floor(unreserved / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI;
                if (!maximum) { return; }
                const requested = mode === 'minimum' ? minimum : (mode === 'maximum' ? maximum : recommended);
                const value = Math.min(
                  maximum,
                  Math.max(MEMORY_RESERVATION_STEP_MI, Math.ceil(requested / MEMORY_RESERVATION_STEP_MI) * MEMORY_RESERVATION_STEP_MI)
                );
                const slider = $('ram-reservation-slider');
                if (slider) {
                  slider.max = String(maximum);
                  slider.value = String(value);
                }
                applyCpuMemoryReservationMi(value);
                setRamUseMode(mode);
              });
