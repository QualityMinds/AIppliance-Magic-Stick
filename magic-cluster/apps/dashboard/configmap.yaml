          document.querySelectorAll('.dashboard-dialog').forEach((dialog) => {
            dialog.addEventListener('close', () => {
              clearPasswordInputs(dialog.querySelector('form'));
              if (dialog.id === 'api-access-created-dialog') {
                const keyInput = $('api-access-created-key');
                if (keyInput) { keyInput.value = ''; }
                const copyOutput = $('api-access-copy-output');
                if (copyOutput) { copyOutput.textContent = ''; }
              }
              if (dialog.id === 'api-access-revoke-dialog') {
                activeApiAccessRevocation = null;
              }
              if (dialog.id === 'kubernetes-access-dialog') {
                activeKubernetesAccessUser = null;
              }
              restoreDialogOpener(dialog);
            });
          });

          const apiAccessCreateForm = $('api-access-create-form');
          if (apiAccessCreateForm) {
            apiAccessCreateForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const errorNode = $('api-access-create-error');
              errorNode.textContent = '';
              const data = new FormData(apiAccessCreateForm);
              const name = String(data.get('name') || '').trim();
              setDialogBusy(apiAccessCreateForm, true);
              try {
                const payload = await dashboardRequest('/api/api-access', {
                  method: 'POST',
                  body: JSON.stringify({ name })
                });
                closeUserDialog($('api-access-create-dialog'));
                showCreatedApiAccess(payload);
                await refreshApiAccessAfterMutation('API key created. Its secret was shown once.');
              } catch (error) {
                errorNode.textContent = error.message || 'The API key could not be created.';
              } finally {
                setDialogBusy(apiAccessCreateForm, false);
              }
            });
          }

          const apiAccessCopy = $('api-access-copy');
          if (apiAccessCopy) {
            apiAccessCopy.addEventListener('click', async () => {
              const keyInput = $('api-access-created-key');
              const output = $('api-access-copy-output');
              if (!keyInput || !keyInput.value) { return; }
              try {
                if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                  await navigator.clipboard.writeText(keyInput.value);
                } else {
                  keyInput.focus();
                  keyInput.select();
                  if (!document.execCommand('copy')) { throw new Error('Copy is not available'); }
                  keyInput.setSelectionRange(keyInput.value.length, keyInput.value.length);
                }
                if (output) { output.textContent = 'API key copied.'; }
              } catch (error) {
                if (output) { output.textContent = 'Copy failed. Select and copy the key manually.'; }
              }
            });
          }

          const apiAccessRevokeForm = $('api-access-revoke-form');
          if (apiAccessRevokeForm) {
            apiAccessRevokeForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              if (!activeApiAccessRevocation) { return; }
