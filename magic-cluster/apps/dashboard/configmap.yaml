                item.textContent = 'Enable GPU and KubeAI on the Modules page before adding a local model.';
              } else {
                summary.textContent = 'Live GPU metrics unavailable. Planned VRAM: ' + formatMi(vram.plannedMi || 0);
                item.textContent = vram.error || 'DCGM metrics are not available.';
              }
              list.appendChild(item);
              return;
            }
            summary.textContent = 'Free ' + formatMi(vram.freeMi) + ' of ' + formatMi(vram.totalMi) + '; planned ' + formatMi(vram.plannedMi);
            (vram.gpus || []).forEach((gpu) => {
              const item = document.createElement('div');
              item.className = 'mini-item';
              item.textContent = (gpu.modelName || gpu.device || gpu.id || 'GPU') + ': ' + formatMi(gpu.freeMi) + ' free, ' + formatMi(gpu.usedMi) + ' used';
              list.appendChild(item);
            });
          };

          const appendModelMeta = (container, label, value) => {
            const text = value === undefined || value === null ? '' : String(value).trim();
            if (!text) { return; }
            const item = document.createElement('span');
            item.className = 'model-meta-item';
            const strong = document.createElement('strong');
            strong.textContent = label + ': ';
            item.append(strong, text);
            container.appendChild(item);
          };

          const renderModels = (modelPayload) => {
            const list = $('model-list');
            if (!list) { return; }
            list.innerHTML = '';
            const catalogModels = new Map(((modelPayload || {}).models || []).map((model) => [model.id, model]));
            const activations = (modelPayload || {}).activations || [];
            const activationNames = new Set(activations.map((activation) => (activation.metadata || {}).name).filter(Boolean));
            const registeredModels = ((modelPayload || {}).models || []).filter((model) => !activationNames.has(model.id));
            const countNode = $('model-list-count');
            if (countNode) {
              const total = activations.length + registeredModels.length;
              countNode.textContent = total + (total === 1 ? ' model' : ' models');
            }
            Object.keys(pendingModelDeletes).forEach((name) => {
              if (!activationNames.has(name)) {
                delete pendingModelDeletes[name];
              }
            });
            if (activations.length) {
              const section = document.createElement('section');
              section.className = 'module-group';
              const grid = document.createElement('div');
              grid.className = 'module-grid';
              activations.forEach((activation) => {
                const metadata = activation.metadata || {};
                const spec = activation.spec || {};
                const status = activation.status || {};
                const local = spec.local || {};
                const external = spec.external || {};
                const enabled = spec.enabled !== false;
                const basePhase = status.phase || (enabled ? 'Requested' : 'Disabled');
                const deleting = Boolean(metadata.name && pendingModelDeletes[metadata.name]) || Boolean(metadata.deletionTimestamp) || String(basePhase).toLowerCase() === 'removing';
                const phase = deleting ? 'Removing' : basePhase;
                const progress = moduleProgress(phase, enabled, status);
                const catalog = catalogModels.get(metadata.name) || {};
                const item = document.createElement('article');
                item.className = 'module-card';
                const header = document.createElement('div');
                header.className = 'module-card-header';
                const titleBlock = document.createElement('div');
                titleBlock.className = 'module-card-title';
                const label = document.createElement('strong');
                label.textContent = metadata.name || 'unnamed';
                const key = document.createElement('span');
                key.textContent = (spec.type || 'model') + ' / ' + (catalog.type || (spec.external || {}).modelType || (spec.local || {}).modelType || 'chat');
                titleBlock.append(label, key);
                const pill = document.createElement('span');
                pill.className = 'status-pill ' + progressPillClass(progress);
                pill.textContent = phase;
                header.append(titleBlock, pill);
                const meta = document.createElement('div');
                meta.className = 'model-meta';
                appendModelMeta(meta, 'VRAM', status.vramRequiredMi ? formatMi(status.vramRequiredMi) : (local.vram || (local.vramMi ? formatMi(local.vramMi) : '')));
                appendModelMeta(meta, 'Context', local.contextWindow || external.contextWindow || '');
                appendModelMeta(meta, 'Max seqs', local.maxNumSeqs || '');
                appendModelMeta(meta, 'Target', spec.targetNamespace || '');
                const details = document.createElement('div');
                details.className = 'module-message';
                details.textContent = status.message || status.modelRef || catalog.modelRef || 'pending';
                const actions = document.createElement('div');
                actions.className = 'action-row';
                item.append(header);
                if (meta.childElementCount) {
                  item.appendChild(meta);
                }
                item.append(createProgressBox(progress), details);
                if (metadata.name) {
                  const remove = document.createElement('button');
                  remove.className = 'control-button danger';
                  remove.type = 'button';
                  remove.dataset.modelDelete = metadata.name;
                  remove.textContent = deleting ? 'Removing' : 'Remove';
                  remove.disabled = deleting;
                  if (deleting) {
                    remove.title = 'Remove requested';
                  }
                  actions.appendChild(remove);
                  item.appendChild(actions);
                }
                grid.appendChild(item);
              });
              section.appendChild(grid);
              list.appendChild(section);
            }
            if (registeredModels.length) {
              const section = document.createElement('section');
              section.className = 'module-group';
              const heading = document.createElement('div');
              heading.className = 'module-group-heading';
              const title = document.createElement('h3');
              title.textContent = 'Registered Models';
              const count = document.createElement('span');
              count.textContent = registeredModels.length + (registeredModels.length === 1 ? ' model' : ' models');
              heading.append(title, count);
              const grid = document.createElement('div');
              grid.className = 'module-grid';
              registeredModels.forEach((model) => {
                const item = document.createElement('article');
                item.className = 'module-card';
                const header = document.createElement('div');
                header.className = 'module-card-header';
                const titleBlock = document.createElement('div');
                titleBlock.className = 'module-card-title';
                const label = document.createElement('strong');
                label.textContent = model.id || model.name || 'unnamed';
                const key = document.createElement('span');
                key.textContent = (model.type || 'model') + ' / ' + (model.provider || model.source || 'catalog');
                titleBlock.append(label, key);
                const pill = document.createElement('span');
                pill.className = 'status-pill ready';
                pill.textContent = 'Registered';
                header.append(titleBlock, pill);
                const details = document.createElement('div');
                details.className = 'module-message';
                details.textContent = model.modelRef || 'catalog';
                item.append(header, createProgressBox({ value: 100, label: 'Registered', className: 'ready' }), details);
                grid.appendChild(item);
              });
              section.append(heading, grid);
              list.appendChild(section);
            }
            if (!list.childElementCount) {
              const item = document.createElement('div');
              item.className = 'mini-item';
              item.textContent = 'No models registered yet.';
              list.appendChild(item);
            }
          };

          const sessionIsUserAdmin = (session) => {
            const roles = Array.isArray((session || {}).roles) ? session.roles : [];
            return roles.includes('magicstick-admin') && (session || {}).identityManagementAvailable !== false;
          };

          const setUsersTabAccess = (session) => {
            const button = $('users-tab-button');
            const allowed = sessionIsUserAdmin(session);
            if (!button) { return; }
            button.hidden = !allowed;
            if (!allowed && button.getAttribute('aria-selected') === 'true') {
              const overview = document.querySelector('.tab-button[data-tab="overview"]');
              if (overview) {
                overview.click();
              }
            }
          };

          const userSource = (user) => {
            const raw = (user || {}).source;
            if (raw && typeof raw === 'object') {
              return String(raw.displayName || raw.provider || raw.alias || raw.type || 'External');
            }
            return String((user || {}).provider || raw || 'Local');
          };

          const userIsLocal = (user) => {
            if ((user || {}).local === true) { return true; }
            if ((user || {}).local === false) { return false; }
            const normalized = userSource(user).trim().toLowerCase();
            return ['local', 'keycloak', 'internal'].includes(normalized);
          };

          const userRoles = (user, key) => {
            const roles = (user || {})[key];
            return Array.isArray(roles) ? roles.map((role) => String(role)) : [];
          };

          const userAccessLevel = (user) => {
            const explicit = String((user || {}).accessLevel || '').trim().toLowerCase();
            if (['user', 'viewer', 'operator', 'admin'].includes(explicit)) { return explicit; }
            const roles = new Set(userRoles(user, 'directRoles').concat(userRoles(user, 'effectiveRoles')));
            if (roles.has('magicstick-admin')) { return 'admin'; }
            if (roles.has('magicstick-operator')) { return 'operator'; }
            if (roles.has('magicstick-viewer')) { return 'viewer'; }
            return 'user';
          };

          const userEffectiveAccessLevel = (user) => {
            const explicit = String((user || {}).effectiveAccessLevel || '').trim().toLowerCase();
            if (['user', 'viewer', 'operator', 'admin'].includes(explicit)) { return explicit; }
            const roles = new Set(userRoles(user, 'effectiveRoles'));
            if (roles.has('magicstick-admin')) { return 'admin'; }
            if (roles.has('magicstick-operator')) { return 'operator'; }
            if (roles.has('magicstick-viewer')) { return 'viewer'; }
            return userAccessLevel(user);
          };

          const userDisplayName = (user) => {
            const explicit = String((user || {}).displayName || '').trim();
            if (explicit) { return explicit; }
            return [user.firstName, user.lastName].map((value) => String(value || '').trim()).filter(Boolean).join(' ') || String(user.username || 'Unnamed user');
          };

          const userCapability = (user, capability) => {
            return ((user || {}).capabilities || {})[capability] === true;
          };

          const formatUserDate = (value) => {
            if (value === undefined || value === null || value === '') { return 'Unknown'; }
            const numeric = typeof value === 'number' ? value : Number(value);
            const date = Number.isFinite(numeric)
              ? new Date(numeric < 100000000000 ? numeric * 1000 : numeric)
              : new Date(String(value));
            return Number.isNaN(date.getTime()) ? 'Unknown' : date.toLocaleString();
          };

          const userById = (id) => usersPageItems.find((user) => String(user.id) === String(id));

          const createUserAction = (user, action, label, allowed, options = {}) => {
            const button = document.createElement('button');
            button.className = 'control-button' + (options.danger ? ' danger' : '');
            button.type = 'button';
            button.dataset.userAction = action;
            button.dataset.userId = String(user.id || '');
            button.textContent = label;
            button.disabled = !allowed;
            if (!allowed && options.unavailableReason) {
              button.title = options.unavailableReason;
              button.setAttribute('aria-label', label + ': ' + options.unavailableReason);
            }
            return button;
          };

          const renderUsers = () => {
            const list = $('users-list');
            if (!list) { return; }
            const statusFilter = ($('user-status-filter') || {}).value || 'all';
            const sourceFilter = ($('user-source-filter') || {}).value || 'all';
            const visibleUsers = usersPageItems.filter((user) => {
              const statusMatches = statusFilter === 'all' || (statusFilter === 'enabled' ? user.enabled !== false : user.enabled === false);
              const local = userIsLocal(user);
              const sourceMatches = sourceFilter === 'all' || (sourceFilter === 'local' ? local : !local);
              return statusMatches && sourceMatches;
            });
            list.replaceChildren();
            visibleUsers.forEach((user) => {
              const row = document.createElement('tr');

              const identityCell = document.createElement('td');
              identityCell.dataset.label = 'User';
              const identity = document.createElement('div');
              identity.className = 'user-identity';
              const displayName = document.createElement('strong');
              displayName.textContent = userDisplayName(user);
              const username = document.createElement('span');
              username.textContent = String(user.username || 'Unknown username');
              identity.append(displayName, username);
              identityCell.appendChild(identity);

              const emailCell = document.createElement('td');
              emailCell.dataset.label = 'Email';
              emailCell.textContent = String(user.email || 'Not set');

              const sourceCell = document.createElement('td');
              sourceCell.dataset.label = 'Source';
              const sourceName = document.createElement('strong');
              sourceName.textContent = userSource(user);
              const sourceNote = document.createElement('div');
              sourceNote.className = 'user-source-note';
              sourceNote.textContent = userIsLocal(user) ? 'Managed locally' : 'Profile and password managed upstream';
              sourceCell.append(sourceName, sourceNote);

              const statusCell = document.createElement('td');
              statusCell.dataset.label = 'Status';
              const status = document.createElement('span');
              status.className = 'status-pill ' + (user.enabled === false ? 'disabled' : 'enabled');
              status.textContent = user.enabled === false ? 'Disabled' : 'Enabled';
              statusCell.appendChild(status);

              const roleCell = document.createElement('td');
              roleCell.dataset.label = 'Access';
              const access = document.createElement('strong');
              access.textContent = titleFromKey(userEffectiveAccessLevel(user));
              const directRoles = userRoles(user, 'directRoles');
              const effectiveRoles = userRoles(user, 'effectiveRoles');
              const directNote = document.createElement('div');
              directNote.className = 'user-role-note';
              directNote.textContent = 'Direct: ' + (directRoles.join(', ') || 'none');
              const effectiveNote = document.createElement('div');
              effectiveNote.className = 'user-role-note';
              effectiveNote.textContent = 'Effective: ' + (effectiveRoles.join(', ') || 'none');
              roleCell.append(access, directNote, effectiveNote);

              const createdCell = document.createElement('td');
              createdCell.dataset.label = 'Created';
              createdCell.textContent = formatUserDate(user.createdAt || user.createdTimestamp);

              const actionsCell = document.createElement('td');
              actionsCell.dataset.label = 'Actions';
              const actions = document.createElement('div');
              actions.className = 'user-actions';
              const isSelf = userCapability(user, 'isSelf');
              const isProtected = userCapability(user, 'isProtected');
              const externalProfileReason = userIsLocal(user)
                ? (isProtected ? 'Protected recovery profiles cannot be edited here.' : 'This profile cannot be edited here.')
                : 'This profile is managed by the external identity provider.';
              const accessReason = isSelf
                ? 'You cannot change your own access level.'
                : (isProtected ? 'Protected recovery access cannot be changed.' : 'This account\'s MagicStick access cannot be changed here.');
              const passwordReason = !userIsLocal(user)
                ? 'Reset this password at the external identity provider.'
                : (isSelf ? 'Use the Keycloak account page to change your own password.' : (isProtected ? 'Protected recovery credentials cannot be reset here.' : 'Password reset is unavailable.'));
              const deleteReason = !userIsLocal(user)
                ? 'External accounts must be disabled here or removed at the identity provider.'
                : (isSelf ? 'You cannot delete your own account.' : (isProtected ? 'Protected recovery users cannot be deleted.' : 'The last local administrator cannot be deleted.'));
              actions.append(
                createUserAction(user, 'edit', 'Edit', userCapability(user, 'canEditProfile'), { unavailableReason: externalProfileReason }),
                createUserAction(user, 'roles', 'Access', userCapability(user, 'canManageRoles'), { unavailableReason: accessReason })
              );
              if (user.enabled === false) {
                actions.appendChild(createUserAction(user, 'enable', 'Enable', userCapability(user, 'canEnable'), { unavailableReason: 'This protected account cannot be enabled here.' }));
              } else {
                actions.appendChild(createUserAction(user, 'disable', 'Disable', userCapability(user, 'canDisable'), { unavailableReason: 'You cannot disable yourself or the protected last local administrator.' }));
              }
              actions.append(
                createUserAction(user, 'password', 'Reset Password', userCapability(user, 'canResetPassword'), {
                  unavailableReason: passwordReason
                }),
                createUserAction(user, 'delete', 'Delete', userCapability(user, 'canDelete'), {
                  danger: true,
                  unavailableReason: deleteReason
                })
              );
              actionsCell.appendChild(actions);
              row.append(identityCell, emailCell, sourceCell, statusCell, roleCell, createdCell, actionsCell);
              list.appendChild(row);
            });

            const table = $('users-table-wrap');
            const empty = $('users-empty');
            const pagination = $('users-pagination');
            if (table) { table.hidden = visibleUsers.length === 0; }
            if (empty) { empty.hidden = visibleUsers.length !== 0; }
            if (pagination) { pagination.hidden = usersPageItems.length === 0 && usersPageFirst === 0; }
            const summary = $('users-page-summary');
            if (summary) {
              const start = usersPageItems.length ? usersPageFirst + 1 : 0;
              const end = usersPageFirst + usersPageItems.length;
              const filtered = visibleUsers.length !== usersPageItems.length ? '; ' + visibleUsers.length + ' shown after filters' : '';
              summary.textContent = start + '–' + end + ' of ' + usersTotal + filtered;
            }
            const previous = $('users-previous');
            const next = $('users-next');
            if (previous) { previous.disabled = usersLoading || usersPageFirst === 0; }
            if (next) { next.disabled = usersLoading || usersPageFirst + usersPageItems.length >= usersTotal || usersPageItems.length === 0; }
          };

          const setUsersLoading = (loading) => {
            usersLoading = loading;
            const loadingNode = $('users-loading');
            const error = $('users-error');
            if (loadingNode) { loadingNode.hidden = !loading; }
            if (loading && error) { error.hidden = true; }
            if (loading) {
              const table = $('users-table-wrap');
              const empty = $('users-empty');
              const pagination = $('users-pagination');
              if (table) { table.hidden = true; }
              if (empty) { empty.hidden = true; }
              if (pagination) { pagination.hidden = true; }
            }
            ['user-search', 'user-status-filter', 'user-source-filter', 'user-refresh', 'users-page-size', 'users-previous', 'users-next'].forEach((id) => {
              const node = $(id);
              if (node) { node.disabled = loading; }
            });
          };

          const loadUsers = async (force = false) => {
            if (!sessionIsUserAdmin(latestSession) || usersLoading || (usersLoaded && !force)) { return; }
            const sequence = ++usersRequestSequence;
            setUsersLoading(true);
            const output = $('users-output');
            if (output) { output.textContent = 'Loading users from Keycloak…'; }
            const params = new URLSearchParams({ first: String(usersPageFirst), max: String(usersPageSize) });
            const search = String(($('user-search') || {}).value || '').trim();
            if (search) { params.set('search', search); }
            try {
              const payload = await userRequest('/api/users?' + params.toString());
              if (sequence !== usersRequestSequence) { return; }
              const items = Array.isArray(payload) ? payload : (payload.users || payload.items || payload.results || []);
              usersPageItems = Array.isArray(items) ? items.filter((user) => user && user.id && user.username) : [];
              const reportedTotal = Number((payload || {}).total ?? (payload || {}).totalCount);
              usersTotal = Number.isFinite(reportedTotal) ? reportedTotal : usersPageFirst + usersPageItems.length;
              usersLoaded = true;
              const error = $('users-error');
              if (error) { error.hidden = true; error.textContent = ''; }
              if (output) { output.textContent = 'Users loaded. Changes are written directly to Keycloak.'; }
              renderUsers();
            } catch (error) {
              if (sequence !== usersRequestSequence) { return; }
              usersLoaded = false;
              usersPageItems = [];
              const errorNode = $('users-error');
              if (errorNode) {
                errorNode.textContent = 'Users could not be loaded: ' + (error.message || 'Keycloak is unavailable.');
                errorNode.hidden = false;
              }
              const table = $('users-table-wrap');
              const empty = $('users-empty');
              const pagination = $('users-pagination');
              if (table) { table.hidden = true; }
              if (empty) { empty.hidden = true; }
              if (pagination) { pagination.hidden = true; }
              if (output) { output.textContent = 'Use Refresh to retry.'; }
            } finally {
              if (sequence === usersRequestSequence) {
                setUsersLoading(false);
                if (usersLoaded) { renderUsers(); }
              }
            }
          };

          const showUserDialog = (dialog, focusSelector) => {
            if (!dialog || typeof dialog.showModal !== 'function') { return; }
            dialogOpeners.set(dialog, document.activeElement);
            dialog.showModal();
            requestAnimationFrame(() => {
              const focusTarget = dialog.querySelector(focusSelector || 'input:not([type="hidden"]), select, button');
              if (focusTarget) { focusTarget.focus(); }
            });
          };

          const restoreDialogOpener = (dialog) => {
            const opener = dialogOpeners.get(dialog);
            dialogOpeners.delete(dialog);
            if (opener && typeof opener.focus === 'function' && document.contains(opener)) {
              opener.focus();
            }
          };

          const closeUserDialog = (dialog) => {
            if (!dialog || !dialog.open) { return; }
            dialog.close();
            restoreDialogOpener(dialog);
          };

          const clearPasswordInputs = (form) => {
            if (!form) { return; }
            form.querySelectorAll('input[type="password"]').forEach((input) => { input.value = ''; });
          };

          const setDialogBusy = (form, busy) => {
            if (!form) { return; }
            Array.from(form.elements).forEach((element) => { element.disabled = busy; });
          };

          const loadUserDetails = async (user) => {
            if (!user || !user.id) { throw new Error('The selected user no longer exists.'); }
            return userRequest('/api/users/' + encodeURIComponent(user.id));
          };

          const openUserEditor = (user = null) => {
            const dialog = $('user-editor-dialog');
            const form = $('user-editor-form');
            if (!dialog || !form) { return; }
            form.reset();
            activeUserEditor = user;
            const creating = !user;
            $('user-editor-title').textContent = creating ? 'Create User' : 'Edit User';
            $('user-editor-description').textContent = creating
              ? 'Create a local Keycloak user for this appliance.'
              : 'Edit locally managed profile fields for ' + String(user.username || 'this user') + '.';
            form.elements.username.value = creating ? '' : String(user.username || '');
            form.elements.username.readOnly = !creating;
            form.elements.firstName.value = creating ? '' : String(user.firstName || '');
            form.elements.lastName.value = creating ? '' : String(user.lastName || '');
            form.elements.email.value = creating ? '' : String(user.email || '');
            form.elements.accessLevel.value = creating ? 'user' : userAccessLevel(user);
            form.elements.enabled.checked = creating ? true : user.enabled !== false;
            $('user-editor-access-field').hidden = !creating;
            $('user-editor-password-field').hidden = !creating;
            $('user-editor-confirm-field').hidden = !creating;
            $('user-editor-enabled-field').hidden = !creating;
            form.elements.password.required = creating;
            form.elements.passwordConfirmation.required = creating;
            const note = $('user-editor-source-note');
            note.hidden = creating || userIsLocal(user);
            note.textContent = creating ? '' : 'This identity comes from ' + userSource(user) + '. Only fields explicitly allowed by the server can be changed.';
            $('user-editor-error').textContent = '';
            $('user-editor-submit').textContent = creating ? 'Create User' : 'Save Profile';
            showUserDialog(dialog, creating ? 'input[name="username"]' : 'input[name="firstName"]');
          };

          const openUserRoles = (user) => {
            const dialog = $('user-role-dialog');
            const form = $('user-role-form');
            if (!dialog || !form) { return; }
            activeUserRoles = user;
            form.reset();
            form.elements.accessLevel.value = userAccessLevel(user);
            $('user-role-title').textContent = 'Change access for ' + String(user.username || 'user');
            const direct = userRoles(user, 'directRoles');
            const effective = userRoles(user, 'effectiveRoles');
            $('user-role-note').textContent = 'Direct roles: ' + (direct.join(', ') || 'none') + '. Effective roles: ' + (effective.join(', ') || 'none') + '. Unmanaged roles are preserved.';
            $('user-role-error').textContent = '';
            showUserDialog(dialog, 'select[name="accessLevel"]');
          };

          const openUserPassword = (user) => {
            const dialog = $('user-password-dialog');
            const form = $('user-password-form');
            if (!dialog || !form) { return; }
            activeUserPassword = user;
            form.reset();
            $('user-password-title').textContent = 'Reset password for ' + String(user.username || 'user');
            $('user-password-error').textContent = '';
            showUserDialog(dialog, 'input[name="password"]');
          };

          const openUserConfirmation = (user, action) => {
            const dialog = $('user-confirm-dialog');
            const form = $('user-confirm-form');
            if (!dialog || !form) { return; }
            activeUserConfirmation = { user, action };
            form.reset();
            const username = String(user.username || 'this user');
            const title = action === 'delete' ? 'Delete user' : (action === 'disable' ? 'Disable user' : 'Enable user');
            const description = action === 'delete'
              ? 'Permanently delete the local account ' + username + '. This cannot be undone.'
              : (action === 'disable'
                ? 'Disable ' + username + ' and request a Keycloak logout for the user.'
                : 'Enable ' + username + ' so the user can sign in again.');
            $('user-confirm-title').textContent = title;
            $('user-confirm-description').textContent = description;
            $('user-delete-confirm-field').hidden = action !== 'delete';
            form.elements.usernameConfirmation.required = action === 'delete';
            $('user-confirm-submit').textContent = action === 'delete' ? 'Delete User' : title;
            $('user-confirm-error').textContent = '';
            showUserDialog(dialog, action === 'delete' ? 'input[name="usernameConfirmation"]' : '#user-confirm-submit');
          };

          const refreshUsersAfterMutation = async (message) => {
            usersLoaded = false;
            await loadUsers(true);
            const output = $('users-output');
            if (output && usersLoaded) { output.textContent = message; }
          };

          const renderStatus = (status) => {
            const fluxList = $('flux-list');
            if (fluxList) {
              fluxList.innerHTML = '';
              (status.fluxKustomizations || []).slice(0, 8).forEach((item) => {
                const ready = (item.conditions || []).find((condition) => condition.type === 'Ready');
                const node = document.createElement('div');
                node.className = 'mini-item';
                node.textContent = item.name + ': ' + ((ready || {}).status || item.phase || 'Unknown');
                fluxList.appendChild(node);
              });
            }
            const podSummary = $('pod-summary');
            if (podSummary) {
              const pods = status.pods || [];
              const running = pods.filter((pod) => pod.phase === 'Running').length;
              podSummary.textContent = running + '/' + pods.length + ' pods running';
            }
            const routeList = $('route-list');
            if (routeList) {
              routeList.innerHTML = '';
              (status.httpRoutes || []).slice(0, 8).forEach((route) => {
                const node = document.createElement('div');
                node.className = 'mini-item';
                const label = document.createElement('strong');
                label.textContent = route.namespace + '/' + route.name + ': ' + (route.accepted ? 'Accepted' : 'Pending');
                node.appendChild(label);
                const links = createResourceLinks((route.hostnames || []).map((hostname) => linkFromUrl('https://' + hostname)).filter(Boolean));
                if (links) {
                  node.appendChild(links);
                } else {
                  const empty = document.createElement('span');
                  empty.textContent = 'no host';
                  node.appendChild(empty);
                }
                routeList.appendChild(node);
              });
            }
          };

          const refresh = async () => {
            try {
              const session = await request('/api/session');
              latestSession = session || {};
              setUsersTabAccess(latestSession);
              const settings = await request('/api/settings');
              const appliance = await request('/api/appliance');
              const modulePayload = await request('/api/modules');
              const instancePayload = await request('/api/instances');
              const modelPayload = await request('/api/models');
              const status = await request('/api/status');
              renderSettings(settings);
              latestModulePayload = modulePayload || {};
              latestModelPayload = modelPayload || {};
              renderLocalPresetOptions(latestModelPayload);
              renderInstanceForms(latestModulePayload);
              renderLocalModelAvailability(latestModulePayload);
              renderInstanceModelOptions(latestModelPayload);
              if (!localPresetLastApplied) {
                const presetSelect = $('local-model-preset');
                applyLocalPresetFields(presetSelect ? presetSelect.value : '', { force: true });
              }
              const phase = ((appliance.status || {}).phase || 'Pending');
              $('appliance-summary').textContent = appliance.metadata.namespace + '/' + appliance.metadata.name + ' is ' + phase;
              const modules = ((modulePayload || {}).modules || {});
              const enabledModules = Object.values(modules).filter((item) => item && item.enabled === true).length;
              $('module-summary').textContent = enabledModules + ' modules enabled';
              const instances = ((instancePayload || {}).instances || {});
              const instanceCount = Object.values(instances).reduce((count, items) => count + (Array.isArray(items) ? items.length : 0), 0);
              $('instance-summary').textContent = instanceCount + ' instances requested';
              const installedModelIds = new Set(((modelPayload || {}).models || []).map(modelIdentifier).filter(Boolean));
              $('model-summary').textContent = installedModelIds.size + (installedModelIds.size === 1 ? ' model installed' : ' models installed');
              renderOverviewApps(modulePayload, instancePayload, status);
              renderOverviewAttention(appliance, modulePayload, instancePayload, modelPayload, status);
              renderModules(modulePayload, status);
              renderInstances(instancePayload, status);
              renderVram(modelPayload);
              renderModels(modelPayload);
              renderStatus(status);
              setText('session-user', 'Signed in: ' + session.username);
              setApiState('Connected', true);
            } catch (error) {
              setApiState(error.message || 'API unavailable', false);
            }
          };

          document.querySelectorAll('.tab-button').forEach((button) => {
            button.addEventListener('click', async () => {
              document.querySelectorAll('.tab-button').forEach((item) => item.setAttribute('aria-selected', item === button ? 'true' : 'false'));
              document.querySelectorAll('.tab-panel').forEach((panel) => { panel.hidden = panel.id !== ('tab-' + button.dataset.tab); });
              if (button.dataset.tab === 'users') {
                await loadUsers(false);
              }
            });
          });

          const userCreate = $('user-create');
          if (userCreate) {
            userCreate.addEventListener('click', () => openUserEditor());
          }

          const userSearchForm = $('user-search-form');
          if (userSearchForm) {
            userSearchForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              usersPageFirst = 0;
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          ['user-status-filter', 'user-source-filter'].forEach((id) => {
            const filter = $(id);
            if (filter) {
              filter.addEventListener('change', renderUsers);
            }
          });

          const userRefresh = $('user-refresh');
          if (userRefresh) {
            userRefresh.addEventListener('click', async () => {
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          const userPageSize = $('users-page-size');
          if (userPageSize) {
            userPageSize.addEventListener('change', async () => {
              usersPageSize = Number(userPageSize.value || 25);
              usersPageFirst = 0;
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          const usersPrevious = $('users-previous');
          if (usersPrevious) {
            usersPrevious.addEventListener('click', async () => {
              usersPageFirst = Math.max(0, usersPageFirst - usersPageSize);
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          const usersNext = $('users-next');
          if (usersNext) {
            usersNext.addEventListener('click', async () => {
              usersPageFirst += usersPageSize;
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          document.querySelectorAll('[data-dialog-cancel]').forEach((button) => {
            button.addEventListener('click', () => closeUserDialog(button.closest('dialog')));
          });

          const instanceCreateOpen = $('instance-create-open');
          if (instanceCreateOpen) {
            instanceCreateOpen.addEventListener('click', openInstanceCreateDialog);
          }

          const instanceCreateBack = $('instance-create-back');
          if (instanceCreateBack) {
            instanceCreateBack.addEventListener('click', () => selectInstanceCreateType(''));
          }

          const instanceCreateDialog = $('instance-create-dialog');
          if (instanceCreateDialog) {
            instanceCreateDialog.addEventListener('close', () => {
              activeInstanceCreateType = '';
              selectInstanceCreateType('');
            });
          }

          document.querySelectorAll('.dashboard-dialog').forEach((dialog) => {
            dialog.addEventListener('close', () => {
              clearPasswordInputs(dialog.querySelector('form'));
              restoreDialogOpener(dialog);
            });
          });

          const userEditorForm = $('user-editor-form');
          if (userEditorForm) {
            userEditorForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const creating = !activeUserEditor;
              const data = new FormData(userEditorForm);
              const errorNode = $('user-editor-error');
              errorNode.textContent = '';
              let path;
              let method;
              let body;
              if (creating) {
                const password = String(data.get('password') || '');
                const confirmation = String(data.get('passwordConfirmation') || '');
                if (password !== confirmation) {
                  errorNode.textContent = 'The temporary passwords do not match.';
                  clearPasswordInputs(userEditorForm);
                  userEditorForm.elements.password.focus();
                  return;
                }
                path = '/api/users';
                method = 'POST';
                body = JSON.stringify({
                  username: String(data.get('username') || '').trim(),
                  firstName: String(data.get('firstName') || '').trim(),
                  lastName: String(data.get('lastName') || '').trim(),
                  email: String(data.get('email') || '').trim(),
                  accessLevel: String(data.get('accessLevel') || 'user'),
                  enabled: data.has('enabled'),
                  password,
                  temporary: true
                });
              } else {
                path = '/api/users/' + encodeURIComponent(activeUserEditor.id);
                method = 'PATCH';
                body = JSON.stringify({
                  firstName: String(data.get('firstName') || '').trim(),
                  lastName: String(data.get('lastName') || '').trim(),
                  email: String(data.get('email') || '').trim()
                });
              }
              clearPasswordInputs(userEditorForm);
              setDialogBusy(userEditorForm, true);
              try {
                await userRequest(path, { method, body });
                closeUserDialog($('user-editor-dialog'));
                await refreshUsersAfterMutation(creating ? 'User created.' : 'User profile updated.');
              } catch (error) {
                errorNode.textContent = (error.message || 'The user could not be saved.') + (creating ? ' Re-enter the temporary password before retrying.' : '');
              } finally {
                setDialogBusy(userEditorForm, false);
              }
            });
          }

          const userRoleForm = $('user-role-form');
          if (userRoleForm) {
            userRoleForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              if (!activeUserRoles) { return; }
              const errorNode = $('user-role-error');
              errorNode.textContent = '';
              const data = new FormData(userRoleForm);
              const accessLevel = String(data.get('accessLevel') || 'user');
              setDialogBusy(userRoleForm, true);
              try {
                await userRequest('/api/users/' + encodeURIComponent(activeUserRoles.id) + '/roles', {
                  method: 'PUT',
                  body: JSON.stringify({ accessLevel })
                });
                closeUserDialog($('user-role-dialog'));
                await refreshUsersAfterMutation('User access updated and Keycloak logout requested.');
              } catch (error) {
                errorNode.textContent = error.message || 'The access level could not be updated.';
              } finally {
                setDialogBusy(userRoleForm, false);
              }
            });
          }

          const userPasswordForm = $('user-password-form');
          if (userPasswordForm) {
            userPasswordForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              if (!activeUserPassword) { return; }
              const data = new FormData(userPasswordForm);
              const password = String(data.get('password') || '');
              const confirmation = String(data.get('passwordConfirmation') || '');
              const errorNode = $('user-password-error');
              errorNode.textContent = '';
              if (password !== confirmation) {
                errorNode.textContent = 'The temporary passwords do not match.';
                clearPasswordInputs(userPasswordForm);
                userPasswordForm.elements.password.focus();
                return;
              }
              const body = JSON.stringify({ password, temporary: true });
              clearPasswordInputs(userPasswordForm);
              setDialogBusy(userPasswordForm, true);
              try {
                await userRequest('/api/users/' + encodeURIComponent(activeUserPassword.id) + '/password', { method: 'PUT', body });
                closeUserDialog($('user-password-dialog'));
                await refreshUsersAfterMutation('Temporary password set and Keycloak logout requested.');
              } catch (error) {
                errorNode.textContent = (error.message || 'The password could not be reset.') + ' Re-enter the temporary password before retrying.';
              } finally {
                setDialogBusy(userPasswordForm, false);
              }
            });
          }

          const userConfirmForm = $('user-confirm-form');
          if (userConfirmForm) {
            userConfirmForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              if (!activeUserConfirmation) { return; }
              const { user, action } = activeUserConfirmation;
              const errorNode = $('user-confirm-error');
              errorNode.textContent = '';
              let usernameConfirmation = '';
              if (action === 'delete') {
                usernameConfirmation = String(new FormData(userConfirmForm).get('usernameConfirmation') || '');
                if (usernameConfirmation !== String(user.username || '')) {
                  errorNode.textContent = 'Enter the exact username to confirm deletion.';
                  userConfirmForm.elements.usernameConfirmation.focus();
                  return;
                }
              }
              setDialogBusy(userConfirmForm, true);
              try {
                const basePath = '/api/users/' + encodeURIComponent(user.id);
                if (action === 'delete') {
                  await userRequest(basePath, {
                    method: 'DELETE',
                    body: JSON.stringify({ usernameConfirmation })
                  });
                } else {
                  await userRequest(basePath + '/' + action, { method: 'POST', body: '{}' });
                }
                closeUserDialog($('user-confirm-dialog'));
                await refreshUsersAfterMutation(action === 'delete' ? 'User deleted.' : 'User ' + action + 'd; Keycloak session state updated.');
              } catch (error) {
                errorNode.textContent = error.message || 'The requested action could not be completed.';
              } finally {
                setDialogBusy(userConfirmForm, false);
              }
            });
          }

          document.addEventListener('click', async (event) => {
            const actionButton = event.target.closest('[data-user-action]');
            if (!actionButton || actionButton.disabled) { return; }
            const user = userById(actionButton.dataset.userId);
            if (!user) {
              const output = $('users-output');
              if (output) { output.textContent = 'The selected user is no longer on this page. Refresh the list.'; }
              return;
            }
            const action = actionButton.dataset.userAction;
            if (action === 'edit') {
              try {
                actionButton.disabled = true;
                const payload = await loadUserDetails(user);
                const detail = (payload || {}).user || payload;
                openUserEditor({ ...user, ...detail, capabilities: detail.capabilities || user.capabilities });
              } catch (error) {
                const output = $('users-output');
                if (output) { output.textContent = error.message || 'The user details could not be loaded.'; }
              } finally {
                actionButton.disabled = false;
              }
              return;
            }
            if (action === 'roles') {
              openUserRoles(user);
            } else if (action === 'password') {
              openUserPassword(user);
            } else if (['enable', 'disable', 'delete'].includes(action)) {
              openUserConfirmation(user, action);
            }
          });

          document.addEventListener('click', async (event) => {
            const enable = event.target.closest('[data-module-enable]');
            const disable = event.target.closest('[data-module-disable]');
            const action = enable ? 'enable' : (disable ? 'disable' : null);
            const name = enable ? enable.dataset.moduleEnable : (disable ? disable.dataset.moduleDisable : null);
            if (!action || !name) { return; }
            try {
              pendingModuleActions[name] = action;
              (enable || disable).disabled = true;
              const item = (enable || disable).closest('.module-card, .module-item, .mini-item');
              const hasAdvancedFields = item && item.querySelector('[data-module-parameter]');
              const body = {};
              if (enable && hasAdvancedFields) {
                body.parameters = moduleParametersFromItem(item);
              }
              await request('/api/modules/' + encodeURIComponent(name) + '/' + action, { method: 'POST', body: JSON.stringify(body) });
              const message = name + ' ' + action + ' requested through ModuleActivation.';
              if ($('module-output')) { $('module-output').textContent = message; }
              if ($('model-output')) { $('model-output').textContent = message; }
              await refresh();
            } catch (error) {
              delete pendingModuleActions[name];
              if ($('module-output')) { $('module-output').textContent = error.message; }
              if ($('model-output')) { $('model-output').textContent = error.message; }
            }
          });

          document.addEventListener('click', async (event) => {
            const remove = event.target.closest('[data-model-delete]');
            if (!remove) { return; }
            const name = remove.dataset.modelDelete;
            try {
              pendingModelDeletes[name] = true;
              remove.disabled = true;
              remove.textContent = 'Removing';
              remove.title = 'Remove requested';
              await request('/api/models/' + encodeURIComponent(name), { method: 'DELETE' });
              $('model-output').textContent = name + ' remove requested.';
              await refresh();
            } catch (error) {
              delete pendingModelDeletes[name];
              remove.disabled = false;
              remove.textContent = 'Remove';
              remove.removeAttribute('title');
              $('model-output').textContent = error.message;
            }
          });

          document.addEventListener('click', async (event) => {
            const credentials = event.target.closest('[data-instance-credentials]');
            if (!credentials) { return; }
            const name = credentials.dataset.instanceCredentials;
            const card = credentials.closest('.module-card');
            if (!name || !card) { return; }
            const existing = card.querySelector('.credential-panel');
            if (existing) {
              existing.remove();
              credentials.textContent = 'Credentials';
              return;
            }
            try {
              credentials.disabled = true;
              credentials.textContent = 'Loading';
              const payload = await request('/api/instances/' + encodeURIComponent(name) + '/credentials');
              showInstanceCredentials(card, payload);
              credentials.textContent = 'Hide credentials';
              $('instance-output').textContent = name + ' credentials loaded.';
            } catch (error) {
              credentials.textContent = 'Credentials';
              $('instance-output').textContent = error.message;
            } finally {
              credentials.disabled = false;
            }
          });

          document.addEventListener('click', async (event) => {
            const remove = event.target.closest('[data-instance-delete]');
            if (!remove) { return; }
            const name = remove.dataset.instanceDelete;
            if (!name) { return; }
            try {
              await request('/api/instances/' + encodeURIComponent(name), { method: 'DELETE' });
              $('instance-output').textContent = name + ' remove requested.';
              await refresh();
            } catch (error) {
              $('instance-output').textContent = error.message;
            }
          });

          const localModelForm = $('local-model-form');
          if (localModelForm) {
            const localPresetSelect = $('local-model-preset');
            if (localPresetSelect) {
              localPresetSelect.addEventListener('change', () => {
                applyLocalPresetFields(localPresetSelect.value, { force: true });
                if (localPresetSelect.value === 'custom') {
                  scheduleVramEstimate();
                }
              });
            }
            ['url', 'contextWindow', 'maxNumSeqs', 'modelType'].forEach((name) => {
              const field = localModelForm.elements[name];
              if (field) {
                field.addEventListener('input', scheduleVramEstimate);
                field.addEventListener('change', scheduleVramEstimate);
              }
            });
            const vramSlider = $('vram-estimate-slider');
            if (vramSlider) {
              vramSlider.addEventListener('input', () => {
                applyVramLimitMi(Number(vramSlider.value || 0));
              });
            }
            document.querySelectorAll('[data-vram-use]').forEach((button) => {
              button.addEventListener('click', () => {
                if (!latestVramEstimate) { return; }
                const mode = button.dataset.vramUse;
                const minimum = Number(latestVramEstimate.minimumMi || 0);
                const recommended = Number(latestVramEstimate.recommendedMi || minimum);
                const maximum = latestVramEstimate.maximumMi === null || latestVramEstimate.maximumMi === undefined ? recommended : Number(latestVramEstimate.maximumMi || recommended);
                const effectiveMax = latestVramEstimate.gpuAvailable ? Math.max(minimum, maximum) : Math.max(minimum, recommended);
                const requested = mode === 'minimum' ? minimum : (mode === 'maximum' ? effectiveMax : recommended);
                const value = Math.min(effectiveMax, Math.max(minimum, requested));
                const slider = $('vram-estimate-slider');
                if (slider) {
                  slider.max = String(effectiveMax);
                  slider.value = String(value);
                }
                applyVramLimitMi(value, mode);
              });
            });
            localModelForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const missing = missingLocalModelModules(latestModulePayload);
              if (missing.length > 0) {
                const labels = missing.map((name) => moduleDisplayName(name, moduleCatalogSpec(latestModulePayload, name), moduleSpec(latestModulePayload, name)));
                $('model-output').textContent = 'Local models require these modules to be Ready: ' + labels.join(', ') + '.';
                return;
              }
              const data = new FormData(localModelForm);
              const preset = data.get('preset') || 'custom';
              const payload = {
                name: data.get('name') || preset,
                enabled: true,
                targetNamespace: 'ai',
                local: {
                  modelType: data.get('modelType') || 'chat',
                  vram: data.get('vram') || '5Gi'
                }
              };
              if (preset !== 'custom') {
                payload.local.preset = preset;
              }
              if ((data.get('url') || '').trim()) {
                payload.local.url = data.get('url').trim();
              }
              if ((data.get('contextWindow') || '').trim()) {
                payload.local.contextWindow = Number(data.get('contextWindow'));
              }
              if ((data.get('maxNumSeqs') || '').trim()) {
                payload.local.maxNumSeqs = Number(data.get('maxNumSeqs'));
              }
              try {
                await request('/api/models/local', { method: 'POST', body: JSON.stringify(payload) });
                $('model-output').textContent = payload.name + ' local model requested.';
                await refresh();
              } catch (error) {
                $('model-output').textContent = error.message;
              }
            });
          }

          const removeLocalRuntime = $('remove-local-runtime');
          if (removeLocalRuntime) {
            removeLocalRuntime.addEventListener('click', async () => {
              if (!window.confirm('Remove the automatically installed KubeAI and NVIDIA GPU runtime?')) { return; }
              try {
                removeLocalRuntime.disabled = true;
                const result = await request('/api/models/local-runtime/remove', { method: 'POST', body: '{}' });
                const removed = (result.removed || []).join(', ') || 'no modules';
                const skipped = (result.skipped || []).join(', ');
                $('model-output').textContent = 'Local runtime removal requested for ' + removed + (skipped ? '; manually managed modules skipped: ' + skipped : '') + '.';
                await refresh();
              } catch (error) {
                $('model-output').textContent = error.message;
              } finally {
                removeLocalRuntime.disabled = false;
              }
            });
          }

          const externalModelForm = $('external-model-form');
          if (externalModelForm) {
            externalModelForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const data = new FormData(externalModelForm);
              const payload = {
                name: data.get('name') || 'example-external-model',
                enabled: true,
                targetNamespace: 'ai',
                external: {
                  model: data.get('model') || 'openai/gpt-4o-mini',
                  apiBase: data.get('apiBase') || 'https://api.openai.com/v1',
                  modelType: data.get('modelType') || 'chat'
                }
              };
              if ((data.get('contextWindow') || '').trim()) {
                payload.external.contextWindow = Number(data.get('contextWindow'));
              }
              if ((data.get('apiKey') || '').trim()) {
                payload.apiKey = data.get('apiKey').trim();
              }
              try {
                await request('/api/models/external', { method: 'POST', body: JSON.stringify(payload) });
                $('model-output').textContent = payload.name + ' external model requested.';
                externalModelForm.reset();
                await refresh();
              } catch (error) {
                $('model-output').textContent = error.message;
              }
            });
          }

          document.querySelectorAll('.instance-form').forEach((form) => {
            form.addEventListener('submit', async (event) => {
              event.preventDefault();
              const data = new FormData(form);
              const type = form.dataset.instanceType;
              if (!instanceTypeInstalled(latestModulePayload, type)) {
                $('instance-output').textContent = 'Install the required modules before creating this instance.';
                return;
              }
              const selectedModel = String(data.get('model') || '').trim();
              if (form.querySelector('select[data-model-select]') && !selectedModel) {
                $('instance-output').textContent = 'Select a deployed model before creating this instance.';
                return;
              }
              const payload = {
                name: data.get('name') || 'default',
                enabled: true,
                namespace: 'ai',
                model: selectedModel || 'CHANGEME_MODEL',
                access: {
                  authentication: data.get('authentication') || 'sso',
                  role: data.get('role') || 'user',
                  exposure: data.get('exposure') || 'localAndPublic'
                }
              };
              const host = instanceHostDefault(form, latestSettings);
              if (type === 'openclaw') {
                payload.storage = { size: data.get('storage') || '20Gi' };
                payload.ingress = { enabled: false, host };
              }
              if (type === 'hermes') {
                payload.model = selectedModel || 'qwen3635b';
                payload.storage = { size: data.get('storage') || '10Gi' };
                payload.ingress = { enabled: false, host };
              }
              if (type === 'paperclip') {
                payload.storage = { size: data.get('storage') || '5Gi' };
                payload.database = { managed: { storageSize: data.get('postgresStorage') || '10Gi' } };
                payload.ingress = { enabled: false, host };
                payload.admin = { email: data.get('adminEmail') || 'admin@example.com', name: 'Admin' };
                const openClawEnabled = data.has('openClawEnabled');
                const hermesEnabled = data.has('hermesEnabled');
                const openClawInstanceRef = String(data.get('openClawInstanceRef') || '').trim();
                const hermesInstanceRef = String(data.get('hermesInstanceRef') || '').trim();
                if (openClawEnabled && !openClawInstanceRef) {
                  $('instance-output').textContent = 'Select an OpenClaw instance or disable its gateway.';
                  return;
                }
                if (hermesEnabled && !hermesInstanceRef) {
                  $('instance-output').textContent = 'Select a Hermes instance or disable its gateway.';
                  return;
                }
                const requestedConcurrency = Number(data.get('maxConcurrentAgents') || 2);
                const maxConcurrentAgents = Number.isFinite(requestedConcurrency)
                  ? Math.max(1, Math.min(10, Math.trunc(requestedConcurrency)))
                  : 2;
                payload.agentExecution = {
                  defaultModel: 'litellm/' + selectedModel.replace(/^(litellm|openai)\//, ''),
                  maxConcurrentAgents,
                  openCode: { enabled: data.has('openCodeEnabled') },
                  openClaw: { enabled: openClawEnabled, instanceRef: openClawInstanceRef },
                  hermes: { enabled: hermesEnabled, instanceRef: hermesInstanceRef }
                };
              }
              if (type === 'kubeopencode') {
                payload.server = { enabled: true, ingress: { enabled: false, host } };
                payload.agentTemplates = [{ name: data.get('template') || 'default-coder', description: 'Default coding agent template' }];
              }
              if (type === 'odysseus') {
                payload.storage = { size: data.get('storage') || '20Gi' };
                payload.chroma = { storage: { size: data.get('chromaStorage') || '5Gi' } };
                payload.searxng = { storage: { size: data.get('searxngStorage') || '1Gi' } };
                payload.ntfy = { storage: { size: data.get('ntfyStorage') || '1Gi' } };
                payload.ingress = { enabled: false, host };
              }
              try {
                await request('/api/instances/' + type, { method: 'POST', body: JSON.stringify(payload) });
                $('instance-output').textContent = type + '/' + payload.name + ' requested through AppInstance.';
                closeUserDialog($('instance-create-dialog'));
                await refresh();
              } catch (error) {
                $('instance-output').textContent = error.message;
              }
            });
          });

          document.querySelectorAll('input[data-gateway-toggle]').forEach((toggle) => {
            toggle.addEventListener('change', () => {
              const form = toggle.closest('form');
              const select = form && form.querySelector('select[data-instance-ref-type="' + toggle.dataset.gatewayToggle + '"]');
              if (select) {
                select.disabled = !toggle.checked || toggle.disabled;
              }
            });
          });

          const settingsForm = $('settings-form');
          if (settingsForm) {
            settingsForm.addEventListener('input', () => {
              settingsForm.dataset.dirty = 'true';
            });
            settingsForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const data = new FormData(settingsForm);
              const payload = {
                publicDomain: data.get('publicDomain'),
                mdnsDomain: data.get('mdnsDomain'),
                dashboardHost: data.get('dashboardHost')
              };
              try {
                const settings = await request('/api/settings', { method: 'PATCH', body: JSON.stringify(payload) });
                settingsForm.dataset.dirty = 'false';
                renderSettings(settings, { force: true });
                $('settings-output').textContent = 'Domain settings saved.';
                await refresh();
              } catch (error) {
                $('settings-output').textContent = error.message;
              }
            });
          }

          refresh();
          setInterval(refresh, 30000);
        })();
      </script>
    </body>
    </html>
    HTML

      mv "$tmp" /html/index.html
      sleep 30
    done
