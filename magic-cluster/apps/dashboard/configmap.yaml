            activeKubernetesAccessUser = user;
            form.reset();
            form.elements.accessLevel.value = String(user.accessLevel || 'none');
            $('kubernetes-access-title').textContent = 'Kubernetes access for ' + String(user.username || 'user');
            $('kubernetes-access-description').textContent = 'Access is bound to this Keycloak identity and is revoked by removing the group membership.';
            $('kubernetes-access-dialog-error').textContent = '';
            updateKubernetesAccessNote();
            showUserDialog(dialog, 'select[name="accessLevel"]');
          };

          const downloadKubernetesKubeconfig = async (user) => {
            const output = $('kubernetes-access-output');
            try {
              const payload = await dashboardRequest('/api/kubernetes-access/' + encodeURIComponent(user.id) + '/kubeconfig');
              const blob = new Blob([String(payload.content || '')], { type: 'application/yaml;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = String(payload.filename || 'magicstick.kubeconfig');
              document.body.appendChild(link);
              link.click();
              link.remove();
              URL.revokeObjectURL(url);
              if (output) { output.textContent = 'Kubeconfig downloaded for ' + String(user.username || 'user') + '. It contains no token or password.'; }
            } catch (error) {
              if (output) { output.textContent = 'Kubeconfig download failed: ' + (error.message || 'Kubernetes SSO is unavailable.'); }
            }
          };

          const copyKubernetesKubeconfig = async (user, button) => {
            const output = $('kubernetes-access-output');
            const originalLabel = button ? button.textContent : 'Copy to Clipboard';
            if (button) {
              button.disabled = true;
              button.textContent = 'Copying...';
            }
            try {
              const payload = await dashboardRequest('/api/kubernetes-access/' + encodeURIComponent(user.id) + '/kubeconfig');
              const content = String(payload.content || '');
              if (!content.trim()) { throw new Error('The kubeconfig is empty.'); }
              if (!await copyText(content)) { throw new Error('Clipboard access is unavailable.'); }
              if (output) { output.textContent = 'Kubeconfig copied for ' + String(user.username || 'user') + '. It contains no token or password.'; }
            } catch (error) {
              if (output) { output.textContent = 'Kubeconfig copy failed: ' + (error.message || 'Clipboard access is unavailable.'); }
            } finally {
              if (button) {
                button.disabled = false;
                button.textContent = originalLabel;
              }
            }
          };

          const refreshKubernetesAccessAfterMutation = async (message) => {
            kubernetesAccessLoaded = false;
            await loadKubernetesAccess(true);
            const output = $('kubernetes-access-output');
            if (output && kubernetesAccessLoaded) { output.textContent = message; }
          };

          const renderStatus = (status) => {
            const hardwareList = $('hardware-operator-list');
            const hardwareSummary = $('hardware-operator-summary');
            if (hardwareList) {
              hardwareList.replaceChildren();
              const operators = Object.values((status || {}).hardwareOperators || {})
                .sort((left, right) => String(left.displayName || left.module || '').localeCompare(String(right.displayName || right.module || '')));
              operators.forEach((operator) => {
                const card = document.createElement('article');
                card.className = 'mini-item hardware-operator-card';
                card.dataset.hardwareOperator = String(operator.vendor || operator.module || '');
                const heading = document.createElement('div');
                heading.className = 'module-row';
                const title = document.createElement('strong');
                title.textContent = operator.displayName || operator.module || 'GPU operator';
                const phase = document.createElement('span');
                const normalized = String(operator.phase || 'Unknown').toLowerCase();
                phase.className = 'status-pill ' + (
                  normalized === 'ready' ? 'ready'
                    : (['degraded', 'unsupported', 'conflict'].includes(normalized) ? 'degraded' : 'waiting')
                );
                phase.textContent = operator.phase || 'Unknown';
                heading.append(title, phase);

                const meta = document.createElement('div');
                meta.className = 'hardware-operator-meta';
                const version = document.createElement('span');
                version.textContent = 'Version ' + (operator.operatorVersion || 'unknown') + ' - ' + (operator.driverMode || 'driver mode unknown');
                const nodes = document.createElement('span');
                nodes.textContent = (operator.detectedNodes || []).length + ' detected / ' + (operator.compatibleNodes || []).length + ' compatible node(s)';
                const resources = document.createElement('span');
                resources.textContent = String(operator.allocatableResources || 0) + ' allocatable resource(s) - managed by ' + (operator.managedBy || 'none');
                const detail = document.createElement('span');
                detail.textContent = operator.message || 'No status message.';
                meta.append(version, nodes, resources, detail);
                card.append(heading, meta);
                hardwareList.appendChild(card);
              });
              if (!operators.length) {
                const empty = document.createElement('div');
                empty.className = 'mini-item';
                empty.textContent = 'Hardware operator status has not been reported yet.';
                hardwareList.appendChild(empty);
              }
              if (hardwareSummary) {
                const active = operators.filter((operator) => operator.operatorActive === true).length;
                const ready = operators.filter((operator) => operator.phase === 'Ready').length;
                hardwareSummary.textContent = ready + ' ready / ' + active + ' active / ' + operators.length + ' known';
              }
            }
            const fluxList = $('flux-list');
            if (fluxList) {
              fluxList.innerHTML = '';
              (status.fluxKustomizations || []).slice(0, 8).forEach((item) => {
                const ready = (item.conditions || []).find((condition) => condition.type === 'Ready');
                const node = document.createElement('div');
                node.className = 'mini-item';
                node.textContent = item.name + ': ' + ((ready || {}).status || item.phase || 'Unknown');
                fluxList.appendChild(node);
              });
            }
            const podSummary = $('pod-summary');
            if (podSummary) {
              const pods = status.pods || [];
              const running = pods.filter((pod) => pod.phase === 'Running').length;
              podSummary.textContent = running + '/' + pods.length + ' pods running';
            }
            const routeList = $('route-list');
            if (routeList) {
              routeList.innerHTML = '';
              (status.httpRoutes || []).slice(0, 8).forEach((route) => {
                const node = document.createElement('div');
                node.className = 'mini-item';
                const label = document.createElement('strong');
                label.textContent = route.namespace + '/' + route.name + ': ' + (route.accepted ? 'Accepted' : 'Pending');
                node.appendChild(label);
                const links = createResourceLinks((route.hostnames || []).map((hostname) => linkFromUrl('https://' + hostname)).filter(Boolean));
                if (links) {
                  node.appendChild(links);
                } else {
                  const empty = document.createElement('span');
                  empty.textContent = 'no host';
                  node.appendChild(empty);
                }
                routeList.appendChild(node);
              });
            }
          };

          const refresh = async () => {
            try {
              const session = await request('/api/session');
              latestSession = session || {};
              setUsersTabAccess(latestSession);
              setApiAccessTabAccess(latestSession);
              setKubernetesAccessTabAccess(latestSession);
              const settings = await request('/api/settings');
              const appliance = await request('/api/appliance');
              const modulePayload = await request('/api/modules');
              const instancePayload = await request('/api/instances');
              const modelPayload = await request('/api/models');
              const status = await request('/api/status');
              renderSettings(settings);
              latestModulePayload = modulePayload || {};
              latestModelPayload = modelPayload || {};
              renderInferenceEngines(latestModelPayload);
              renderComputeTargets(latestModelPayload);
              renderLocalPresetOptions(latestModelPayload);
              renderInstanceForms(latestModulePayload);
              renderLocalModelAvailability(latestModelPayload);
              renderInstanceModelOptions(latestModelPayload);
              if (!localPresetLastApplied && selectedComputeTarget()) {
                const presetSelect = $('local-model-preset');
                applyLocalPresetFields(presetSelect ? presetSelect.value : '', { force: true });
              }
              const phase = ((appliance.status || {}).phase || 'Pending');
              $('appliance-summary').textContent = appliance.metadata.namespace + '/' + appliance.metadata.name + ' is ' + phase;
              const modules = ((modulePayload || {}).modules || {});
              const enabledModules = Object.values(modules).filter((item) => item && item.enabled === true).length;
              $('module-summary').textContent = enabledModules + ' modules enabled';
              const instances = ((instancePayload || {}).instances || {});
              const instanceCount = Object.values(instances).reduce((count, items) => count + (Array.isArray(items) ? items.length : 0), 0);
              $('instance-summary').textContent = instanceCount + ' instances requested';
              const installedModelIds = new Set(((modelPayload || {}).models || []).map(modelIdentifier).filter(Boolean));
              $('model-summary').textContent = installedModelIds.size + (installedModelIds.size === 1 ? ' model installed' : ' models installed');
              renderOverviewApps(modulePayload, instancePayload, status);
              renderOverviewAttention(appliance, modulePayload, instancePayload, modelPayload, status);
              renderServices(modulePayload, instancePayload, status, modelPayload);
              renderComputeMemory(modelPayload);
              renderModels(modelPayload);
              renderStatus(status);
              setText('session-user', 'Signed in: ' + session.username);
              setApiState('Connected', true);
            } catch (error) {
              setApiState(error.message || 'API unavailable', false);
            }
          };

          document.querySelectorAll('.tab-button').forEach((button) => {
            button.addEventListener('click', async () => {
              document.querySelectorAll('.tab-button').forEach((item) => item.setAttribute('aria-selected', item === button ? 'true' : 'false'));
              document.querySelectorAll('.tab-panel').forEach((panel) => { panel.hidden = panel.id !== ('tab-' + button.dataset.tab); });
              if (button.dataset.tab === 'users') {
                await loadUsers(false);
              }
              if (button.dataset.tab === 'api-access') {
                await loadApiAccess(false);
              }
              if (button.dataset.tab === 'kubernetes-access') {
                await loadKubernetesAccess(false);
              }
            });
          });

          const kubernetesAccessRefresh = $('kubernetes-access-refresh');
          if (kubernetesAccessRefresh) {
            kubernetesAccessRefresh.addEventListener('click', async () => {
              kubernetesAccessLoaded = false;
              await loadKubernetesAccess(true);
            });
          }

          const kubernetesAccessSearchForm = $('kubernetes-access-search-form');
          if (kubernetesAccessSearchForm) {
            kubernetesAccessSearchForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              kubernetesAccessLoaded = false;
              await loadKubernetesAccess(true);
            });
          }

          const kubernetesAccessForm = $('kubernetes-access-form');
          if (kubernetesAccessForm) {
            kubernetesAccessForm.elements.accessLevel.addEventListener('change', updateKubernetesAccessNote);
            kubernetesAccessForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              if (!activeKubernetesAccessUser) { return; }
              const user = activeKubernetesAccessUser;
              const errorNode = $('kubernetes-access-dialog-error');
              errorNode.textContent = '';
              setDialogBusy(kubernetesAccessForm, true);
              try {
                const level = String(kubernetesAccessForm.elements.accessLevel.value || 'none');
                await dashboardRequest('/api/kubernetes-access/' + encodeURIComponent(user.id), {
                  method: 'PUT',
                  body: JSON.stringify({ accessLevel: level })
                });
                closeUserDialog($('kubernetes-access-dialog'));
                await refreshKubernetesAccessAfterMutation('Kubernetes access updated for ' + String(user.username || 'user') + '. Existing Keycloak sessions were signed out.');
              } catch (error) {
                errorNode.textContent = error.message || 'Kubernetes access could not be updated.';
              } finally {
                setDialogBusy(kubernetesAccessForm, false);
              }
            });
          }

          const apiAccessCreate = $('api-access-create');
          if (apiAccessCreate) {
            apiAccessCreate.addEventListener('click', openApiAccessCreate);
          }

          const apiAccessRefresh = $('api-access-refresh');
          if (apiAccessRefresh) {
            apiAccessRefresh.addEventListener('click', async () => {
              apiAccessLoaded = false;
              await loadApiAccess(true);
            });
          }

          const userCreate = $('user-create');
          if (userCreate) {
            userCreate.addEventListener('click', () => openUserEditor());
          }

          const userSearchForm = $('user-search-form');
          if (userSearchForm) {
            userSearchForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              usersPageFirst = 0;
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          ['user-status-filter', 'user-source-filter'].forEach((id) => {
            const filter = $(id);
            if (filter) {
              filter.addEventListener('change', renderUsers);
            }
          });

          const userRefresh = $('user-refresh');
          if (userRefresh) {
            userRefresh.addEventListener('click', async () => {
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          const userPageSize = $('users-page-size');
          if (userPageSize) {
            userPageSize.addEventListener('change', async () => {
              usersPageSize = Number(userPageSize.value || 25);
              usersPageFirst = 0;
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          const usersPrevious = $('users-previous');
          if (usersPrevious) {
            usersPrevious.addEventListener('click', async () => {
              usersPageFirst = Math.max(0, usersPageFirst - usersPageSize);
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          const usersNext = $('users-next');
          if (usersNext) {
            usersNext.addEventListener('click', async () => {
              usersPageFirst += usersPageSize;
              usersLoaded = false;
              await loadUsers(true);
            });
          }

          document.querySelectorAll('[data-dialog-cancel]').forEach((button) => {
            button.addEventListener('click', () => {
              const dialog = button.closest('dialog');
              if (dialog && dialog.id === 'api-access-created-dialog') {
                const keyInput = $('api-access-created-key');
                if (keyInput) { keyInput.value = ''; }
              }
              closeUserDialog(dialog);
            });
          });

          const instanceCreateOpen = $('instance-create-open');
          if (instanceCreateOpen) {
            instanceCreateOpen.addEventListener('click', () => openInstanceCreateDialog(''));
          }

          document.querySelectorAll('[data-service-filter]').forEach((button) => {
            button.addEventListener('click', () => {
              activeServiceFilter = button.dataset.serviceFilter || 'all';
              applyServiceFilter();
            });
          });

          const servicePlatformToggle = $('service-platform-toggle');
          if (servicePlatformToggle) {
