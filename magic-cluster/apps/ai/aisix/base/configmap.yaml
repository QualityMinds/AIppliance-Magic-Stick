apiVersion: v1
kind: ConfigMap
metadata:
  name: aisix-config
  namespace: aisix-system
  labels:
    app: aisix
data:
  config.yaml: |
    resources_file: /etc/aisix-runtime/resources.yaml
    proxy:
      addr: "0.0.0.0:3000"
      request_body_limit_bytes: 33554432
    admin:
      enabled: false
    observability:
      service_name: magicstick-aisix
      log_level: info
      access_log: true
      metrics:
        prometheus:
          enabled: true
          path: /metrics
          addr: "0.0.0.0:9090"
        otlp:
          enabled: false
      tracing:
        otlp:
          enabled: false
    upstream:
      timeout_ms: 600000
      stream_timeout_ms: 300000
      connect_timeout_ms: 10000
      retries: 1
