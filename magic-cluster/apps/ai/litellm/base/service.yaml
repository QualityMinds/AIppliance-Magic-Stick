apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
    - name: mesh-metrics
      port: 9099
      targetPort: mesh-metrics
      protocol: TCP
