apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: ai
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: qdrant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "${AI_APPLIANCE_QDRANT_STORAGE:=1Gi}"
