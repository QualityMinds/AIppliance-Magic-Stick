apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anything-llm-storage
  namespace: ai
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: anything-llm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "${AI_APPLIANCE_ANYTHING_LLM_STORAGE:=1Gi}"
