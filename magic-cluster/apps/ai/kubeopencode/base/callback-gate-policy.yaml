apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: kubeopencode-callback-gate
  namespace: identity-system
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: static-kubeopencode-local}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: static-kubeopencode-local-callback}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: static-kubeopencode-public}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: static-kubeopencode-public-callback}
  lua:
    - type: ValueRef
      valueRef: {group: "", kind: ConfigMap, name: magicstick-cookie-migration}
  extProc:
    - backendRefs: [{group: gateway.envoyproxy.io, kind: Backend, name: magicstick-callback-gate}]
      failOpen: false
      messageTimeout: 8s
      processingMode: {request: {}}
