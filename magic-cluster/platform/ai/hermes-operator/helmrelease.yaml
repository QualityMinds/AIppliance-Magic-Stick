apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-operator
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: hermes-operator-system
  chart:
    spec:
      chart: hermes-operator
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: hermes-operator
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    force: true
    crds: CreateReplace
  values:
    image:
      tag: v0.2.0
