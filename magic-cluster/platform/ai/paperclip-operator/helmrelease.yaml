apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperclip-operator
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: paperclip-operator-system
  chart:
    spec:
      chart: paperclip-operator
      version: "0.19.1"
      sourceRef:
        kind: HelmRepository
        name: paperclip-operator
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    force: true
    crds: CreateReplace
  values:
    crds:
      install: true
      keep: true
    image:
      repository: ghcr.io/paperclipinc/paperclip-operator
      tag: v0.19.1
