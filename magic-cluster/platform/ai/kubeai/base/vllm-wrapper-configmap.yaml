apiVersion: v1
kind: ConfigMap
metadata:
  name: magicstick-vllm-wrapper
  namespace: ai
data:
  sitecustomize.py: |-
    import os

    # Explicit, version/checksum-bound qualification only. Ordinary runtimes
    # never alter native vLLM files. Run before importing the argument wrapper
    # or launching Python workers; children see the same container-local fix.
    if os.environ.get("MAGICSTICK_VLLM_PLE_BACKPORT"):
        try:
            import ple_backport

            ple_backport.apply()
        except Exception as exc:
            import sys

            print(f"[magicstick-vllm-wrapper] ERROR: PLE backport rejected: {exc}",
                  file=sys.stderr, flush=True)
            # Python otherwise ignores failures in sitecustomize and continues
            # with an unqualified native kernel.
            os._exit(2)

    if (
        os.environ.get("MAGICSTICK_VLLM_WRAPPER_ENABLED", "").strip().lower() == "true"
        and os.environ.get("MAGICSTICK_VLLM_WRAPPER_APPLIED", "").strip().lower() != "true"
    ):
        # KubeAI starts the model server as the container's first Python
        # process. Mark the environment before importing the wrapper so every
        # multiprocessing child inherits the guard and keeps its own argv.
        os.environ["MAGICSTICK_VLLM_WRAPPER_APPLIED"] = "true"
        try:
            import wrapper

            wrapper.configure_argv()
        except Exception:
            # Python ignores ordinary sitecustomize exceptions. Continuing
            # would discard the checked VRAM/parallelism arguments and could
            # then fail on an unrelated original flag, hiding the real cause.
            import sys
            import tempfile
            import traceback

            location = "unavailable"
            try:
                directory = tempfile.mkdtemp(prefix="magicstick-vllm-startup-")
                location = os.path.join(directory, "startup.log")
                descriptor = os.open(location, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                with os.fdopen(descriptor, "w") as stream:
                    stream.write(traceback.format_exc()[-65536:])
            except OSError:
                pass
            print(f"[magicstick-vllm-wrapper] ERROR: WRAPPER_STARTUP; refusing unqualified startup; private_diagnostic={location}",
                  file=sys.stderr, flush=True)
            os._exit(2)
  ple_backport.py: |-
    """Opt-in backport of vLLM #60142, never a quantization conversion.

    Upstream b0b23a48d466712d18d390e73b62b169842f65e2 (Apache-2.0),
    applied only to the reviewed 0.31.0 NVIDIA image's exact native files.
    Container-local writes disappear when the model Pod is removed.
    """
    import fcntl
    import hashlib
    import os
    from importlib.metadata import distribution
    from pathlib import Path
    import tempfile


    FIX = "b0b23a48d466712d18d390e73b62b169842f65e2"
    ORIGINAL = {
        "models/qwen4_exp/common/ngram_embedding.py": "1392f51ccf0b610542bf05c3021271bf6754221d9616ff92831b94f79fc3a892",
        "triton_utils/importing.py": "e7f665c17fc51366e633dc88b1c6b50f5b4ed4516d1b6d8828c68ef9902fc814",
    }
    # Populated from the exact checked native sources, not from upstream main.
    PATCHED = {
        "models/qwen4_exp/common/ngram_embedding.py": "414c18488d3ea94c18b4c2e0f8dec7a1cf251d2efefd621dca64850088bd0b14",
        "triton_utils/importing.py": "609e659a995d7f5b3e56c6c1bda120a39d19db8adb63f330ac0961a415a57604",
    }


    def replace_once(source, before, after):
        if source.count(before) != 1:
            raise ValueError("Native PLE backport anchor is missing or ambiguous")
        return source.replace(before, after, 1)


    def transform(name, source):
        if name == "triton_utils/importing.py":
            return replace_once(source, "        self.int32 = None\n        self.tensor = None",
                "        self.int32 = None\n        self.uint8 = None\n"
                "        self.pointer_type = lambda element_ty: None\n        self.tensor = None")
        if name != "models/qwen4_exp/common/ngram_embedding.py":
            raise ValueError("Unknown native backport target")
        start = source.index("@triton.jit\ndef _lookup_ple_embedding_from_pinned_kernel(")
        end = source.index("\n\nclass Qwen4ExpPLEPinnedHostEmbedding", start)
        original = source[start:end]
        kernel = original
        for before, after in (
            ("    weight_ptr,", "    weight_ptr: tl.pointer_type(tl.uint8),  # type: ignore[valid-type]"),
            ("    output_ptr,", "    output_ptr: tl.pointer_type(tl.uint8),  # type: ignore[valid-type]"),
            ("    embedding_dim,", "    row_bytes,"),
            ('    """Look up TP-owned PLE rows through a CUDA view of pinned host memory."""',
             '    """Copy TP-owned PLE rows as raw bytes from a CUDA view of pinned host memory.\n\n'
             '    Byte pointers keep the storage dtype out of the kernel signature, so\n'
             '    dtypes Triton cannot lower on the GPU (FP8 E4M3FN before SM89) still work.\n    """'),
            ("    row_id = tl.program_id(0)", "    row_id = tl.program_id(0).to(tl.int64)"),
            ("    store_mask = offsets < embedding_dim", "    store_mask = offsets < row_bytes"),
            ("        weight_ptr + local_idx * embedding_dim + offsets,", "        weight_ptr + local_idx * row_bytes + offsets,"),
            ("        other=0.0,", "        other=0,"),
            ("        output_ptr + row_id * embedding_dim + offsets,", "        output_ptr + row_id * row_bytes + offsets,"),
        ):
            kernel = replace_once(kernel, before, after)
        source = replace_once(source, original, kernel)
        source = replace_once(source,
            "        self._block_d = triton.next_power_of_2(self.embedding_dim)",
            "        self._row_bytes = self.embedding_dim * self.weight.element_size()\n"
            "        self._block_d = triton.next_power_of_2(self._row_bytes)")
        return replace_once(source, "                output,\n                self.embedding_dim,",
                            "                output,\n                self._row_bytes,")


    def sha(data):
        return hashlib.sha256(data).hexdigest()


    def apply():
        if os.environ.get("MAGICSTICK_VLLM_PLE_BACKPORT") != FIX:
            raise ValueError("Unreviewed PLE backport requested")
        if os.environ.get("MAGICSTICK_COMPUTE_TARGET") != "nvidia-gpu":
            raise ValueError("PLE backport qualification is NVIDIA-only")
        runtime = distribution("vllm")
        if runtime.version != "0.31.0":
            raise ValueError("PLE backport requires the exact reviewed vLLM 0.31.0 runtime")
        lock_fd = os.open("/tmp/magicstick-ple-backport.lock", os.O_CREAT | os.O_RDWR | os.O_NOFOLLOW, 0o600)
        with os.fdopen(lock_fd, "r+") as lock:
            fcntl.flock(lock, fcntl.LOCK_EX)
            pending, hashes = [], {}
            # Validate both files before any write. Accept only the original or
            # our exact patched bytes; a future version/foreign edit fails closed.
            for name, expected in ORIGINAL.items():
                path = Path(runtime.locate_file("vllm/" + name))
                if path.is_symlink() or not path.is_file():
                    raise ValueError("Native PLE target must be a regular file")
                data = path.read_bytes()
                if sha(data) == PATCHED[name]:
                    hashes[name] = PATCHED[name]
                    continue
                if sha(data) != expected:
                    raise ValueError("Native PLE source checksum differs from the reviewed image")
                patched = transform(name, data.decode()).encode()
                if sha(patched) != PATCHED[name]:
                    raise ValueError("PLE backport result checksum differs from the reviewed patch")
                compile(patched, str(path), "exec")
                pending.append((path, patched))
                hashes[name] = sha(patched)
            for path, data in pending:
                fd, temporary = tempfile.mkstemp(prefix=".magicstick-ple-", dir=path.parent)
                try:
                    with os.fdopen(fd, "wb") as output:
                        output.write(data)
                        output.flush()
                        os.fsync(output.fileno())
                    os.chmod(temporary, path.stat().st_mode & 0o777)
                    os.replace(temporary, path)
                finally:
                    if os.path.exists(temporary):
                        os.unlink(temporary)
            if pending:
                print(f"[magicstick-vllm-wrapper] PLE byte-copy backport {FIX} applied to vLLM 0.31.0",
                      flush=True)
            return hashes
  wrapper.py: |-
    from importlib.metadata import PackageNotFoundError, version as runtime_version
    import json
    import os
    from pathlib import Path
    import re
    import subprocess
    import sys


    PREFIX = "[magicstick-vllm-wrapper]"


    def log(message):
        print(f"{PREFIX} {message}", flush=True)


    def die(message):
        print(f"{PREFIX} ERROR: {message}", file=sys.stderr, flush=True)
        sys.exit(2)


    def parse_mib(name):
        raw = os.environ.get(name)
        if raw is None or raw.strip() == "":
            return None
        value = raw.strip()
        number_only = re.fullmatch(r"(\d+(?:\.\d+)?)", value)
        if number_only:
            return int(float(number_only.group(1)))

        match = re.fullmatch(r"(\d+(?:\.\d+)?)\s*([A-Za-z]+)", value)
        if not match:
            die(f"{name} must be a memory value like 15Gi, 6144Mi, or 15360")

        amount = float(match.group(1))
        unit = match.group(2).lower()
        factors = {
            "m": 1,
            "mb": 1,
            "mi": 1,
            "mib": 1,
            "g": 1024,
            "gb": 1024,
            "gi": 1024,
            "gib": 1024,
        }
        if unit not in factors:
            die(f"{name} uses unsupported unit {match.group(2)!r}; use Mi or Gi")
        return int(amount * factors[unit])


    def nvidia_gpu_total_mib(device):
        command = [
            "nvidia-smi",
            "-i",
            device,
            "--query-gpu=memory.total",
            "--format=csv,noheader,nounits",
        ]
        try:
            result = subprocess.run(
                command,
                check=True,
                capture_output=True,
                text=True,
                timeout=10,
            )
        except FileNotFoundError:
            die("nvidia-smi is not available in the vLLM container")
        except subprocess.CalledProcessError as exc:
            die(f"nvidia-smi failed: {exc.stderr.strip() or exc.stdout.strip()}")
        except subprocess.TimeoutExpired:
            die("nvidia-smi timed out")

        lines = result.stdout.strip().splitlines()
        if not lines:
            die("nvidia-smi returned no GPU memory value")
        first_line = lines[0].strip()
        try:
            return int(first_line)
        except ValueError:
            die(f"could not parse GPU memory from nvidia-smi output: {first_line!r}")


    def python_gpu_total_mib(compute_target, device):
        if compute_target == "amd-gpu":
            backend = "cuda"
        elif compute_target == "intel-gpu":
            backend = "xpu"
        else:
            die(f"unsupported GPU memory backend for {compute_target!r}")
        script = (
            "import sys, torch; "
            f"props=torch.{backend}.get_device_properties(int(sys.argv[1])); "
            "print(int(props.total_memory)//1048576)"
        )
        try:
            child_env = dict(os.environ)
            child_env["MAGICSTICK_VLLM_WRAPPER_ENABLED"] = "false"
            result = subprocess.run(
                ["python3", "-c", script, device],
                check=True,
                capture_output=True,
                text=True,
                timeout=30,
                env=child_env,
            )
        except FileNotFoundError:
            die("python3 is not available in the vLLM container")
        except subprocess.CalledProcessError as exc:
            details = (exc.stderr or exc.stdout or "").strip()
            die(f"{compute_target} memory detection failed: {details or 'no diagnostic output'}")
        except subprocess.TimeoutExpired:
            die(f"{compute_target} memory detection timed out")

        lines = result.stdout.strip().splitlines()
        if not lines:
            die(f"{compute_target} runtime returned no GPU memory value")
        first_line = lines[0].strip()
        try:
            return int(first_line)
        except ValueError:
            die(f"could not parse {compute_target} memory from runtime output: {first_line!r}")


    def gpu_total_mib(compute_target, device):
        if compute_target == "nvidia-gpu":
            return nvidia_gpu_total_mib(device)
        return python_gpu_total_mib(compute_target, device)


    def strip_gpu_memory_utilization(args):
        filtered = []
        skip_next = False
        for arg in args:
            if skip_next:
                skip_next = False
                continue
            if arg in ("--gpu-memory-utilization", "--gpu_memory_utilization"):
                skip_next = True
                continue
            if arg.startswith("--gpu-memory-utilization=") or arg.startswith("--gpu_memory_utilization="):
                continue
            filtered.append(arg)
        return filtered


    def normalize_legacy_cache_flags(args):
        legacy = {"--calculate-kv-scales", "--no-calculate-kv-scales"}
        if not any(arg.replace("_", "-") in legacy for arg in args):
            return args
        # Upstream 0.28 removed runtime KV calibration, not FP8 cache support.
        # Inspect package metadata without importing torch or initializing CUDA;
        # older installed images must retain their existing calibration behavior.
        try:
            version = runtime_version("vllm")
        except PackageNotFoundError:
            die("Cannot identify the installed vLLM runtime for FP8 cache compatibility")
        match = re.match(r"^(\d+)\.(\d+)(?:[.+-]|$)", version)
        if not match:
            die(f"Cannot interpret the installed vLLM runtime version: {version!r}")
        if tuple(map(int, match.groups())) >= (0, 28):
            log(f"vllm={version}: removed legacy KV calibration flag; FP8 uses checkpoint scales or upstream defaults")
            return [arg for arg in args if arg.replace("_", "-") not in legacy]
        return args


    def configure_cpu_threads():
        """Respect a container CPU quota instead of binding the entire host.

        vLLM auto binding counts physical cores, not CFS quota. Under the
        default eight-core quota a many-core host otherwise starts dozens of
        spin-waiting workers. Explicit user thread/binding policies win.
        """
        if os.environ.get("OMP_NUM_THREADS") or os.environ.get("VLLM_CPU_OMP_THREADS_BIND"):
            return
        try:
            affinity = len(os.sched_getaffinity(0))
        except (AttributeError, OSError):
            affinity = os.cpu_count() or 1
        quota = None
        try:
            amount, period = Path("/sys/fs/cgroup/cpu.max").read_text().split()
            if amount != "max" and int(period) > 0 and int(amount) > 0:
                quota = max(1, int(amount) // int(period))
        except (OSError, ValueError):
            try:
                amount = int(Path("/sys/fs/cgroup/cpu/cpu.cfs_quota_us").read_text())
                period = int(Path("/sys/fs/cgroup/cpu/cpu.cfs_period_us").read_text())
                if amount > 0 and period > 0:
                    quota = max(1, amount // period)
            except (OSError, ValueError):
                pass
        if quota is not None and quota < affinity:
            threads = max(1, quota - 1)  # Leave bounded capacity for the frontend.
            os.environ["VLLM_CPU_OMP_THREADS_BIND"] = "nobind"
            os.environ["OMP_NUM_THREADS"] = str(threads)
            # This is an automatic startup budget, not an explicit operator
            # override. vLLM 0.31 reduces Torch intra-op threads to one after
            # loading; without its provenance marker our generated OMP value
            # disables that transition in both the worker and EngineCore.
            # Their spin-waiting pools then burn the Pod's CFS quota while a
            # Ready server fails to answer its first request.
            try:
                version = runtime_version("vllm")
                match = re.match(r"^(\d+)\.(\d+)(?:[.+-]|$)", version)
                if match and tuple(map(int, match.groups())) >= (0, 31):
                    os.environ["VLLM_OMP_NUM_THREADS_SET_BY_VLLM"] = "1"
            except PackageNotFoundError:
                pass
            log(f"CPU quota={quota} cores; startup_threads={threads}; serving_threads=native; binding=nobind")


    def configure_argv():
        compute_target = os.environ.get("MAGICSTICK_COMPUTE_TARGET", "nvidia-gpu").strip().lower()
        args = normalize_legacy_cache_flags(strip_gpu_memory_utilization(sys.argv[1:]))
        # All supported vLLM pins implement this scheduler. Lower values win
        # among queued requests; this does not promise preemption of active work.
        filtered = []
        skip_policy_value = False
        for arg in args:
            if skip_policy_value:
                skip_policy_value = False
                continue
            if arg in ("--scheduling-policy", "--scheduling_policy"):
                skip_policy_value = True
                continue
            if arg.startswith(("--scheduling-policy=", "--scheduling_policy=")):
                continue
            filtered.append(arg)
        args = [*filtered, "--scheduling-policy", "priority"]
        if compute_target == "cpu":
            configure_cpu_threads()
            sys.argv[:] = [sys.argv[0], *args]
            log(
                "compute_target=cpu "
                f"cpu_kvcache_space={os.environ.get('VLLM_CPU_KVCACHE_SPACE', 'unset')}"
            )
            return

        if compute_target not in ("nvidia-gpu", "amd-gpu", "intel-gpu"):
            die(f"unsupported MAGICSTICK_COMPUTE_TARGET: {compute_target!r}")

        device = os.environ.get("MAGICSTICK_GPU_DEVICE", "0").strip() or "0"
        budget_mib = parse_mib("MAGICSTICK_VLLM_VRAM_LIMIT")
        if budget_mib is None:
            die("MAGICSTICK_VLLM_VRAM_LIMIT is required for MagicStick GPU vLLM models")
        if budget_mib <= 0:
            die("MAGICSTICK_VLLM_VRAM_LIMIT must be greater than zero")

        group = os.environ.get("MAGICSTICK_GPU_UUIDS", "").split(",") if os.environ.get("MAGICSTICK_GPU_UUIDS") else []
        if group:
            # Replicated deployments bind one exact DRA UUID per independent
            # Pod. It is still a pinned assignment, not an invalid split group.
            if compute_target != "nvidia-gpu" or not all(group) or len(set(group)) != len(group):
                die("Invalid NVIDIA multi-GPU assignment")
            if os.environ.get("MAGICSTICK_GPU_COUNT", str(len(group))) != str(len(group)):
                die("NVIDIA GPU count does not match the requested DRA assignment")
            os.environ["CUDA_DEVICE_ORDER"] = "PCI_BUS_ID"
            args, total_mib = configure_parallelism(args, group)
            args = qualify_collectives(args, group)
        else:
            total_mib = gpu_total_mib(compute_target, device)
        if budget_mib > total_mib:
            die(
                "MAGICSTICK_VLLM_VRAM_LIMIT "
                f"{budget_mib}Mi is larger than physical GPU memory {total_mib}Mi"
            )

        raw_utilization = budget_mib / total_mib
        # Keep small user-selected budgets exact. vLLM accepts utilization
        # ratios below five percent; silently increasing them would violate the
        # reservation configured in the dashboard. Retain only the upper
        # safety cap so a full-device budget still leaves runtime headroom.
        utilization = min(0.98, raw_utilization)

        if "MAGICSTICK_CPU_OFFLOAD_MI" in os.environ:
            raw = os.environ["MAGICSTICK_CPU_OFFLOAD_MI"]
            if not raw.isdigit():
                die("MAGICSTICK_CPU_OFFLOAD_MI must be a non-negative integer")
            offload_mi = int(raw)
            if offload_mi and compute_target != "nvidia-gpu":
                die("CPU weight offloading is currently supported on NVIDIA only")
            filtered = []
            skip = False
            controlled = {"--cpu-offload-gb", "--cpu_offload_gb", "--offload-backend", "--offload-group-size"}
            for arg in args:
                if skip:
                    skip = False
                    continue
                if arg in controlled:
                    skip = True
                    continue
                if arg.split("=", 1)[0] not in controlled:
                    filtered.append(arg)
            args = filtered + [f"--cpu-offload-gb={offload_mi / 1024:.6f}", "--offload-backend=uva", "--offload-group-size=0"]
            log(f"cpu_offload_mib={offload_mi} (weight budget, not total host RAM or KV cache)")
        args.append(f"--gpu-memory-utilization={utilization:.4f}")
        sys.argv[:] = [sys.argv[0], *args]

        log(
            f"compute_target={compute_target} physical_gpu_mib="
            f"{total_mib} budget_mib={budget_mib} "
            f"gpu_memory_utilization={utilization:.4f}"
        )
        log("configured vLLM arguments")


    def argument(args, name, default=None):
        for index, value in enumerate(args):
            if value == name and index + 1 < len(args):
                return args[index + 1]
            if value.startswith(name + "="):
                return value.split("=", 1)[1]
        return default


    def parallelism_probe(args):
        # Never initialize CUDA in the parent: vLLM's multiprocessing workers
        # must own their CUDA contexts. This child also validates the model
        # against the registry shipped in the pinned runtime, without executing
        # arbitrary model repository Python code.
        script = """
    import json, sys, torch
    from vllm.config import ModelConfig
    from vllm.model_executor.models import ModelRegistry
    model = ModelConfig(model=sys.argv[1], revision=sys.argv[2] or None, trust_remote_code=False)
    config = model.hf_text_config
    devices = [torch.cuda.get_device_properties(i) for i in range(torch.cuda.device_count())]
    print('MAGICSTICK_PROBE=' + json.dumps({
        'devices': [{'uuid': str(d.uuid), 'totalMi': int(d.total_memory)//1048576} for d in devices],
        'heads': getattr(config, 'num_attention_heads', 0),
        'hidden': getattr(config, 'hidden_size', 0),
        'layers': getattr(config, 'num_hidden_layers', 0),
        'pipeline': ModelRegistry.is_pp_supported_model(model.architectures, model),
    }))
    """
        model = argument(args, "--model")
        if not model:
            die("Multi-GPU vLLM requires an explicit model reference")
        try:
            result = subprocess.run([sys.executable, "-c", script, model, argument(args, "--revision", "")],
                env={**os.environ, "MAGICSTICK_VLLM_WRAPPER_ENABLED": "false"},
                check=True, capture_output=True, text=True, timeout=180)
            return json.loads(next(line.split("=", 1)[1] for line in result.stdout.splitlines() if line.startswith("MAGICSTICK_PROBE=")))
        except (OSError, subprocess.SubprocessError, ValueError, StopIteration) as exc:
            die(f"Could not validate the multi-GPU runtime/model: {getattr(exc, 'stderr', '') or str(exc)}")


    def configure_parallelism(args, expected):
        probe = parallelism_probe(args)
        devices = probe.get("devices", [])
        # PyTorch exposes CUDA UUIDs without nvidia-smi/DRA's GPU- prefix on
        # some versions. Compare the same identity, not display formatting.
        def identity(value):
            return str(value).lower().removeprefix("gpu-")
        if len(devices) != len(expected) or {identity(d['uuid']) for d in devices} != {identity(uuid) for uuid in expected}:
            die("CUDA-visible GPU identities do not match the complete requested DRA group; refusing partial placement")
        capacities = [int(d['totalMi']) for d in devices]
        if min(capacities) <= 0:
            die("Multi-GPU requires a verified physical capacity for every GPU")
        unequal_capacities = len(set(capacities)) > 1
        count = len(devices)
        heads, hidden, layers = (int(probe.get(key) or 0) for key in ("heads", "hidden", "layers"))
        tensor = heads > 0 and hidden > 0 and heads % count == 0 and hidden % count == 0
        strategy = os.environ.get("MAGICSTICK_VLLM_PARALLELISM", "auto")
        if strategy == "auto":
            strategy = "tensor" if tensor else "pipeline"
        if strategy not in ("tensor", "pipeline") or (strategy == "tensor" and not tensor) or (strategy == "pipeline" and (not probe.get('pipeline') or layers < count)):
            die("The model does not support the selected GPU count/parallelism. Choose fewer GPUs or a supported strategy")
        controlled = {"--tensor-parallel-size", "--pipeline-parallel-size", "--distributed-executor-backend", "--data-parallel-size", "-tp", "-pp", "-dp"}
        if unequal_capacities:
            controlled.add("--worker-cls")
        filtered, skip = [], False
        for arg in args:
            if skip:
                skip = False
                continue
            option = arg.split("=", 1)[0].replace("_", "-")
            if option in controlled:
                skip = "=" not in arg
            else:
                filtered.append(arg)
        filtered += [f"--tensor-parallel-size={count if strategy == 'tensor' else 1}",
                     f"--pipeline-parallel-size={count if strategy == 'pipeline' else 1}",
                     "--distributed-executor-backend=mp", "--data-parallel-size=1"]
        if unequal_capacities:
            # Native worker selection keeps one MiB budget on each GPU instead
            # of applying one percentage to differently sized physical devices.
            filtered.append("--worker-cls=budget_worker.BudgetWorker")
        log(f"gpu_count={count} parallelism={strategy} (same-node, per-device VRAM budget)")
        return filtered, min(capacities)


    def collective_progress(output):
        """Last fixed milestone per rank; never retain native text or UUIDs."""
        stages = {"import", "assignment", "init", "all-reduce", "point-to-point", "cleanup", "complete"}
        ranks = {}
        for line in str(output)[-65536:].splitlines():
            if not line.startswith("MAGICSTICK_COLLECTIVE_PROGRESS=") or len(line) > 256:
                continue
            try:
                value = json.loads(line.split("=", 1)[1])
                rank, stage = value.get("rank"), value.get("stage")
                if type(rank) is int and 0 <= rank < 16 and stage in stages:
