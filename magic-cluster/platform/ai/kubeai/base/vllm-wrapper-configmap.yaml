    def collective_probe(expected, environment):
        # Own each rank directly. torchrun gives its workers new sessions, so
        # killing only torchrun's process group can leave CUDA workers alive and
        # communicate() waiting forever on their inherited output pipe.
        import select
        import signal
        import time
        from pathlib import Path

        command = [sys.executable, str(Path(__file__).with_name("collective_probe.py")), ",".join(expected)]
        processes, output, reason, returncode = [], bytearray(), None, None
        read_fd, write_fd = os.pipe()
        os.set_blocking(read_fd, False)

        def read_output():
            # Bounded tail and bounded work per poll: a noisy rank must not
            # exhaust RAM or postpone the qualification/cleanup deadline.
            try:
                chunk = os.read(read_fd, 65536)
            except BlockingIOError:
                return False
            output.extend(chunk)
            del output[:-65536]
            return bool(chunk)

        cleanup_confirmed = True
        try:
            port = collective_rendezvous_port()
            deadline = time.monotonic() + 75
            for rank in range(len(expected)):
                child_environment = {**environment, "MAGICSTICK_VLLM_WRAPPER_ENABLED": "false",
                    "MASTER_ADDR": "127.0.0.1", "MASTER_PORT": port,
                    "RANK": str(rank), "LOCAL_RANK": str(rank),
                    "WORLD_SIZE": str(len(expected)), "LOCAL_WORLD_SIZE": str(len(expected)),
                    "TORCHELASTIC_USE_AGENT_STORE": "False", "TORCHELASTIC_RESTART_COUNT": "0"}
                child_environment.setdefault("OMP_NUM_THREADS", "1")
                child_environment.setdefault("TORCH_NCCL_ASYNC_ERROR_HANDLING", "1")
                processes.append(subprocess.Popen(command, env=child_environment, stdout=write_fd,
                    stderr=subprocess.STDOUT, start_new_session=True))
            os.close(write_fd)
            write_fd = None
            while True:
                codes = [process.poll() for process in processes]
                if any(code not in (None, 0) for code in codes):
                    reason, returncode = "COLLECTIVE_PROBE_FAILED", next(code for code in codes if code not in (None, 0))
                    break
                if all(code == 0 for code in codes):
                    break
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    reason = "COLLECTIVE_PROBE_TIMEOUT"
                    break
                if select.select([read_fd], [], [], min(0.05, remaining))[0]:
                    if not read_output():
                        time.sleep(min(0.05, remaining))
        except OSError:
            # Never print command/environment or an exception that may contain
            # private native paths. Partial launches still own cleanup below.
            reason = "COLLECTIVE_PROBE_FAILED" if len(processes) == len(expected) else "COLLECTIVE_PROBE_LAUNCH_FAILED"
        finally:
            if write_fd is not None:
                os.close(write_fd)
            # Always clear every owned group, including descendants whose rank
            # leader already exited. A missing group is a normal exit race.
            for process in processes:
                try:
                    os.killpg(process.pid, signal.SIGKILL)
                except ProcessLookupError:
                    pass
                except OSError:
                    cleanup_confirmed = False
            cleanup_deadline = time.monotonic() + 10
            for process in processes:
                try:
                    process.wait(timeout=max(0, cleanup_deadline - time.monotonic()))
                except (subprocess.TimeoutExpired, OSError):
                    cleanup_confirmed = False
            # Do not wait for EOF: an inherited pipe must not add an unbounded
            # third wait. Drain at most one retained tail per assigned rank.
            for _ in range(len(expected) + 1):
                if not read_output():
                    break
            os.close(read_fd)
        text = output.decode("utf-8", errors="replace")
        if not cleanup_confirmed:
            collective_diagnostic(text, returncode, environment,
                reason="COLLECTIVE_PROBE_CLEANUP_UNCONFIRMED", cleanup_confirmed=False)
            # No alternate transport may start alongside unconfirmed workers.
            die("COLLECTIVE_PROBE_CLEANUP_UNCONFIRMED; refusing model startup and transport retry")
        success = reason is None and "MAGICSTICK_COLLECTIVE_OK" in text.splitlines()
        if not success:
