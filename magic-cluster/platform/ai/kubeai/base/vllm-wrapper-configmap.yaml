                reason=reason or "COLLECTIVE_PROBE_FAILED")
        return success


    def qualify_collectives(args, expected):
        if len(expected) < 2:
            return args
        environment = dict(os.environ)
        if collective_probe(expected, environment):
            log("NVIDIA collective preflight passed for the complete assigned GPU group")
            return args
        # Explicit operator transport policy is never overwritten. Only a
        # successful second probe on this very assignment qualifies fallback.
        if "NCCL_P2P_DISABLE" not in environment and collective_probe(expected, {**environment, "NCCL_P2P_DISABLE": "1"}):
            os.environ["NCCL_P2P_DISABLE"] = "1"
            log("WARNING: direct GPU transport failed; verified host-mediated NCCL transport selected for this Pod only. Check PCIe/IOMMU topology; throughput may be lower")
            # vLLM's custom CUDA collective bypasses NCCL's transport policy.
            return [*args, "--disable-custom-all-reduce"] if "--disable-custom-all-reduce" not in args else args
        die("NVIDIA collective preflight failed for the assigned GPU group (all-reduce or point-to-point). Check GPU/PCIe/IOMMU transport diagnostics; the model was not started")


    def main():
        configure_argv()


    if __name__ == "__main__":
        main()
