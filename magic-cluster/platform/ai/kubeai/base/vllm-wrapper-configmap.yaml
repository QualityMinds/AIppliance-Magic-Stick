    import torch
    from vllm.v1.worker.gpu_worker import Worker
    from wrapper import log, parse_mib


    class BudgetWorker(Worker):
        """vLLM 0.31.0 native worker with equal MiB budgets on unequal GPUs."""

        def init_device(self):
            if self.parallel_config.data_parallel_size != 1:
                raise ValueError("Magic Stick GPU groups require one same-node runtime")
            if self.cache_config.kv_cache_memory_bytes is not None or self.cache_config.num_gpu_blocks_override is not None:
                raise ValueError("Use the VRAM budget control rather than overriding KV cache memory or block counts")
            budget_mib = parse_mib("MAGICSTICK_VLLM_VRAM_LIMIT")
            if not budget_mib or budget_mib <= 0:
                raise ValueError("A positive per-GPU VRAM budget is required")
            # This runs in the CUDA worker child, never in the parent process.
            # The wrapper forces mp and data-parallel-size=1, so local_rank is
            # already the CUDA ordinal used by native Worker.init_device.
            torch.cuda.set_device(self.local_rank)
            total_bytes = torch.cuda.get_device_properties(self.local_rank).total_memory
            budget_bytes = budget_mib * 1048576
            if total_bytes <= 0 or budget_bytes > total_bytes:
                raise ValueError("The per-GPU budget exceeds this worker's physical VRAM")
            self.cache_config.gpu_memory_utilization = min(0.98, budget_bytes / total_bytes)
            log(f"worker_gpu={self.local_rank} budget_mib={budget_mib} gpu_memory_utilization={self.cache_config.gpu_memory_utilization:.6f}")
            # Native startup rechecks free memory after NCCL initialization;
            # native profiling subtracts model/runtime usage from this budget.
            super().init_device()
