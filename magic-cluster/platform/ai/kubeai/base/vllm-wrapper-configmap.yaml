    """Bounded small native NCCL check, not an inference acceptance result."""
    import os
    import sys
    import json
    from datetime import timedelta


    def progress(stage):
        print("MAGICSTICK_COLLECTIVE_PROGRESS=" + json.dumps({
            "rank": int(os.environ["LOCAL_RANK"]), "stage": stage,
        }), flush=True)


    def main():
        progress("import")
        import torch
        import torch.distributed as dist

        progress("assignment")
        expected = [value.lower().removeprefix("gpu-") for value in sys.argv[1].split(",")]
        visible = [str(torch.cuda.get_device_properties(i).uuid).lower().removeprefix("gpu-")
                   for i in range(torch.cuda.device_count())]
        if len(visible) != len(expected) or set(visible) != set(expected):
            raise RuntimeError("Collective probe GPU assignment changed")
        rank = int(os.environ["LOCAL_RANK"])
        torch.cuda.set_device(rank)
        progress("init")
        dist.init_process_group("nccl", timeout=timedelta(seconds=30))
        size = dist.get_world_size()
        if size != len(expected):
            raise RuntimeError("Collective probe world size changed")
        value = torch.full((1024,), float(rank + 1), device="cuda", dtype=torch.float32)
        progress("all-reduce")
        dist.all_reduce(value)
        torch.cuda.synchronize()
        if not torch.all(value == size * (size + 1) / 2).item():
            raise RuntimeError("Collective probe all-reduce mismatch")
        # Pipeline parallelism uses send/recv as well as collectives. Probe
        # both directions for every pair after communicator initialization.
        progress("point-to-point")
        for source in range(size):
            for target in range(size):
                if source == target:
                    continue
                # Integer zero otherwise infers int64 on receivers while the
                # source sends float32: NCCL then waits for a different payload.
                tensor = torch.full((1024,), float(source + 1) if rank == source else 0,
                                    device="cuda", dtype=torch.float32)
                if rank == source:
                    dist.send(tensor, target)
                elif rank == target:
                    dist.recv(tensor, source)
                    if not torch.all(tensor == source + 1).item():
                        raise RuntimeError("Collective probe point-to-point mismatch")
                dist.barrier()
        torch.cuda.synchronize()
        progress("cleanup")
        dist.destroy_process_group()
        progress("complete")
        if rank == 0:
            print("MAGICSTICK_COLLECTIVE_OK", flush=True)


    if __name__ == "__main__":
        main()
