apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubeai
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: ai
  chart:
    spec:
      chart: kubeai
      version: "0.23.2"
      sourceRef:
        kind: HelmRepository
        name: kubeai
        namespace: flux-system
  install:
    createNamespace: false
  values:
    crds:
      enabled: true
    open-webui:
      enabled: false
    service:
      type: ClusterIP
    ingress:
      enabled: false
    modelServers:
      VLLM:
        images:
          magicstick-vllm-nvidia: vllm/vllm-openai:v0.23.0
          magicstick-vllm-cpu: vllm/vllm-openai-cpu:v0.23.0
          # Stable vendor images introduced upstream for the v0.26 release.
          magicstick-vllm-amd: vllm/vllm-openai-rocm:v0.26.0
          magicstick-vllm-intel: vllm/vllm-openai-xpu:v0.26.0
      OLlama:
        images:
          magicstick-ollama-cpu: ollama/ollama:0.11.11
          magicstick-ollama-nvidia: ollama/ollama:0.11.11
          magicstick-ollama-amd: ollama/ollama:0.11.11-rocm
    modelRollouts:
      # Avoid starting an extra GPU model pod during model updates.
      surge: 0
    resourceProfiles:
      magicstick-nvidia-gpu:
        imageName: magicstick-vllm-nvidia
        requests:
          cpu: "6"
          memory: 6Gi
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: present
            effect: NoSchedule
      magicstick-vllm-cpu:
        imageName: magicstick-vllm-cpu
        nodeSelector:
          kubernetes.io/os: linux
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 6Gi
      # KubeAI multiplies every resource quantity by the Model resource-profile
      # count. One unit represents 16 MiB, so the operator can translate an
      # appliance memory reservation into the pod's requests.memory value.
      magicstick-vllm-cpu-memory:
        imageName: magicstick-vllm-cpu
        nodeSelector:
          kubernetes.io/os: linux
        requests:
          cpu: "4m"
          memory: 16Mi
        limits:
          cpu: "16m"
          memory: 24Mi
      magicstick-ollama-cpu:
        imageName: magicstick-ollama-cpu
        nodeSelector:
          kubernetes.io/os: linux
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 6Gi
      magicstick-ollama-cpu-memory:
        imageName: magicstick-ollama-cpu
        nodeSelector:
          kubernetes.io/os: linux
        requests:
          cpu: "8m"
          memory: 16Mi
        limits:
          cpu: "32m"
          memory: 48Mi
      magicstick-ollama-nvidia-gpu:
        imageName: magicstick-ollama-nvidia
        requests:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: present
            effect: NoSchedule
      magicstick-ollama-amd-gpu:
        imageName: magicstick-ollama-amd
        nodeSelector:
          kubernetes.io/os: linux
          feature.node.kubernetes.io/amd-gpu: "true"
        requests:
          cpu: "2"
          memory: 4Gi
          amd.com/gpu: "1"
        limits:
          amd.com/gpu: "1"
        tolerations:
          - key: amd.com/gpu
            operator: Equal
            value: present
            effect: NoSchedule
      magicstick-amd-gpu:
        imageName: magicstick-vllm-amd
        nodeSelector:
          kubernetes.io/os: linux
          feature.node.kubernetes.io/amd-gpu: "true"
        requests:
          cpu: "6"
          memory: 8Gi
          amd.com/gpu: "1"
        limits:
          amd.com/gpu: "1"
        tolerations:
          - key: amd.com/gpu
            operator: Equal
            value: present
            effect: NoSchedule
      magicstick-intel-i915-gpu:
        imageName: magicstick-vllm-intel
        nodeSelector:
          kubernetes.io/os: linux
          intel.feature.node.kubernetes.io/gpu: "true"
        requests:
          cpu: "6"
          memory: 8Gi
          gpu.intel.com/i915: "1"
        limits:
          gpu.intel.com/i915: "1"
      magicstick-intel-xe-gpu:
        imageName: magicstick-vllm-intel
        nodeSelector:
          kubernetes.io/os: linux
          intel.feature.node.kubernetes.io/gpu: "true"
        requests:
          cpu: "6"
          memory: 8Gi
          gpu.intel.com/xe: "1"
        limits:
          gpu.intel.com/xe: "1"
    modelServerPods:
      jsonPatches:
        - op: replace
          path: /spec/volumes/0
          value:
            name: dshm
            emptyDir:
              medium: Memory
        - op: add
          path: /spec/volumes/-
          value:
            name: model-cache
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
        - op: add
          path: /spec/volumes/-
          value:
            name: magicstick-vllm-wrapper
            configMap:
              name: magicstick-vllm-wrapper
        - op: add
          path: /spec/volumes/-
          value:
            name: ollama-model-cache
            hostPath:
              path: /root/.ollama
              type: DirectoryOrCreate
        - op: add
          path: /spec/containers/0/volumeMounts/-
          value:
            name: model-cache
            mountPath: /root/.cache
        - op: add
          path: /spec/containers/0/volumeMounts/-
          value:
            name: magicstick-vllm-wrapper
            mountPath: /opt/magicstick/vllm-wrapper
            readOnly: true
        - op: add
          path: /spec/containers/0/volumeMounts/-
          value:
            name: ollama-model-cache
            mountPath: /root/.ollama
