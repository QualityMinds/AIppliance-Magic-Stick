apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: magicstick-gpu-sharing
  namespace: ai
rules:
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [magicstick-gpu-validation]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: magicstick-gpu-sharing
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: magicstick-gpu-sharing
subjects:
  - kind: ServiceAccount
    name: magicstick-operator
    namespace: ai-system
