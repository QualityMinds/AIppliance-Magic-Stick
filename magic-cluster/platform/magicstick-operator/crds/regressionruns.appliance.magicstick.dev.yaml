apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: regressionruns.appliance.magicstick.dev
spec:
  group: appliance.magicstick.dev
  scope: Namespaced
  names:
    plural: regressionruns
    singular: regressionrun
    kind: RegressionRun
    shortNames: [msreg]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [applianceUid, nodeUids, phases, requestedBy, image, sourceRevision]
              x-kubernetes-validations:
                - rule: 'has(self.diagnosticSelection) == has(oldSelf.diagnosticSelection) && (!has(self.diagnosticSelection) || self.diagnosticSelection == oldSelf.diagnosticSelection)'
                  message: 'The diagnostic selection is immutable. Create a new run instead.'
                - rule: '!has(self.diagnosticSelection) || (self.operation == "tests" && self.testMode == "full" && size(self.phases) == 1 && self.phases[0] in [2, 3, 4])'
                  message: 'Diagnostic tests require full mode and exactly their catalog phase (2, 3 or 4).'
                - rule: '(has(self.testMode) ? self.testMode : "full") == (has(oldSelf.testMode) ? oldSelf.testMode : "full")'
                  message: 'The test mode is immutable. Create a new run instead.'
                - rule: 'self.operation == "tests" || self.testMode == "full"'
                  message: 'Non-destructive mode cannot perform previous-run recovery.'
                - rule: 'self.testMode != "non-destructive" || (!has(self.accountRunName) && !has(self.accountRunUid))'
                  message: 'Non-destructive tests cannot reuse a previous recovery account.'
                - rule: 'self.applianceUid == oldSelf.applianceUid && self.nodeUids == oldSelf.nodeUids && self.phases == oldSelf.phases && self.requestedBy == oldSelf.requestedBy && self.image == oldSelf.image && self.sourceRevision == oldSelf.sourceRevision'
                  message: 'Run identity, image and selection are immutable. Create a new run instead.'
                - rule: 'has(self.accountRunName) == has(self.accountRunUid)'
                  message: 'A recovery account reference needs both its original run name and UID.'
                - rule: 'has(self.accountRunName) == has(oldSelf.accountRunName) && (!has(self.accountRunName) || (self.accountRunName == oldSelf.accountRunName && self.accountRunUid == oldSelf.accountRunUid))'
                  message: 'The recovery credential reference is immutable.'
                - rule: 'self.operation == oldSelf.operation && has(self.lockRecovery) == has(oldSelf.lockRecovery) && (!has(self.lockRecovery) || self.lockRecovery == oldSelf.lockRecovery)'
                  message: 'The run operation and reviewed recovery lock are immutable.'
                - rule: 'self.operation == "recover-lock" ? (size(self.phases) == 0 && has(self.lockRecovery)) : (size(self.phases) > 0 && !has(self.lockRecovery))'
                  message: 'Lock recovery selects no test phases and requires an exact lock snapshot.'
              properties:
                applianceUid: {type: string, maxLength: 64}
                nodeUids:
                  type: array
                  minItems: 1
                  maxItems: 64
                  x-kubernetes-list-type: set
                  items: {type: string, maxLength: 64}
                requestedBy: {type: string, minLength: 1, maxLength: 128}
                phases:
                  type: array
                  minItems: 0
                  maxItems: 9
                  x-kubernetes-list-type: set
                  items: {type: integer, minimum: 0, maximum: 8}
                image:
                  type: string
                  maxLength: 240
                  pattern: '^ghcr[.]io/qualityminds/magicstick-regression:[a-z0-9-]+@sha256:[a-f0-9]{64}$'
                sourceRevision: {type: string, pattern: '^[a-f0-9]{40}$'}
                testMode: {type: string, enum: [non-destructive, full], default: full}
                diagnosticSelection: {type: string, maxLength: 40, pattern: '^[a-z][a-z0-9-]{0,39}$'}
                operation: {type: string, maxLength: 12, enum: [tests, recover-lock], default: tests}
                lockRecovery:
                  type: object
                  required: [uid, resourceVersion, runId]
                  properties:
                    uid: {type: string, maxLength: 36, pattern: '^[a-f0-9-]{36}$'}
                    resourceVersion: {type: string, maxLength: 32, pattern: '^[0-9]{1,32}$'}
                    runId: {type: string, maxLength: 40, pattern: '^reg-[a-f0-9-]{36}$'}
                    released: {type: boolean, enum: [true]}
                accountRunName: {type: string, pattern: '^regression-[a-f0-9]{32}$'}
                accountRunUid: {type: string, pattern: '^[a-f0-9-]{36}$'}
                cancelRequested: {type: boolean, default: false}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
