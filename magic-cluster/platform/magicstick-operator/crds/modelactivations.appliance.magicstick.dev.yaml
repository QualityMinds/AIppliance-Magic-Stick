apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelactivations.appliance.magicstick.dev
  labels:
    app.kubernetes.io/name: magicstick-operator
    app.kubernetes.io/component: crd
spec:
  group: appliance.magicstick.dev
  names:
    kind: ModelActivation
    listKind: ModelActivationList
    plural: modelactivations
    singular: modelactivation
    shortNames:
      - msmodel
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Target
          type: string
          jsonPath: .spec.targetNamespace
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Model
          type: string
          jsonPath: .status.modelRef
        - name: VRAM
          type: integer
          jsonPath: .status.vramRequiredMi
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: ModelActivation requests one local or external model through the Magic Stick runtime controllers.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
              properties:
                enabled:
                  type: boolean
                  default: true
                type:
                  type: string
                  enum:
                    - local
                    - external
                targetNamespace:
                  type: string
                  default: ai
                applianceRef:
                  type: object
                  properties:
                    name:
                      type: string
                      default: local
                    namespace:
                      type: string
                      default: ai-system
                local:
                  type: object
                  description: Local KubeAI model settings for vLLM or Ollama.
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    preset:
                      type: string
                    url:
                      type: string
                    modelType:
                      type: string
                    features:
                      type: array
                      items:
                        type: string
                    engine:
                      type: string
                      default: VLLM
                      enum:
                        - VLLM
                        - OLlama
                    computeTarget:
                      type: string
                      description: Logical compute backend. Missing values on legacy resources are interpreted as nvidia-gpu.
                      default: nvidia-gpu
                      enum:
                        - cpu
                        - nvidia-gpu
                        - amd-gpu
                        - intel-gpu
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: computeTarget is immutable; recreate the ModelActivation to change it
                    resourceProfile:
                      type: string
                    vram:
                      type: string
                    vramMi:
                      type: integer
                      minimum: 1
                    memoryRequiredMi:
                      type: integer
                      minimum: 16
                      description: Kubernetes memory request for CPU-backed model pods, in MiB.
                    contextWindow:
                      type: integer
                      minimum: 1
                    maxOutputTokens:
                      type: integer
                      minimum: 1
                    maxNumSeqs:
                      type: integer
                      minimum: 1
                    kvCacheMemoryBytes:
                      type: integer
                      minimum: 67108864
                    args:
                      type: array
                      items:
                        type: string
                    minReplicas:
                      type: integer
                      minimum: 0
                    maxReplicas:
                      type: integer
                      minimum: 0
                    env:
                      type: object
                      additionalProperties:
                        type: string
                external:
                  type: object
                  description: External LiteLLM provider model settings.
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    model:
                      type: string
                    apiBase:
                      type: string
                    modelType:
                      type: string
                    apiKeySecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    apiVersion:
                      type: string
                    customLlmProvider:
                      type: string
                    tpm:
                      type: integer
                      minimum: 1
                    rpm:
                      type: integer
                      minimum: 1
                    contextWindow:
                      type: integer
                      minimum: 1
                    maxOutputTokens:
                      type: integer
                      minimum: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                phase:
                  type: string
                modelRef:
                  type: string
                catalogId:
                  type: string
                computeTarget:
                  type: string
                engine:
                  type: string
                resolvedResourceProfile:
                  type: string
                vramRequiredMi:
                  type: integer
                  minimum: 0
                memoryRequiredMi:
                  type: integer
                  minimum: 0
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
