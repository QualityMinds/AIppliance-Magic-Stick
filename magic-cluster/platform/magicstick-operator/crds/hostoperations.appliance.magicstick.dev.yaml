apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hostoperations.appliance.magicstick.dev
spec:
  group: appliance.magicstick.dev
  scope: Namespaced
  names:
    kind: HostOperation
    listKind: HostOperationList
    plural: hostoperations
    singular: hostoperation
    shortNames: [mshostop]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Node, type: string, jsonPath: .spec.nodeName}
        - {name: Action, type: string, jsonPath: .spec.action}
        - {name: Phase, type: string, jsonPath: .status.phase}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Host operation requests are immutable.
                - rule: self.action != 'prepare-gpu' || (has(self.planId) && size(self.planId) == 64)
                  message: GPU preparation requires a reviewed plan.
                - rule: '!self.experimentMode || self.allowExperimental'
                  message: Experiment mode requires explicit experimental acknowledgement.
                - rule: self.action == 'prepare-gpu' || ((!has(self.planId) || self.planId == '') && !self.allowExperimental && !self.experimentMode)
                  message: Power operations cannot supply preparation settings.
              required: [action, nodeName, nodeUid, bootId, requestId, acknowledgeDisruption, allowExperimental, experimentMode, actorHash]
              properties:
                action: {type: string, enum: [prepare-gpu, reboot, poweroff]}
                nodeName: {type: string, minLength: 1, maxLength: 253, pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'}
                nodeUid: {type: string, minLength: 1, maxLength: 64}
                bootId: {type: string, minLength: 1, maxLength: 64}
                requestId: {type: string, pattern: '^[a-f0-9]{32}$', maxLength: 32}
                planId: {type: string, maxLength: 64, pattern: '^([a-f0-9]{64})?$'}
                allowExperimental: {type: boolean}
                experimentMode: {type: boolean}
                acknowledgeDisruption: {type: boolean, enum: [true]}
                actorHash: {type: string, pattern: '^[a-f0-9]{64}$', maxLength: 64}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Accepted, Preparing, RebootScheduled, PoweroffScheduled, Verifying, Validating, Succeeded, PreparedUnverified, Failed, Rejected, Interrupted]
                message: {type: string, maxLength: 2048}
                requestId: {type: string, maxLength: 32}
                startedAt: {type: string, format: date-time}
                updatedAt: {type: string, format: date-time}
                bootId: {type: string, maxLength: 64}
