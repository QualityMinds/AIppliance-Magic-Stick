    def module_ready(module, catalog):
        if module in STATIC_DEPENDENCIES:
            name = STATIC_DEPENDENCIES[module]
        else:
            module_spec = (catalog.get("modules") or {}).get(module) or {}
            name = module_spec.get("kustomizationName")
        if not name:
            return False
        kustomization = get_resource("kustomize.toolkit.fluxcd.io", "v1", "kustomizations", FLUX_NAMESPACE, name)
        return ready_condition(kustomization or {}).get("status") == "True"


    def local_compute_target(activation):
        local = ((activation.get("spec") or {}).get("local") or {})
        return str(local.get("computeTarget") or "nvidia-gpu").strip().lower()


    def normalize_local_engine(value):
        normalized = str(value or "VLLM").strip().upper()
        if normalized == "VLLM":
            return "VLLM"
        if normalized == "OLLAMA":
            return "OLlama"
        raise ValueError("unsupported local.engine: " + str(value))


    def local_engine(activation):
        local = ((activation.get("spec") or {}).get("local") or {})
        return normalize_local_engine(local.get("engine"))


    def compute_target_definition(compute_target, compute_catalog, engine="VLLM"):
        definition = ((compute_catalog or {}).get("targets") or {}).get(compute_target)
        if not isinstance(definition, dict):
            raise ValueError("unsupported local.computeTarget: " + str(compute_target))
        requested_engine = normalize_local_engine(engine)
        engines = [normalize_local_engine(item) for item in definition.get("engines") or []]
        if requested_engine not in engines:
            raise ValueError("compute target " + compute_target + " does not support " + requested_engine)
        return definition


    def compute_target_engine_profile(definition, engine):
        requested_engine = normalize_local_engine(engine)
        profiles = definition.get("engineProfiles") or {}
        profile = profiles.get(requested_engine)
        if isinstance(profile, dict):
            return profile
        if requested_engine == "VLLM":
            return {
                "defaultResourceProfile": definition.get("defaultResourceProfile"),
                "resourceProfilesByResource": definition.get("resourceProfilesByResource") or {},
            }
        raise ValueError("compute target has no resource profile for " + requested_engine)


    def capability_modules(catalog, capabilities):
        modules = (catalog or {}).get("modules") or {}
        resolved = []
        for capability in capabilities or []:
            providers = [
                name
                for name, definition in sorted(modules.items())
                if capability in (definition.get("providesCapabilities") or [])
            ]
            if not providers:
                raise ValueError("no module provides required capability: " + str(capability))
            resolved.append(providers[0])
        return resolved


    def model_required_modules(
        model_type,
        compute_target="nvidia-gpu",
        engine="VLLM",
        catalog=None,
        compute_catalog=None,
    ):
        if model_type != "local":
            return list(EXTERNAL_MODEL_MODULES)
        if catalog is None or compute_catalog is None:
            provider = {
                "nvidia-gpu": "gpu",
                "amd-gpu": "amd-gpu",
                "intel-gpu": "intel-gpu",
            }.get(compute_target)
            providers = [provider] if provider else []
        else:
            target = compute_target_definition(compute_target, compute_catalog, engine)
            providers = capability_modules(catalog, target.get("requiredCapabilities") or [])
        return list(dict.fromkeys(providers + LOCAL_MODEL_BASE_MODULES))


    def ensure_model_module_activations(required_modules, catalog):
        for module in required_modules:
            module_definition = ((catalog or {}).get("modules") or {}).get(module) or {}
            if module_definition.get("activationPolicy") == "hardware-detected":
                continue
            ensure_module_activation(module, auto=True)


    def nvidia_gpu_capacity():
        total = 0
        for node in list_items("/api/v1/nodes"):
            status = node.get("status") or {}
            resources = status.get("allocatable") or status.get("capacity") or {}
            raw = str(resources.get("nvidia.com/gpu") or "0").strip()
            try:
                total += max(0, int(raw))
            except ValueError:
                continue
        return total


    def cluster_architectures():
        architectures = set()
        for node in list_items("/api/v1/nodes"):
            architecture = str(((node.get("status") or {}).get("nodeInfo") or {}).get("architecture") or "").strip()
            if architecture:
                architectures.add(architecture)
        return architectures


    def semantic_version(value):
        match = re.search(r"v?(\d+)\.(\d+)(?:\.(\d+))?", str(value or ""))
        if not match:
            return ()
        return tuple(int(part or 0) for part in match.groups())


    def version_at_least(value, minimum):
        current = semantic_version(value)
        required = semantic_version(minimum)
        return bool(current and required and current >= required)


    def node_name(node):
        return str((node.get("metadata") or {}).get("name") or "unknown")


    def node_labels(node):
        return (node.get("metadata") or {}).get("labels") or {}


    def node_ready(node):
        return any(
            item.get("type") == "Ready" and item.get("status") == "True"
            for item in ((node.get("status") or {}).get("conditions") or [])
        )


    def label_is_true(labels, name):
        return str((labels or {}).get(name) or "").strip().lower() == "true"


    def extended_resource_capacity(nodes, resource_names):
        total = 0
        for node in nodes or []:
            resources = (node.get("status") or {}).get("allocatable") or {}
            for resource_name in resource_names or []:
                raw = str(resources.get(resource_name) or "0").strip()
                if raw.isdigit():
                    total += int(raw)
        return total


    def compute_target_nodes(definition):
        architectures = {str(item) for item in definition.get("architectures") or []}
        selector = {str(key): str(value) for key, value in (definition.get("nodeSelector") or {}).items()}
        result = []
        for node in list_items("/api/v1/nodes"):
            if not node_ready(node) or (node.get("spec") or {}).get("unschedulable") is True:
                continue
            labels = node_labels(node)
            node_info = (node.get("status") or {}).get("nodeInfo") or {}
            architecture = str(node_info.get("architecture") or labels.get("kubernetes.io/arch") or "")
            if architectures and architecture not in architectures:
                continue
            if not all(str(labels.get(key) or "") == value for key, value in selector.items()):
                continue
            result.append(node)
        return result


    def compute_target_resource_selection(definition, engine="VLLM"):
        resource_names = [str(item) for item in definition.get("resourceNames") or []]
        engine_profile = compute_target_engine_profile(definition, engine)
        profiles = {
            str(key): str(value)
            for key, value in (engine_profile.get("resourceProfilesByResource") or {}).items()
        }
        nodes = compute_target_nodes(definition)
        for resource_name in resource_names:
            capacity = extended_resource_capacity(nodes, [resource_name])
            if capacity > 0:
                return resource_name, profiles.get(resource_name) or engine_profile.get("defaultResourceProfile"), capacity
        return "", engine_profile.get("defaultResourceProfile"), 0


    def resolve_compute_target_profile(definition, engine="VLLM"):
        engine_profile = compute_target_engine_profile(definition, engine)
        profiles = engine_profile.get("resourceProfilesByResource") or {}
        if len(profiles) <= 1:
            return next(iter(profiles.values()), None) or engine_profile.get("defaultResourceProfile")
        _resource_name, profile, _capacity = compute_target_resource_selection(definition, engine)
        return profile or engine_profile.get("defaultResourceProfile")


    def compute_target_capacity(compute_target, definition):
        if compute_target == "nvidia-gpu":
            return nvidia_gpu_capacity()
        _resource_name, _profile, capacity = compute_target_resource_selection(definition)
        return capacity


    def existing_crd_names():
        return {
            str((item.get("metadata") or {}).get("name") or "")
            for item in list_items("/apis/apiextensions.k8s.io/v1/customresourcedefinitions")
        }


    def hardware_node_preflight(node, hardware):
        labels = node_labels(node)
        node_info = (node.get("status") or {}).get("nodeInfo") or {}
        architecture = str(node_info.get("architecture") or labels.get("kubernetes.io/arch") or "")
        operating_system = str(node_info.get("operatingSystem") or labels.get("kubernetes.io/os") or "")
        kubelet_version = str(node_info.get("kubeletVersion") or "")
        supported_architectures = {str(item) for item in hardware.get("architectures") or []}
        minimum_kubernetes = str(hardware.get("minimumKubernetes") or "")
        issues = []
        if operating_system != "linux":
            issues.append("operating system must be linux")
        if supported_architectures and architecture not in supported_architectures:
            issues.append("architecture " + (architecture or "unknown") + " is unsupported")
        if minimum_kubernetes and not version_at_least(kubelet_version, minimum_kubernetes):
            issues.append(
                "kubelet " + (kubelet_version or "unknown") + " is below " + minimum_kubernetes
            )
        return issues


    def hardware_operator_statuses(
        catalog,
        activations,
        module_statuses=None,
        nodes=None,
        crd_names=None,
        activate=False,
    ):
        module_statuses = module_statuses or {}
        nodes = list_items("/api/v1/nodes") if nodes is None else list(nodes)
        crd_names = existing_crd_names() if crd_names is None else set(crd_names)
        statuses = {}
        for module, definition in sorted((catalog.get("modules") or {}).items()):
            hardware = definition.get("hardware") or {}
            detection_label = str(hardware.get("detectionLabel") or "")
            if not detection_label:
                continue
            supported_label = str(hardware.get("supportedLabel") or detection_label)
            detected = [node for node in nodes if label_is_true(node_labels(node), detection_label)]
            incompatible = {}
            compatible = []
            for node in detected:
                issues = hardware_node_preflight(node, hardware)
                if issues:
                    incompatible[node_name(node)] = issues
                else:
                    compatible.append(node)
            supported = [
                node for node in compatible
                if label_is_true(node_labels(node), supported_label)
            ]
            resource_names = [str(item) for item in hardware.get("resourceNames") or []]
            allocatable = extended_resource_capacity(compatible, resource_names)
            activation = activations.get(module)
            activation_spec = (activation or {}).get("spec") or {}
            activation_metadata = (activation or {}).get("metadata") or {}
            enabled = bool(activation) and activation_spec.get("enabled", True) is not False and not activation_metadata.get("deletionTimestamp")
            module_phase = str(
                (module_statuses.get(module) or {}).get("phase")
                or ((activation or {}).get("status") or {}).get("phase")
                or ""
            )
            required_crds = {str(item) for item in definition.get("requiredCrds") or []}
            externally_managed = not activation and bool(required_crds.intersection(crd_names))
            managed_by = "external" if externally_managed else ("magicstick" if activation else "none")
            phase = "NotRequired"
            message = "No matching " + str(definition.get("displayName") or module) + " hardware was detected."

            if not detected and not enabled and not externally_managed:
                pass
            elif detected and not compatible:
                phase = "Unsupported"
                message = "Matching PCI hardware was detected, but no node passed the platform preflight."
            elif not detected and enabled:
                phase = "Unknown"
                message = "The hardware signal is currently absent; the existing operator is retained and is not removed automatically."
            elif not detected and externally_managed:
                phase = "Unknown"
                message = "An externally managed operator is present, but matching hardware is not currently detected."
            elif detected and activation and not enabled:
                phase = "Disabled"
                message = "Matching hardware is present, but the operator was explicitly disabled. Automatic detection will not override that choice."
            elif detected and externally_managed:
                if allocatable > 0:
                    phase = "Ready"
                    message = "An externally managed operator publishes allocatable GPU resources."
                else:
                    phase = "Conflict"
                    message = "The vendor CRD already exists outside Magic Stick, so automatic installation was blocked to avoid a second operator."
            elif detected and not enabled:
                phase = "Detected"
                message = "Compatible hardware detected; the vendor operator is being requested."
                if activate:
                    ensure_module_activation(module, auto=True, activation_source="hardware-detection")
            elif module_phase.lower() == "degraded":
                phase = "Degraded"
                message = (module_statuses.get(module) or {}).get("message") or "The vendor operator failed to reconcile."
            elif module_phase.lower() != "ready":
                phase = "Installing"
                message = "The vendor operator is " + (module_phase or "being installed") + "."
            elif supported_label != detection_label and not supported:
                phase = "Unsupported"
                message = "The vendor operator is running, but its support rule did not accept the detected GPU."
            elif allocatable < 1:
                phase = "Installing"
                message = "The operator is running, but its driver and device plugin have not published an allocatable GPU resource yet."
            else:
                phase = "Ready"
                message = str(allocatable) + " allocatable GPU resource(s) are ready."

            operator_status = "True" if phase == "Ready" else ("False" if phase in ("Degraded", "Unsupported", "Conflict", "Disabled") else "Unknown")
            resource_status = "True" if allocatable > 0 else ("False" if detected else "Unknown")
            statuses[module] = {
                "module": module,
                "displayName": str(definition.get("displayName") or module),
                "vendor": str(hardware.get("vendor") or ""),
                "operatorVersion": str(hardware.get("operatorVersion") or ""),
                "driverMode": str(hardware.get("driverMode") or ""),
                "phase": phase,
                "needed": bool(detected),
                "operatorActive": bool(enabled or externally_managed),
                "managedBy": managed_by,
                "modulePhase": module_phase,
                "detectionLabel": detection_label,
                "supportedLabel": supported_label,
                "detectedNodes": [node_name(node) for node in detected],
                "compatibleNodes": [node_name(node) for node in compatible],
                "supportedNodes": [node_name(node) for node in supported],
                "incompatibleNodes": incompatible,
                "resourceNames": resource_names,
                "allocatableResources": allocatable,
                "message": message,
                "checks": [
                    {
                        "name": "hardware-detected",
                        "status": "True" if detected else "False",
                        "message": str(len(detected)) + " matching node(s).",
                    },
                    {
                        "name": "platform-preflight",
                        "status": "True" if compatible else ("False" if detected else "Unknown"),
                        "message": str(len(compatible)) + " compatible node(s).",
                    },
                    {
                        "name": "operator-ready",
                        "status": operator_status,
                        "message": module_phase or phase,
                    },
                    {
                        "name": "allocatable-resource",
                        "status": resource_status,
                        "message": str(allocatable) + " resource(s).",
                    },
                ],
            }
        return statuses


    def merged_local_model(activation, presets, compute_catalog=None):
        metadata = activation.get("metadata") or {}
        spec = activation.get("spec") or {}
        local = dict(spec.get("local") or {})
        compute_target = str(local.get("computeTarget") or "nvidia-gpu").strip().lower()
        engine = normalize_local_engine(local.get("engine"))
        target_definition = compute_target_definition(compute_target, compute_catalog, engine) if compute_catalog else {
            "engines": [engine],
            "engineProfiles": {
                engine: {
                    "defaultResourceProfile": (
                        ("magicstick-ollama-cpu-memory:128" if compute_target == "cpu" else "magicstick-ollama-nvidia-gpu:1")
                        if engine == "OLlama"
                        else ("magicstick-vllm-cpu-memory:256" if compute_target == "cpu" else "magicstick-nvidia-gpu:1")
                    )
                }
            },
        }
        preset_name = local.get("preset") or metadata.get("name")
        preset = dict(presets.get(preset_name) or {})
        if local.get("preset") and not preset:
            raise ValueError("unknown local model preset: " + str(local.get("preset")))
        variants = preset.get("variants") or []
        requested_artifact = str(local.get("artifact") or "").strip()
        artifact_controls_url = False
        merged = {key: value for key, value in preset.items() if key != "variants"}
        if variants:
            candidates = [
                dict(variant)
                for variant in variants
                if str(variant.get("computeTarget") or "").lower() == compute_target
                and normalize_local_engine(variant.get("engine")) == engine
            ]
            architectures = cluster_architectures() if compute_catalog is not None else set()
            if architectures:
                candidates = [
                    variant
                    for variant in candidates
                    if not variant.get("architectures")
                    or architectures.intersection(str(item) for item in variant.get("architectures") or [])
                ]
            if len(candidates) != 1:
                raise ValueError(
                    "preset " + str(preset_name) + " has no unique " + engine + "/" + compute_target + " variant for this cluster"
                )
            variant = candidates[0]
            artifacts = variant.get("artifacts") or []
            merged.update({key: value for key, value in variant.items() if key != "artifacts"})
            if artifacts:
                artifact_definitions = {}
                for artifact_definition in artifacts:
                    if not isinstance(artifact_definition, dict):
                        raise ValueError(
                            "preset " + str(preset_name) + " has an invalid artifact definition for "
                            + engine + "/" + compute_target
                        )
                    artifact_id = str(artifact_definition.get("id") or "").strip()
                    if not artifact_id or artifact_id in artifact_definitions:
                        raise ValueError(
                            "preset " + str(preset_name) + " has invalid or duplicate artifact IDs for "
                            + engine + "/" + compute_target
                        )
                    artifact_definitions[artifact_id] = artifact_definition
                selected_artifact_id = requested_artifact or str(variant.get("defaultArtifact") or "").strip()
                selected_artifact = artifact_definitions.get(selected_artifact_id)
                if not selected_artifact:
                    raise ValueError(
                        "unknown local model artifact " + str(selected_artifact_id or "<none>")
                        + " for preset " + str(preset_name) + " " + engine + "/" + compute_target
                    )
                merged.update({key: value for key, value in selected_artifact.items() if key != "id"})
                merged["artifact"] = selected_artifact_id
                artifact_controls_url = True
            elif requested_artifact:
                raise ValueError(
                    "unknown local model artifact " + requested_artifact + " for legacy preset "
                    + str(preset_name) + " " + engine + "/" + compute_target
                )
        elif requested_artifact:
            raise ValueError(
                "unknown local model artifact " + requested_artifact + " for preset "
                + str(preset_name) + " " + engine + "/" + compute_target
            )
        elif preset and compute_target != "nvidia-gpu":
            raise ValueError("legacy preset " + str(preset_name) + " is only available for nvidia-gpu")

        requested_profile = local.get("resourceProfile")
        resolved_profile = (
            merged.get("resourceProfile")
            or resolve_compute_target_profile(target_definition, engine)
            or compute_target_engine_profile(target_definition, engine).get("defaultResourceProfile")
        )
        if requested_profile and requested_profile != resolved_profile:
            raise ValueError("local.resourceProfile must be resolved from the selected compute target and preset")
        local_override_fields = (
            "modelType",
            "features",
            "vram",
            "vramMi",
            "memoryRequiredMi",
            "contextWindow",
            "context_window",
            "maxOutputTokens",
            "max_output_tokens",
            "maxNumSeqs",
            "max_num_seqs",
            "kvCacheMemoryBytes",
            "args",
            "minReplicas",
            "maxReplicas",
            "env",
        )
        if not artifact_controls_url:
            local_override_fields = ("url",) + local_override_fields
        merged.update({key: local[key] for key in local_override_fields if key in local})
        if local.get("preset"):
            merged["preset"] = local.get("preset")
        merged["computeTarget"] = compute_target
        merged["engine"] = engine
        merged["resourceProfile"] = resolved_profile
        if not merged.get("features"):
            model_type = merged.get("modelType") or merged.get("type") or "chat"
            merged["features"] = ["TextEmbedding"] if model_type == "embedding" else ["TextGeneration"]
        return merged


    def local_model_vram_mi(local):
        return parse_mib(local.get("vram")) or positive_int(local.get("vramMi")) or 0


    def cpu_memory_resource_profile(resource_profile, memory_mi):
        requested_mi = positive_int(memory_mi) or 0
        if not requested_mi:
            raise ValueError("local.memoryRequiredMi is required for CPU ModelActivation")
        profile = str(resource_profile or "").strip()
        if not profile or ":" not in profile:
            raise ValueError("CPU resource profile must use the <name>:<multiple> format")
        profile_name, _separator, _multiple = profile.rpartition(":")
        if not profile_name:
            raise ValueError("CPU resource profile name is empty")
        units = max(1, (requested_mi + CPU_MEMORY_PROFILE_UNIT_MI - 1) // CPU_MEMORY_PROFILE_UNIT_MI)
        normalized_mi = units * CPU_MEMORY_PROFILE_UNIT_MI
        return profile_name + ":" + str(units), normalized_mi


    def model_args_with_runtime_limits(args, context_window, max_num_seqs):
        normalized = []
        skip_next = False
        for arg in [str(item) for item in (args or [])]:
            if skip_next:
                skip_next = False
                continue
            if arg in ("--max-model-len", "--max_model_len", "--max-num-seqs", "--max_num_seqs"):
                skip_next = True
                continue
            if (
                arg.startswith("--max-model-len=")
                or arg.startswith("--max_model_len=")
                or arg.startswith("--max-num-seqs=")
                or arg.startswith("--max_num_seqs=")
            ):
                continue
            normalized.append(arg)
        if context_window:
            normalized.append(f"--max-model-len={context_window}")
        if max_num_seqs:
            normalized.append(f"--max-num-seqs={max_num_seqs}")
        return normalized


    def model_args_with_cpu_cache(args, kv_cache_memory_bytes):
        normalized = []
        skip_next = False
        for arg in [str(item) for item in (args or [])]:
            if skip_next:
                skip_next = False
                continue
            if arg in ("--kv-cache-memory-bytes", "--kv_cache_memory_bytes"):
                skip_next = True
                continue
            if arg.startswith("--kv-cache-memory-bytes=") or arg.startswith("--kv_cache_memory_bytes="):
                continue
            normalized.append(arg)
        normalized.append(f"--kv-cache-memory-bytes={kv_cache_memory_bytes}")
        return normalized


    def non_negative_int(value, default):
        if value is None:
            return default
        if isinstance(value, bool):
            return default
        if isinstance(value, int) and value >= 0:
            return value
        if isinstance(value, str) and value.strip().isdigit():
            return int(value.strip())
        return default


    def kubeai_model_replica_counts(model):
        model = model or {}
        spec = model.get("spec") or {}
        replicas = (model.get("status") or {}).get("replicas") or {}
        ready = non_negative_int(replicas.get("ready"), 0)
        current = non_negative_int(replicas.get("all"), 0)
        minimum = non_negative_int(spec.get("minReplicas"), 1)
        expected = max(1, ready, current, minimum)
        return ready, expected


    def pod_is_ready(pod):
        return any(
            condition.get("type") == "Ready" and condition.get("status") == "True"
            for condition in ((pod.get("status") or {}).get("conditions") or [])
        )


    def model_pod_endpoints(namespace, model_name):
        selector = urllib.parse.urlencode({"labelSelector": "app=model,model=" + model_name})
        pods = list_items(f"/api/v1/namespaces/{namespace}/pods?{selector}")
        endpoints = []
        for pod in pods:
            metadata = pod.get("metadata") or {}
            status = pod.get("status") or {}
            if metadata.get("deletionTimestamp") or not pod_is_ready(pod):
                continue
            pod_ip = str(status.get("podIP") or "").strip()
            if not pod_ip:
                continue
            annotations = metadata.get("annotations") or {}
            port = positive_int(annotations.get("model-pod-port")) or 8000
            if port > 65535:
                continue
            host = "[" + pod_ip + "]" if ":" in pod_ip else pod_ip
            endpoints.append("http://" + host + ":" + str(port))
        return endpoints


    def ollama_request_json(endpoint, method, path, body=None):
        data = None
        headers = {"Accept": "application/json"}
        if body is not None:
            data = json.dumps(body).encode("utf-8")
            headers["Content-Type"] = "application/json"
        request = urllib.request.Request(endpoint + path, data=data, headers=headers, method=method)
        with urllib.request.urlopen(request, timeout=OLLAMA_MODEL_API_TIMEOUT_SECONDS) as response:
            payload = response.read().decode("utf-8")
            return json.loads(payload) if payload else {}


    def ollama_model_names(payload):
        names = set()
        for model in (payload or {}).get("models") or []:
            for key in ("name", "model"):
                value = str((model or {}).get(key) or "").strip()
                if value:
                    names.add(value)
        return names


    def ollama_name_is_available(names, expected):
        expected = str(expected or "").strip()
        if not expected:
            return False
        candidates = {expected}
        if ":" not in expected.rsplit("/", 1)[-1]:
            candidates.add(expected + ":latest")
        return bool(candidates.intersection(names))


    def ensure_ollama_model_alias(namespace, model_name, model_url):
        source_name = str(model_url or "").removeprefix("ollama://").strip("/")
        if not source_name:
            return False, "Waiting for a valid Ollama source model reference."
        endpoints = model_pod_endpoints(namespace, model_name)
        if not endpoints:
            return False, "Waiting for a ready Ollama model pod."

        waiting_for_source = False
        unavailable_api = False
        alias_failures = []
        for endpoint in endpoints:
            try:
                names = ollama_model_names(ollama_request_json(endpoint, "GET", "/api/tags"))
            except (OSError, ValueError, urllib.error.URLError, urllib.error.HTTPError):
                unavailable_api = True
                continue
            if ollama_name_is_available(names, model_name):
                continue
            if not ollama_name_is_available(names, source_name):
                waiting_for_source = True
                continue
            try:
                ollama_request_json(
                    endpoint,
                    "POST",
                    "/api/copy",
                    {"source": source_name, "destination": model_name},
                )
                names = ollama_model_names(ollama_request_json(endpoint, "GET", "/api/tags"))
            except urllib.error.HTTPError as error:
                alias_failures.append("HTTP " + str(error.code))
                continue
            except (OSError, ValueError, urllib.error.URLError):
                alias_failures.append("model API error")
                continue
            if not ollama_name_is_available(names, model_name):
                alias_failures.append("alias is still absent")

        if alias_failures:
            return False, (
                "Ollama downloaded the source model, but could not publish alias "
                + model_name + ": " + ", ".join(sorted(set(alias_failures))) + "."
            )
        if waiting_for_source:
            return False, "Waiting for Ollama to finish downloading source model " + source_name + "."
        if unavailable_api:
            return False, "Waiting for the Ollama model API to become reachable."
        return True, "Ollama alias " + model_name + " is available on every ready model pod."


    def kubeai_model_resource(activation, presets, compute_catalog=None):
        metadata = activation.get("metadata") or {}
        spec = activation.get("spec") or {}
        name = metadata.get("name")
        namespace = spec.get("targetNamespace") or "ai"
        local = merged_local_model(activation, presets, compute_catalog)
        compute_target = local.get("computeTarget") or "nvidia-gpu"
        engine = local.get("engine") or "VLLM"
        resource_profile = local.get("resourceProfile")
        target_definition = compute_target_definition(compute_target, compute_catalog, engine) if compute_catalog else {
            "kind": "cpu" if compute_target == "cpu" else "gpu"
        }
        accelerator_backed = target_definition.get("kind") == "gpu"
        url = (local.get("url") or "").strip()
        vram_mi = local_model_vram_mi(local)
        memory_mi = positive_int(local.get("memoryRequiredMi")) or 0
        if not url:
            raise ValueError("local.url is required for local ModelActivation")
        if engine == "VLLM" and not url.startswith("hf://"):
            raise ValueError("VLLM local.url must use the hf:// scheme")
        if engine == "OLlama" and not url.startswith("ollama://"):
            raise ValueError("OLlama local.url must use the ollama:// scheme")
        if accelerator_backed and not vram_mi:
            raise ValueError("local.vram or local.vramMi is required for local ModelActivation")
        if not accelerator_backed and vram_mi:
            raise ValueError("CPU ModelActivation must not define local.vram or local.vramMi")
        if not accelerator_backed:
            memory_mi = memory_mi or (
                DEFAULT_OLLAMA_CPU_MEMORY_MI if engine == "OLlama" else DEFAULT_VLLM_CPU_MEMORY_MI
            )
            resource_profile, memory_mi = cpu_memory_resource_profile(resource_profile, memory_mi)
        annotations = {}
        context_window = positive_int(local.get("contextWindow") or local.get("context_window"))
        max_output_tokens = positive_int(local.get("maxOutputTokens") or local.get("max_output_tokens"))
        max_num_seqs = positive_int(local.get("maxNumSeqs") or local.get("max_num_seqs"))
        if context_window:
            annotations["ai-appliance.io/context-window"] = str(context_window)
        if max_output_tokens:
            annotations["ai-appliance.io/max-output-tokens"] = str(max_output_tokens)
        env = dict(local.get("env") or {})
        env["MAGICSTICK_COMPUTE_TARGET"] = compute_target
        env["MAGICSTICK_ENGINE"] = engine
        for legacy_key in (
            "MAGICSTICK_VLLM_ACTIVE_THREAD_PERCENTAGE",
            "MAGICSTICK_MPS_DEVICE",
            "CUDA_MPS_ACTIVE_THREAD_PERCENTAGE",
            "CUDA_MPS_PINNED_DEVICE_MEM_LIMIT",
            "CUDA_MPS_PIPE_DIRECTORY",
        ):
            env.pop(legacy_key, None)
        if engine == "VLLM":
            wrapper_path = "/opt/magicstick/vllm-wrapper"
            inherited_python_path = str(env.get("PYTHONPATH") or "").strip()
            env["PYTHONPATH"] = wrapper_path + ((":" + inherited_python_path) if inherited_python_path else "")
            env["MAGICSTICK_VLLM_WRAPPER_ENABLED"] = "true"
            if accelerator_backed:
                env["MAGICSTICK_VLLM_VRAM_LIMIT"] = local.get("vram") or str(vram_mi)
                env.pop("VLLM_CPU_KVCACHE_SPACE", None)
            else:
                env.pop("MAGICSTICK_VLLM_VRAM_LIMIT", None)
                env.pop("VLLM_CPU_KVCACHE_SPACE", None)
            args = model_args_with_runtime_limits(local.get("args") or [], context_window, max_num_seqs)
            if compute_target == "cpu":
                kv_cache_memory_bytes = positive_int(local.get("kvCacheMemoryBytes")) or 536870912
                args = model_args_with_cpu_cache(args, kv_cache_memory_bytes)
        else:
            if local.get("args"):
                raise ValueError("OLlama local.args is not supported; use contextWindow and maxNumSeqs")
            for key in (
                "MAGICSTICK_VLLM_WRAPPER_ENABLED",
                "MAGICSTICK_VLLM_VRAM_LIMIT",
                "VLLM_CPU_KVCACHE_SPACE",
            ):
                env.pop(key, None)
            env["OLLAMA_MAX_LOADED_MODELS"] = "1"
            env["OLLAMA_SCHED_SPREAD"] = "false"
            if context_window:
                env["OLLAMA_CONTEXT_LENGTH"] = str(context_window)
            if max_num_seqs:
                env["OLLAMA_NUM_PARALLEL"] = str(max_num_seqs)
            args = []
        return {
            "apiVersion": "kubeai.org/v1",
            "kind": "Model",
            "metadata": {
                "name": name,
                "namespace": namespace,
                "labels": {
                    "app.kubernetes.io/managed-by": "magicstick-operator",
                    "appliance.magicstick.dev/modelactivation": name,
                    "appliance.magicstick.dev/compute-target": compute_target,
                    "appliance.magicstick.dev/engine": engine.lower(),
                },
                "annotations": annotations,
            },
            "spec": {
                "features": local.get("features") or ["TextGeneration"],
                "url": url,
                "engine": engine,
                "resourceProfile": resource_profile,
                "minReplicas": non_negative_int(local.get("minReplicas"), 1),
                "maxReplicas": non_negative_int(local.get("maxReplicas"), 1),
                "env": env,
                "args": args,
            },
        }, {
            "computeTarget": compute_target,
            "engine": engine,
            "artifact": str(local.get("artifact") or ""),
            "precision": str(local.get("precision") or ""),
            "quantization": str(local.get("quantization") or ""),
            "resourceProfile": resource_profile,
            "vramMi": vram_mi,
            "memoryMi": memory_mi,
        }


    def delete_kubeai_model(name, namespace):
        return delete_resource("kubeai.org", "v1", "models", namespace, name)


    def reconcile_model_activation(activation, catalog, presets, compute_catalog=None):
        metadata = activation.get("metadata") or {}
        spec = activation.get("spec") or {}
        generation = int(metadata.get("generation") or 0)
        name = metadata.get("name")
        model_type = spec.get("type") or "local"
        namespace = spec.get("targetNamespace") or "ai"
        model_ref = ("kubeai/" + name) if model_type == "local" else ("litellm/" + name)
        runtime = {
            "computeTarget": local_compute_target(activation) if model_type == "local" else "external",
            "engine": str(((spec.get("local") or {}).get("engine") or "VLLM")) if model_type == "local" else "external",
            "artifact": str(((spec.get("local") or {}).get("artifact") or "")) if model_type == "local" else "",
            "precision": "",
            "quantization": "",
            "resourceProfile": "",
            "vramMi": 0,
            "memoryMi": 0,
        }

        def status_payload(phase, message, catalog_id=""):
            return {
                "phase": phase,
                "modelRef": model_ref,
                "catalogId": catalog_id,
                "computeTarget": runtime["computeTarget"],
                "engine": runtime["engine"],
                "artifact": runtime.get("artifact", ""),
                "precision": runtime.get("precision", ""),
                "quantization": runtime.get("quantization", ""),
                "resolvedResourceProfile": runtime["resourceProfile"],
                "vramRequiredMi": runtime["vramMi"],
                "memoryRequiredMi": runtime["memoryMi"],
                "message": message,
            }

        def patch_status(phase, reason, message, catalog_id=""):
            patch_model_status(
                activation,
                phase,
                reason,
                message,
                model_ref,
                catalog_id,
                runtime["vramMi"],
                generation,
                compute_target=runtime["computeTarget"],
                engine=runtime["engine"],
                resource_profile=runtime["resourceProfile"],
                memory_mi=runtime["memoryMi"],
                artifact=runtime.get("artifact", ""),
                precision=runtime.get("precision", ""),
                quantization=runtime.get("quantization", ""),
            )

        if metadata.get("deletionTimestamp"):
            if model_type == "local" and get_resource("kubeai.org", "v1", "models", namespace, name):
                delete_kubeai_model(name, namespace)
                message = "ModelActivation is being deleted; KubeAI Model is being removed."
                patch_status("Removing", "Removing", message, name)
                return "Removing", status_payload("Removing", message, name)
            remove_model_finalizer(activation)
            return "Disabled", status_payload("Disabled", "ModelActivation deleted.")

        ensure_model_finalizer(activation)
        enabled = spec.get("enabled", True) is not False
        if not enabled:
            if model_type == "local" and get_resource("kubeai.org", "v1", "models", namespace, name):
                delete_kubeai_model(name, namespace)
                message = "ModelActivation is disabled; KubeAI Model is being removed."
                patch_status("Removing", "Removing", message, name)
                return "Removing", status_payload("Removing", message, name)
            message = "ModelActivation is disabled."
            patch_status("Disabled", "Disabled", message, name)
            return "Disabled", status_payload("Disabled", message, name)

        if model_type not in ("local", "external"):
            message = "Unsupported model type: " + str(model_type)
            patch_status("Degraded", "UnsupportedType", message)
            return "Degraded", status_payload("Degraded", message)

        resource = None
        if model_type == "local":
            try:
                if compute_catalog is None:
                    resource, runtime = kubeai_model_resource(activation, presets)
                else:
                    resource, runtime = kubeai_model_resource(activation, presets, compute_catalog)
            except ValueError as error:
                message = str(error)
                patch_status("Degraded", "InvalidModelSpec", message)
                return "Degraded", status_payload("Degraded", message)

        try:
            required_modules = model_required_modules(
                model_type,
                runtime["computeTarget"],
                runtime["engine"],
                catalog,
                compute_catalog,
            )
        except ValueError as error:
            message = str(error)
            patch_status("Degraded", "InvalidComputeTarget", message)
            return "Degraded", status_payload("Degraded", message)
        ensure_model_module_activations(required_modules, catalog)
        missing_modules = [module for module in required_modules if not module_ready(module, catalog)]
        if missing_modules:
            message = "Waiting for required modules: " + ", ".join(missing_modules)
            patch_status("WaitingForModules", "WaitingForModules", message, name)
            return "WaitingForModules", status_payload("WaitingForModules", message, name)

        if model_type == "local":
            target_definition = compute_target_definition(
                runtime["computeTarget"], compute_catalog, runtime["engine"]
            ) if compute_catalog else {
                "displayName": "NVIDIA GPU",
                "resourceNames": ["nvidia.com/gpu"] if runtime["computeTarget"] == "nvidia-gpu" else [],
            }
            resource_names = [str(item) for item in target_definition.get("resourceNames") or []]
            if resource_names and compute_target_capacity(runtime["computeTarget"], target_definition) < 1:
                label = str(target_definition.get("displayName") or runtime["computeTarget"])
                message = (
                    "The " + label + " runtime is installed, but Kubernetes reports no allocatable "
                    + ", ".join(resource_names) + " resources."
                )
                patch_status("WaitingForGPU", "WaitingForGPU", message, name)
                return "WaitingForGPU", status_payload("WaitingForGPU", message, name)
            if not crd_exists("models.kubeai.org"):
                message = "Waiting for required CRDs: models.kubeai.org"
                patch_status("WaitingForCRDs", "WaitingForCRDs", message, name)
                return "WaitingForCRDs", status_payload("WaitingForCRDs", message, name)
            applied_model = apply_resource(resource)
            kubeai_model = get_resource("kubeai.org", "v1", "models", namespace, name) or applied_model
            ready_replicas, expected_replicas = kubeai_model_replica_counts(kubeai_model)
            if ready_replicas < 1:
                message = f"Waiting for KubeAI/{runtime['engine']} on {runtime['computeTarget']} to become ready: {ready_replicas}/{expected_replicas} replicas ready."
                patch_status("Starting", "WaitingForReadyReplica", message, name)
                return "Starting", status_payload("Starting", message, name)
            if runtime["engine"] == "OLlama":
                alias_ready, message = ensure_ollama_model_alias(
                    namespace,
                    name,
                    (resource.get("spec") or {}).get("url"),
                )
                if not alias_ready:
                    patch_status("Starting", "WaitingForOllamaAlias", message, name)
                    return "Starting", status_payload("Starting", message, name)

        if catalog_contains_model(namespace, name):
            message = "Model is available in the generated model catalog."
            patch_status("Ready", "CatalogReady", message, name)
            return "Ready", status_payload("Ready", message, name)

        message = "Waiting for model-catalog to publish the model."
        patch_status("Reconciling", "WaitingForCatalog", message, name)
        return "Reconciling", status_payload("Reconciling", message, name)


    def managed_resource_name(name, suffix):
        suffix = dns_label_part(suffix, "resource")
        prefix = dns_label_part(name, "instance")[: max(1, 62 - len(suffix))].rstrip("-")
        return prefix + "-" + suffix


    def app_instance_access_config(instance):
        access = ((instance.get("spec") or {}).get("access") or {})
        authentication = str(access.get("authentication") or "sso")
        role = str(access.get("role") or "user")
        exposure = str(access.get("exposure") or "localAndPublic")
        if authentication not in ("sso", "none"):
            raise ValueError("spec.access.authentication must be sso or none")
        if exposure not in ("local", "localAndPublic"):
            raise ValueError("spec.access.exposure must be local or localAndPublic")
        if role not in ("user", "viewer", "operator", "admin"):
            raise ValueError("spec.access.role must be user, viewer, operator, or admin")
        return authentication, role, exposure


    def app_instance_backend(instance, definition):
        metadata = instance.get("metadata") or {}
        application = ((instance.get("spec") or {}).get("application") or "")
        route = definition.get("route") or {}
        service_mode = route.get("serviceName") or "instance"
        if service_mode == "instance":
            service_name = metadata.get("name")
        elif service_mode == "shortName":
            service_name = app_instance_short_name(instance, application)
        else:
            raise ValueError("application route.serviceName must be instance or shortName")
        port = positive_int(route.get("port"))
        if not service_name or not port:
            raise ValueError("application definition has no valid route service and port")
        return service_name, port


    def access_resource_labels(instance):
        metadata = instance.get("metadata") or {}
        application = ((instance.get("spec") or {}).get("application") or "")
        return {
            "app.kubernetes.io/managed-by": "magicstick-operator",
            "appliance.magicstick.dev/appinstance": metadata.get("name"),
            "appliance.magicstick.dev/application": application,
        }


    def app_instance_route(
        instance,
        route_name,
        hostname,
        service_name,
        service_port,
        local=False,
        strip_cookies=False,
        request_timeout=None,
    ):
        target_namespace = ((instance.get("spec") or {}).get("targetNamespace") or "ai")
        metadata = {
            "name": route_name,
            "namespace": IDENTITY_NAMESPACE,
            "labels": access_resource_labels(instance),
        }
        if local:
            metadata["annotations"] = {"lab42.io/mdns.enabled": "true"}
        rule = {
            "backendRefs": [{
                "name": service_name,
                "namespace": target_namespace,
                "port": service_port,
            }],
        }
        if request_timeout is not None:
            if request_timeout != "0s":
                raise ValueError("application route.requestTimeout must be 0s when set")
            # AI application streams must not inherit Envoy's 15-second total
            # request timeout. Callback routes remain bounded by the default.
            rule["timeouts"] = {"request": request_timeout}
        if strip_cookies:
            # Edge authentication has already consumed the OIDC cookies. Hermes
            # is an API gateway and does not use application cookies; removing
            # them prevents Envoy's encrypted session cookies from exceeding
            # aiohttp's per-header limit after several SSO-protected apps.
            rule["filters"] = [{
                "type": "RequestHeaderModifier",
                "requestHeaderModifier": {"remove": ["Cookie"]},
            }]
        return {
            "apiVersion": "gateway.networking.k8s.io/v1",
            "kind": "HTTPRoute",
            "metadata": metadata,
            "spec": {
                "parentRefs": [{"name": IDENTITY_GATEWAY_NAME}],
                "hostnames": [hostname],
                "rules": [rule],
            },
        }


    def app_instance_callback_route(instance, route_name, hostname, callback_path, service_name, service_port):
        target_namespace = ((instance.get("spec") or {}).get("targetNamespace") or "ai")
        return {
            "apiVersion": "gateway.networking.k8s.io/v1",
            "kind": "HTTPRoute",
            "metadata": {
                "name": route_name,
                "namespace": IDENTITY_NAMESPACE,
                "labels": access_resource_labels(instance),
            },
            "spec": {
                "parentRefs": [{"name": IDENTITY_GATEWAY_NAME}],
                "hostnames": [hostname],
                "rules": [{
                    "matches": [{"path": {"type": "Exact", "value": callback_path}}],
                    "backendRefs": [{
                        "name": service_name,
                        "namespace": target_namespace,
                        "port": service_port,
                    }],
                }],
            },
        }


    def app_instance_security_policy(instance, policy_name, route_names, redirect_url, cookie_domain, required_role):
        issuer = "https://id." + mdns_domain() + "/realms/magicstick"
        allowed_roles = {
            "user": ["magicstick-user", "magicstick-viewer", "magicstick-operator", "magicstick-admin"],
            "viewer": ["magicstick-viewer", "magicstick-operator", "magicstick-admin"],
            "operator": ["magicstick-operator", "magicstick-admin"],
            "admin": ["magicstick-admin"],
        }[required_role]
        return {
            "apiVersion": "gateway.envoyproxy.io/v1alpha1",
            "kind": "SecurityPolicy",
            "metadata": {
                "name": policy_name,
                "namespace": IDENTITY_NAMESPACE,
                "labels": access_resource_labels(instance),
            },
            "spec": {
                "targetRefs": [{
                    "group": "gateway.networking.k8s.io",
                    "kind": "HTTPRoute",
                    "name": route_name,
                } for route_name in route_names],
                "oidc": {
                    "provider": {
                        "issuer": issuer,
                        "authorizationEndpoint": issuer + "/protocol/openid-connect/auth",
                        "tokenEndpoint": "http://keycloak.identity-system.svc.cluster.local:8080/realms/magicstick/protocol/openid-connect/token",
                        "endSessionEndpoint": issuer + "/protocol/openid-connect/logout",
                    },
                    "clientID": OIDC_CLIENT_ID,
                    "clientSecret": {"name": OIDC_CLIENT_SECRET_NAME},
                    "redirectURL": redirect_url,
                    "logoutPath": "/logout",
                    "cookieDomain": cookie_domain,
                    "cookieNames": {
                        "accessToken": "MagicStickAccessToken",
                        "idToken": "MagicStickIDToken",
                    },
                    "forwardAccessToken": True,
                },
                "jwt": {
                    "providers": [{
                        "name": "keycloak",
                        "issuer": issuer,
                        "remoteJWKS": {
                            "uri": "http://keycloak.identity-system.svc.cluster.local:8080/realms/magicstick/protocol/openid-connect/certs",
                            "backendRefs": [{"name": "keycloak", "port": 8080}],
                        },
                        "extractFrom": {"cookies": ["MagicStickAccessToken"]},
                    }],
                },
                "authorization": {
                    "defaultAction": "Deny",
                    "rules": [{
                        "name": "required-magicstick-role",
                        "action": "Allow",
                        "principal": {
                            "jwt": {
                                "provider": "keycloak",
                                "claims": [{
                                    "name": "realm_access.roles",
                                    "valueType": "StringArray",
                                    "values": allowed_roles,
                                }],
                            },
                        },
                    }],
                },
            },
        }


    def app_instance_access_resources(instance, definition):
        metadata = instance.get("metadata") or {}
        spec = instance.get("spec") or {}
        name = metadata.get("name")
        target_namespace = spec.get("targetNamespace") or "ai"
        application = spec.get("application") or ""
        authentication, required_role, exposure = app_instance_access_config(instance)
        service_name, service_port = app_instance_backend(instance, definition)
        local_host = app_instance_local_host(instance, application)
        public_host = app_instance_public_host(instance, application)
        local_route_name = managed_resource_name(name, "local")
        public_route_name = managed_resource_name(name, "public")
        local_callback_name = managed_resource_name(name, "local-callback")
        public_callback_name = managed_resource_name(name, "public-callback")
        local_policy_name = managed_resource_name(name, "local-sso")
        public_policy_name = managed_resource_name(name, "public-sso")
        grant_name = managed_resource_name(name, "route-access")
        resources = [{
            "apiVersion": "gateway.networking.k8s.io/v1beta1",
            "kind": "ReferenceGrant",
            "metadata": {
                "name": grant_name,
                "namespace": target_namespace,
                "labels": access_resource_labels(instance),
            },
            "spec": {
                "from": [{
                    "group": "gateway.networking.k8s.io",
                    "kind": "HTTPRoute",
                    "namespace": IDENTITY_NAMESPACE,
                }],
                "to": [{"group": "", "kind": "Service", "name": service_name}],
            },
        }]
        strip_cookies = bool((definition.get("route") or {}).get("stripCookies"))
        request_timeout = (definition.get("route") or {}).get("requestTimeout")
        resources.append(app_instance_route(
            instance,
            local_route_name,
            local_host,
            service_name,
            service_port,
            local=True,
            strip_cookies=strip_cookies,
            request_timeout=request_timeout,
        ))
        if authentication == "sso":
            local_callback_path = "/oauth2/callback/" + local_route_name
            resources.append(app_instance_callback_route(
                instance,
                local_callback_name,
                mdns_domain(),
                local_callback_path,
                service_name,
                service_port,
            ))
            resources.append(app_instance_security_policy(
                instance,
                local_policy_name,
                [local_route_name, local_callback_name],
                "https://" + mdns_domain() + local_callback_path,
                mdns_domain(),
                required_role,
            ))
        public_url = ""
        if exposure == "localAndPublic":
            resources.append(app_instance_route(
                instance,
                public_route_name,
                public_host,
                service_name,
                service_port,
                strip_cookies=strip_cookies,
                request_timeout=request_timeout,
            ))
            public_url = "https://" + public_host + "/"
            if authentication == "sso":
                public_callback_path = "/oauth2/callback/" + public_route_name
                resources.append(app_instance_callback_route(
                    instance,
                    public_callback_name,
                    dashboard_public_host(),
                    public_callback_path,
                    service_name,
                    service_port,
                ))
                resources.append(app_instance_security_policy(
                    instance,
                    public_policy_name,
                    [public_route_name, public_callback_name],
                    "https://" + dashboard_public_host() + public_callback_path,
                    public_domain(),
                    required_role,
                ))
        return resources, {
            "authentication": authentication,
            "requiredRole": required_role,
            "localURL": "https://" + local_host + "/",
            "publicURL": public_url,
        }


    def app_instance_access_refs(instance):
        name = (instance.get("metadata") or {}).get("name")
        target_namespace = ((instance.get("spec") or {}).get("targetNamespace") or "ai")
        return [
            {"apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "metadata": {"name": managed_resource_name(name, "local"), "namespace": IDENTITY_NAMESPACE}},
            {"apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "metadata": {"name": managed_resource_name(name, "public"), "namespace": IDENTITY_NAMESPACE}},
            {"apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "metadata": {"name": managed_resource_name(name, "local-callback"), "namespace": IDENTITY_NAMESPACE}},
            {"apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "metadata": {"name": managed_resource_name(name, "public-callback"), "namespace": IDENTITY_NAMESPACE}},
            {"apiVersion": "gateway.envoyproxy.io/v1alpha1", "kind": "SecurityPolicy", "metadata": {"name": managed_resource_name(name, "local-sso"), "namespace": IDENTITY_NAMESPACE}},
            {"apiVersion": "gateway.envoyproxy.io/v1alpha1", "kind": "SecurityPolicy", "metadata": {"name": managed_resource_name(name, "public-sso"), "namespace": IDENTITY_NAMESPACE}},
            {"apiVersion": "gateway.networking.k8s.io/v1beta1", "kind": "ReferenceGrant", "metadata": {"name": managed_resource_name(name, "route-access"), "namespace": target_namespace}},
        ]


    def sync_app_instance_access(instance, definition, enabled=True):
        desired, access_status = app_instance_access_resources(instance, definition) if enabled else ([], {"authentication": "sso", "requiredRole": "user", "localURL": "", "publicURL": ""})
        desired_keys = {
            (resource["apiVersion"], resource["kind"], resource["metadata"]["namespace"], resource["metadata"]["name"])
            for resource in desired
        }
        for reference in app_instance_access_refs(instance):
            metadata = reference["metadata"]
            key = (reference["apiVersion"], reference["kind"], metadata["namespace"], metadata["name"])
            if key not in desired_keys and get_applied_resource(reference):
                delete_applied_resource(reference)
        for resource in desired:
            apply_resource(resource)
        return access_status


    def app_instance_helmrelease(instance, definition, source, suspend=False):
        metadata = instance.get("metadata") or {}
        spec = instance.get("spec") or {}
        values = dict(spec.get("values") or {})
        application = spec.get("application") or ""
        name = metadata.get("name")
        target_namespace = spec.get("targetNamespace") or "ai"
        local_host = app_instance_local_host(instance, application)
        public_host = app_instance_public_host(instance, application)
        ingress = dict(values.get("ingress") or {})
        ingress["enabled"] = False
        ingress["host"] = public_host
        values["ingress"] = ingress
        server = dict(values.get("server") or {})
        server_ingress = dict(server.get("ingress") or {})
        server_ingress["enabled"] = False
        server_ingress["host"] = public_host
        server["ingress"] = server_ingress
        values["server"] = server
        chart_path = str(definition.get("chartPath") or "").strip()
        if not chart_path:
            raise ValueError("application definition has no chartPath")
        source_namespace = source.get("namespace") or FLUX_NAMESPACE
        return {
            "apiVersion": "helm.toolkit.fluxcd.io/v2",
            "kind": "HelmRelease",
            "metadata": {
                "name": name,
                "namespace": APPLIANCE_NAMESPACE,
                "labels": {
                    "app.kubernetes.io/managed-by": "magicstick-operator",
                    "appliance.magicstick.dev/appinstance": name,
                    "appliance.magicstick.dev/application": application,
                },
            },
            "spec": {
                "interval": "10m0s",
                "releaseName": name,
                "targetNamespace": target_namespace,
                "storageNamespace": APPLIANCE_NAMESPACE,
                "suspend": bool(suspend),
                "install": {"createNamespace": True},
                "upgrade": {"cleanupOnFail": True},
                "uninstall": {"keepHistory": False},
                "chart": {
                    "spec": {
                        "chart": "./" + chart_path.lstrip("./"),
                        "interval": "10m0s",
                        "reconcileStrategy": "Revision",
                        "sourceRef": {
                            "kind": source.get("kind") or "GitRepository",
                            "name": source.get("name") or "flux-system",
                            "namespace": source_namespace,
                        },
                    },
                },
                "values": {
                    "instance": {
                        "name": name,
                        "namespace": target_namespace,
                        "application": application,
                        "localHost": local_host,
                        "localName": local_mdns_name(local_host),
                        "publicHost": public_host,
                        "values": values,
                    },
                },
            },
        }, "https://" + local_host + "/"


    def app_instance_helmrelease_ref(instance):
        metadata = instance.get("metadata") or {}
        return {
            "apiVersion": "helm.toolkit.fluxcd.io/v2",
            "kind": "HelmRelease",
            "metadata": {"name": metadata.get("name"), "namespace": APPLIANCE_NAMESPACE},
        }


    def reconcile_helm_app_instance(instance, definition, source):
        metadata = instance.get("metadata") or {}
        spec = instance.get("spec") or {}
        generation = int(metadata.get("generation") or 0)
        name = metadata.get("name")
        target = {"kind": "HelmRelease", "name": name, "namespace": APPLIANCE_NAMESPACE}
        reference = app_instance_helmrelease_ref(instance)

        if metadata.get("deletionTimestamp"):
            sync_app_instance_access(instance, definition, enabled=False)
            if get_applied_resource(reference):
                delete_applied_resource(reference)
                patch_instance_status(instance, "Removing", target, "Removing", "Helm release is being removed.", generation=generation)
                return "Removing", target
            remove_app_instance_finalizer(instance)
            return "Disabled", target

        ensure_app_instance_finalizer(instance)
        enabled = spec.get("enabled", True) is not False
        access_status = sync_app_instance_access(instance, definition, enabled=enabled)
        release, url = app_instance_helmrelease(instance, definition, source, suspend=not enabled)
        apply_resource(release)
        if not enabled:
            patch_instance_status(instance, "Suspended", target, "Suspended", "Helm release is suspended and external routes are removed.", url=url, access=access_status, generation=generation)
            return "Suspended", target

        current = get_applied_resource(reference) or {}
        ready = ready_condition(current)
        if ready.get("status") == "True":
            phase = "Ready"
            reason = ready.get("reason") or "HelmReleaseReady"
            message = ready.get("message") or "Helm release is ready."
        elif ready.get("status") == "False" and ready.get("reason") not in ("Progressing", "InstallSucceeded", "UpgradeSucceeded"):
            phase = "Degraded"
            reason = ready.get("reason") or "HelmReleaseNotReady"
            message = ready.get("message") or "Helm release is not ready."
        else:
            phase = "Reconciling"
            reason = ready.get("reason") or "WaitingForHelmRelease"
            message = ready.get("message") or "Waiting for Flux to reconcile the Helm release."
        patch_instance_status(instance, phase, target, reason, message, url=url, access=access_status, generation=generation)
        return phase, target


    def reconcile_instance(instance, module_catalog, app_catalog, source):
        metadata = instance.get("metadata") or {}
        spec = instance.get("spec") or {}
        generation = int(metadata.get("generation") or 0)
        application = spec.get("application")
        definition = (app_catalog.get("applications") or {}).get(application)
        if not definition:
            if metadata.get("deletionTimestamp"):
                sync_app_instance_access(instance, {}, enabled=False)
                remove_app_instance_finalizer(instance)
                return "Disabled", {"kind": "", "name": metadata.get("name", ""), "namespace": spec.get("targetNamespace") or "ai"}
            patch_instance_status(instance, "Degraded", {}, "UnknownApplication", f"Unknown application '{application}'", generation=generation)
            return "Degraded", {}

        if metadata.get("deletionTimestamp") or spec.get("enabled", True) is False:
            return reconcile_helm_app_instance(instance, definition, source)

        required_modules = definition.get("requiredModules") or []
        for module in required_modules:
            ensure_module_activation(module, auto=True)
        missing_modules = [module for module in required_modules if not module_ready(module, module_catalog)]
        target = {"kind": "HelmRelease", "name": metadata.get("name"), "namespace": APPLIANCE_NAMESPACE}
        if missing_modules:
            message = "Waiting for required modules: " + ", ".join(missing_modules)
            patch_instance_status(instance, "WaitingForModules", target, "WaitingForModules", message, generation=generation)
            return "WaitingForModules", target

        missing_crds = [crd for crd in (definition.get("requiredCrds") or []) if not crd_exists(crd)]
        if missing_crds:
            message = "Waiting for required CRDs: " + ", ".join(missing_crds)
            patch_instance_status(instance, "WaitingForCRDs", target, "WaitingForCRDs", message, generation=generation)
            return "WaitingForCRDs", target

        return reconcile_helm_app_instance(instance, definition, source)


    def patch_appliance_status(module_statuses, instance_statuses, model_statuses, hardware_statuses=None):
        current = appliance()
        if not current:
            return
        hardware_statuses = hardware_statuses or {}
        degraded = any(item.get("phase") == "Degraded" for item in module_statuses.values())
        waiting = any(item.get("phase") not in ("Ready", "Suspended", "Disabled") for item in module_statuses.values())
        waiting = waiting or any(item.get("phase") not in ("Ready", "Suspended", "Disabled") for group in instance_statuses.values() for item in group.values())
        degraded = degraded or any(item.get("phase") == "Degraded" for item in model_statuses.values())
        waiting = waiting or any(item.get("phase") not in ("Ready", "Disabled") for item in model_statuses.values())
        degraded = degraded or any(
            item.get("phase") in ("Degraded", "Unsupported", "Conflict", "Disabled") and item.get("needed") is True
            for item in hardware_statuses.values()
        )
        waiting = waiting or any(
            item.get("phase") in ("Detected", "Installing")
            for item in hardware_statuses.values()
        )
        phase = "Degraded" if degraded else ("Reconciling" if waiting else "Ready")
        message = "Runtime CRs reconciled through ModuleActivation, AppInstance, and ModelActivation resources."
        path = f"/apis/{APPLIANCE_GROUP}/{APPLIANCE_VERSION}/namespaces/{APPLIANCE_NAMESPACE}/appliances/{APPLIANCE_NAME}/status"
        patch_json(path, {"status": {
            "observedGeneration": int((current.get("metadata") or {}).get("generation") or 0),
            "phase": phase,
            "modules": module_statuses,
            "instances": instance_statuses,
            "models": model_statuses,
            "hardwareOperators": hardware_statuses,
            "conditions": [condition("True" if phase == "Ready" else "False", phase, message)],
        }})


    def reconcile_once():
        catalog = load_catalog()
        app_catalog = load_app_catalog()
        compute_catalog = load_compute_target_catalog()
        presets = load_model_presets()
        current = appliance() or {}
        source = ((current.get("spec") or {}).get("source") or {"kind": "GitRepository", "name": "flux-system", "namespace": FLUX_NAMESPACE})
        activations = module_activations()
        instances = app_instances()
        models = model_activations()
        nodes = list_items("/api/v1/nodes")
        crd_names = existing_crd_names()

        seed_appliance_modules(current, catalog, activations)
        activations = module_activations()
        hardware_operator_statuses(
            catalog,
            activations,
            nodes=nodes,
            crd_names=crd_names,
            activate=True,
        )
        activations = module_activations()

        for instance in instances:
            definition = (app_catalog.get("applications") or {}).get((instance.get("spec") or {}).get("application")) or {}
            if ((instance.get("spec") or {}).get("enabled", True) is False):
                continue
            for module in definition.get("requiredModules") or []:
                ensure_module_activation(module, auto=True)
        for model in models:
            spec = model.get("spec") or {}
            if spec.get("enabled", True) is False:
                continue
            if (model.get("metadata") or {}).get("deletionTimestamp"):
                continue
            model_type = spec.get("type") or "local"
            compute_target = local_compute_target(model) if model_type == "local" else "external"
            try:
                engine = local_engine(model) if model_type == "local" else "external"
                required_model_modules = model_required_modules(
                    model_type, compute_target, engine, catalog, compute_catalog
                )
            except ValueError:
                required_model_modules = []
            ensure_model_module_activations(required_model_modules, catalog)
        for activation in list(activations.values()):
            if ((activation.get("spec") or {}).get("enabled", True) is False):
                continue
            module = canonical_module((activation.get("spec") or {}).get("module") or (activation.get("metadata") or {}).get("name"))
            module_spec = (catalog.get("modules") or {}).get(module) or {}
            for dependency in module_spec.get("requires") or []:
                dep = canonical_module(dependency)
                if dep not in STATIC_DEPENDENCIES:
                    ensure_module_activation(dep, auto=True)

        activations = module_activations()
        cleanup_stale_module_kustomizations(catalog, activations, source)
        module_statuses = {}
        for module, activation in sorted(activations.items()):
            phase, status = reconcile_module(module, activation, catalog, source)
            module_statuses[module] = status

        instance_statuses = {}
        for instance in instances:
            instance_type = (instance.get("spec") or {}).get("application") or "unknown"
            name = (instance.get("metadata") or {}).get("name")
            phase, target = reconcile_instance(instance, catalog, app_catalog, source)
            instance_statuses.setdefault(instance_type, {})[name] = {
                "phase": phase,
                "namespace": target.get("namespace", ""),
                "kind": target.get("kind", ""),
                "name": target.get("name", ""),
                "url": ((instance.get("status") or {}).get("url") or ""),
                "message": ((instance.get("status") or {}).get("message") or ""),
            }

        reconcile_paperclip_tenant_namespaces(instances)

        model_statuses = {}
        for model in models:
            name = (model.get("metadata") or {}).get("name")
            phase, status = reconcile_model_activation(model, catalog, presets, compute_catalog)
            model_statuses[name] = status

        hardware_statuses = hardware_operator_statuses(
            catalog,
            activations,
            module_statuses=module_statuses,
            nodes=nodes,
            crd_names=crd_names,
        )
        patch_appliance_status(module_statuses, instance_statuses, model_statuses, hardware_statuses)
        print(f"reconciled modules={len(module_statuses)} instances={len(instances)} models={len(models)}", flush=True)


    def main():
        print("magicstick-operator live controller starting", flush=True)
        while True:
            try:
                reconcile_once()
            except Exception as error:
                print("reconcile failed: " + repr(error), flush=True)
                traceback.print_exc()
            time.sleep(REQUEUE_SECONDS)


    if __name__ == "__main__":
        main()
