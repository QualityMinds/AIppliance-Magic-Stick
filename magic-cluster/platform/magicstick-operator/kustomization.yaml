apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - crds/appliances.appliance.magicstick.dev.yaml
  - crds/moduleactivations.appliance.magicstick.dev.yaml
  - crds/appinstances.appliance.magicstick.dev.yaml
  - crds/modelactivations.appliance.magicstick.dev.yaml
  - crds/hostoperations.appliance.magicstick.dev.yaml
  - crds/regressionruns.appliance.magicstick.dev.yaml
  - regression-rbac.yaml
  - rbac.yaml
  - kubernetes-access-rbac.yaml
  - module-catalog.yaml
  - compute-target-catalog.yaml
  - gpu-compatibility-catalog.yaml
  - gpu-validation-configmap.yaml
  - gpu-validation-history.yaml
  - gpu-runtime-images.yaml
  - app-catalog.yaml
  - model-presets.yaml
  - controller-configmap.yaml
  - deployment.yaml
  - default-appliance.yaml
configMapGenerator:
  - name: magicstick-operator-controller
    namespace: ai-system
    behavior: merge
    files:
      - service_keys.py
      - regression_runs.py
generatorOptions:
  disableNameSuffixHash: true
