apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: ${AI_APPLIANCE_ENVOY_CRDS_POLICY:=Skip}
  interval: 10m0s
  releaseName: envoy-gateway
  timeout: 10m0s
  upgrade:
    crds: ${AI_APPLIANCE_ENVOY_CRDS_POLICY:=Skip}
  values:
    # Patch releases fix auth-filter crashes. Attached EnvoyProxy resources also
    # pin this image because their default Replace merge does not inherit it.
    global:
      images:
        envoyProxy:
          image: docker.io/envoyproxy/envoy:distroless-v1.38.6
    deployment:
      replicas: 1
      envoyGateway:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
