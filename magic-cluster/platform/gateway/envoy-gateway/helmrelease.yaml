apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: ${AI_APPLIANCE_ENVOY_CRDS_POLICY:=Skip}
  interval: 10m0s
  releaseName: envoy-gateway
  timeout: 10m0s
  valuesFrom:
    - kind: ConfigMap
      name: magicstick-callback-backend-activation
      valuesKey: enabled
      targetPath: config.envoyGateway.extensionApis.enableBackend
      optional: true
  upgrade:
    crds: ${AI_APPLIANCE_ENVOY_CRDS_POLICY:=Skip}
  values:
    # First boot is disabled. Only the restricted real-API deny-canary Job
    # activates the watched valuesFrom override after admission is enforced.
    config:
      envoyGateway:
        extensionApis:
          enableBackend: false
    # Patch releases fix auth-filter crashes. Attached EnvoyProxy resources also
    # pin this image because their default Replace merge does not inherit it.
    global:
      images:
        envoyProxy:
          image: docker.io/envoyproxy/envoy:distroless-v1.38.7@sha256:3d79fb37be70734406e0d3b36189f662a2fd0d202813af492880aa3646426fda
    deployment:
      replicas: 1
      envoyGateway:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
