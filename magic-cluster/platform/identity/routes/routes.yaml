# Admit routes only after the Gateway baselines have current controller proof.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: identity-system
  annotations:
    lab42.io/mdns.enabled: "true"
spec:
  parentRefs:
    - name: identity-pilot
      sectionName: https
  hostnames:
    - "id.${AI_APPLIANCE_MDNS_DOMAIN:=magicstick.local}"
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-federation
  namespace: identity-system
spec:
  parentRefs:
    - name: identity-pilot
      sectionName: https
  hostnames:
    - "id.${AI_APPLIANCE_MDNS_DOMAIN:=magicstick.local}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/magicstick/broker
      backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-pilot
  namespace: identity-system
  annotations:
    lab42.io/mdns.enabled: "true"
spec:
  parentRefs:
    - name: identity-pilot
      sectionName: https
  hostnames:
    - "auth-pilot.${AI_APPLIANCE_MDNS_DOMAIN:=magicstick.local}"
  rules:
    - backendRefs:
        - name: auth-pilot
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-http-to-https
  namespace: identity-system
spec:
  parentRefs:
    - name: identity-pilot
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
