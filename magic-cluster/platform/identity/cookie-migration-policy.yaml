apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: magicstick-cookie-migration
  namespace: identity-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: identity-pilot
      sectionName: https
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: magicstick-cookie-migration
  # A missing route-level gate must fall back to the same mandatory check.
  extProc:
    - backendRefs: [{group: gateway.envoyproxy.io, kind: Backend, name: magicstick-callback-gate}]
      failOpen: false
      messageTimeout: 8s
      processingMode: {request: {}}
