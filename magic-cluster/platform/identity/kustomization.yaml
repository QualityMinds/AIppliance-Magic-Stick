apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: keycloak-session-policy
    namespace: identity-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - keycloak-session-policy.sh
  - name: auth-pilot-nginx
    namespace: identity-system
    files:
      - nginx.conf=auth-pilot-nginx.conf
resources:
  - secrets.yaml
  - postgresql.yaml
  - keycloak-realm.yaml
  - keycloak.yaml
  - pilot-certificate.yaml
  - kubernetes-access-rbac.yaml
  - gateway.yaml
  - routes.yaml
  - security-policy.yaml
  - setup-rbac.yaml
  - setup-configmap.yaml
  - setup-app.yaml
