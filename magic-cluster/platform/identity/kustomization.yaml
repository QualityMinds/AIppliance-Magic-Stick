apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: keycloak-session-policy
    namespace: identity-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - keycloak-session-policy.sh
      - keycloak-callback-policy.sh
  - name: auth-pilot-nginx
    namespace: identity-system
    files:
      - nginx.conf=auth-pilot-nginx.conf
  - name: magicstick-cookie-migration
    namespace: identity-system
    options:
      disableNameSuffixHash: true
    files:
      - lua=cookie-migration.lua
resources:
  - callback-configmaps.yaml
  - callback-gate-policy.yaml
  - callback-gate-tls.yaml
  - secrets.yaml
  - postgresql.yaml
  - keycloak-realm.yaml
  - keycloak.yaml
  - pilot-certificate.yaml
  - kubernetes-access-rbac.yaml
  - gateway.yaml
  - cookie-migration-policy.yaml
  - default-deny-policy.yaml
  - routes.yaml
  - routes
  - security-policy.yaml
  - setup-rbac.yaml
  - setup-configmap.yaml
  - setup-app.yaml
