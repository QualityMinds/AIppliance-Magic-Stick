        resources.append((f"/apis/gateway.envoyproxy.io/v1alpha1/namespaces/{ns}/envoyproxies", f"/apis/gateway.envoyproxy.io/v1alpha1/namespaces/{ns}/envoyproxies/magicstick-setup", {
            "apiVersion": "gateway.envoyproxy.io/v1alpha1", "kind": "EnvoyProxy",
            "metadata": {"name": "magicstick-setup", "namespace": ns, "labels": labels},
            "spec": {"provider": {"type": "Kubernetes", "kubernetes": {
                "envoyDeployment": {"container": {"image": "docker.io/envoyproxy/envoy:distroless-v1.38.7@sha256:3d79fb37be70734406e0d3b36189f662a2fd0d202813af492880aa3646426fda"}},
                "envoyService": {
                    "type": "LoadBalancer", "externalTrafficPolicy": "Local", "loadBalancerSourceRanges": PRIVATE_CIDRS,
                },
            }}},
        }))
        resources.append((f"/apis/gateway.networking.k8s.io/v1/namespaces/{ns}/gateways", f"/apis/gateway.networking.k8s.io/v1/namespaces/{ns}/gateways/magicstick-setup", {
            "apiVersion": "gateway.networking.k8s.io/v1", "kind": "Gateway",
            "metadata": {"name": "magicstick-setup", "namespace": ns, "labels": labels},
            "spec": {"gatewayClassName": "magicstick-envoy", "infrastructure": {"parametersRef": {
                "group": "gateway.envoyproxy.io", "kind": "EnvoyProxy", "name": "magicstick-setup",
            }}, "listeners": [{"name": "setup-https", "protocol": "HTTPS", "port": 9443,
                "tls": {"mode": "Terminate", "certificateRefs": [{"kind": "Secret", "name": "magicstick-setup-tls"}]},
                "allowedRoutes": {"namespaces": {"from": "Same"}}}]},
        }))
        backend = [{"name": "magicstick-setup", "port": 8080}]
        resources.append((f"/apis/gateway.networking.k8s.io/v1/namespaces/{ns}/httproutes", f"/apis/gateway.networking.k8s.io/v1/namespaces/{ns}/httproutes/magicstick-setup-direct", {
            "apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute",
            "metadata": {"name": "magicstick-setup-direct", "namespace": ns, "labels": labels},
            "spec": {"parentRefs": [{"name": "magicstick-setup"}], "rules": [{
                "matches": [{"path": {"type": "PathPrefix", "value": "/setup"}}], "backendRefs": backend,
            }]},
        }))
        resources.append((f"/apis/gateway.networking.k8s.io/v1/namespaces/{ns}/httproutes", f"/apis/gateway.networking.k8s.io/v1/namespaces/{ns}/httproutes/magicstick-setup-local", {
            "apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute",
