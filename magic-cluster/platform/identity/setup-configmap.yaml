            "apiVersion": "cert-manager.io/v1", "kind": "Issuer",
            "metadata": {"name": "magicstick-setup-selfsigned", "namespace": ns, "labels": labels}, "spec": {"selfSigned": {}},
        }))
        resources.append((f"/apis/cert-manager.io/v1/namespaces/{ns}/certificates", f"/apis/cert-manager.io/v1/namespaces/{ns}/certificates/magicstick-setup", {
            "apiVersion": "cert-manager.io/v1", "kind": "Certificate",
            "metadata": {"name": "magicstick-setup", "namespace": ns, "labels": labels},
