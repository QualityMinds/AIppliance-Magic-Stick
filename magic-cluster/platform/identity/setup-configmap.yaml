        resources.append((f"/apis/gateway.envoyproxy.io/v1alpha1/namespaces/{ns}/securitypolicies", f"/apis/gateway.envoyproxy.io/v1alpha1/namespaces/{ns}/securitypolicies/magicstick-setup-local-only", {
