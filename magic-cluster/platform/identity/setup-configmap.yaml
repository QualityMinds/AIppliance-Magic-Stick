            ], "authorization": {"defaultAction": "Deny", "rules": [{"action": "Allow", "principal": {"clientCIDRs": PRIVATE_CIDRS}}]}},
        }))
        return resources


    DYNAMIC_PATHS = [
        f"/apis/gateway.envoyproxy.io/v1alpha1/namespaces/{NAMESPACE}/securitypolicies/magicstick-setup-local-only",
        f"/apis/gateway.networking.k8s.io/v1/namespaces/{NAMESPACE}/httproutes/magicstick-setup-local",
        f"/apis/gateway.networking.k8s.io/v1/namespaces/{NAMESPACE}/httproutes/magicstick-setup-direct",
        f"/apis/gateway.networking.k8s.io/v1/namespaces/{NAMESPACE}/gateways/magicstick-setup",
        f"/apis/gateway.envoyproxy.io/v1alpha1/namespaces/{NAMESPACE}/envoyproxies/magicstick-setup",
        f"/apis/cert-manager.io/v1/namespaces/{NAMESPACE}/certificates/magicstick-setup",
        f"/api/v1/namespaces/{NAMESPACE}/secrets/magicstick-setup-tls",
        f"/apis/cert-manager.io/v1/namespaces/{NAMESPACE}/issuers/magicstick-setup-selfsigned",
    ]


    def reconcile_once():
        setup = setup_resource()
        phase = setup_phase(setup)
        if phase in {"Completed", "CompletedLegacy"}:
            clear_setup_credentials()
        if phase not in {"Pending", "Claimed", "Applying", "Failed"}:
            if phase == "Completed" and (COMPLETION_IN_PROGRESS.is_set()
                    or not completion_grace_elapsed(setup)
                    or not dashboard_handoff_ready(current_settings()["mdnsDomain"])):
                return
            for path in DYNAMIC_PATHS:
                delete_resource(path)
            if phase == "Completed":
                migrate_completed_recovery_user(setup)
            return
        settings = current_settings()
        domain = setup_route_domain(settings["mdnsDomain"])
        for collection, item, resource in dynamic_resources(domain, setup_access_ips()):
            apply_resource(collection, item, resource)


    def sync_callback_gate_ca():
        # cert-manager's CA injector does not target ConfigMaps. Copy only the
        # projected public CA, never the serving certificate's private key.
        with open(CALLBACK_GATE_CA_FILE, encoding="ascii") as ca_file:
            certificate = ca_file.read()
        ssl.create_default_context(cadata=certificate)  # reject missing/invalid PEM
        current = get_resource(CALLBACK_GATE_CA_PATH)
        if current is None:
            raise RuntimeError("callback gate CA ConfigMap not yet available")
        if (current.get("data") or {}).get("ca.crt") != certificate:
            kube_request("PATCH", CALLBACK_GATE_CA_PATH,
                         {"metadata": {"resourceVersion": current["metadata"]["resourceVersion"]},
                          "data": {"ca.crt": certificate}}, "application/merge-patch+json")


    def reconcile_loop():
        while True:
            try:
                sync_callback_gate_ca()
            except Exception as error:
                print("callback gate CA reconciliation failed:", type(error).__name__, flush=True)
            try:
                sync_oidc_callbacks()
            except Exception as error:
                print("callback reconciliation failed:", type(error).__name__, flush=True)
            try:
                reconcile_once()
            except Exception as error:
                print("setup reconciliation failed:", type(error).__name__, flush=True)
            time.sleep(15)


    INDEX_HTML = """<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Magicstick einrichten</title><link rel=stylesheet href=/setup/style.css></head><body><main><header><span class=mark>MS</span><div><h1>Magicstick einrichten</h1><p>Lokale Ersteinrichtung</p></div></header><section id=status class=card>Systemstatus wird geprüft …</section><section id=claim class=card hidden><h2>Einrichtungscode</h2><p>Gib den Einrichtungscode mit acht Zeichen von der Textkonsole ein.</p><form id=claimForm><label>Einrichtungscode<input id=claimToken autocomplete=one-time-code minlength=8 maxlength=8 autocapitalize=none spellcheck=false required></label><button>Appliance übernehmen</button></form></section><section id=config class=card hidden><h2>Grundkonfiguration</h2><form id=setupForm><div class=grid><label>Appliance-Name<input name=applianceName required maxlength=80></label><label>Lokale Adresse<input name=mdnsDomain required></label><label>Zeitzone<input name=timezone required></label><label>Sprache<select name=language><option value=de>Deutsch</option><option value=en>English</option></select></label><label class=wide>Öffentliche Domain (optional)<input name=publicDomain placeholder=magicstick.example.com></label></div><h2>Erster Administrator</h2><div class=grid><label>Benutzername<input name=username required autocomplete=username></label><label>Anzeigename<input name=displayName required autocomplete=name></label><label class=wide>E-Mail<input name=email required type=email autocomplete=email></label><label>Passwort<input name=password required type=password minlength=12 autocomplete=new-password></label><label>Passwort bestätigen<input name=passwordConfirm required type=password minlength=12 autocomplete=new-password></label></div><aside>Beim Abschluss wird zusätzlich ein einmaliger Recovery-Zugang erzeugt. Speichere ihn außerhalb der Appliance.</aside><button>Einrichtung abschließen</button></form></section><section id=done class=card hidden><h2>Einrichtung abgeschlossen</h2><p>Speichere diese einmalig angezeigten Recovery-Zugangsdaten:</p><pre id=recovery></pre><p id=recoveryUnavailable hidden>Die Recovery-Zugangsdaten wurden nur einmal angezeigt und können hier nicht erneut abgerufen werden.</p><p>Danach kannst du dich mit deinem neuen Administratorkonto anmelden.</p><p id=handoff role=status aria-live=polite>Das Dashboard wird vorbereitet …</p><button id=login type=button disabled>Zum SSO-Login</button></section><p id=message role=alert></p></main><script src=/setup/app.js></script></body></html>"""
    STYLE_CSS = """:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f3f5f7;color:#17212b}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:0 auto;padding:40px 20px}header{display:flex;align-items:center;gap:16px;margin-bottom:24px}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#143d59;color:white;font-weight:800}h1{margin:0;font-size:1.8rem}header p{margin:4px 0;color:#596875}.card{background:white;border:1px solid #dce2e7;border-radius:16px;padding:24px;box-shadow:0 10px 32px #17324d10;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{display:grid;gap:7px;font-weight:650}input,select{width:100%;padding:11px 12px;border:1px solid #aeb9c2;border-radius:8px;font:inherit}button,.button{display:inline-block;margin-top:20px;padding:12px 18px;border:0;border-radius:9px;background:#176b87;color:white;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}button:disabled{opacity:.55}aside{margin-top:20px;padding:14px;background:#edf6f7;border-left:4px solid #2b8a9d}pre{padding:16px;background:#17212b;color:#f4fbfc;border-radius:9px;white-space:pre-wrap}#message{color:#a32626;font-weight:700}[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}main{padding-top:24px}}"""
    APP_JS = r"""
    const $ = selector => document.querySelector(selector);
    let defaults = {};
    let loginUrl = '/';
    let handoffTimer = null;
    let handoffReadySeen = false;
    let loginReady = false;
    let configLoaded = false;

    const cookie = name => document.cookie.split('; ')
      .find(value => value.startsWith(name + '='))?.split('=').slice(1).join('=') || '';

    async function api(path, options = {}) {
      options.headers = {'Content-Type': 'application/json', ...(options.headers || {})};
      if (options.method && options.method !== 'GET') {
        options.headers['X-MagicStick-CSRF'] = decodeURIComponent(cookie('MagicStickSetupCsrf'));
      }
      const response = await fetch('/setup/api/' + path, {...options, cache: 'no-store'});
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(body.message || 'Die Anfrage ist fehlgeschlagen.');
        error.status = response.status;
        throw error;
      }
      return body;
    }

    function show(id) {
      for (const section of ['claim', 'config', 'done']) {
        $('#' + section).hidden = section !== id;
      }
    }

    function randomCode(bytes = 18) {
      const data = new Uint8Array(bytes);
      crypto.getRandomValues(data);
      return Array.from(data, value => value.toString(16).padStart(2, '0'))
        .join('').match(/.{1,6}/g).join('-');
    }

    function setLoginReady(ready) {
      loginReady = ready;
      $('#login').disabled = !ready;
      $('#handoff').textContent = ready
        ? 'Das Dashboard ist bereit. Du kannst dich jetzt anmelden.'
        : 'Das Dashboard wird vorbereitet …';
      if (ready && handoffTimer) {
        clearTimeout(handoffTimer);
        handoffTimer = null;
      }
    }

    function scheduleHandoff() {
      if (!loginReady && !handoffTimer) {
        handoffTimer = setTimeout(checkHandoff, 2500);
      }
    }

    async function checkHandoff() {
      handoffTimer = null;
      try {
        const response = await fetch('/setup/api/handoff', {
          cache: 'no-store',
          redirect: 'manual',
        });
        if (response.type === 'opaqueredirect') {
          setLoginReady(true);
          return;
        }
        const contentType = response.headers.get('content-type') || '';
        if (response.ok && contentType.includes('application/json')) {
          const handoff = await response.json();
          if (handoff.dashboardURL) {
            loginUrl = handoff.dashboardURL;
            try { sessionStorage.setItem('magicstick-dashboard-url', loginUrl); } catch {}
          }
          handoffReadySeen = handoffReadySeen || handoff.dashboardReady === true;
        } else if (response.ok && contentType.includes('text/html')) {
          // The authenticated dashboard now answers this former setup path.
          setLoginReady(true);
          return;
        }
      } catch {
        // The direct :9443 setup listener closes during handoff. Probe the
        // replacement address only after the server reported it ready.
        if (handoffReadySeen) {
          try {
            await fetch(loginUrl, {mode: 'no-cors', redirect: 'manual', cache: 'no-store'});
            setLoginReady(true);
            return;
          } catch {}
        }
      }
      scheduleHandoff();
    }

    function startHandoff(url) {
      loginUrl = url || loginUrl;
      try { sessionStorage.setItem('magicstick-dashboard-url', loginUrl); } catch {}
      setLoginReady(false);
      checkHandoff();
    }

    async function load() {
      try {
        const status = await api('status');
        $('#status').textContent = status.phase === 'Absent'
          ? 'Die Appliance wurde noch nicht für den Setup-Modus initialisiert.'
          : 'Setup-Status: ' + status.phase;
        const fragment = new URLSearchParams(location.hash.slice(1));
        const claim = fragment.get('claim');
        history.replaceState(null, '', location.pathname);
        if (['Completed', 'CompletedLegacy'].includes(status.phase)) {
          show('done');
          $('#recovery').hidden = true;
          $('#recoveryUnavailable').hidden = false;
          try { loginUrl = sessionStorage.getItem('magicstick-dashboard-url') || loginUrl; } catch {}
          startHandoff(loginUrl);
          return;
        }
        if (['Claimed', 'Applying', 'Failed'].includes(status.phase)) {
          try {
            await openConfig();
            return;
          } catch (error) {
            $('#message').textContent = [401, 403].includes(error.status)
              ? 'Die Einrichtung ist noch nicht abgeschlossen. Gib den angezeigten Einrichtungscode erneut ein, um fortzufahren.'
              : error.message;
          }
        }
        show('claim');
        if (claim) {
          $('#claimToken').value = claim;
          $('#claimForm').requestSubmit();
        }
      } catch (error) {
        $('#message').textContent = error.message;
      }
    }

    async function openConfig() {
      defaults = await api('config');
      if (!configLoaded) {
        for (const [key, value] of Object.entries(defaults)) {
          if ($('#setupForm').elements[key]) {
            $('#setupForm').elements[key].value = value || '';
          }
        }
        configLoaded = true;
      }
      show('config');
      $('#message').textContent = '';
    }

    $('#claimForm').addEventListener('submit', async event => {
      event.preventDefault();
      $('#message').textContent = '';
      try {
        await api('claim', {
          method: 'POST',
          body: JSON.stringify({claimToken: $('#claimToken').value.replaceAll('-', '').trim()}),
        });
        await openConfig();
      } catch (error) {
        $('#message').textContent = error.message;
      }
    });

    $('#setupForm').addEventListener('submit', async event => {
      event.preventDefault();
      $('#message').textContent = '';
      const values = Object.fromEntries(new FormData(event.target));
      if (values.password !== values.passwordConfirm) {
        $('#message').textContent = 'Die Passwörter stimmen nicht überein.';
        return;
      }
      delete values.passwordConfirm;
      const button = event.target.querySelector('button');
      button.disabled = true;
      try {
        const setupId = (await api('status')).installationId || randomCode(6).replaceAll('-', '');
        values.recoveryUsername = 'recovery-' + setupId.slice(0, 8);
        values.recoveryCode = randomCode();
        const result = await api('complete', {method: 'POST', body: JSON.stringify(values)});
        $('#recovery').textContent = 'Benutzer: ' + result.recoveryUsername +
          '\nCode:     ' + result.recoveryCode;
        $('#recovery').hidden = false;
        $('#recoveryUnavailable').hidden = true;
        show('done');
        $('#status').textContent = 'Setup-Status: Completed';
        startHandoff(result.dashboardURL || 'https://' + values.mdnsDomain + '/');
      } catch (error) {
        if ([401, 403].includes(error.status)) {
          show('claim');
          $('#message').textContent = 'Gib den Einrichtungscode erneut ein. Deine Eingaben bleiben in diesem Browser erhalten.';
        } else {
          $('#message').textContent = error.message;
        }
        button.disabled = false;
      }
    });

    $('#login').addEventListener('click', () => {
      if (loginReady) location.assign(loginUrl);
    });

    load();
    """


    class Handler(BaseHTTPRequestHandler):
        server_version = "MagicstickSetup/1"

        def log_message(self, fmt, *args):
            print("setup request", self.command, self.path.split("?", 1)[0], flush=True)

        def send_security_headers(self, content_type, length=0, cookies=None):
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(length))
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Security-Policy", "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'")
            self.send_header("Referrer-Policy", "no-referrer")
            self.send_header("X-Content-Type-Options", "nosniff")
            for cookie in cookies or []:
                self.send_header("Set-Cookie", cookie)

        def send_bytes(self, status, payload, content_type, cookies=None):
            self.send_response(status)
            self.send_security_headers(content_type, len(payload), cookies)
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(payload)

        def send_json(self, status, payload, cookies=None):
            self.send_bytes(status, json.dumps(payload, separators=(",", ":")).encode("utf-8"), "application/json; charset=utf-8", cookies)

        def read_json(self):
            try:
                length = int(self.headers.get("Content-Length", "0"))
            except ValueError as error:
                raise ApiError(400, "Die Anfrage ist ungültig.") from error
            if length <= 0 or length > 32768:
                raise ApiError(400, "Die Anfrage ist ungültig.")
            try:
                return json.loads(self.rfile.read(length).decode("utf-8"))
            except (UnicodeDecodeError, json.JSONDecodeError) as error:
                raise ApiError(400, "Die Anfrage ist ungültig.") from error

        def client_key(self):
            forwarded = self.headers.get("X-Forwarded-For", "").split(",", 1)[0].strip()
            return forwarded or self.client_address[0]

        def do_GET(self):
            try:
                path = self.path.split("?", 1)[0]
                if path == "/internal/callback-readiness":
                    host = urllib.parse.parse_qs(urllib.parse.urlsplit(self.path).query).get("host", [""])
                    gateway = urllib.parse.parse_qs(urllib.parse.urlsplit(self.path).query).get('gateway') == ['1']
                    check = gateway_callback_readiness if gateway else callback_readiness_singleflight
                    available = len(host) == 1 and bool(re.fullmatch(r'[a-z0-9.-]{1,253}', host[0])) and check(host[0])
                    self.send_bytes(204 if available else 503, b"", "text/plain")
                elif path in {"/", "/setup", "/setup/"}:
                    self.send_bytes(200, INDEX_HTML.encode("utf-8"), "text/html; charset=utf-8")
                elif path == "/setup/style.css":
                    self.send_bytes(200, STYLE_CSS.encode("utf-8"), "text/css; charset=utf-8")
                elif path == "/setup/app.js":
                    self.send_bytes(200, APP_JS.encode("utf-8"), "application/javascript; charset=utf-8")
                elif path == "/setup/api/status":
                    setup = setup_resource()
                    spec = (setup or {}).get("spec") or {}
                    self.send_json(200, {"phase": setup_phase(setup), "installationId": spec.get("installationId", ""), "ready": setup is not None})
                elif path == "/setup/api/handoff":
                    if setup_phase() != "Completed":
                        raise ApiError(409, "Die Einrichtung ist noch nicht abgeschlossen.", "setup_incomplete")
                    domain = current_settings()["mdnsDomain"]
                    self.send_json(200, {"dashboardURL": "https://" + domain + "/",
                                         "dashboardReady": dashboard_handoff_ready(domain)})
                elif path == "/setup/api/config":
                    _, stored = validate_session(self.headers.get("Cookie"))
                    self.send_json(200, resumable_config(stored))
                else:
                    self.send_json(404, {"message": "Nicht gefunden."})
            except ApiError as error:
                self.send_json(error.status, {"message": str(error), "code": error.code})
            except Exception as error:
                print("setup GET failed:", type(error).__name__, flush=True)
                self.send_json(503, {"message": "Der Setup-Dienst ist noch nicht bereit.", "code": "unavailable"})

        def do_POST(self):
            try:
                path = self.path.split("?", 1)[0]
                if path == "/setup/api/claim":
                    self.claim()
                elif path == "/setup/api/complete":
                    self.complete()
                else:
                    self.send_json(404, {"message": "Nicht gefunden."})
            except ApiError as error:
                self.send_json(error.status, {"message": str(error), "code": error.code})
            except (BrokenPipeError, ConnectionResetError):
                # A disconnected browser is not a failed setup transaction.
                # In particular, do not undo a confirmed Completed status.
                print("setup response disconnected", flush=True)
            except urllib.error.HTTPError as error:
                print("setup dependency HTTP error:", error.code, flush=True)
                try:
                    record_setup_failure("dependency_http_error")
                except Exception:
                    pass
                self.send_json(503, {"message": "Eine interne Abhängigkeit ist noch nicht bereit.", "code": "dependency_unavailable"})
            except Exception as error:
                print("setup POST failed:", type(error).__name__, flush=True)
                try:
                    record_setup_failure("internal_error")
                except Exception:
                    pass
                self.send_json(500, {"message": "Die Einrichtung konnte nicht abgeschlossen werden.", "code": "internal_error"})

        def claim(self):
            with SETUP_LOCK:
                self.claim_locked()

        def claim_locked(self):
            resource = setup_resource()
            phase = setup_phase(resource)
            if phase not in INCOMPLETE_PHASES:
                raise ApiError(409, "Die Einrichtung ist abgeschlossen oder nicht verfügbar.", "setup_closed")
            key = self.client_key()
            failures = [stamp for stamp in FAILED_CLAIMS.get(key, []) if stamp > time.time() - 300]
            FAILED_CLAIMS[key] = failures
            supplied = str(self.read_json().get("claimToken") or "").replace("-", "").strip().lower()
            expected = decode_secret(get_resource(CLAIM_SECRET_PATH), "claim-sha256")
            if not constant_match(secret_hash(supplied), expected):
                if len(failures) >= 5:
                    raise ApiError(429, "Zu viele Fehlversuche. Bitte warte fünf Minuten.", "rate_limited")
                failures.append(time.time())
                raise ApiError(403, "Der Einrichtungscode ist falsch.", "invalid_claim")
            session_token, csrf_token = new_session(ensure_session_secret())
            FAILED_CLAIMS.pop(key, None)
            if phase == "Pending":
                patch_status("Claimed", claimedAt=(resource.get("status") or {}).get("claimedAt") or now(), lastErrorCode="")
            cookies = [
                f"{SESSION_COOKIE}={session_token}; Path=/setup; Max-Age={SESSION_TTL_SECONDS}; Secure; HttpOnly; SameSite=Strict",
                f"{CSRF_COOKIE}={csrf_token}; Path=/; Max-Age={SESSION_TTL_SECONDS}; Secure; SameSite=Strict",
            ]
            self.send_json(200, {"claimed": True}, cookies)

        def complete(self):
            with SETUP_LOCK:
                self.complete_locked()

        def complete_locked(self):
            phase = setup_phase()
            if phase in {"Completed", "CompletedLegacy"}:
                raise ApiError(409, "Die Einrichtung ist bereits abgeschlossen.", "already_completed")
            if phase not in {"Claimed", "Applying", "Failed"}:
                raise ApiError(409, "Die Appliance wurde noch nicht übernommen.", "claim_required")
            cookies, stored = validate_session(self.headers.get("Cookie"))
            validate_csrf(cookies, stored, self.headers.get("X-MagicStick-CSRF", ""))
            values = validate_complete(self.read_json())
            ensure_session_secret(draft=values)
            patch_status("Applying", claimedAt=((setup_resource().get("status") or {}).get("claimedAt", now())), lastErrorCode="")
            update_settings(values)
            token = keycloak_token()
            ensure_keycloak_user(token, values["username"], values["password"], values["email"], values["displayName"], "primary")
            ensure_keycloak_user(token, values["recoveryUsername"], values["recoveryCode"],
                                 values["recoveryUsername"] + "@" + values["mdnsDomain"], "Recovery Administrator", "recovery")
            COMPLETION_IN_PROGRESS.set()
            try:
                patch_status("Completed", completedAt=now(), lastErrorCode="")
                clear_setup_credentials()
                expired = [
                    f"{SESSION_COOKIE}=; Path=/setup; Max-Age=0; Secure; HttpOnly; SameSite=Strict",
                    f"{CSRF_COOKIE}=; Path=/; Max-Age=0; Secure; SameSite=Strict",
                ]
                self.send_json(200, {"completed": True, "recoveryUsername": values["recoveryUsername"],
                                     "recoveryCode": values["recoveryCode"],
                                     "dashboardURL": "https://" + values["mdnsDomain"] + "/"}, expired)
            finally:
                COMPLETION_IN_PROGRESS.clear()


    class SetupHttpServer(ThreadingHTTPServer):
        request_queue_size = 128


    if __name__ == "__main__":
        threading.Thread(target=reconcile_loop, daemon=True).start()
        SetupHttpServer(("0.0.0.0", PORT), Handler).serve_forever()
