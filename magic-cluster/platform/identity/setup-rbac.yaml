apiVersion: v1
kind: ServiceAccount
metadata:
  name: magicstick-setup
  namespace: identity-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: magicstick-setup
rules:
  - apiGroups: ["appliance.magicstick.dev"]
    resources: ["appliancesetups"]
    verbs: ["get", "list"]
  - apiGroups: ["appliance.magicstick.dev"]
    resources: ["appliancesetups/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["magicstick-setup-claim", "magicstick-setup-session", "magicstick-setup-tls"]
    verbs: ["get", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ai-appliance-settings", "magicstick-oidc-callbacks", "magicstick-oidc-callbacks-status", "magicstick-callback-gate-ca"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["appliance.magicstick.dev"]
    resources: ["appinstances"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["keycloak"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ai-appliance-dashboard"]
    verbs: ["get"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyproxies", "securitypolicies"]
    verbs: ["get", "create", "patch", "update", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "certificates"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: magicstick-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: magicstick-setup
subjects:
  - kind: ServiceAccount
    name: magicstick-setup
    namespace: identity-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: magicstick-setup-gateway-readiness
  namespace: identity-system
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [list]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: magicstick-setup-gateway-readiness
  namespace: identity-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: magicstick-setup-gateway-readiness}
subjects:
  - {kind: ServiceAccount, name: magicstick-setup, namespace: identity-system}
