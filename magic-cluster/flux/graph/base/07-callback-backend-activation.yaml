apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: callback-backend-activation
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: first-run-bootstrap
  interval: 10m0s
  path: ./magic-cluster/platform/gateway/callback-backend-activation
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  wait: true
  timeout: 5m0s
