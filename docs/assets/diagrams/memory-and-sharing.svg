<title id="memory-and-sharing-title">Memory is not model slots</title>
<desc id="memory-and-sharing-desc">A discrete GPU has dedicated VRAM separate from system RAM. A unified-memory GPU such as Strix Halo uses physical RAM: a firmware GPU reservation is unavailable to Linux, and CPU plus dynamic GPU allocations compete for Linux-visible RAM. The dynamic GPU ceiling is a limit inside that RAM, not protected extra memory. Firmware and dynamic pools cannot be blindly summed for model fit. Free memory comes from live telemetry; unreserved budget subtracts planned reservations. GPU admission also needs a free model slot. The illustrative four slots show two used and two free, not four GPUs or four isolated VRAM partitions. Shared AMD uses DRA and shared NVIDIA uses time-slicing where supported.</desc>
