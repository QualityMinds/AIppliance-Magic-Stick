<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">One platform, two paths</title>
<desc id="architecture-desc">Configuration: the dashboard saves ModelActivation settings; the Magic Stick Operator reconciles local runtimes through KubeAI for Ollama and ordinary vLLM, or direct workloads for FreeToken and Realtime vLLM-Omni. Inference: applications and API clients call LiteLLM, which routes to the local runtime. The model catalog publishes ready local routes. Each runtime uses its supported CPU or GPU target. Authentication, module provisioning and external-provider routes are omitted.</desc>
