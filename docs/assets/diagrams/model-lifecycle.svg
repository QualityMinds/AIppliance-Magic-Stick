<title id="model-lifecycle-title">From Start to Ready</title>
<desc id="model-lifecycle-desc">Create or Start saves and enables a local model. During startup the controller prepares dependencies and resources; the runtime downloads weights if needed, loads the model and checks health. A ready model can be published to LiteLLM. A failure can report Degraded: inspect Logs and resolve its cause. Stop removes the runtime and withdraws the route. During Removing, allocations are still terminating; Disabled retains the settings. Start reuses those settings. Remove deletes the definition; cache cleanup is a separate action. This is a simplified workflow, not an exhaustive state machine; exact startup labels vary by engine.</desc>
