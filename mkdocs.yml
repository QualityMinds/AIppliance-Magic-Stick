# Header title below the website header; browser titles keep the brand (docs/overrides/main.html).
site_name: Documentation
site_description: Install, use and administer your Magic Stick AI appliance.
site_url: https://magic-stick.ai/handbook/
repo_url: https://github.com/QualityMinds/AIppliance-Magic-Stick
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: dist/docs-site/handbook
strict: true
theme:
  name: material
  # Website header and footer around every handbook page (main.html,
  # partials/footer.html) and an accessible name for the search dialog.
  custom_dir: docs/overrides
  language: en
  font: false
  # One dark scheme, like the website; no light-mode toggle.
  palette:
    scheme: slate
    primary: custom
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search
hooks:
  - tools/docs_hook.py
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
extra_css:
  - stylesheets/handbook.css
extra:
  # Cookie-free visitor statistics. tools/docs.py adds the Umami tag to every
  # built page (landing pages and handbook) only when both values are set; the
  # committed HTML sources and local previews stay free of remote scripts.
  # Keep docs/privacy.html and docs/datenschutz.html in step with this block.
  umami:
    script: 'https://analytics.magic-stick.ai/script.js'
    website_id: '97e24eee-709d-43f4-a86c-718abd4c0043'
    domains: []     # optional: only count visits on these public hostnames
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn
exclude_docs: |
  /AGENTS.md
  /overrides/
  /index.html
  /de.html
  /editions.html
  /editionen.html
  /imprint.html
  /privacy.html
  /impressum.html
  /datenschutz.html
  /site.css
  /site.js
  /llms.txt
  /BingSiteAuth.xml
  /sales-deck/
  /navigation.json
  /migration.json
  /authentication.md
  /licensing.md
  /operator-orchestration.md
  /architecture.md
  /paperclip-agents.md
  /operations.md
  /dashboard.md
  /model-catalog.md
  /ubuntu-updates.md
  /website.md
  /modules.md
  /appliance-crd.md
  /getting-started.md
  /public-release-checklist.md
  /license-audit.md
  /realtime.md
  /network-management.md
  /configuration.md
  /freetoken-integration-review.md
  /model-cache.md
  /gpu-sharing.md
