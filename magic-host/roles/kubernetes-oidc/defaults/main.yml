---
kubernetes_oidc_kubeconfig: /etc/rancher/k3s/k3s.yaml
kubernetes_oidc_k3s_binary: /usr/local/bin/k3s
kubernetes_oidc_ca_secret_namespace: identity-system
kubernetes_oidc_ca_secret_name: identity-pilot-ca
kubernetes_oidc_info_namespace: identity-system
kubernetes_oidc_info_name: magicstick-kubernetes-access-info
kubernetes_oidc_info_manifest: /tmp/magicstick-kubernetes-access-info.yaml
kubernetes_oidc_ca_file: /etc/rancher/k3s/magicstick-oidc-ca.crt
kubernetes_oidc_client_id: magicstick-kubernetes
kubernetes_oidc_mdns_domain: "{{ ai_appliance_mdns_domain | default('magicstick.local', true) }}"
kubernetes_oidc_issuer_url: "https://id.{{ kubernetes_oidc_mdns_domain }}/realms/magicstick"
kubernetes_oidc_api_server: "https://{{ kubernetes_oidc_mdns_domain }}:6443"
kubernetes_oidc_gateway_address: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
kubernetes_oidc_ready_retries: 180
kubernetes_oidc_ready_delay_seconds: 5
