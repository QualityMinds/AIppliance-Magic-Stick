---
- name: Install the existing Ubuntu networking tools for bounded network management
  ansible.builtin.apt:
    name: [netplan.io, python3-yaml, iw, wpasupplicant]
    state: present

- name: Create root-owned host management directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /usr/local/lib/magicstick/host-management, mode: "0755"}
    - {path: /usr/local/lib/magicstick/host-management/roles, mode: "0755"}
    - {path: /var/lib/magicstick/host-management, mode: "0700"}

- name: Install bounded host worker and reviewed local package profiles
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/lib/magicstick/host-management/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - host_worker.py
    - host_plan.py
    - network_contract.py
    - network_config.py
    - network_apply.py
    - updates_contract.py
    - host_updates.py
    - gpu_memory.py
    - profiles.json
    - ansible.cfg

- name: Install the same preparation playbook and role used by the host workflow
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: root
    group: root
    mode: preserve
  loop:
    - source: "{{ role_path }}/../../playbooks/gpu-prepare.yml"
      destination: /usr/local/lib/magicstick/host-management/prepare.yml
    - source: "{{ role_path }}/../gpu-compatibility"
      destination: /usr/local/lib/magicstick/host-management/roles/

- name: Install node-local host management service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - magicstick-host-management.service
    - magicstick-host-management.timer
    - magicstick-network-apply.service
    - magicstick-network-recovery.service

- name: Enable local recovery of unconfirmed network changes before networking starts
  ansible.builtin.systemd_service:
    name: magicstick-network-recovery.service
    daemon_reload: true
    enabled: true

- name: Enable post-install host inspection and approved-operation processing
  ansible.builtin.systemd_service:
    name: magicstick-host-management.timer
    daemon_reload: true
    enabled: true
    state: started
