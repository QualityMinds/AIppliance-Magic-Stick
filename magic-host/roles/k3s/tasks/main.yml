---
- name: Create the persistent containerd v3 drop-in directory before K3s starts
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Preconfigure the optional NVIDIA runtime without changing the default runtime
  ansible.builtin.copy:
    src: 90-magicstick-nvidia.toml
    dest: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/90-magicstick-nvidia.toml
    owner: root
    group: root
    mode: "0644"

- name: Check for an existing K3s configuration
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: k3s_existing_config

# After bootstrap, kubernetes-oidc renders the complete configuration once the
# effective domain, host IP and identity trust are known. Rendering bootstrap
# defaults here would remove its IP SAN and restart K3s twice on every run.
- name: Configure K3s for first bootstrap only
  ansible.builtin.import_tasks: configure.yml
  when: not k3s_existing_config.stat.exists

- name: Install K3s (skip if already installed)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Read the local node before enforcing NVIDIA host-driver ownership
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ ansible_facts['hostname'] | lower }}"
      - -o
      - json
  register: nvidia_display_k3s_node
  changed_when: false
  retries: 12
  delay: 5
  until: nvidia_display_k3s_node.rc == 0
  when: nvidia_display_detected | default(false) | bool

- name: Keep an existing NVIDIA display node on the host-owned driver
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - label
      - node
      - "{{ ansible_facts['hostname'] | lower }}"
      - nvidia.com/gpu.deploy.driver=false
      - --overwrite
  when:
    - nvidia_display_detected | default(false) | bool
    - (nvidia_display_k3s_node.stdout | from_json).metadata.labels.get('nvidia.com/gpu.deploy.driver', '') != 'false'

- name: Own the fresh NVIDIA startup gate before Flux installs GPU operands
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/lib/magicstick/nvidia-display/driver_ready.py
      - --arm
      - --node
      - "{{ ansible_facts['hostname'] | lower }}"
  register: nvidia_display_startup_gate
  changed_when: nvidia_display_startup_gate.rc == 0 and (nvidia_display_startup_gate.stdout | from_json).changed | bool
  retries: 6
  delay: 2
  until: nvidia_display_startup_gate.rc == 0
  when:
    - nvidia_display_detected | default(false) | bool
    - nvidia_display_new_install.stat.exists
    - not nvidia_display_driver_ready | bool
