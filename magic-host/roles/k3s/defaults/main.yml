---
# Default k3s node name. Uses the system hostname so each machine registers
# itself under its own name in the single-node cluster.
# Override by setting node_name in host_vars or group_vars.
node_name: "{{ ansible_facts['hostname'] }}"

# The API server starts without OIDC during the first bootstrap. Once Flux has
# installed Keycloak and cert-manager, the kubernetes-oidc role places the
# public identity CA at this path and re-renders the same K3s configuration.
k3s_oidc_ca_file: /etc/rancher/k3s/magicstick-oidc-ca.crt
k3s_oidc_client_id: magicstick-kubernetes
k3s_oidc_issuer_url: "https://id.{{ ai_appliance_mdns_domain | default('magicstick.local', true) }}/realms/magicstick"
k3s_oidc_username_claim: preferred_username
k3s_oidc_username_prefix: "oidc:"
k3s_oidc_groups_claim: groups
k3s_oidc_groups_prefix: "oidc:"
k3s_tls_sans:
  - "{{ ai_appliance_mdns_domain | default('magicstick.local', true) }}"
