---
- name: Create protected dashboard console state directory
  ansible.builtin.file:
    path: "{{ dashboard_console_state_directory }}"
    state: directory
    owner: "{{ dashboard_console_runtime_uid }}"
    group: "{{ dashboard_console_runtime_gid }}"
    mode: "0700"

- name: Install dashboard console mouse helper
  ansible.builtin.copy:
    src: console-mouse.py
    dest: "{{ dashboard_console_mouse_helper }}"
    owner: root
    group: root
    mode: "0755"

- name: Create dashboard console USB transfer folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # The console Pod may only write its request; status and mount points belong to root.
    - {path: "{{ dashboard_console_transfer_directory }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ dashboard_console_transfer_directory }}/requests", owner: "{{ dashboard_console_runtime_uid }}", group: "{{ dashboard_console_runtime_gid }}", mode: "0700"}
    - {path: "{{ dashboard_console_transfer_directory }}/status", owner: root, group: root, mode: "0755"}
    - {path: "{{ dashboard_console_transfer_directory }}/usb", owner: root, group: root, mode: "0755"}

- name: Install dashboard console USB helper
  ansible.builtin.copy:
    src: console-usb.py
    dest: "{{ dashboard_console_usb_helper }}"
    owner: root
    group: root
    mode: "0755"

- name: Install dashboard console USB request service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ dashboard_console_usb_service }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Mount or unmount USB sticks requested by the Magic Stick console
      # Requests come from a person at the monitor; never stop answering them.
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      ExecStart={{ dashboard_console_usb_helper }} process --root {{ dashboard_console_transfer_directory }} --uid {{ dashboard_console_runtime_uid }} --gid {{ dashboard_console_runtime_gid }} --filesystems {{ dashboard_console_usb_filesystems | join(',') }}
  notify: Reload systemd for dashboard console

- name: Install dashboard console USB request watcher
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ dashboard_console_usb_path_unit }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Watch for USB stick requests from the Magic Stick console

      [Path]
      PathChanged={{ dashboard_console_transfer_directory }}/requests/request
      Unit={{ dashboard_console_usb_service }}

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd for dashboard console

- name: Switch dashboard console USB requests on or off
  ansible.builtin.systemd:
    name: "{{ dashboard_console_usb_path_unit }}"
    enabled: "{{ dashboard_console_usb_enabled | bool }}"
    state: "{{ 'started' if dashboard_console_usb_enabled | bool else 'stopped' }}"
    daemon_reload: true

- name: Install dashboard console launcher
  ansible.builtin.template:
    src: launcher.j2
    dest: "{{ dashboard_console_launcher }}"
    owner: root
    group: root
    mode: "0755"

- name: Render dashboard console runtime
  ansible.builtin.template:
    src: runtime.yaml.j2
    dest: "{{ dashboard_console_runtime_manifest }}"
    owner: root
    group: root
    mode: "0600"

- name: Reconcile dashboard console runtime
  ansible.builtin.command:
    argv:
      - "{{ dashboard_console_k3s_binary }}"
      - kubectl
      - --kubeconfig
      - "{{ dashboard_console_kubeconfig }}"
      - apply
      - -f
      - "{{ dashboard_console_runtime_manifest }}"
  register: dashboard_console_runtime_apply
  changed_when: >-
    ('created' in dashboard_console_runtime_apply.stdout)
    or ('configured' in dashboard_console_runtime_apply.stdout)

- name: Install physical dashboard console service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ dashboard_console_service }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Display the Magic Stick TUI on the physical monitor
      After=cloud-final.service k3s.service network-online.target magicstick-setup-console.service
      Wants=network-online.target
      ConditionPathExists={{ dashboard_console_tty_path }}
      ConditionPathExists=!{{ dashboard_console_setup_claim_file }}

      [Service]
      Type=simple
      Environment=TERM=linux
      ExecStartPre=-/usr/bin/chvt {{ dashboard_console_virtual_terminal }}
      ExecStart={{ dashboard_console_launcher }}
      ExecStopPost=-/usr/bin/chvt 1
      Restart=always
      RestartSec={{ dashboard_console_retry_seconds }}
      StandardInput=tty-force
      StandardOutput=tty
      StandardError=tty
      TTYPath={{ dashboard_console_tty_path }}
      TTYReset=yes
      TTYVHangup=yes
      TTYVTDisallocate=yes

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd for dashboard console

- name: Enable physical dashboard console service
  ansible.builtin.systemd:
    name: "{{ dashboard_console_service }}"
    enabled: true
    daemon_reload: true

- name: Read first-run completion phase for dashboard console
  ansible.builtin.command:
    argv:
      - "{{ dashboard_console_k3s_binary }}"
      - kubectl
      - --kubeconfig
      - "{{ dashboard_console_kubeconfig }}"
      - --namespace
      - "{{ dashboard_console_setup_namespace }}"
      - get
      - appliancesetup
      - "{{ dashboard_console_setup_resource }}"
      - -o
      - "jsonpath={.status.phase}"
  register: dashboard_console_setup_phase
  changed_when: false
  failed_when: false

- name: Show dashboard TUI after completed first-run setup
  ansible.builtin.systemd:
    name: "{{ dashboard_console_service }}"
    state: started
    no_block: true
  when:
    - dashboard_console_setup_phase.rc == 0
    - (dashboard_console_setup_phase.stdout | trim) in ['Completed', 'CompletedLegacy']
