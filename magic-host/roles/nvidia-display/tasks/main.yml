---
- name: Detect physical NVIDIA PCI display controllers
  ansible.builtin.script:
    cmd: detect.py
    executable: /usr/bin/python3
  register: nvidia_display_inventory
  changed_when: false
  check_mode: false

- name: Record whether this host needs NVIDIA display ownership
  ansible.builtin.set_fact:
    nvidia_display_detected: "{{ (nvidia_display_inventory.stdout | from_json).nvidiaDisplay | bool }}"

- name: Prepare a host-owned NVIDIA console only on matching hardware
  when: nvidia_display_detected | bool
  block:
    - name: Check whether this is an installer-created first boot
      ansible.builtin.stat:
        path: "{{ nvidia_display_new_install_marker }}"
      register: nvidia_display_new_install

    - name: Require a supported Ubuntu host for automatic NVIDIA driver selection
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] in ['24.04', '26.04']
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: >-
          Automatic NVIDIA host-driver selection requires Ubuntu 24.04/26.04
          x86_64. Keep the GPU Operator from taking over an active console.

    - name: Install Ubuntu hardware-based driver selection
      ansible.builtin.apt:
        name: ubuntu-drivers-common
        state: present
        install_recommends: false
        update_cache: false
        allow_downgrade: false
        fail_on_autoremove: true
        allow_unauthenticated: false
        force_apt_get: true

    - name: Select Ubuntu's recommended NVIDIA packages or retain the installed driver
      ansible.builtin.script:
        cmd: select-driver.py
        executable: /usr/bin/python3
      register: nvidia_display_driver_plan
      changed_when: false
      when: not ansible_check_mode

    - name: Install the recommended NVIDIA host-driver package set
      ansible.builtin.apt:
        name: "{{ (nvidia_display_driver_plan.stdout | from_json).packages }}"
        state: present
        install_recommends: false
        update_cache: false
        allow_downgrade: false
        fail_on_autoremove: true
        allow_unauthenticated: false
        force_apt_get: true
      register: nvidia_display_packages
      when:
        - not ansible_check_mode
        - (nvidia_display_driver_plan.stdout | from_json).packages | length > 0

    - name: Create NVIDIA persistence service override directory
      ansible.builtin.file:
        path: /etc/systemd/system/nvidia-persistenced.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the host NVIDIA persistence socket available for CDI containers
      ansible.builtin.copy:
        dest: /etc/systemd/system/nvidia-persistenced.service.d/90-magicstick.conf
        content: |
          # The GPU Operator's CDI spec mounts this socket into NVIDIA containers.
          [Unit]
          StopWhenUnneeded=false

          [Service]
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_persistenced_override

    - name: Enable NVIDIA persistence daemon across host reboots
      ansible.builtin.systemd_service:
        name: nvidia-persistenced.service
        daemon_reload: "{{ nvidia_display_persistenced_override.changed }}"
        enabled: true

    - name: Check whether the NVIDIA driver is already usable before starting persistence
      ansible.builtin.command:
        argv:
          - /usr/bin/nvidia-smi
          - -L
      register: nvidia_display_gpu_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Start NVIDIA persistence daemon when the driver is usable
      ansible.builtin.systemd_service:
        name: nvidia-persistenced.service
        state: started
      when: nvidia_display_gpu_probe.rc == 0

    - name: Configure NVIDIA DRM to retain the Linux framebuffer console
      ansible.builtin.copy:
        dest: /etc/modprobe.d/90-magicstick-nvidia-display.conf
        content: |
          # Managed by Magic Stick on hosts with an NVIDIA display controller.
          options nvidia-drm modeset=1 fbdev=1
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_modprobe

    - name: Load NVIDIA DRM early on subsequent boots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/90-magicstick-nvidia-display.conf
        content: |
          # Managed by Magic Stick on hosts with an NVIDIA display controller.
          nvidia-drm
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_modules_load

    - name: Create K3s configuration drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the GPU Operator from replacing the host display driver
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/90-magicstick-nvidia-display.yaml
        content: |
          # The host owns NVIDIA DRM so the local setup/TUI console remains visible.
          node-label:
            - nvidia.com/gpu.deploy.driver=false
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_k3s_policy

    - name: Mark a changed first installation for the host-managed reboot
      ansible.builtin.file:
        path: "{{ nvidia_display_reboot_marker }}"
        state: touch
        owner: root
        group: root
        mode: "0600"
      when:
        - nvidia_display_new_install.stat.exists
        - >-
          nvidia_display_packages.changed or nvidia_display_modprobe.changed
          or nvidia_display_modules_load.changed or nvidia_display_k3s_policy.changed
