---
- name: Detect physical NVIDIA PCI display controllers
  ansible.builtin.script:
    cmd: detect.py
    executable: /usr/bin/python3
  register: nvidia_display_inventory
  changed_when: false
  check_mode: false

- name: Record whether this host needs NVIDIA display ownership
  ansible.builtin.set_fact:
    nvidia_display_detected: "{{ (nvidia_display_inventory.stdout | from_json).nvidiaDisplay | bool }}"

- name: Prepare a host-owned NVIDIA console only on matching hardware
  when: nvidia_display_detected | bool
  block:
    - name: Check whether this is an installer-created first boot
      ansible.builtin.stat:
        path: "{{ nvidia_display_new_install_marker }}"
      register: nvidia_display_new_install

    - name: Require a supported Ubuntu host for automatic NVIDIA driver selection
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] in ['24.04', '26.04']
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: >-
          Automatic NVIDIA host-driver selection requires Ubuntu 24.04/26.04
          x86_64. Keep the GPU Operator from taking over an active console.

    - name: Install Ubuntu hardware-based driver selection
      ansible.builtin.apt:
        name: ubuntu-drivers-common
        state: present
        install_recommends: false
        update_cache: false
        allow_downgrade: false
        fail_on_autoremove: true
        allow_unauthenticated: false
        force_apt_get: true

    - name: Select Ubuntu's recommended NVIDIA packages or retain the installed driver
      ansible.builtin.script:
        cmd: select-driver.py
        executable: /usr/bin/python3
      register: nvidia_display_driver_plan
      changed_when: false
      when: not ansible_check_mode

    - name: Create the root-owned NVIDIA handoff helper directory
      ansible.builtin.file:
        path: /usr/local/lib/magicstick/nvidia-display
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the sysfs-only NVIDIA readiness and first-boot handoff helper
      ansible.builtin.copy:
        src: driver_ready.py
        dest: /usr/local/lib/magicstick/nvidia-display/driver_ready.py
        owner: root
        group: root
        mode: "0755"

    - name: Create NVIDIA persistence service override directory
      ansible.builtin.file:
        path: /etc/systemd/system/nvidia-persistenced.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the host NVIDIA persistence socket available for CDI containers
      ansible.builtin.copy:
        dest: /etc/systemd/system/nvidia-persistenced.service.d/90-magicstick.conf
        content: |
          # The GPU Operator's CDI spec mounts this socket into NVIDIA containers.
          [Unit]
          StopWhenUnneeded=false
          After=systemd-modules-load.service

          [Service]
          ExecCondition=/usr/bin/python3 /usr/local/lib/magicstick/nvidia-display/driver_ready.py --ready
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_persistenced_override

    - name: Load the persistence guard before NVIDIA package post-install services run
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: nvidia_display_persistenced_override.changed

    - name: Install the recommended NVIDIA host-driver package set
      ansible.builtin.apt:
        name: "{{ (nvidia_display_driver_plan.stdout | from_json).packages }}"
        state: present
        install_recommends: false
        update_cache: false
        allow_downgrade: false
        fail_on_autoremove: true
        allow_unauthenticated: false
        force_apt_get: true
      register: nvidia_display_packages
      when:
        - not ansible_check_mode
        - (nvidia_display_driver_plan.stdout | from_json).packages | length > 0

    - name: Denylist Nouveau for the next boot without unloading the active console
      ansible.builtin.copy:
        dest: /etc/modprobe.d/90-magicstick-nouveau.conf
        content: |
          # The installed host NVIDIA driver owns subsequent boots, not the live installer.
          blacklist nouveau
          options nouveau modeset=0
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_nouveau_policy

    - name: Enable NVIDIA persistence daemon across host reboots
      ansible.builtin.systemd_service:
        name: nvidia-persistenced.service
        daemon_reload: "{{ nvidia_display_persistenced_override.changed }}"
        enabled: true

    - name: Read NVIDIA PCI driver bindings without loading any driver
      ansible.builtin.script:
        cmd: "driver_ready.py --status{{ ' --fresh-install' if nvidia_display_new_install.stat.exists else '' }}"
        executable: /usr/bin/python3
      register: nvidia_display_driver_bindings
      changed_when: false
      check_mode: false

    - name: Record whether every NVIDIA display GPU is host-driver bound
      ansible.builtin.set_fact:
        nvidia_display_driver_ready: "{{ (nvidia_display_driver_bindings.stdout | from_json).ready | bool }}"

    - name: Check whether the NVIDIA driver is already usable before starting persistence
      ansible.builtin.command:
        argv:
          - /usr/bin/nvidia-smi
          - -L
      register: nvidia_display_gpu_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when: nvidia_display_driver_ready | bool

    - name: Start NVIDIA persistence daemon when the driver is usable
      ansible.builtin.systemd_service:
        name: nvidia-persistenced.service
        state: started
      when:
        - nvidia_display_driver_ready | bool
        - nvidia_display_gpu_probe.rc | default(1) == 0

    - name: Report the expected first-boot NVIDIA driver transition
      ansible.builtin.debug:
        msg: >-
          Waiting for the host NVIDIA driver handoff. Nouveau is not unloaded
          from the active console. NVIDIA services and first-install Operator
          operands remain deferred until the planned restart activates the driver.
      when: not nvidia_display_driver_ready | bool

    - name: Install the bounded NVIDIA first-boot release service
      ansible.builtin.copy:
        dest: /etc/systemd/system/magicstick-nvidia-handoff.service
        content: |
          [Unit]
          Description=Release the first-install NVIDIA startup gate after driver handoff
          After=k3s.service systemd-modules-load.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 /usr/local/lib/magicstick/nvidia-display/driver_ready.py --release --node {{ ansible_facts['hostname'] | lower }}
          TimeoutStartSec=45s
        owner: root
        group: root
        mode: "0644"

    - name: Install the NVIDIA first-boot release timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/magicstick-nvidia-handoff.timer
        content: |
          [Unit]
          Description=Retry the managed NVIDIA startup handoff without driver-loading loops

          [Timer]
          OnBootSec=20s
          OnUnitInactiveSec=30s
          Unit=magicstick-nvidia-handoff.service

          [Install]
          WantedBy=timers.target
        owner: root
        group: root
        mode: "0644"

    - name: Enable the NVIDIA handoff timer across the planned first restart
      ansible.builtin.systemd_service:
        name: magicstick-nvidia-handoff.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Configure NVIDIA DRM to retain the Linux framebuffer console
      ansible.builtin.copy:
        dest: /etc/modprobe.d/90-magicstick-nvidia-display.conf
        content: |
          # Managed by Magic Stick on hosts with an NVIDIA display controller.
          options nvidia-drm modeset=1 fbdev=1
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_modprobe

    - name: Load NVIDIA DRM early on subsequent boots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/90-magicstick-nvidia-display.conf
        content: |
          # Managed by Magic Stick on hosts with an NVIDIA display controller.
          nvidia-drm
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_modules_load

    - name: Refresh initramfs after preparing the complete NVIDIA boot configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/update-initramfs
          - -u
      when: >-
        nvidia_display_nouveau_policy.changed or nvidia_display_modprobe.changed
        or nvidia_display_modules_load.changed

    - name: Create K3s configuration drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the GPU Operator from replacing the host display driver
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/90-magicstick-nvidia-display.yaml
        content: "{{ (nvidia_display_driver_bindings.stdout | from_json).bootstrapConfig }}"
        owner: root
        group: root
        mode: "0644"
      register: nvidia_display_k3s_policy

    - name: Mark a changed first installation for the host-managed reboot
      ansible.builtin.file:
        path: "{{ nvidia_display_reboot_marker }}"
        state: touch
        owner: root
        group: root
        mode: "0600"
      when:
        - nvidia_display_new_install.stat.exists
        - >-
          nvidia_display_packages.changed or nvidia_display_modprobe.changed
          or nvidia_display_modules_load.changed
          or (nvidia_display_k3s_policy.changed and not nvidia_display_driver_ready)
          or (nvidia_display_nouveau_policy.changed and not nvidia_display_driver_ready)
