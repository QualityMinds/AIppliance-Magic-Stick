# Optional reviewed additions to the base/GPU lab observers. NEVER applied by
# the runner. No admin credential, Secret grant, Pod create/exec or wildcard.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: magicstick-regression-administration-observer
rules:
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases, helmcharts]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: magicstick-regression-administration-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: magicstick-regression-administration-observer
subjects:
  - kind: ServiceAccount
    name: regression-observer
    namespace: magicstick-regression
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regression-catalog-observer
  namespace: ai
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ai-model-catalog]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regression-catalog-observer
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: regression-catalog-observer
subjects:
  - kind: ServiceAccount
    name: regression-observer
    namespace: magicstick-regression
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regression-app-cleaner
  namespace: magicstick-regression
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regression-app-cleaner
  namespace: ai-system
rules:
  - apiGroups: [appliance.magicstick.dev]
    resources: [appinstances]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regression-app-cleaner
  namespace: ai-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: regression-app-cleaner
subjects:
  - kind: ServiceAccount
    name: regression-app-cleaner
    namespace: magicstick-regression
---
# ONLY for the explicitly approved license-persistence API-Pod test.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regression-api-restarter
  namespace: magicstick-regression
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regression-api-restarter
  namespace: identity-system
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regression-api-restarter
  namespace: identity-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: regression-api-restarter
subjects:
  - kind: ServiceAccount
    name: regression-api-restarter
    namespace: magicstick-regression
