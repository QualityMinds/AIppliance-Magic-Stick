# Opt-in Phase 1 smoke cleanup identity for a dedicated appliance.
# The product API creates/starts models. This separate credential only deletes
# ModelActivations in ai-system with an atomic UID/resourceVersion precondition.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regression-model-cleaner
  namespace: magicstick-regression
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regression-model-cleaner
  namespace: ai-system
rules:
  - apiGroups: [appliance.magicstick.dev]
    resources: [modelactivations]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regression-model-cleaner
  namespace: ai-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: regression-model-cleaner
subjects:
  - kind: ServiceAccount
    name: regression-model-cleaner
    namespace: magicstick-regression
