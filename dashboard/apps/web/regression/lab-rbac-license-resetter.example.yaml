# Optional TEST-LAB grant, only after explicit license-baseline approval.
# Not applied by a test. Cannot list/delete Secrets or modify issuer trust.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regression-license-resetter
  namespace: magicstick-regression
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regression-license-resetter
  namespace: identity-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [magicstick-license]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regression-license-resetter
  namespace: identity-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: regression-license-resetter
subjects:
  - kind: ServiceAccount
    name: regression-license-resetter
    namespace: magicstick-regression
