# Additive Phase 3/4 observer only. No Secrets, exec, Pod logs or write verbs.
# Apply only to the dedicated, owner-approved regression appliance.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: magicstick-regression-gpu-observer
rules:
  - apiGroups: [appliance.magicstick.dev]
    resources: [moduleactivations]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices, resourceclaims]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [kubeai.org]
    resources: [models]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: magicstick-regression-gpu-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: magicstick-regression-gpu-observer
subjects:
  - kind: ServiceAccount
    name: regression-observer
    namespace: magicstick-regression
